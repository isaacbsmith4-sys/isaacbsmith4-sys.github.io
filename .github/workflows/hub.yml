name: Update hub

on:
  schedule:
    # Every 30 minutes, 9 AM - 1 AM ET (UTC 13:00-05:30): locks the day's best plays at the
    # lock hour in hub/settings.json, grades them as each sport posts results, rebuilds index.html.
    - cron: "*/30 13-23 * * *"
    - cron: "*/30 0-5 * * *"
    - cron: "35,45 14 * * *"   # 10:35 / 10:45 AM EDT, right after the lock
  # GitHub often skips frequent scheduled runs, so also rebuild whenever a sport app
  # publishes (their pushes use deploy keys, which do trigger workflows; the hub's own
  # commits use GITHUB_TOKEN, which doesn't, so there's no loop)
  push:
    branches: [main]
    paths-ignore: ["index.html", "hub/ledger.json", "hub/alerts_state.json"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: hub
  cancel-in-progress: false

jobs:
  hub:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # check out the latest main (not the commit that triggered the run): a run that waited
      # in the queue must see the previous run's ledger and alert state, or alerts repeat
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # your own picks (private repo my-picks), read with the read-only deploy key "hub reader".
      # Without the secret the hub still builds; phones connected to My Picks read them live.
      - name: Read my picks
        env:
          KEY: ${{ secrets.MY_PICKS_KEY }}
        run: |
          [ -z "$KEY" ] && { echo "No MY_PICKS_KEY secret; skipping"; exit 0; }
          mkdir -p ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/my_picks && chmod 600 ~/.ssh/my_picks
          GIT_SSH_COMMAND="ssh -i ~/.ssh/my_picks -o StrictHostKeyChecking=accept-new" \
            git clone -q --depth 1 git@github.com:isaacbsmith4-sys/my-picks.git "$RUNNER_TEMP/my-picks" \
            && echo "MY_PICKS_JSON=$RUNNER_TEMP/my-picks/picks.json" >> "$GITHUB_ENV" || echo "Couldn't read my-picks"
          rm -f ~/.ssh/my_picks
      - run: python3 hub/build.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html hub/ledger.json hub/alerts_state.json hub/teams.json
          git diff --cached --quiet && exit 0
          git commit -m "Hub $(TZ=America/New_York date +%Y-%m-%dT%H:%M%Z)"
          for i in 1 2 3 4; do git push && break; git pull --rebase; done

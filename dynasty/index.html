<style>
/* Layout: a college basketball coaching career across all of Division I. One screen per tab (Home /
   Roster / Recruit / League / Office) with a bottom tab bar; players, recruits and game results open in
   bottom sheets. Your school's color is the one accent (--team); green means good (a win, interest you
   lead), red means bad, gold is rankings and seeds. Team logos sit on light chips so dark logos read. */
:root{
  color-scheme:dark;
  --bg:#08090d; --surface:#111319; --surface2:#181b23; --sunk:#0c0e13; --line:#23262f; --line-hi:#353a47;
  --ink:#eef0f5; --ink2:#c3c7d3; --muted:#868c9c; --faint:#585e6e;
  --team:#f08a24; --good:#5fd8a0; --warn:#f2b45c; --bad:#ff6a7c; --gold:#ffd34d;
  --display:"Barlow Condensed","Avenir Next Condensed",system-ui,sans-serif;
  --body:"Manrope","Avenir Next","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --tabh:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);min-height:100vh;overflow-x:hidden;
  padding:env(safe-area-inset-top,0px) max(14px,env(safe-area-inset-right,0px)) calc(var(--tabh) + 24px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(100% 50% at 80% -10%,color-mix(in srgb,var(--team) 24%,transparent),transparent 60%)}
.wrap{position:relative;max-width:680px;margin:0 auto}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 12px}
.school{display:flex;gap:10px;align-items:center;min-width:0}
.school b{display:block;font:800 22px/1 var(--display);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.school span{font:600 11px var(--mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.rec{text-align:right;flex:none}
.rec b{display:block;font:800 26px/1 var(--display);font-variant-numeric:tabular-nums}
.rec span{font:600 11px var(--mono);color:var(--muted)}
.logo{flex:none;position:relative;display:inline-grid;place-items:center;border-radius:28%;background:#f3f4f7;overflow:hidden;box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 2px 8px rgba(0,0,0,.35);vertical-align:middle}
.logo b{font:800 14px var(--display);color:#30343e}
.logo img{position:absolute;inset:9%;width:82%;height:82%;object-fit:contain}
.screen{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;min-width:0}
.card h2{font:800 19px var(--display);margin:0 0 10px;text-transform:uppercase;letter-spacing:.03em;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 small{font:600 11px var(--mono);color:var(--muted);letter-spacing:.06em;text-align:right}
.eyebrow{font:600 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sub{color:var(--muted);font-size:12.5px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap} .row>*{min-width:0}
.between{justify-content:space-between}
.btn{appearance:none;border:1px solid var(--line-hi);background:var(--surface2);color:var(--ink);font:700 14px var(--body);padding:11px 15px;border-radius:13px;cursor:pointer;white-space:nowrap}
.btn.go{background:var(--team);border-color:var(--team);color:#fff;box-shadow:0 0 24px -8px var(--team)}
.btn.wide{width:100%;padding:14px;font-size:15.5px}
.btn.sm{padding:7px 10px;font-size:12.5px;border-radius:10px}
.btn.ghost{background:transparent;color:var(--muted)}
.btn:disabled{opacity:.4}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,.li:focus-visible,.job:focus-visible{outline:2px solid var(--team);outline-offset:2px}
.chip{border:1px solid var(--line);background:var(--surface2);color:var(--ink2);border-radius:999px;padding:7px 12px;font:600 12.5px var(--body);cursor:pointer;white-space:nowrap}
.chip.on{border-color:var(--team);background:color-mix(in srgb,var(--team) 20%,transparent);color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.li{display:flex;gap:10px;align-items:center;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;color:inherit;font:inherit}
.li:first-child{border-top:0}
.ovr{flex:none;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font:800 19px var(--display);font-variant-numeric:tabular-nums}
.pos{flex:none;font:700 11px var(--mono);color:var(--muted);width:24px}
.name{flex:1;min-width:0}
.name b{display:block;font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name span{font-size:12px;color:var(--muted)}
.right{text-align:right;flex:none}
.stars{color:var(--gold);letter-spacing:1px;font-size:12px}
.rk{color:var(--gold);font-weight:800}
.pill{display:inline-block;font:700 10.5px var(--mono);letter-spacing:.06em;padding:3px 7px;border-radius:999px;background:var(--surface2);color:var(--ink2);border:1px solid var(--line);white-space:nowrap}
.pill.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.toplogos{display:flex;gap:3px;margin-top:5px}.toplogos>span{border-radius:50%;line-height:0}.toplogos>span.me{box-shadow:0 0 0 2px var(--good)}
.pill.team{color:#fff;background:var(--team);border-color:var(--team)}
.pill.gold{color:#1a1200;background:var(--gold);border-color:var(--gold)}
.bar{height:6px;border-radius:999px;background:var(--sunk);overflow:hidden}
.bar>b{display:block;height:100%;border-radius:999px;background:var(--team)}
.big{font:800 34px/1 var(--display);font-variant-numeric:tabular-nums}
.matchup{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.matchup .side{display:grid;justify-items:center;gap:6px}
.matchup .side b{display:block;font:800 20px/1.05 var(--display);text-transform:uppercase}
.matchup .side span{font-size:12px;color:var(--muted)}
.vs{font:700 12px var(--mono);color:var(--muted)}
.news{display:grid;gap:8px}
.news div{font-size:13px;color:var(--ink2);padding-left:10px;border-left:2px solid var(--line-hi)}
.news div.me{border-left-color:var(--team);color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
td .tn{display:flex;align-items:center;gap:8px;text-align:left}
tr.me td{color:var(--ink);font-weight:700;background:color-mix(in srgb,var(--team) 12%,transparent)}
.scroll{overflow-x:auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabh)}
.tab{appearance:none;background:none;border:0;color:var(--muted);font:700 11px var(--body);display:grid;place-items:center;gap:2px;cursor:pointer;padding:8px 0}
.tab i{font-style:normal;font-size:19px;line-height:1}
.tab.on{color:var(--ink)} .tab.on i{color:var(--team)}
.overlay{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:680px;max-height:90vh;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h3{font:800 24px/1.05 var(--display);margin:0;text-transform:uppercase}
.grab{width:44px;height:5px;border-radius:999px;background:var(--line-hi);margin:0 auto 12px}
.ratings{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:13px}
.ratings .bar{height:8px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat3 div{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:9px;text-align:center}
.stat3 b{display:block;font:800 22px var(--display);font-variant-numeric:tabular-nums}
.stat3 span{font:600 9.5px var(--mono);letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.opt{display:grid;gap:2px;text-align:left;padding:10px 11px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font:inherit;cursor:pointer}
.opt b{font-size:13.5px}.opt span{font-size:11.5px;color:var(--muted)}
.opt.on b::after{content:" ✓";color:var(--good)}
.opt.on{border-color:var(--team);background:color-mix(in srgb,var(--team) 22%,transparent)}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:8px}
.score .t{display:grid;justify-items:center;gap:6px}
.score .t b{display:block;font:800 17px var(--display);text-transform:uppercase}
.score .s{font:800 52px/1 var(--display);font-variant-numeric:tabular-nums}
.score .s.win{color:var(--good)}
.clock{font:600 12px var(--mono);color:var(--muted);text-align:center;margin-top:6px}
.pbp{font-size:13px;color:var(--ink2);display:grid;gap:4px;margin-top:10px}
.jobs{display:grid;gap:8px}
.job{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--surface2);cursor:pointer;color:inherit;font:inherit;text-align:left;width:100%}
input[type=text],input[type=search]{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:11px;padding:11px 12px;width:100%}
.meter{position:relative;height:10px;border-radius:999px;background:linear-gradient(90deg,var(--bad),var(--warn) 40%,var(--good));opacity:.85}
.meter i{position:absolute;top:-4px;width:4px;height:18px;border-radius:3px;background:#fff;box-shadow:0 0 8px #000}
.rounds{display:grid;gap:14px}
.bm{display:grid;grid-template-columns:auto 1fr auto;gap:6px 8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);font-size:13px}
.bm .seed{font:700 11px var(--mono);color:var(--muted);width:16px;text-align:right}
.bm .w{font-weight:700;color:var(--ink)} .bm .l{color:var(--muted)}
.bm.mine{border-color:var(--team)}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
.hero{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
</style>
</head>
<body>
<div class="wrap">
  <header class="top" id="top"></header>
  <main id="main"><div class="empty" style="padding:40px 0;text-align:center">Loading…</div></main>
</div>
<nav class="tabs" id="tabs" hidden><div class="in">
  <button class="tab on" data-tab="home"><i>⌂</i>Home</button>
  <button class="tab" data-tab="roster"><i>☰</i>Roster</button>
  <button class="tab" data-tab="recruit"><i>★</i>Recruit</button>
  <button class="tab" data-tab="league"><i>⚑</i>League</button>
  <button class="tab" data-tab="office"><i>$</i>Office</button>
</div></nav>
<div id="ov"></div>

<script src="teams.js"></script>
<script>
"use strict";
/* =====================================================================================
   DATA
   ===================================================================================== */
const POS = ["PG", "SG", "SF", "PF", "C"];
const KEYS = ["sht", "ins", "pas", "def", "reb", "ath", "iq"];
const KEYNAME = {sht: "Shooting", ins: "Inside", pas: "Passing", def: "Defense", reb: "Rebounding", ath: "Athleticism", iq: "IQ"};
// how much each rating counts toward a player's overall, by position
const WT = {
  PG: {sht: .24, ins: .06, pas: .3, def: .14, reb: .02, ath: .14, iq: .1},
  SG: {sht: .34, ins: .13, pas: .12, def: .14, reb: .03, ath: .14, iq: .1},
  SF: {sht: .2, ins: .2, pas: .09, def: .17, reb: .1, ath: .15, iq: .09},
  PF: {sht: .09, ins: .27, pas: .05, def: .17, reb: .23, ath: .13, iq: .06},
  C:  {sht: .03, ins: .3, pas: .04, def: .2, reb: .28, ath: .1, iq: .05}
};
// archetype tilt per position, so a PG passes better than he rebounds, etc.
const TILT = {
  PG: {sht: 4, ins: -6, pas: 10, def: 1, reb: -14, ath: 3, iq: 4},
  SG: {sht: 8, ins: -2, pas: 0, def: 1, reb: -10, ath: 3, iq: 0},
  SF: {sht: 1, ins: 1, pas: -3, def: 3, reb: -2, ath: 3, iq: 0},
  PF: {sht: -6, ins: 6, pas: -7, def: 2, reb: 8, ath: 0, iq: -1},
  C:  {sht: -14, ins: 8, pas: -10, def: 4, reb: 12, ath: -2, iq: -2}
};
const HT = {PG: [72, 76], SG: [75, 78], SF: [77, 80], PF: [79, 82], C: [81, 85]};
const YEARS = ["FR", "SO", "JR", "SR"];
const POWER = ["ACC", "Big Ten", "SEC", "Big 12", "Big East"];
// schools where academics sell (the Ivies most of all)
const ACADEMIC = new Set(["Duke", "Stanford", "Northwestern", "Vanderbilt", "Georgetown", "Notre Dame", "Rice", "Wake Forest", "Virginia", "UCLA", "California", "Michigan", "Boston College", "Villanova", "Davidson", "Bucknell", "Colgate", "Holy Cross", "Lehigh", "Lafayette", "William & Mary", "Richmond", "Santa Clara", "Army", "Navy", "Air Force", "USC", "Emory"]);
const FIRST = ["Jalen", "Marcus", "Tyler", "Devin", "Caleb", "Isaiah", "Jordan", "Malik", "Andre", "Cameron", "Darius", "Elijah", "Trey", "Xavier", "Noah", "Jaylen", "Bryce", "Kendall", "Terrence", "Micah", "Owen", "Quentin", "Reggie", "Silas", "Tobias", "Zion", "Brandon", "Cole", "Dante", "Evan", "Gavin", "Jace", "Keegan", "Landon", "Mason", "Nate", "Omari", "Preston", "Rashad", "Seth", "Trevon", "Wesley", "Amir", "Bennett", "Cedric", "Desmond", "Emeka", "Hunter", "Ivan", "Javon", "Kobe", "Luca", "Miles", "Nico", "Ryder", "Shane", "Tariq", "Victor", "Wyatt", "Yusuf", "Aiden", "Boogie", "Chase", "Deshawn", "Eli", "Fletcher", "Grant", "Hakeem", "Isaac", "Jabari", "Kai", "Lamont", "Marquis", "Nolan", "Oscar", "Paxton", "Rayshawn", "Sterling", "Tre", "Ulysses"];
const LAST = ["Johnson", "Williams", "Carter", "Brooks", "Hayes", "Mitchell", "Coleman", "Price", "Reed", "Bennett", "Foster", "Graham", "Hughes", "Jenkins", "Kelly", "Lawson", "Morris", "Nelson", "Owens", "Parker", "Ramsey", "Sanders", "Turner", "Vaughn", "Walker", "Young", "Adams", "Barnes", "Crawford", "Dixon", "Ellis", "Fleming", "Gibson", "Holloway", "Ingram", "Jordan", "Knox", "Lyons", "Maxwell", "Norris", "Okafor", "Porter", "Quinn", "Russell", "Stokes", "Tate", "Underwood", "Vance", "Whitfield", "Ashby", "Boateng", "Castillo", "Diallo", "Edwards", "Fairley", "Grant", "Hampton", "Iverson", "Jefferson", "Kingston", "Lockhart", "Monroe", "Nwosu", "Odom", "Pryor", "Rhodes", "Sutton", "Thornton", "Upshaw", "Valentine", "Wade", "York", "Abara", "Bishop", "Chandler", "Dupree", "Easley", "Fontaine", "Garrison", "Hollins", "Sow", "Petrovic", "Kowalski", "Murray", "Holmes", "Banks", "Pierce", "Gaines", "Battle", "Swain"];
const REGIONS = ["East", "West", "South", "Midwest"];

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const rnd = (a, b) => a + Math.random() * (b - a);
const irnd = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const money = n => n >= 1e6 ? "$" + (n / 1e6).toFixed(2).replace(/\.?0+$/, "") + "M" : n >= 1000 ? "$" + Math.round(n / 1000) + "K" : "$" + Math.round(n);
const htStr = i => `${Math.floor(i / 12)}'${i % 12}"`;
function wavg(list, f, w) { let s = 0, t = 0; for (const x of list) { s += f(x) * w(x); t += w(x); } return t ? s / t : 0; }
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

let S = null;   // the whole save
const T = id => S.teams[id];
const P = id => S.players[id];
const me = () => S.teams[S.user];
const CONFS = [...new Set(TEAMS.map(t => t[5]))].sort((a, b) => (POWER.indexOf(a) + 1 || 99) - (POWER.indexOf(b) + 1 || 99) || a.localeCompare(b));

/* ---------- players ---------- */
function ovr(p) { const w = WT[p.pos]; let s = 0; for (const k of KEYS) s += p.r[k] * w[k]; return Math.round(s); }
function makeRatings(pos, target) {
  const r = {};
  for (const k of KEYS) r[k] = target + TILT[pos][k] + gauss() * 7;
  const off = target - ovr({pos, r});
  for (const k of KEYS) r[k] = clamp(Math.round(r[k] + off), 20, 99);
  return r;
}
const blankStats = () => ({gp: 0, min: 0, pts: 0, reb: 0, ast: 0, stl: 0, fgm: 0, fga: 0, tpm: 0, tpa: 0, ftm: 0, fta: 0});
function newPlayer(pos, target, yr) {
  const id = S.nextId++;
  const p = {id, fn: pick(FIRST), ln: pick(LAST), pos, yr, ht: irnd(...HT[pos]), r: makeRatings(pos, target), pot: 0, nil: 0, morale: 70, tid: null, s: blankStats()};
  p.pot = clamp(ovr(p) + [irnd(8, 22), irnd(5, 15), irnd(2, 9), irnd(0, 4)][Math.max(0, yr)], ovr(p), 97);
  S.players[id] = p;
  return p;
}
const grade = v => v >= 90 ? "A+" : v >= 85 ? "A" : v >= 80 ? "A-" : v >= 76 ? "B+" : v >= 72 ? "B" : v >= 68 ? "B-" : v >= 64 ? "C+" : v >= 60 ? "C" : "D";
const ovrColor = v => v >= 80 ? "#5fd8a0" : v >= 72 ? "#9fd36a" : v >= 64 ? "#f2d45c" : v >= 56 ? "#f2a25c" : "#ff7a7c";
const fairNil = (p, prest) => Math.max(0, Math.round(((ovr(p) - 58) * 14000 + Math.max(0, ovr(p) - 74) * 30000) * (.6 + prest / 120) / 5000) * 5000);

/* ---------- teams ---------- */
const isIvy = t => t.conf === "Ivy League";
const nilBudget = t => Math.round((120000 + t.prest * t.prest * 280) * (isIvy(t) ? .3 : 1) / 5000) * 5000;
const rpw = prest => Math.round(55 + prest * .55);   // recruiting points per week
function tier(t) {
  if (t.prest >= 93) return 0;                                   // blue blood
  if (POWER.includes(t.conf)) return 1;                          // power program
  if (isIvy(t)) return 4;                                        // the Ivies
  if (t.prest >= 55) return 2;                                   // top mid-major
  if (t.prest >= 44) return 3;                                   // decent mid-major
  return 5;                                                      // everybody else
}
const TIERS = [["Blue bloods", "Win now. Anything less than a deep March run is a failure.", "#ffd34d"],
  ["Power programs", "Big-conference talent and big-conference pressure.", "#5fd8a0"],
  ["Top mid-majors", "The Gonzaga path: win the league, crash the dance.", "#9fd36a"],
  ["Decent mid-majors", "The 12-14 seeds. Bust some brackets.", "#f2b45c"],

function portalAI() {

/* ---------- save / load (IndexedDB: the league is too big for localStorage) ---------- */
const DB = {
  db: null,
  open() { return this.db ? Promise.resolve(this.db) : new Promise((ok, no) => { const q = indexedDB.open("dynasty", 1); q.onupgradeneeded = () => q.result.createObjectStore("kv"); q.onsuccess = () => ok(this.db = q.result); q.onerror = () => no(q.error); }); },
  async get(k) { const db = await this.open(); return new Promise(ok => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => ok(q.result); q.onerror = () => ok(null); }); },
  async set(k, v) { const db = await this.open(); return new Promise(ok => { const tx = db.transaction("kv", "readwrite"); tx.objectStore("kv").put(v, k); tx.oncomplete = () => ok(); tx.onerror = () => ok(); }); },
  async del(k) { const db = await this.open(); return new Promise(ok => { const tx = db.transaction("kv", "readwrite"); tx.objectStore("kv").delete(k); tx.oncomplete = () => ok(); }); }
};

function migrate(s) {

    <button class="btn go wide" data-act="off">Start the ${S.year + 1}-${String(S.year + 2).slice(2)} season</button></div>`;

let pFilter = "all", pPos = "All";

}

}

      ${q.dream != null ? `<div class="row" style="margin-top:8px">${logo(T(q.dream), 22)}<span class="sub">Dream school: <b style="color:var(--ink)">${esc(T(q.dream).name)}</b></span></div>` : ""}

    <div class="chips">${[0, 5, 4, 3, 2].map(s => `<button class="chip ${rStars === s ? "on" : ""}" data-act="rs" data-k="${s}">${s ? s + "★" : "All stars"}</button>`).join("")}${["All", ...POS].map(p => `<button class="chip ${rPos === p ? "on" : ""}" data-act="rp" data-k="${p}">${p}</button>`).join("")}</div>

    <div class="score" style="margin-top:10px"><div class="t">${logo(H, 56)}<b>${seedTag(H.id)}${esc(H.name)}</b></div><div><span class="s ${hw ? "win" : ""}" id="sH">0</span> <span class="s" style="font-size:28px;color:var(--muted)">–</span> <span class="s ${hw ? "" : "win"}" id="sA">0</span></div><div class="t">${logo(A, 56)}<b>${seedTag(A.id)}${esc(A.name)}</b></div></div>

  const step = now => {
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 2), el = $("#sH"); if (!el) return;
    el.textContent = Math.round(res.hs * e); $("#sA").textContent = Math.round(res.as * e);
    const secs = Math.round(2400 * (1 - k)), left = secs > 1200 ? secs - 1200 : secs;
    $("#clock").textContent = k < 1 ? `${secs > 1200 ? "1st" : "2nd"} half · ${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}` : `Final${res.ot ? " / OT" : ""}`;
    if (k < 1) requestAnimationFrame(step); else $("#after").style.opacity = 1;
  };
  requestAnimationFrame(step);
}

/* ---------- actions ---------- */
function busy(fn) { $("#main").style.opacity = .5; setTimeout(() => { fn(); $("#main").style.opacity = 1; }, 20); }
// sim many weeks one at a time so the screen keeps breathing, with a progress sheet
function simWhile(keepGoing, label, max = 60) {
  let n = 0;
  sheet(`<h3>${esc(label)}</h3><div class="sub" id="simTxt" style="margin:8px 0">Starting…</div><div class="bar" style="height:10px"><b id="simBar" style="width:0%"></b></div>`);
  const total = S.phase === "season" ? S.schedule.length - S.week : 12;
  const stepOnce = () => {
    if (!keepGoing() || n >= max) { closeSheet(); render(); scrollTo(0, 0); return; }
    playWeek(); n++;
    const txt = $("#simTxt"), bar = $("#simBar");
    if (txt) txt.textContent = `${phaseLabel()} · ${recStr(me())}`;
    if (bar) bar.style.width = Math.min(100, n / total * 100) + "%";
    setTimeout(stepOnce, 0);
  };
  setTimeout(stepOnce, 30);
}
document.addEventListener("input", e => { if (e.target.id === "jobSearch") { jobQuery = e.target.value; window._coach = $("#coachName").value; renderJobs(); const s = $("#jobSearch"); s.focus(); s.setSelectionRange(s.value.length, s.value.length); } });
document.addEventListener("click", e => {
  const tb = e.target.closest("[data-tab]");
  if (tb && !e.target.closest("[data-act]")) { tab = tb.dataset.tab; closeSheet(); render(); scrollTo(0, 0); return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, id = +el.dataset.id;
  if (a === "closeBg") { if (e.target === el) closeSheet(); return; }
  if (a === "close") { closeSheet(); render(); return; }
  if (a === "jobMore") { window._coach = $("#coachName").value; jobOpen[el.dataset.k] = !jobOpen[el.dataset.k]; renderJobs(); return; }
  if (a === "job") { const name = ($("#coachName").value || "Coach").trim().slice(0, 24), slot = pendingSlot || 1; busy(() => { newCareer(+el.dataset.i, name, slot); pendingSlot = null; tab = "home"; saveNow(); render(); scrollTo(0, 0); }); return; }
  if (a === "slotNew") {
    const n = +el.dataset.k;
    if (summaries[n] && !confirm(`Erase the career in Slot ${n} (${summaries[n].team}) and start over there?`)) return;
    if (S) saveNow();
    pendingSlot = n; window._back = S; S = null; closeSheet(); render(); scrollTo(0, 0); return;
  }
  if (a === "slotGo") {
    const n = +el.dataset.k; if (S && S.slot === n) return;
    if (S) saveNow();
    busy(async () => { const s = await loadSlot(n); if (s) { S = s; S.slot = n; tab = "home"; DB.set("active", n); } render(); scrollTo(0, 0); }); return;
  }
  if (a === "slotDel") {
    const n = +el.dataset.k; if (!summaries[n] || (S && S.slot === n)) return;
    if (!confirm(`Delete the career in Slot ${n} (${summaries[n].team})? This can't be undone.`)) return;
    DB.del(slotKey(n)); delete summaries[n]; DB.set("summaries", summaries); render(); return;
  }
  if (a === "jobBack") { S = window._back; pendingSlot = null; window._back = null; render(); return; }
  if (a === "play") { busy(() => { playWeek(); render(); if (lastGame) showGame(lastGame, true); }); return; }
  if (a === "sim4") { const stop = S.week + 4; simWhile(() => S.phase === "season" && S.week < stop, "Simming 4 weeks"); return; }
  if (a === "simReg") { simWhile(() => S.phase === "season", "Simming to March"); return; }
  if (a === "simEnd") { simWhile(() => S.phase === "conf" || S.phase === "ncaa", "Simming to the offseason"); return; }
  if (a === "off") { busy(() => { nextOffStep(); render(); scrollTo(0, 0); }); return; }
  if (a === "pay" || a === "deny") { answerRequest(id, a === "pay"); render(); return; }
  if (a === "portal") { portalSheet(id); return; }
  if (a === "pOffer") { portalOffer(id, +el.dataset.v); render(); portalSheet(id); return; }
  if (a === "pPull") { portalOffer(id, null); render(); portalSheet(id); return; }
  if (a === "pPitch") { portalPitch(id); render(); portalSheet(id); return; }
  if (a === "pf") { pFilter = el.dataset.k; render(); return; }
  if (a === "pp") { pPos = el.dataset.k; render(); return; }
  if (a === "pAuto") { const x = autoPortal(); render(); sheet(`<h3>Assistant</h3><p class="sub">${x.found ? `Found ${plural(x.found, "player")} who have you in their top 5 and would play for you. Pitched ${x.pitched}, made ${plural(x.made, "new offer")}.` : "Nobody who'd play for you has you in his top 5 right now. Try pitching players yourself to get on their lists."}</p><button class="btn wide" data-act="close" style="margin-top:12px">OK</button>`); return; }
  if (a === "autoSet") { autoDraft = {...S.auto}; autoSheet(); return; }
  if (a === "autoPick") { const k = el.dataset.k, v = el.dataset.v; autoDraft[k] = k === "want" || k === "nil" ? +v : k === "boost" ? v === "true" : v; autoSheet(); return; }
  if (a === "autoSave") { S.auto = {...autoDraft, on: true}; if (S.phase !== "off") autoRecruit(); save(); closeSheet(); render(); return; }
  if (a === "autoOff") { S.auto.on = false; save(); render(); return; }
  if (a === "booster") { boosterEvent(); render(); return; }
  if (a === "player") { playerSheet(id); return; }
  if (a === "up" || a === "down") { const o = me().order, i = o.indexOf(id), j = a === "up" ? i - 1 : i + 1; if (j >= 0 && j < o.length) { [o[i], o[j]] = [o[j], o[i]]; save(); render(); } return; }
  if (a === "autoOrder") { autoOrder(me()); save(); render(); return; }
  if (a === "rf") { rFilter = el.dataset.k; render(); return; }
  if (a === "past") { showPast = !showPast; render(); return; }
  if (a === "rp") { rPos = el.dataset.k; render(); return; }
  if (a === "rs") { rStars = +el.dataset.k; render(); return; }
  if (a === "recruit") { recruitSheet(id); return; }
  if (a === "ract") { act(id, el.dataset.w); render(); recruitSheet(id); return; }
  if (a === "nil") { setNil(id, +el.dataset.v); render(); recruitSheet(id); return; }
  if (a === "lg") { lgView = el.dataset.k; render(); return; }
  if (a === "lgc") { lgConf = el.dataset.k; render(); return; }
  if (a === "breg") { bRegion = +el.dataset.k; render(); return; }
  if (a === "box") { const g = S.schedule[+el.dataset.w].find(g => g.h === S.user || g.a === S.user); showGame({h: g.h, a: g.a, hs: g.hs, as: g.as, ot: g.ot, box: g.box, label: `Week ${+el.dataset.w + 1}`}, false); return; }
});

(async () => {
  try {
    summaries = (await DB.get("summaries")) || {};
    const active = (await DB.get("active")) || 1;
    S = await loadSlot(active) || (active !== 1 ? await loadSlot(1) : null);
    if (S) { S.slot = S.slot || active; if (!summaries[S.slot]) { summaries[S.slot] = summarize(); DB.set("summaries", summaries); } }
  } catch {}
  render();
})();
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>

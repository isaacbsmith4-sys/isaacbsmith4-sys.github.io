<style>
/* Layout: one screen per tab (Today / Body / Trends / Setup), bottom tab bar on phones, food added from a bottom sheet.
   Warm charcoal ground with an ember accent; each macro keeps one color everywhere (protein ember, carbs amber, fat plum). */
:root{
  color-scheme:dark;
  --bg:#0f0b09; --surface:#19130f; --surface2:#221a15; --sunk:#140f0c; --line:#33271f; --line-hi:#4a3a2e;
  --ink:#f7efe8; --ink2:#d2c3b6; --muted:#9a8a7d; --faint:#6b5d52;
  --ember:#ff6a3d; --ember-bg:rgba(255,106,61,.13); --carb:#ffb84a; --fat:#c08bff; --water:#4cc3ff;
  --good:#69db8f; --warn:#ffb84a; --bad:#ff5a6e; --on-ember:#200a03;
  --display:"Archivo","Avenir Next Condensed",system-ui,sans-serif;
  --body:"Manrope","Avenir Next","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --tabh:64px; --accent:var(--ember);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);min-height:100vh;overflow-x:hidden;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(var(--tabh) + 24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(110% 60% at 90% -10%,rgba(255,106,61,.16),transparent 60%),radial-gradient(80% 50% at -10% 105%,rgba(255,184,74,.07),transparent 60%)}
.wrap{position:relative;max-width:620px;margin:0 auto}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:18px 0 14px}
header h1{font:900 28px var(--display);font-stretch:118%;margin:0;letter-spacing:-.01em;text-transform:uppercase}
header p{margin:2px 0 0;color:var(--muted);font-size:13px}
.daynav{display:flex;align-items:center;gap:4px}
.screen{display:grid;gap:14px}
.card{background:linear-gradient(180deg,var(--surface),rgba(25,19,15,.85));border:1px solid var(--line);border-radius:20px;padding:18px;min-width:0}
.card h2{font:800 15px var(--display);font-stretch:112%;margin:0;text-transform:uppercase;letter-spacing:.02em}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sub,.note{color:var(--muted);font-size:12.5px}
.eyebrow{font:600 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.top{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:center}
.ringbox{position:relative;width:100%;max-width:150px;aspect-ratio:1}
.ringbox svg{width:100%;height:100%;display:block}
.ringbox .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.big{font:900 32px var(--display);font-stretch:110%;font-variant-numeric:tabular-nums;line-height:1}
.arc{transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 6px var(--glow))}
.macros{display:grid;gap:12px}
.mac .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.mac .t b{font-weight:700}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.bar>b{display:block;height:100%;border-radius:8px;background:var(--c);box-shadow:0 0 10px var(--c);transition:width .6s}
.eqn{display:flex;justify-content:space-between;gap:6px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);text-align:center}
.eqn div{display:grid;gap:1px}
.eqn b{font:700 17px var(--mono)}
.eqn span{font-size:11px;color:var(--muted)}
.eqn i{align-self:center;color:var(--faint);font-style:normal}
.meal .mh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.meal .mh h3{font:800 14px var(--display);font-stretch:112%;margin:0;text-transform:uppercase;letter-spacing:.03em}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .m{flex:1;min-width:0}
.item .m div:first-child{overflow-wrap:anywhere}
.item .meta{font-size:12px;color:var(--muted)}
.item .cal{font:600 14px var(--mono)}
.x{border:0;background:none;color:var(--faint);font-size:19px;cursor:pointer;padding:2px 6px}
.x:hover{color:var(--bad)}
.btn{appearance:none;border:1px solid var(--line-hi);background:var(--surface2);color:var(--ink);font:700 14px var(--body);padding:11px 16px;border-radius:14px;cursor:pointer;white-space:nowrap}
.btn.ember{background:var(--ember);color:var(--on-ember);border-color:var(--ember);box-shadow:0 0 26px -8px var(--ember)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.wide{width:100%;padding:15px;font-size:16px;border-radius:16px}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:11px}
.btn.add{border-style:dashed;color:var(--ink2);width:100%;margin-top:8px;background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,.tab:focus-visible,.res:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.between{justify-content:space-between}
input,select{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:11px;padding:10px 11px;min-width:0}
input[type=number],input[type=date]{font-family:var(--mono)}
label.f{display:grid;gap:5px;font-size:12px;color:var(--muted);flex:1 1 110px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface2);color:var(--ink2);border-radius:999px;padding:8px 12px;font:600 13px var(--body);cursor:pointer}
.chip.on{border-color:var(--ember);background:var(--ember-bg);color:var(--ink)}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;background:none;color:var(--muted);font:700 13px var(--body);padding:9px 6px;cursor:pointer}
.seg button.on{background:var(--ember-bg);color:var(--ink);box-shadow:inset 0 -2px 0 var(--ember)}
.water{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.water button{width:30px;height:40px;border-radius:7px 7px 12px 12px;border:1.5px solid rgba(76,195,255,.45);background:transparent;cursor:pointer}
.water button.on{background:linear-gradient(transparent 22%,rgba(76,195,255,.75) 22%);box-shadow:0 0 10px -2px var(--water)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px 13px;display:grid;gap:3px}
.stat .v{font:800 22px var(--display);font-stretch:110%;font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:10px var(--mono)}
.empty{color:var(--muted);font-size:14px;padding:16px;border:1px dashed var(--line-hi);border-radius:14px;text-align:center}
.res{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.res:last-child{border-bottom:0}
.res .m{flex:1;min-width:0}
.res .m div:first-child{overflow-wrap:anywhere}
.res .k{font:600 13px var(--mono);color:var(--ink2);text-align:right}
.badge{font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ember);margin-left:6px}
.pick{display:grid;gap:14px;padding:14px;border-radius:16px;background:var(--surface2);border:1px solid var(--line-hi)}
.preview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center}
.preview div{display:grid}
.preview b{font:700 18px var(--mono)}
.preview span{font-size:11px;color:var(--muted)}
video.scan{width:100%;border-radius:14px;background:#000;aspect-ratio:4/3;object-fit:cover}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:rgba(15,11,9,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
nav.tabs .in{display:flex;width:100%;max-width:620px}
.tab{flex:1;border:0;background:none;color:var(--faint);font:600 11px var(--body);display:grid;justify-items:center;gap:3px;padding:6px 0;cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-selected=true]{color:var(--ember)}
.tab[aria-selected=true] svg{filter:drop-shadow(0 0 6px var(--ember))}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(8,5,3,.72);backdrop-filter:blur(5px);display:grid;align-items:end;justify-items:center}
.sheet .in{width:min(620px,100%);height:min(88vh,760px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;display:flex;flex-direction:column;gap:14px;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .22s ease-out}
.sheet .in.short{height:auto;max-height:88vh}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--surface2);border:1px solid var(--line-hi);border-radius:13px;padding:10px 14px;font-size:14px;display:flex;gap:12px;align-items:center;box-shadow:0 12px 40px rgba(0,0,0,.5);max-width:calc(100vw - 32px)}
.toast button{border:0;background:none;color:var(--ember);font:700 13px var(--body);cursor:pointer}
@media (max-width:400px){.top{grid-template-columns:120px minmax(0,1fr);gap:14px}.big{font-size:26px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rid = () => Math.random().toString(36).slice(2, 10);
const pad = n => String(n).padStart(2, "0");
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const r0 = v => Math.round(v);
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const todayKey = () => ymd(new Date(Date.now() - 3 * 3600e3)); // a late-night snack before 3 AM counts toward the day before
const parseKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return ymd(d); };
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const MEALS = ["Breakfast", "Lunch", "Dinner", "Snacks"];
const mealNow = () => { const h = new Date().getHours(); return h >= 4 && h < 10 ? "Breakfast" : h < 15 && h >= 10 ? "Lunch" : h >= 15 && h < 21 ? "Dinner" : "Snacks"; };

/* ---------- state ---------- */
const KEY = "fuelapp:v1";
const DEFAULTS = {
  settings: {cal: 2800, p: 160, c: 340, f: 85, water: 10,
    profile: {sex: "m", age: 16, ft: 5, in: 10, lb: 160, act: 1.725, goal: 0}},
  days: {}, weights: {}, myFoods: [], meals: [],

const DAYS = Life.col("fuel/days", {months: 3}), WTS = Life.col("fuel/weights", {months: 6}), FSET = Life.doc("fuel/settings");
const daysMap = () => Object.fromEntries(Object.entries(S.days).filter(([k, d]) => d.items.length || d.water).map(([k, d]) => [k, {...d, date: k}]));

function adopt() {

  S.weights = Object.fromEntries(Object.entries(WTS.all()).map(([k, w]) => [k, w.lb]));

let reader = null, zxingLoad = null;
function loadZxing() {
  if (window.ZXing) return Promise.resolve();
  return zxingLoad ||= new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"; s.onload = res; s.onerror = rej; document.head.appendChild(s); });

async function startCamera() {
  const v = $("#scanVid"); if (!v || reader) return;

    });

}
function stopScan() { try { reader?.reset(); } catch (e) {} reader = null; }
async function lookup(code) {
  code = String(code || "").replace(/\D/g, "");
  if (code.length < 8) { add.scanMsg = "Barcodes are 8 to 13 digits."; renderSheet(); return; }
  add.scanMsg = "Looking up " + code + "…"; renderSheet();
  try {
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,brands,serving_size,serving_quantity,nutriments`);
    const d = await r.json();
    if (!add) return;
    if (d.status !== 1 || !d.product) { add.scanMsg = "That barcode isn't in the database. Use Create to add it from the label."; renderSheet(); return; }
    const p = d.product, n = p.nutriments || {};

    if (n["energy-kcal_serving"] != null) f = {cal: num(n["energy-kcal_serving"]), p: num(n.proteins_serving), c: num(n.carbohydrates_serving), f: num(n.fat_serving), serving: p.serving_size || "1 serving"};
    else if (n["energy-kcal_100g"] != null && num(p.serving_quantity) > 0) { const k = num(p.serving_quantity) / 100; f = {cal: num(n["energy-kcal_100g"]) * k, p: num(n.proteins_100g) * k, c: num(n.carbohydrates_100g) * k, f: num(n.fat_100g) * k, serving: p.serving_size || p.serving_quantity + " g"}; }
    else if (n["energy-kcal_100g"] != null) f = {cal: num(n["energy-kcal_100g"]), p: num(n.proteins_100g), c: num(n.carbohydrates_100g), f: num(n.fat_100g), serving: "100 g"};
    if (!f) { add.scanMsg = "Found it, but it has no calorie info. Use Create to add it from the label."; renderSheet(); return; }
    const name = [p.brands?.split(",")[0], p.product_name].filter(Boolean).join(" ") || "Scanned food";
    add.pick = {id: "s" + code, name, src: "scan", ...f}; add.qty = 1; add.scanMsg = ""; renderSheet();
  } catch (e) { if (add) { add.scanMsg = "Couldn't reach the food database. Check your connection."; renderSheet(); } }
}

/* ================= BODY ================= */
function viewBody() {
  const keys = Object.keys(S.weights).sort(), k = todayKey();
  const pts = keys.slice(-60).map(d => ({d, w: S.weights[d]}));
  // 7-day moving average smooths out water-weight noise
  const ma = pts.map((p, i) => { const from = addDays(p.d, -6); const win = pts.filter(x => x.d >= from && x.d <= p.d).map(x => x.w); return {d: p.d, w: avg(win)}; });
  let chart = '<div class="empty">Weigh in a few mornings to see your trend.</div>', rate = null;
  if (pts.length >= 2) {
    const W = 340, H = 170, pl = 34, pb = 20, ws = pts.map(p => p.w), lo = Math.min(...ws) - 1, hi = Math.max(...ws) + 1;
    const t0 = parseKey(pts[0].d).getTime(), t1 = parseKey(pts[pts.length - 1].d).getTime() || t0 + 1;
    const X = d => pl + (parseKey(d).getTime() - t0) / (t1 - t0 || 1) * (W - pl - 8), Y = w => 10 + (1 - (w - lo) / (hi - lo)) * (H - pb - 10);
    const line = ma.map((p, i) => `${i ? "L" : "M"}${X(p.d).toFixed(1)},${Y(p.w).toFixed(1)}`).join(" ");
    const ticks = [lo + 1, (lo + hi) / 2, hi - 1].map(v => `<line x1="${pl}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pl - 5}" y="${Y(v) + 3}" text-anchor="end">${v.toFixed(0)}</text>`).join("");
    chart = `<svg class="chart" viewBox="0 0 ${W} ${H}">${ticks}${pts.map(p => `<circle cx="${X(p.d)}" cy="${Y(p.w)}" r="3" fill="var(--faint)"/>`).join("")}<path d="${line}" fill="none" stroke="var(--ember)" stroke-width="2.5" style="filter:drop-shadow(0 0 5px var(--ember))"/><circle cx="${X(ma[ma.length - 1].d)}" cy="${Y(ma[ma.length - 1].w)}" r="4.5" fill="var(--ember)"/><text x="${pl}" y="${H - 4}">${parseKey(pts[0].d).toLocaleDateString([], {month: "short", day: "numeric"})}</text><text x="${W}" y="${H - 4}" text-anchor="end">${parseKey(pts[pts.length - 1].d).toLocaleDateString([], {month: "short", day: "numeric"})}</text></svg>`;
    const back = ma.filter(p => p.d <= addDays(ma[ma.length - 1].d, -7));
    if (back.length) { const days = (parseKey(ma[ma.length - 1].d) - parseKey(back[back.length - 1].d)) / 864e5; rate = (ma[ma.length - 1].w - back[back.length - 1].w) / days * 7; }
  }
  const goal = S.settings.profile.goal, last = pts[pts.length - 1];
  const verdict = rate == null ? "Needs about 2 weeks of weigh-ins." : goal > 0 ? (rate < .2 ? "Gaining slower than planned. Add 150–200 kcal a day." : rate > 1 ? "Gaining fast. Some of that is likely fat; trim 150 kcal a day." : "Right on pace for a lean gain.")
    : goal < 0 ? (rate > -.3 ? "Not dropping yet. Trim 150 kcal a day or add steps." : rate < -1.5 ? "Dropping fast for an athlete. Eat a bit more so you keep strength." : "Right on pace.") : (Math.abs(rate) < .4 ? "Holding steady." : rate > 0 ? "Creeping up. Trim 100–150 kcal a day to hold." : "Drifting down. Add 100–150 kcal a day to hold.");
  return `
  <section class="card"><div class="ch"><h2>Weigh in</h2><span class="sub">morning, after the bathroom, before eating</span></div>
    <div class="row"><input type="number" inputmode="decimal" step="0.1" id="wIn" placeholder="${last ? last.w : "lb"}" value="${S.weights[k] ?? ""}" style="flex:1 1 120px" aria-label="Today's weight in pounds"><button class="btn ember" data-act="saveW">Save</button></div></section>
  <section class="stats">
    <div class="stat"><span class="eyebrow">Trend weight</span><span class="v">${ma.length ? ma[ma.length - 1].w.toFixed(1) : "–"}</span><span class="s">7-day average, lb</span></div>
    <div class="stat"><span class="eyebrow">Per week</span><span class="v" style="color:${rate == null ? "var(--ink)" : "var(--ember)"}">${rate == null ? "–" : (rate > 0 ? "+" : "") + rate.toFixed(1)}</span><span class="s">lb, from the trend</span></div>
  </section>
  <section class="card"><div class="ch"><h2>Trend</h2><span class="sub">dots = daily · line = 7-day average</span></div>${chart}
    <p class="note" style="margin:10px 0 0">${esc(verdict)} Daily weight swings 2–4 lb from water and food, so watch the line, not the dots.</p></section>
  ${pts.length ? `<section class="card"><div class="ch"><h2>Recent</h2></div>${pts.slice(-10).reverse().map(p => `<div class="item"><div class="m">${parseKey(p.d).toLocaleDateString([], {weekday: "short", month: "short", day: "numeric"})}</div><span class="cal">${p.w} lb</span><button class="x" data-act="delW" data-d="${p.d}" aria-label="Delete">×</button></div>`).join("")}</section>` : ""}`;
}

/* ================= TRENDS ================= */
function viewTrends() {
  const s = S.settings, k = todayKey(), days = [];
  for (let i = 13; i >= 0; i--) { const dk = addDays(k, -i), t = totals(dk), n = peek(dk)?.items.length || 0; days.push({k: dk, t, logged: n > 0}); }
  const logged = days.filter(d => d.logged && d.k !== k), l7 = logged.filter(d => d.k > addDays(k, -8));
  const pHit = logged.filter(d => d.t.p >= s.p * .9).length;
  const W = 340, H = 170, pl = 34, pb = 20, maxC = Math.max(s.cal * 1.3, ...days.map(d => d.t.cal));
  const y = v => H - pb - v / maxC * (H - pb - 12), bw = (W - pl) / days.length;
  const bars = days.map((d, i) => { const bx = pl + i * bw + bw * .18, w = bw * .64, col = d.t.cal > s.cal * 1.1 ? "var(--bad)" : d.t.cal >= s.cal * .85 ? "var(--good)" : "var(--carb)";
    return (d.logged ? `<rect x="${bx}" y="${y(d.t.cal)}" width="${w}" height="${H - pb - y(d.t.cal)}" rx="4" fill="${col}"/>` : `<rect x="${bx}" y="${H - pb - 3}" width="${w}" height="3" rx="1.5" fill="var(--line)"/>`) + `<text x="${bx + w / 2}" y="${H - 5}" text-anchor="middle">${"SMTWTFS"[parseKey(d.k).getDay()]}</text>`; }).join("");
  const grid = [.5, 1].map(f => `<line x1="${pl}" x2="${W}" y1="${y(s.cal * f)}" y2="${y(s.cal * f)}" stroke="var(--line)"/><text x="${pl - 5}" y="${y(s.cal * f) + 3}" text-anchor="end">${(s.cal * f / 1000).toFixed(1)}k</text>`).join("");
  const goalLine = `<line x1="${pl}" x2="${W}" y1="${y(s.cal)}" y2="${y(s.cal)}" stroke="var(--ember)" stroke-dasharray="4 4"/>`;
  const pBars = days.map((d, i) => { const bx = pl + i * bw + bw * .18, w = bw * .64, h = 46, f = clamp(d.t.p / s.p, 0, 1.2) / 1.2;
    return d.logged ? `<rect x="${bx}" y="${h - f * h + 4}" width="${w}" height="${f * h}" rx="3" fill="${d.t.p >= s.p * .9 ? "var(--ember)" : "var(--line-hi)"}"/>` : ""; }).join("");
  return `
  <section class="stats">
    <div class="stat"><span class="eyebrow">Avg calories</span><span class="v">${l7.length ? r0(avg(l7.map(d => d.t.cal))).toLocaleString() : "–"}</span><span class="s">last 7 logged days · goal ${s.cal.toLocaleString()}</span></div>
    <div class="stat"><span class="eyebrow">Avg protein</span><span class="v">${l7.length ? r0(avg(l7.map(d => d.t.p))) + "g" : "–"}</span><span class="s">goal ${s.p}g</span></div>
    <div class="stat"><span class="eyebrow">Protein hit</span><span class="v">${logged.length ? pHit + "/" + logged.length : "–"}</span><span class="s">days within 10% of goal</span></div>
    <div class="stat"><span class="eyebrow">Days logged</span><span class="v">${logged.length}/13</span><span class="s">past two weeks</span></div>
  </section>
  <section class="card"><div class="ch"><h2>Calories, 14 days</h2><span class="sub">dashed = goal</span></div><svg class="chart" viewBox="0 0 ${W} ${H}">${grid}${goalLine}${bars}</svg></section>
  <section class="card"><div class="ch"><h2>Protein</h2><span class="sub">orange = goal hit</span></div><svg class="chart" viewBox="0 0 ${W} 54">${pBars}</svg>
    <p class="note" style="margin:8px 0 0">Hitting protein most days matters more for getting stronger than any single perfect day.</p></section>`;
}

/* ================= SETUP ================= */
function calcGoals(p) {
  const kg = p.lb * .4536, cm = (p.ft * 12 + num(p.in)) * 2.54;
  const bmr = 10 * kg + 6.25 * cm - 5 * p.age + (p.sex === "m" ? 5 : -161);
  const cal = Math.round((bmr * p.act + p.goal) / 50) * 50;
  const pr = Math.round(p.lb * 1.0 / 5) * 5, fat = Math.round(p.lb * .35 / 5) * 5;
  const carbs = Math.max(0, Math.round((cal - pr * 4 - fat * 9) / 4 / 5) * 5);
  return {cal, p: pr, c: carbs, f: fat};
}
function viewSetup() {
  const s = S.settings, p = s.profile, g = calcGoals(p);
  return `
  <section class="card"><div class="ch"><h2>Daily goals</h2></div>
    <div class="row"><label class="f">Calories<input id="gCal" type="number" inputmode="numeric" value="${s.cal}"></label><label class="f">Protein g<input id="gP" type="number" inputmode="numeric" value="${s.p}"></label></div>
    <div class="row" style="margin-top:8px"><label class="f">Carbs g<input id="gC" type="number" inputmode="numeric" value="${s.c}"></label><label class="f">Fat g<input id="gF" type="number" inputmode="numeric" value="${s.f}"></label><label class="f">Water cups<input id="gW" type="number" inputmode="numeric" value="${s.water}"></label></div>
    <button class="btn ember wide" style="margin-top:12px" data-act="saveGoals">Save goals</button></section>
  <section class="card"><div class="ch"><h2>Goal calculator</h2><span class="sub">estimates, adjust from your weight trend</span></div>
    <div class="seg" style="margin-bottom:10px">${[["m", "Male"], ["f", "Female"]].map(([v, l]) => `<button class="${p.sex === v ? "on" : ""}" data-act="prof" data-k="sex" data-v="${v}">${l}</button>`).join("")}</div>
    <div class="row"><label class="f">Age<input data-pf="age" type="number" inputmode="numeric" value="${p.age}"></label><label class="f">Height ft<input data-pf="ft" type="number" inputmode="numeric" value="${p.ft}"></label><label class="f">in<input data-pf="in" type="number" inputmode="numeric" value="${p.in}"></label><label class="f">Weight lb<input data-pf="lb" type="number" inputmode="decimal" value="${p.lb}"></label></div>
    <label class="f" style="margin-top:10px">How active<select data-pf="act">${[[1.375, "Light: a few workouts a week"], [1.55, "Moderate: training most days"], [1.725, "In season: practice or lifting daily"], [1.9, "Very high: two-a-days"]].map(([v, l]) => `<option value="${v}" ${p.act == v ? "selected" : ""}>${l}</option>`).join("")}</select></label>
    <div class="eyebrow" style="margin:12px 0 6px">Goal</div>
    <div class="seg">${[[-300, "Lean out"], [0, "Maintain"], [300, "Gain muscle"]].map(([v, l]) => `<button class="${p.goal === v ? "on" : ""}" data-act="prof" data-k="goal" data-v="${v}">${l}</button>`).join("")}</div>
    <div class="preview" style="margin-top:14px"><div><b>${g.cal.toLocaleString()}</b><span>kcal</span></div><div><b style="color:var(--ember)">${g.p}</b><span>protein</span></div><div><b style="color:var(--carb)">${g.c}</b><span>carbs</span></div><div><b style="color:var(--fat)">${g.f}</b><span>fat</span></div></div>
    <button class="btn wide" style="margin-top:12px" data-act="useCalc">Use these goals</button>
    <p class="note" style="margin:10px 0 0">Protein is set to about 1 g per pound of bodyweight, which is plenty for building muscle. For a teen athlete, eating enough matters more than eating little: keep any cut small and slow.</p></section>
  <section class="card"><div class="ch"><h2>Backup</h2><span class="sub">${Object.keys(S.days).length} days saved on this phone</span></div>
    <p class="note" style="margin:0 0 10px">Your food log is only stored on this phone. Save a backup now and then.</p>
    <div class="row"><button class="btn" data-act="export">Save backup</button><label class="btn ghost" style="position:relative;overflow:hidden">Restore backup<input type="file" accept="application/json,.json" id="importFile" style="position:absolute;inset:0;opacity:0"></label></div></section>
  <p class="note" style="text-align:center">Open this from LIFE HQ so all your apps share the same data.</p>`;
}

/* ---------- render ---------- */
function render() {
  const titles = {today: "Fuel", body: "Body", trends: "Trends", setup: "Setup"};
  $("#title").textContent = titles[tab];
  const k = todayKey(), isToday = viewDay === k;
  $("#sub").textContent = tab === "today" ? (isToday ? "Today, " : viewDay === addDays(k, -1) ? "Yesterday, " : "") + parseKey(viewDay).toLocaleDateString([], {weekday: "long", month: "short", day: "numeric"}) : new Date().toLocaleDateString([], {weekday: "long", month: "long", day: "numeric"});
  $("#daynav").innerHTML = tab === "today" ? `<button class="btn sm" data-act="dayNav" data-d="-1" aria-label="Previous day">‹</button>${isToday ? "" : '<button class="btn sm" data-act="dayNav" data-d="0">Today</button>'}<button class="btn sm" data-act="dayNav" data-d="1" aria-label="Next day" ${isToday ? "disabled" : ""}>›</button>` : "";
  $("#tabs").innerHTML = TABS.map(([id, l]) => `<button class="tab" role="tab" aria-selected="${id === tab}" data-act="tab" data-id="${id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[id]}</svg>${l}</button>`).join("");
  $("#main").innerHTML = {today: viewToday, body: viewBody, trends: viewTrends, setup: viewSetup}[tab]();
}

/* ---------- actions ---------- */
const val = id => ($("#" + id)?.value ?? "").trim();
let editMeal = null;
const A = {
  tab: el => go(el.dataset.id),
  dayNav(el) { const d = +el.dataset.d; viewDay = d === 0 ? todayKey() : addDays(viewDay, d); if (viewDay > todayKey()) viewDay = todayKey(); render(); },
  openAdd: el => openAdd(el.dataset.meal),
  closeSheet(el, ev) { if (ev.target === el || el.tagName === "BUTTON") closeSheet(); },
  mode(el) { stopScan(); add.mode = el.dataset.m; add.camOn = false; add.scanMsg = ""; renderSheet(); if (add.mode === "search") $("#q")?.focus(); },
  pick(el) { add.pick = resultCache[+el.dataset.i]; add.qty = 1; renderSheet(); },
  unpick() { add.pick = null; renderSheet(); },
  qty(el) { add.qty = +el.dataset.q; renderSheet(); },
  addPicked() {
    const f = add.pick, q = add.qty; if (!(q > 0)) return;
    addItems([{name: f.name, serving: f.serving, qty: q, qtyLabel: qtyLabel(q, f.serving), cal: f.cal * q, p: f.p * q, c: f.c * q, f: f.f * q}], add.meal);
    toast(`Added ${f.name}`); add.pick = null; add.q = ""; add.mode = "search"; renderSheet(); render();
  },
  quickAdd() { const cal = num(val("qkCal")); if (!cal) { toast("Enter calories."); return; }
    addItems([{name: val("qkName") || "Quick add", serving: "1 serving", qtyLabel: "", cal, p: num(val("qkP")), c: num(val("qkC")), f: num(val("qkF"))}], add.meal);
    toast("Added " + cal + " kcal"); closeSheet(); render(); },
  createFood() {
    const name = val("crName"), cal = num(val("crCal")); if (!name || !cal) { toast("Add a name and calories."); return; }
    const f = {id: rid(), name, serving: val("crServ") || "1 serving", cal, p: num(val("crP")), c: num(val("crC")), f: num(val("crF"))};
    S.myFoods.unshift(f); save(); add.pick = {...f, src: "mine"}; add.qty = 1; renderSheet();
  },
  delMine(el) { S.myFoods = S.myFoods.filter(f => f.id !== el.dataset.id); save(); renderSheet(); },
  addMeal(el, ev) { if (ev.target.closest(".x")) return; const m = S.meals.find(x => x.id === el.dataset.id); addItems(m.items, add.meal); toast("Added " + m.name); closeSheet(); render(); },
  delMeal(el) { const m = S.meals.find(x => x.id === el.dataset.id); S.meals = S.meals.filter(x => x !== m); save(); renderSheet(); toast("Deleted " + m.name, () => { S.meals.push(m); }); },
  startScan() { add.camOn = true; add.scanMsg = ""; renderSheet(); },
  lookup() { lookup(val("bcIn")); },
  delItem(el) { const d = day(), before = d.items.slice(); d.items = d.items.filter(i => i.id !== el.dataset.id); save(); render(); toast("Removed", () => { d.items = before; }); },
  copyY(el) { const m = el.dataset.meal, y = (peek(addDays(viewDay, -1))?.items || []).filter(i => i.meal === m); addItems(y, m); render(); toast(`Copied ${y.length} food${y.length === 1 ? "" : "s"}`); },
  saveMeal(el) {
    const m = el.dataset.meal, items = day().items.filter(i => i.meal === m).map(({id, meal, ...rest}) => rest);
    const name = items.map(i => i.name.split(/[,(]/)[0].trim()).slice(0, 3).join(" + ");
    S.meals.unshift({id: rid(), name, items}); save(); toast("Saved \"" + name + "\". Find it at the top of Add food.");
  },
  water(el) { const d = day(), n = +el.dataset.n; d.water = d.water === n ? n - 1 : n; save(); render(); },
  saveW() { const w = num(val("wIn")); if (!(w > 50 && w < 500)) { toast("Enter your weight in pounds."); return; } S.weights[todayKey()] = Math.round(w * 10) / 10; save(); render(); toast("Saved " + w + " lb"); },
  delW(el) { const d = el.dataset.d, w = S.weights[d]; delete S.weights[d]; save(); render(); toast("Deleted", () => { S.weights[d] = w; }); },
  saveGoals() { const s = S.settings; s.cal = num(val("gCal")) || s.cal; s.p = num(val("gP")) || s.p; s.c = num(val("gC")) || s.c; s.f = num(val("gF")) || s.f; s.water = num(val("gW")) || s.water; save(); render(); toast("Goals saved"); },
  prof(el) { const p = S.settings.profile; p[el.dataset.k] = el.dataset.k === "goal" ? +el.dataset.v : el.dataset.v; save(); render(); },
  useCalc() { Object.assign(S.settings, calcGoals(S.settings.profile)); save(); render(); toast("Goals updated"); },
  export() {
    const blob = new Blob([JSON.stringify(S)], {type: "application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "fuel-backup-" + ymd(new Date()) + ".json";
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  },
};
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]");
  if (!el || el.tagName === "INPUT" || el.tagName === "SELECT") return;
  if (el.disabled) return;
  A[el.dataset.act]?.(el, ev);
});
document.addEventListener("keydown", ev => {
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches(".res[data-act]")) { ev.preventDefault(); A[ev.target.dataset.act](ev.target, ev); }
  if (ev.key === "Enter") { const m = {bcIn: "lookup", wIn: "saveW", qkF: "quickAdd", crF: "createFood"}[ev.target.id]; if (m) A[m](); if (ev.target.id === "q" && resultCache[0]) A.pick({dataset: {i: 0}}); }
  if (ev.key === "Escape" && add) closeSheet();
});
document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.id === "q") { add.q = t.value; $("#results").innerHTML = searchResults(add.q); }
  if (t.id === "qtyIn") { add.qty = Math.max(0, num(t.value)); const pv = document.querySelector(".preview"); const f = add.pick, q = add.qty;
    if (pv) pv.querySelectorAll("b").forEach((b, i) => b.textContent = r0([f.cal, f.p, f.c, f.f][i] * q)); document.querySelectorAll(".pick .chip").forEach(c => c.classList.toggle("on", +c.dataset.q === q)); }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.dataset.pf) { const p = S.settings.profile; p[t.dataset.pf] = num(t.value); save(); render(); }
  if (t.id === "importFile" && t.files[0]) t.files[0].text().then(txt => { const d = JSON.parse(txt); if (!d.settings || !d.days) throw 0; S = d; save(); render(); toast("Backup restored"); }).catch(() => toast("That file isn't a Fuel backup."));
});
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (TABS.some(t => t[0] === h) && h !== tab) go(h); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && !add) { if (viewDay > todayKey() || (viewDay < todayKey() && tab !== "today")) viewDay = todayKey(); render(); } });

Life.mountStatus($("#sync"));
Life.onChange(() => { adopt(); if (!add) render(); });
render();
Life.start();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GAME DAY</title>
<meta name="description" content="Scores, teams, players and your own model predictions for NBA, NFL, college basketball and college football">
<meta name="theme-color" content="#06080c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GAME DAY">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=11">
</head>
<body>
<header class="top" id="top">
  <div class="top-row">
    <a class="brand" href="#/home" aria-label="GAME DAY home"><span class="brand-mark">GAME</span><span class="brand-day">DAY</span></a>
    <div class="top-actions">
      <span class="live-pill" id="livePill" hidden><i></i><span>0 live</span></span>
      <a class="icon-btn bell" href="#/alerts" aria-label="Notifications"><svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 1 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span class="bell-n" id="bellCount" hidden></span></a>
      <button class="icon-btn" data-action="search" aria-label="Search teams and players">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
    </div>
  </div>
  <nav class="chips" id="sportChips" aria-label="Sport filter"></nav>
</header>

<main id="view" tabindex="-1"></main>

<nav class="tabs" aria-label="Main">
  <a href="#/home" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
  <a href="#/scores" data-tab="scores"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M12 5v14M7 10v4M17 10v4"/></svg><span>Scores</span></a>
  <a href="#/teams" data-tab="teams"><svg viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 4.5 3.4 8.2 8 9 4.6-.8 8-4.5 8-9V6z"/></svg><span>Teams</span></a>
  <a href="#/stats" data-tab="stats"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><span>Stats</span></a>
  <a href="#/profile" data-tab="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span>Profile</span></a>
</nav>

<div class="overlay" id="overlay" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script type="module" src="js/app.js?v=11"></script>
<script>
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>

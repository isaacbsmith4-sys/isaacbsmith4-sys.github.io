<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LIFE HQ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>LIFE HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: the hub of the life apps. Bottom tab bar (Today / Calendar / Apps / Setup) on phones,
   top rail on desktop. HQ itself stays near-monochrome; color only ever means "this came from
   that app" (each app's own hue from kit/apps.js). */
:root{
  color-scheme:dark;
  --bg:#08090d; --surface:#111319; --surface2:#181b23; --sunk:#0c0e13; --line:#23262f; --line-hi:#353a47;
  --ink:#eef0f5; --ink2:#c3c7d3; --muted:#868c9c; --faint:#585e6e;
  --accent:#e9e7ff; --good:#5fd8a0; --warn:#f2b45c; --bad:#ff6a7c;
  --display:"Unbounded","Avenir Next",system-ui,sans-serif;
  --body:"Manrope","Avenir Next","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --tabh:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);min-height:100vh;overflow-x:hidden;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(var(--tabh) + 24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:760px;margin:0 auto}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:18px 0 14px}
.brand{font:700 13px var(--display);letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
header h1{font:700 24px var(--display);margin:4px 0 0;letter-spacing:-.01em;text-wrap:balance}
.screen{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;min-width:0;position:relative;overflow:hidden}
a.card{color:inherit;text-decoration:none;display:block}
a.card:active{transform:scale(.99)}
.card .tag{display:flex;align-items:center;gap:7px;font:600 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--c)}
.card .tag i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.card .tag .go{margin-left:auto;color:var(--faint);letter-spacing:0;font-size:16px}
.card::after{content:"";position:absolute;right:-40px;top:-40px;width:120px;height:120px;border-radius:50%;background:var(--c,transparent);filter:blur(55px);opacity:.14;pointer-events:none}
.big{font:700 28px var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:8px}
.big small{font:500 13px var(--body);color:var(--muted);letter-spacing:0;margin-left:4px}
.sub{color:var(--muted);font-size:13px}
.note{color:var(--muted);font-size:12.5px}
.eyebrow{font:600 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:10px}
.bar>b{display:block;height:100%;border-radius:6px;background:var(--c);transition:width .6s}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.mini div{display:grid;gap:2px}
.mini b{font:600 15px var(--mono)}
.mini span{font-size:11px;color:var(--muted)}
.empty{color:var(--muted);font-size:13.5px;margin-top:8px}
.agenda{display:grid;gap:2px}
.ev{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.ev:last-child{border-bottom:0}
.ev .t{width:64px;flex:none;font:600 12px var(--mono);color:var(--muted);padding-top:2px}
.ev .d{flex:1;min-width:0}
.ev .d b{display:flex;align-items:center;gap:7px;font-weight:600}
.ev .d b i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.ev.planned .d b{font-weight:500;color:var(--ink2)}
.ev .pl{font:600 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);border:1px solid var(--line-hi);border-radius:6px;padding:1px 5px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{font:600 10px var(--mono);color:var(--faint);text-align:center;padding-bottom:4px;letter-spacing:.1em}
.cal button{aspect-ratio:1;border:1px solid transparent;background:var(--surface2);border-radius:12px;color:var(--ink2);font:600 13px var(--mono);cursor:pointer;display:grid;grid-template-rows:1fr auto;justify-items:center;padding:6px 2px 7px;min-width:0}
.cal button.out{background:transparent;color:var(--faint)}
.cal button.today{border-color:var(--line-hi);color:var(--ink)}
.cal button.sel{background:var(--ink);color:var(--bg)}
.cal .dots{display:flex;gap:3px;justify-content:center;min-height:5px}
.cal .dots i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.mhead h2{font:700 16px var(--display);margin:0}
.btn{appearance:none;border:1px solid var(--line-hi);background:var(--surface2);color:var(--ink);font:700 14px var(--body);padding:10px 15px;border-radius:13px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:11px}
.btn.solid{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.btn:focus-visible,.tab:focus-visible,.cal button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.legend span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.legend i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:10px}
.app{display:grid;gap:8px;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:inherit;position:relative;overflow:hidden}
.app .ic{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 45%,#000));box-shadow:0 0 18px -4px var(--c);display:grid;place-items:center;font:700 16px var(--display);color:#0b0b10}
.app b{font-size:15px}
.app span{font-size:12px;color:var(--muted)}
.app.soon{opacity:.55}
.app.soon .ic{box-shadow:none;filter:saturate(.4)}
.status{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv span:last-child{color:var(--muted);font-family:var(--mono);font-size:12.5px;text-align:right}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:rgba(8,9,13,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
nav.tabs .in{display:flex;width:100%;max-width:760px}
.tab{flex:1;border:0;background:none;color:var(--faint);font:600 11px var(--body);display:grid;justify-items:center;gap:3px;padding:6px 0;cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-selected=true]{color:var(--ink)}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;background:none;color:var(--muted);font:700 12.5px var(--body);padding:9px 4px;cursor:pointer}
.seg button.on{background:var(--surface2);color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
.goal{display:grid;gap:8px;cursor:pointer}
.goal .gt{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.goal .gt b{font-size:16px;line-height:1.3}
.chip{display:inline-block;font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;border-radius:6px;padding:2px 6px;border:1px solid var(--line-hi);color:var(--muted);white-space:nowrap}
.chip.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.gnum{font:700 22px var(--display);font-variant-numeric:tabular-nums}
.gnum small{font:500 12.5px var(--body);color:var(--muted);margin-left:4px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:10px var(--mono)}
.mrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,120px),1fr));gap:10px;margin-top:12px}
.mrow div{background:var(--surface2);border:1px solid var(--line);border-radius:13px;padding:10px 11px;display:grid;gap:1px}
.mrow b{font:600 17px var(--mono)}
.mrow span{font-size:11.5px;color:var(--muted)}
.mrow em{font-style:normal;font-size:11.5px}
.conn{padding:12px 0;border-bottom:1px solid var(--line);display:grid;gap:6px}
.conn:last-child{border-bottom:0}
.conn .vs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.conn .vs div{background:var(--surface2);border-radius:11px;padding:9px 10px}
.conn .vs b{display:block;font:600 16px var(--mono)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:11px;padding:10px 11px;min-width:0}
input[type=number],input[type=date]{font-family:var(--mono)}
label.f{display:grid;gap:5px;font-size:12px;color:var(--muted);flex:1 1 130px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pick{display:grid;gap:8px}
.pick button{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:13px;padding:12px 13px;font:600 14px var(--body);cursor:pointer}
.pick button span{font:500 12px var(--body);color:var(--muted)}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(3,4,8,.72);backdrop-filter:blur(5px);display:grid;align-items:end;justify-items:center}
.sheet .in{width:min(640px,100%);max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;display:grid;gap:14px;align-content:start;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .22s ease-out}
.sheet h3{margin:0;font:700 18px var(--display)}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--surface2);border:1px solid var(--line-hi);border-radius:13px;padding:10px 14px;font-size:14px;display:flex;gap:12px;align-items:center;box-shadow:0 12px 40px rgba(0,0,0,.5);max-width:calc(100vw - 32px)}
.toast button{border:0;background:none;color:var(--accent);font:700 13px var(--body);cursor:pointer}
@media (max-width:380px){.tab{font-size:10px}}
@media (min-width:900px){
  body{padding-bottom:40px;padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
  nav.tabs{top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line);padding:8px 16px}
  .tab{grid-auto-flow:column;gap:8px;font-size:13px;padding:8px}
  .tab svg{width:18px;height:18px}
  .wide2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header><div><div class="brand">Life HQ</div><h1 id="title"></h1></div><div id="sync"></div></header>
  <main id="main" class="screen"></main>
</div>
<nav class="tabs"><div class="in" id="tabs" role="tablist"></div></nav>
<div id="overlay"></div>
<script src="../kit/kit.js?v=7"></script>
<script src="../kit/apps.js?v=7"></script>
<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const {APPS, adapters, util, METRICS, metricInfo, metric} = LifeApps;
const {ymd, parseKey, addDays, dur, time} = util;
const APP = Object.fromEntries(APPS.map(a => [a.id, a]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");
const todayKey = () => ymd(new Date(Date.now() - 4 * 3600e3));
const bar = (f, c) => `<div class="bar" style="--c:${c}"><b style="width:${(clamp(f, 0, 1) * 100).toFixed(1)}%"></b></div>`;

const ICONS = {
  today: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  goals: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  analytics: '<path d="M3 20h18M5 16l4-5 4 3 6-8"/>',
  calendar: '<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/>',
  apps: '<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',
  setup: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
};
const TABS = [["today", "Today"], ["calendar", "Calendar"], ["goals", "Goals"], ["analytics", "Analytics"], ["apps", "Apps"], ["setup", "Setup"]];
let tab = TABS.some(t => t[0] === location.hash.slice(1)) ? location.hash.slice(1) : "today";
function go(t) { tab = t; history.replaceState(null, "", "#" + t); render(); window.scrollTo(0, 0); }

/* ================= TODAY ================= */
function viewToday() {
  const k = todayKey(), now = new Date(), cards = [];
  // Recovery leads the morning: readiness frames everything else
  const ra = adapters.recovery;
  if (ra.has()) {
    const r = ra.today(k), col = r.score == null ? "var(--muted)" : r.score >= 75 ? "var(--good)" : r.score >= 55 ? "var(--warn)" : "var(--bad)";
    cards.push(`<a class="card" href="${APP.recovery.path}" style="--c:${APP.recovery.color}"><div class="tag"><i></i>Recovery<span class="go">›</span></div>
      ${r.checkin ? `<div class="big" style="color:${col}">${r.score ?? "–"}<small>readiness · ${esc(r.band)}</small></div>${bar((r.score || 0) / 100, col)}<div class="sub" style="margin-top:8px">energy ${r.checkin.energy}/5 · soreness ${r.checkin.sore}/5 · stress ${r.checkin.stress}/5</div>`
        : `<div class="big">Check in<small>30 seconds</small></div><div class="empty">How's your body today? Get your readiness score.</div>`}</a>`);
  } else cards.push(emptyCard("recovery"));
  // Sleep
  const sa = adapters.sleep;
  if (sa.has()) {
    const s = sa.today(k), L = s.lastNight;
    const toBed = (s.bed - now) / 60000;
    cards.push(`<a class="card" href="${APP.sleep.path}" style="--c:${APP.sleep.color}"><div class="tag"><i></i>Sleep<span class="go">›</span></div>
      ${s.inBed ? `<div class="big">In bed<small>since ${time(s.inBed)}</small></div>`
        : `<div class="big">${toBed > 0 ? dur(toBed) : dur(-toBed)}<small>${toBed > 0 ? "until bedtime" : "past bedtime"}</small></div>`}
      <div class="sub">Bed ${time(s.bed)} · up ${time(s.wake)}${s.windTotal ? ` · wind-down ${s.windDone}/${s.windTotal}` : ""}</div>
      <div class="mini"><div><b>${L ? dur(L.min) : "–"}</b><span>last night</span></div><div><b>${L && L.q ? L.q + "/5" : "–"}</b><span>rested</span></div><div><b>${L ? Math.round(L.min / s.goalMin * 100) + "%" : "–"}</b><span>of goal</span></div></div>
      ${!L ? `<div class="empty">Last night isn't logged yet.</div>` : ""}</a>`);
  } else cards.push(emptyCard("sleep"));
  // Fuel
  const fa = adapters.fuel;
  if (fa.has()) {
    const f = fa.today(k), g = f.goals, left = g.cal - f.t.cal;
    cards.push(`<a class="card" href="${APP.fuel.path}" style="--c:${APP.fuel.color}"><div class="tag"><i></i>Fuel<span class="go">›</span></div>
      <div class="big">${Math.round(f.t.cal).toLocaleString()}<small>of ${g.cal.toLocaleString()} kcal</small></div>${bar(f.t.cal / g.cal, APP.fuel.color)}
      <div class="mini"><div><b>${Math.round(f.t.p)}/${g.p}g</b><span>protein</span></div><div><b>${f.water}/${g.water}</b><span>cups water</span></div><div><b>${f.weight ? f.weight.lb : "–"}</b><span>${f.weight ? "lb, " + parseKey(f.weight.date).toLocaleDateString([], {month: "short", day: "numeric"}) : "weight"}</span></div></div>
      ${!f.items ? `<div class="empty">Nothing logged today yet.</div>` : left < 0 ? `<div class="empty">${Math.round(-left)} kcal over.</div>` : ""}</a>`);
  } else cards.push(emptyCard("fuel"));
  // Train
  const ta = adapters.train;
  if (ta.has()) {
    const t = ta.today(k), d = t.done[0];
    cards.push(`<a class="card" href="${APP.train.path}" style="--c:${APP.train.color}"><div class="tag"><i></i>Train<span class="go">›</span></div>
      <div class="big">${t.active ? esc(t.active.name) + "<small>in progress</small>" : d ? esc(t.done.map(w => w.name).join(" + ")) + "<small>done</small>" : t.planned ? esc(t.planned.name) + "<small>planned</small>" : "Rest day"}</div>
      <div class="sub">${t.week} workout${t.week === 1 ? "" : "s"} this week${t.plannedWeek ? ` of ${t.plannedWeek} planned` : ""}</div>
      ${t.plannedWeek ? bar(t.week / t.plannedWeek, APP.train.color) : ""}
      ${d && (d.prs || []).length ? `<div class="empty" style="color:var(--good)">New PR: ${esc(d.prs.map(p => p.n).join(", "))}</div>` : ""}</a>`);
  } else cards.push(emptyCard("train"));
  // Habits
  const ha = adapters.habits;
  if (ha.has()) {
    const h = ha.today(k);
    cards.push(`<a class="card" href="${APP.habits.path}" style="--c:${APP.habits.color}"><div class="tag"><i></i>Habits<span class="go">›</span></div>
      <div class="big">${h.done}/${h.due}<small>done today</small></div>${bar(h.due ? h.done / h.due : 0, APP.habits.color)}
      <div class="sub" style="margin-top:8px">${!h.due ? "Nothing scheduled today." : h.done === h.due ? "All done." : h.mustLeft.length ? "Still to do: " + esc(h.mustLeft.join(", ")) : h.left.length + " left"}</div></a>`);
  } else cards.push(emptyCard("habits"));
  // Focus
  const fo = adapters.focus;
  if (fo.has()) {
    const f = fo.today(k);
    cards.push(`<a class="card" href="${APP.focus.path}" style="--c:${APP.focus.color}"><div class="tag"><i></i>Focus<span class="go">›</span></div>
      <div class="big">${f.active ? "Focusing<small>session running</small>" : dur(f.min) + `<small>of ${dur(f.goal)} goal</small>`}</div>${bar(f.min / f.goal, APP.focus.color)}
      <div class="sub" style="margin-top:8px">${f.count ? plural(f.count, "session") + " today" : "No sessions yet today."}</div></a>`);
  } else cards.push(emptyCard("focus"));
  // Coming up: the rest of today's planned items from every app
  const evs = allEvents(k, k).filter(e => e.planned && (!e.time || e.time > now)).sort(byTime);
  return `<div class="wide2">${cards.join("")}</div>
    <section class="card"><div class="mhead"><h2>Coming up today</h2><button class="btn sm" data-act="tab" data-id="calendar">Calendar</button></div>
      ${evs.length ? `<div class="agenda">${evs.map(evRow).join("")}</div>` : `<div class="empty">Nothing else planned today.</div>`}</section>
`;
}
function emptyCard(id) {
  const a = APP[id];

      ${lineChart(sl, {color: APP.sleep.color, target: adapters.sleep.goalHours(), from, to, fmt: v => v.toFixed(1) + "h"})}

        <div><span>Avg bedtime</span><b>${m != null ? bt(m) : "–"}</b><em class="muted">${sd != null ? "±" + Math.round(sd) + " min " + (sd <= 30 ? "(steady)" : sd <= 60 ? "(drifting)" : "(all over)") : ""}</em></div></div></section>`);
  }
  // Fuel
  const cal = metric("fuel.cal", from, to), wt = metric("fuel.weight", from, to);
  if (cal.length || wt.length) {
    const g = adapters.fuel.goals(), pr = metric("fuel.protein", from, to), hit = pr.filter(p => p.v >= g.p * .9).length;
    cards.push(`<section class="card" style="--c:${APP.fuel.color}"><div class="tag"><i></i>Fuel · ${plural(cal.length, "day")} logged</div>
      ${cal.length ? lineChart(cal, {color: APP.fuel.color, target: g.cal, from, to, bars: true, fmt: v => (v / 1000).toFixed(1) + "k"}) : ""}
      <div class="mrow">${statBox("fuel.cal", "Avg calories", from, to, pFrom, pTo)}${statBox("fuel.protein", "Avg protein", from, to, pFrom, pTo)}
        <div><span>Protein goal hit</span><b>${pr.length ? hit + "/" + pr.length : "–"}</b><em class="muted">days within 10%</em></div>
        ${wt.length ? `<div><span>Bodyweight</span><b>${wt[wt.length - 1].v} lb</b><em class="muted">${wt.length > 1 ? (wt[wt.length - 1].v - wt[0].v >= 0 ? "+" : "") + (wt[wt.length - 1].v - wt[0].v).toFixed(1) + " lb in range" : "1 weigh-in"}</em></div>` : ""}</div>
      ${wt.length > 1 ? `<div class="eyebrow" style="margin-top:12px">Bodyweight</div>${lineChart(wt, {color: APP.fuel.color, from, to, fmt: v => v.toFixed(0)})}` : ""}</section>`);
  }
  // Train
  const wo = metric("train.workouts", from, to);
  if (wo.length) {
    const ws = adapters.train.workouts().filter(w => w.date >= from && w.date <= to), prs = ws.reduce((a, w) => a + (w.prs || []).length, 0);
    const wk = {}; wo.forEach(p => { const d = parseKey(p.date); d.setDate(d.getDate() - d.getDay()); wk[ymd(d)] = (wk[ymd(d)] || 0) + p.v; });
    const weekly = Object.entries(wk).sort().map(([date, v]) => ({date, v}));
    cards.push(`<section class="card" style="--c:${APP.train.color}"><div class="tag"><i></i>Train · ${plural(ws.length, "session")}</div>
      ${lineChart(weekly, {color: APP.train.color, from: weekly[0].date, to: weekly[weekly.length - 1].date, bars: true, fmt: v => Math.round(v)})}
      <div class="mrow">${statBox("train.workouts", "Workouts / week", from, to, pFrom, pTo)}${statBox("train.sets", "Hard sets / week", from, to, pFrom, pTo)}
        <div><span>PRs</span><b>${prs}</b><em class="muted">in range</em></div></div></section>`);
  }
  // Recovery
  const rr = metric("recovery.readiness", from, to);
  if (rr.length) cards.push(`<section class="card" style="--c:${APP.recovery.color}"><div class="tag"><i></i>Recovery · ${plural(rr.length, "check-in")}</div>
      ${lineChart(rr, {color: APP.recovery.color, from, to, fmt: v => Math.round(v)})}
      <div class="mrow">${statBox("recovery.readiness", "Avg readiness", from, to, pFrom, pTo)}${statBox("recovery.soreness", "Avg soreness", from, to, pFrom, pTo)}${metric("recovery.rhr", from, to).length ? statBox("recovery.rhr", "Resting HR", from, to, pFrom, pTo) : ""}</div></section>`);
  // Focus
  const fm = metric("focus.min", from, to);
  if (fm.length) cards.push(`<section class="card" style="--c:${APP.focus.color}"><div class="tag"><i></i>Focus · ${plural(fm.length, "day")}</div>
      ${lineChart(fm, {color: APP.focus.color, target: adapters.focus.goal(), from, to, bars: true, fmt: v => (v / 60).toFixed(1) + "h"})}
      <div class="mrow"><div><span>Total</span><b>${dur(fm.reduce((a, p) => a + p.v, 0))}</b><em class="muted">in range</em></div>${statBox("focus.min", "Per week", from, to, pFrom, pTo, {fmt: v => v == null ? "–" : dur(v)})}${statBox("focus.school", "Study / week", from, to, pFrom, pTo, {fmt: v => v == null ? "–" : dur(v)})}</div></section>`);
  // Habits
  const hp = metric("habits.pct", from, to);
  if (hp.length) cards.push(`<section class="card" style="--c:${APP.habits.color}"><div class="tag"><i></i>Habits · ${plural(hp.length, "day")}</div>
      ${lineChart(hp, {color: APP.habits.color, target: 100, from, to, fmt: v => Math.round(v) + "%"})}
      <div class="mrow">${statBox("habits.pct", "Avg done", from, to, pFrom, pTo)}<div><span>Perfect days</span><b>${hp.filter(p => p.v === 100).length}</b><em class="muted">every habit done</em></div></div></section>`);
  return `<div class="seg">${segs.map(([v, l]) => `<button class="${range === v ? "on" : ""}" data-act="range" data-r="${v}">${l}</button>`).join("")}</div>
    ${range === "custom" ? `<div class="row"><label class="f">From<input type="date" id="rFrom" value="${custom.from}"></label><label class="f">To<input type="date" id="rTo" value="${custom.to}"></label></div>` : ""}
    <p class="sub" style="margin:0">${parseKey(from).toLocaleDateString([], {month: "short", day: "numeric"})} – ${parseKey(to).toLocaleDateString([], {month: "short", day: "numeric", year: "numeric"})} · arrows compare with the ${n} days before</p>
    ${cards.length ? `<div class="wide2">${cards.join("")}</div>` : `<section class="card"><div class="empty">Nothing logged in this range yet. Log in Sleep, Fuel or Train and it shows up here.</div></section>`}
    <section class="card"><div class="mhead"><h2>How things connect</h2></div>${connections(from, to)}</section>`;
}
/* honest side-by-side comparisons, with the number of days behind each side */
function connections(from, to) {
  const out = [], goalH = adapters.sleep.goalHours(), sleepBy = Object.fromEntries(metric("sleep.asleep", addDays(from, -1), to).map(p => [p.date, p.v]));
  const ws = adapters.train.workouts().filter(w => w.date >= from && w.date <= to && w.type === "strength");
  const pair = (title, aLbl, bLbl, a, b, fmt, minN = 3) => {
    if (a.length < minN || b.length < minN) return `<div class="conn"><b>${title}</b><span class="note">Needs at least ${minN} days on each side (now ${a.length} and ${b.length}).</span></div>`;
    return `<div class="conn"><b>${title}</b><div class="vs"><div><span class="note">${aLbl} · ${a.length}</span><b>${fmt(avgOf(a))}</b></div><div><span class="note">${bLbl} · ${b.length}</span><b>${fmt(avgOf(b))}</b></div></div></div>`;
  };
  // 1) sleep the night before vs PRs per strength session
  const good = [], short = [];
  ws.forEach(w => { const s = sleepBy[addDays(w.date, -1)]; if (s == null) return; (s >= goalH - .5 ? good : short).push((w.prs || []).length); });
  out.push(pair("Sleep the night before → PRs per lift session", `${(goalH - .5).toFixed(1)}h+ sleep`, "Shorter nights", good, short, v => v.toFixed(2)));
  // 2) protein on training days vs rest days
  const trainDays = new Set(adapters.train.workouts().map(w => w.date)), pr = metric("fuel.protein", from, to);
  out.push(pair("Protein on training days vs rest days", "Training days", "Rest days", pr.filter(p => trainDays.has(p.date)).map(p => p.v), pr.filter(p => !trainDays.has(p.date)).map(p => p.v), v => Math.round(v) + " g"));
  // 3) sleep after a training day vs after a rest day
  const sl = metric("sleep.asleep", from, to);
  out.push(pair("Sleep after training days vs rest days", "After training", "After rest", sl.filter(p => trainDays.has(p.date)).map(p => p.v), sl.filter(p => !trainDays.has(p.date)).map(p => p.v), v => dur(v * 60)));
  return out.join("") + `<p class="note" style="margin:10px 0 0">These are patterns in your own logs, not proof of cause. They get more trustworthy the more days you log.</p>`;
}
const loadedRanges = new Set();
function ensureRange(from, to) {
  if (!Life.connected) return;
  const months = []; for (let d = from.slice(0, 7) + "-01"; d <= to; d = ymd(new Date(parseKey(d).getFullYear(), parseKey(d).getMonth() + 1, 1))) months.push(d.slice(0, 7));
  const key = months.join(","); if (loadedRanges.has(key)) return; loadedRanges.add(key);
  Promise.all(Object.values(adapters).map(a => a.load(months))).then(() => { if (tab === "analytics") render(); }).catch(() => {});
}

/* ================= APPS ================= */
function viewApps() {
  const built = APPS.filter(a => a.built), soon = APPS.filter(a => !a.built);
  const tile = a => `<${a.built ? `a href="${a.path}"` : "div"} class="app ${a.built ? "" : "soon"}" style="--c:${a.color}"><span class="ic">${a.name[0]}</span><b>${a.name}</b><span>${a.built ? a.blurb : "Coming in phase " + a.phase}</span></${a.built ? "a" : "div"}>`;
  return `<section><div class="eyebrow" style="margin-bottom:10px">Your apps</div><div class="apps">${built.map(tile).join("")}
      <a class="app" href="../film/" style="--c:${APP.basketball.color}"><span class="ic">F</span><b>Film Room</b><span>Basketball read-and-react quiz</span></a></div></section>
    <section><div class="eyebrow" style="margin:6px 0 10px">Games</div><div class="apps"><a class="app" href="../rush/" style="--c:#ff3fa4"><span class="ic">L</span><b>Lane Rush</b><span>Neon highway dodge game</span></a><a class="app" href="../echo/" style="--c:#9d8cff"><span class="ic">E</span><b>Echo</b><span>Dodge your own past moves</span></a><a class="app" href="../well/" style="--c:#ff8a3d"><span class="ic">G</span><b>Gravity Well</b><span>Bend comets with a black hole</span></a><a class="app" href="../split/" style="--c:#6fd0ff"><span class="ic">S</span><b>Split Second</b><span>Freeze time, draw your escape</span></a><a class="app" href="../pulse/" style="--c:#7cf7ff"><span class="ic">P</span><b>Pulse</b><span>Shockwave enemies into the walls</span></a></div></section>
    <section><div class="eyebrow" style="margin:6px 0 10px">On the roadmap</div><div class="apps">${soon.map(tile).join("")}</div></section>
    <p class="note">Only LIFE HQ needs to be on your home screen. Open the apps from here and they all share the same data; each has a "‹ LIFE HQ" button to come back.</p>`;
}

/* ================= SETUP ================= */
function viewSetup() {
  const files = (() => { try { return Object.keys(JSON.parse(localStorage.getItem("life:cache") || "{}")); } catch (e) { return []; } })();
  const byApp = {}; files.forEach(p => { const a = p.split("/")[0]; byApp[a] = (byApp[a] || 0) + 1; });
  return `<section class="card"><div class="mhead"><h2>Backup</h2></div>
      ${Life.connected ? `<p class="note" style="margin:0 0 12px">Connected to your private <b>${Life.OWNER}/${Life.REPO}</b> repo. Every save is a commit, so the repo's history is a full backup.</p>
        <div class="status"><button class="btn solid" data-act="syncNow">Sync now</button><button class="btn" data-act="copyKey">Copy key for another app</button><button class="btn" data-act="connect">Details</button></div>`
      : `<p class="note" style="margin:0 0 12px">Your data is saved on this phone, and every app you open from LIFE HQ shares it. Optional: connect a GitHub key to back it up to your private life-data repo and see it on your computer.</p><button class="btn" data-act="connect">Set up backup</button>`}
      ${Life.lastError ? `<p class="note" style="color:var(--bad)">${esc(Life.lastError)}</p>` : ""}
    </section>
    <section class="card"><div class="mhead"><h2>On this device</h2></div>
      ${Object.keys(byApp).length ? Object.entries(byApp).map(([a, n]) => `<div class="kv"><span>${esc(APP[a] ? APP[a].name : a)}</span><span>${n} file${n === 1 ? "" : "s"}</span></div>`).join("") : '<div class="empty">Nothing yet.</div>'}
      <div class="status" style="margin-top:12px"><button class="btn" data-act="export">Download backup</button></div>
      <p class="note" style="margin:10px 0 0">The download has everything this device has loaded (the last few months). The full history is always in life-data on GitHub.</p></section>
    <section class="card"><div class="mhead"><h2>How LIFE HQ works</h2></div>
      <p class="note" style="margin:0">Each app keeps its own data in its own folder of life-data (sleep/, fuel/, …). LIFE HQ reads those folders to build Today and the Calendar, so nothing is copied between apps and nothing is entered twice. Apps work offline and catch up when you're back online.</p></section>`;
}

/* ---------- render ---------- */
function render() {
  const now = new Date(), h = now.getHours();
  $("#title").textContent = tab === "today" ? (h < 4 ? "Late night" : h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening") + ", Isaac"
    : {calendar: "Calendar", goals: "Goals", analytics: "Analytics", apps: "Apps", setup: "Setup"}[tab];
  $("#tabs").innerHTML = TABS.map(([id, l]) => `<button class="tab" role="tab" aria-selected="${id === tab}" data-act="tab" data-id="${id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[id]}</svg>${l}</button>`).join("");
  $("#main").innerHTML = {today: viewToday, calendar: viewCalendar, goals: viewGoals, analytics: viewAnalytics, apps: viewApps, setup: viewSetup}[tab]();
}
const A = {
  closeSheet(el, ev) { if (ev.target === el || el.tagName === "BUTTON") closeSheet(); },
  newGoal() { newGoalSheet(); },
  goalKind(el) {
    const m = el.dataset.k, info = m ? metricInfo(m) : null;
    const cat = !m ? "Personal" : m.startsWith("recovery") ? "Physical" : m.startsWith("sleep") ? "Sleep" : m.startsWith("habits") ? "Habits" : m === "focus.school" ? "School" : m.startsWith("focus") ? "Productivity" : m.startsWith("fuel.weight") || m.startsWith("train") ? "Physical" : "Nutrition";
    const keep = !!info && info.agg !== "last";
    const fg = adapters.fuel.goals ? adapters.fuel.goals() : {};
    const target = m === "sleep.asleep" ? adapters.sleep.goalHours() : m === "fuel.protein" ? fg.p : m === "fuel.cal" ? fg.cal : m === "train.workouts" ? 4 : m === "habits.pct" ? 85 : m === "focus.min" ? (adapters.focus.goal ? adapters.focus.goal() * 7 : 840) : m === "focus.school" ? 300 : "";
    goalForm({metric: m || null, mode: keep ? "keep" : "reach", title: info ? (m.startsWith("train.lift:") ? m.slice(11) + " max" : info.label) : "", cat, target, dir: info && info.better < 0 ? -1 : 1});
  },
  editGoal(el) { goalForm(goalsAll().find(g => g.id === el.dataset.id)); },
  saveGoal() {
    const g = {...pendingGoal}, v = id => ($("#" + id)?.value ?? "").trim(), info = g.metric ? metricInfo(g.metric) : null;
    g.title = v("gTitle") || (info ? info.label : ""); g.cat = v("gCat") || g.cat; g.deadline = v("gDead") || null;
    const t = parseFloat(v("gTarget")); if (!isFinite(t)) { toast("Enter a target number."); return; } g.target = t;
    if (!g.title) { toast("Give the goal a name."); return; }
    if (!g.id) { g.id = Math.random().toString(36).slice(2, 10); g.startDate = todayKey(); g.done = false; }
    if (!info) { const s0 = parseFloat(v("gStart")); if (!isFinite(s0)) { toast("Enter where you are now."); return; } g.start = s0; g.unit = v("gUnit"); g.mode = "reach"; }
    else if (g.mode === "keep") { g.dir = $("#gDir") ? +v("gDir") : (info.better < 0 ? -1 : 1); }
    else if (g.start == null) { const last = metric(g.metric, "2000-01-01", todayKey()).slice(-1)[0]; g.start = last ? last.v : null; }
    if (g.mode === "reach") g.dir = g.start == null || g.target >= g.start ? 1 : -1;
    saveGoal(g); closeSheet(); render(); toast(pendingGoal.id ? "Goal saved" : "Goal added");
  },
  openGoal(el) { openGoal(el.dataset.id); },
  logGoal(el) { const v = parseFloat($("#glogV").value); if (!isFinite(v)) return; const id = Math.random().toString(36).slice(2, 10), k = todayKey();
    const all = GLOG.all(); all[id] = {date: k, goal: el.dataset.id, v, t: Date.now()}; GLOG.replace(all); openGoal(el.dataset.id); render(); toast("Updated"); },
  toggleDone(el) { const g = goalsAll().find(x => x.id === el.dataset.id); g.done = !g.done; saveGoal(g); closeSheet(); render(); toast(g.done ? "Nice. Goal completed." : "Goal is active again"); },
  delGoal(el) { const g = goalsAll().find(x => x.id === el.dataset.id); dropGoal(g.id); closeSheet(); render(); toast("Goal deleted", () => saveGoal(g)); },
  range(el) { range = el.dataset.r; render(); },
  tab: el => go(el.dataset.id),
  month(el) { const [y, m] = calMonth.split("-").map(Number); calMonth = ymd(new Date(y, m - 1 + +el.dataset.d, 1)).slice(0, 7); render(); },
  pick(el) { sel = el.dataset.k; if (sel.slice(0, 7) !== calMonth) calMonth = sel.slice(0, 7); render(); },
  connect() { Life.openConnect(); },
  async syncNow(el) { el.textContent = "Syncing…"; await Life.sync(); render(); },
  async copyKey(el) { try { await navigator.clipboard.writeText(Life.token()); el.textContent = "Copied"; } catch (e) { el.textContent = "Couldn't copy"; } },
  export() {
    let data = {}; try { data = JSON.parse(localStorage.getItem("life:cache") || "{}"); } catch (e) {}
    const out = Object.fromEntries(Object.entries(data).map(([p, f]) => [p, f.data]));
    const blob = new Blob([JSON.stringify({exported: new Date().toISOString(), files: out}, null, 1)], {type: "application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "life-hq-backup-" + todayKey() + ".json";
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  },
};
document.addEventListener("click", ev => { const el = ev.target.closest("[data-act]"); if (!el || el.tagName === "INPUT" || el.tagName === "SELECT") return; A[el.dataset.act]?.(el, ev); });
document.addEventListener("keydown", ev => { if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches(".goal[data-act]")) { ev.preventDefault(); A.openGoal(ev.target); } if (ev.key === "Escape") closeSheet(); });
document.addEventListener("change", ev => { const t = ev.target; if (t.id === "rFrom" || t.id === "rTo") { custom[t.id === "rFrom" ? "from" : "to"] = t.value || custom.from; render(); } });
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (TABS.some(t => t[0] === h) && h !== tab) go(h); });

Life.mountStatus($("#sync"));
Life.onChange(() => { if (!$("#overlay").innerHTML) render(); });
Life.onStatus(s => { if (s === "synced" || s === "local") { if (!document.querySelector(".lk-sheet")) render(); } });
render();
Life.start();
setInterval(() => { if (tab === "today" && !$("#overlay").innerHTML) render(); }, 60000);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>

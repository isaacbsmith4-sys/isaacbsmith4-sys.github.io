<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Best Plays</title>
<meta name="theme-color" content="#0d0f15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Best Plays">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: one screen per tab (Today / Calendar / Records / Sports). Today leads with the
   Play of the Day as a bet slip; the tab bar sits at the bottom on phones, top on desktop. */
:root{
  color-scheme:dark;
  --bg:#0d0f15; --surface:#151821; --surface2:#1c2030; --sunk:#10131b; --line:#272c3d; --line-hi:#3b4258;
  --ink:#eef0f6; --ink2:#b4bbcc; --muted:#808a9f; --faint:#586178;
  --gold:#e3b04b; --gold-ink:#f2c66a; --gold-bg:rgba(227,176,75,.13); --gold-line:rgba(227,176,75,.5); --on-gold:#1a1305;
  --win:#3ddc84; --win-bg:rgba(61,220,132,.14); --loss:#ff6b6b; --loss-bg:rgba(255,107,107,.14); --push-bg:#272c3d;
  --s-all:#5b8def; --s-potd:#c98500; --grid:#232838;
  --nfl:#5b8def; --cfb:#ff6b7d; --nba:#ff8a3d; --ncaab:#b39dff; --nhl:#3dd6c6;
  --font-display:"Big Shoulders Display","Oswald","Arial Narrow",system-ui,sans-serif;
  --font-body:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;
  --tabbar-h:64px;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#f3f1ec; --surface:#ffffff; --surface2:#f8f6f1; --sunk:#ece9e2; --line:#e0dcd2; --line-hi:#c9c3b5;
  --ink:#16181f; --ink2:#3d4252; --muted:#6a7080; --faint:#9a9fac;
  --gold:#a8750a; --gold-ink:#8a5f00; --gold-bg:rgba(201,141,18,.12); --gold-line:rgba(168,117,10,.45); --on-gold:#fffaf0;
  --win:#14864a; --win-bg:rgba(20,134,74,.11); --loss:#c8323a; --loss-bg:rgba(200,50,58,.1); --push-bg:#e6e2d9;
  --s-all:#2f62d8; --s-potd:#b07a00; --grid:#ebe7de;
  --nfl:#2f62d8; --cfb:#d6304a; --nba:#d9600f; --ncaab:#6d4ee0; --nhl:#0f8f84;
}}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f3f1ec; --surface:#ffffff; --surface2:#f8f6f1; --sunk:#ece9e2; --line:#e0dcd2; --line-hi:#c9c3b5;
  --ink:#16181f; --ink2:#3d4252; --muted:#6a7080; --faint:#9a9fac;
  --gold:#a8750a; --gold-ink:#8a5f00; --gold-bg:rgba(201,141,18,.12); --gold-line:rgba(168,117,10,.45); --on-gold:#fffaf0;
  --win:#14864a; --win-bg:rgba(20,134,74,.11); --loss:#c8323a; --loss-bg:rgba(200,50,58,.1); --push-bg:#e6e2d9;
  --s-all:#2f62d8; --s-potd:#b07a00; --grid:#ebe7de;
  --nfl:#2f62d8; --cfb:#d6304a; --nba:#d9600f; --ncaab:#6d4ee0; --nhl:#0f8f84;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);-webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px))}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-block:18px 32px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;padding-top:env(safe-area-inset-top, 0px)}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{width:34px;height:34px;border-radius:9px;background:var(--gold);color:var(--on-gold);display:grid;place-items:center;font:900 19px var(--font-display)}
.logo h1{margin:0;font:900 26px/1 var(--font-display);letter-spacing:.03em;text-transform:uppercase}
.season-chip{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.season-chip b{font:800 22px var(--font-display)}
.season-chip span{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom, 0px);padding-left:env(safe-area-inset-left, 0px);padding-right:env(safe-area-inset-right, 0px)}
.tabs-in{max-width:860px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabbar-h)}
.tab{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11.5px;font-weight:700;letter-spacing:.03em}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--gold-ink)}
@media (min-width:760px){
  body{padding-bottom:0}
  .tabs{position:sticky;top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top, 0px)}
  .tabs-in{height:52px;grid-template-columns:repeat(4,auto);justify-content:start;gap:4px;padding-left:max(16px, env(safe-area-inset-left, 0px))}
  .tab{flex-direction:row;gap:8px;font-size:14px;padding:0 14px;border-bottom:2px solid transparent}
  .tab.on{border-bottom-color:var(--gold)}
  .tab svg{width:18px;height:18px}
  .top{padding-top:0}
}
.view[hidden]{display:none!important}
.sec{margin-top:26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sec-h h2{margin:0;font:800 22px/1 var(--font-display);text-transform:uppercase;letter-spacing:.03em;text-wrap:balance}
.sec-h span{color:var(--muted);font-size:13px}
.note{color:var(--muted);font-size:13px;max-width:70ch;margin:10px 0 0}

/* bet slip */
.slip{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.slip.potd{border-color:var(--gold-line);background:linear-gradient(180deg,var(--gold-bg),transparent 60%),var(--surface)}
.slip-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 0}
.slip-body{padding:10px 16px 14px}
.slip-sel{font:900 32px/1.02 var(--font-display);text-transform:uppercase;letter-spacing:.01em;overflow-wrap:anywhere}
.slip-sel .px{font:700 18px var(--font-body);color:var(--muted);text-transform:none;margin-left:6px;white-space:nowrap}
.perf{position:relative;height:0;border-top:2px dashed var(--line);margin:0 14px}
.perf::before,.perf::after{content:"";position:absolute;top:-10px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.perf::before{left:-24px}.perf::after{right:-24px}
.slip.potd .perf::before,.slip.potd .perf::after{border-color:var(--gold-line)}
.slip-foot{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:12px 16px 14px}
.kv{min-width:0}
.kv b{display:block;font:800 20px/1.1 var(--font-display);letter-spacing:.02em}
.kv span{display:block;font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.bar{height:6px;border-radius:4px;background:var(--sunk);margin-top:8px;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--ink2)}
.bar em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--gold)}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--gold-ink)}
.sport{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.sport i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 8px}
.units{font:800 15px var(--font-display);letter-spacing:.04em;padding:4px 9px;border-radius:7px;background:var(--sunk);color:var(--ink);white-space:nowrap}
.units.u3{background:var(--gold);color:var(--on-gold)}
.res{font:800 14px var(--font-display);letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:7px;white-space:nowrap}
.res.win{background:var(--win-bg);color:var(--win)} .res.loss{background:var(--loss-bg);color:var(--loss)}
.res.push,.res.void{background:var(--push-bg);color:var(--muted)} .res.pending{background:var(--sunk);color:var(--muted)}
.tag{font-size:10.5px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 6px;letter-spacing:.03em}

/* Play of the Day record strip */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:12px}
.strip > div{background:var(--surface);padding:10px 12px}
.form{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap;align-items:center}
.form i{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font:800 12px var(--font-display);font-style:normal}
.form i.win{background:var(--win-bg);color:var(--win)} .form i.loss{background:var(--loss-bg);color:var(--loss)} .form i.push{background:var(--push-bg);color:var(--muted)}
.form small{color:var(--muted);font-size:12px;margin-left:6px}

/* compact slips */
.mini{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.mini .sel{font:800 20px/1.1 var(--font-display);text-transform:uppercase;overflow-wrap:anywhere;min-width:0}
.mini .sel .px{font:600 14px var(--font-body);color:var(--muted);text-transform:none}
.mini .meta{grid-column:1/2;font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center;min-width:0}
.mini .side{display:flex;flex-direction:column;align-items:flex-end;gap:5px;grid-row:1/3;grid-column:2}
.empty{color:var(--muted);text-align:center;padding:26px 14px;background:var(--surface);border:1px dashed var(--line-hi);border-radius:14px}

/* edge board */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);color:var(--ink2);font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:999px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.board{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:10px}
.brow{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);color:var(--ink);text-decoration:none}
.brow:first-child{border-top:0}
.brow:hover{background:var(--surface2)}
.rank{font:800 18px var(--font-display);color:var(--faint);text-align:center}
.brow .w{min-width:0}
.brow .w b{display:block;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .w > span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .r{display:flex;align-items:center;gap:10px}
.brow .ev{text-align:right}
.brow .ev b{display:block;font:800 18px var(--font-display)}
.brow .ev span{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.07em}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.cal-head h2{margin:0;font:900 28px/1 var(--font-display);text-transform:uppercase}
.navbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px}
.mtotal{display:flex;gap:14px;color:var(--ink2);font-size:13px;margin-bottom:10px;flex-wrap:wrap}
.mtotal b{font:800 17px var(--font-display)}
.g7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dw{font-size:10.5px;color:var(--faint);font-weight:800;text-align:center;letter-spacing:.08em;padding-bottom:2px}
.d{aspect-ratio:1/1.08;min-width:0;border-radius:10px;border:1.5px solid transparent;background:var(--surface);cursor:pointer;
  display:flex;flex-direction:column;justify-content:space-between;padding:5px 6px;text-align:left;position:relative}
.d.blank{background:transparent;cursor:default}
.d .dn{font-size:12px;font-weight:700;color:var(--muted)}
.d .du{font:800 15px/1 var(--font-display);align-self:flex-end}
.d.up{background:var(--win-bg)} .d.up .du{color:var(--win)}
.d.down{background:var(--loss-bg)} .d.down .du{color:var(--loss)}
.d.today{border-color:var(--gold)}
.d.sel{border-color:var(--ink)}
.d .st{position:absolute;top:4px;right:5px;font-size:11px;line-height:1;color:var(--gold)}
.d .st.win{color:var(--win)} .d .st.loss{color:var(--loss)}
.d .pend{display:flex;gap:2px;align-self:flex-end}
.d .pend i{width:5px;height:5px;border-radius:50%}

/* records */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.kpi.gold{border-color:var(--gold-line);background:linear-gradient(180deg,var(--gold-bg),transparent),var(--surface)}
.kpi h3{margin:0 0 8px;font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.kpi.gold h3{color:var(--gold-ink)}
.kpi .big{font:900 38px/1 var(--font-display)}
.kpi .row{display:flex;gap:14px;margin-top:8px;color:var(--ink2);font-size:13px;flex-wrap:wrap}
.kpi .row b{color:var(--ink);font-weight:800}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 6px;position:relative}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--ink2);margin:0 0 6px 4px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:3px}
.chart svg{display:block;width:100%;height:auto}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 8px;border-radius:8px;white-space:nowrap;display:none;z-index:2}
.tip b{font-weight:800}
.twrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
table.t th,table.t td{padding:9px 12px;text-align:right;white-space:nowrap;border-top:1px solid var(--line)}
table.t th{font-size:10.5px;color:var(--muted);font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-top:0}
table.t td:first-child,table.t th:first-child{text-align:left}
table.t tr.total td{font-weight:800;background:var(--surface2)}
table.t .grp{text-align:center;color:var(--ink2)}
.pos{color:var(--win)} .neg{color:var(--loss)}

/* sports */
.sports{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.sp-card{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 16px 16px 20px;text-decoration:none;color:var(--ink);position:relative;overflow:hidden;min-width:0}
.sp-card::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--c)}
.sp-card:hover{border-color:var(--line-hi)}
.sp-card h3{margin:0;font:900 26px/1 var(--font-display);text-transform:uppercase}
.sp-card .line{display:flex;gap:16px;color:var(--ink2);font-size:13px;flex-wrap:wrap}
.sp-card .line b{font:800 18px var(--font-display);color:var(--ink)}
.sp-card .line b.pos{color:var(--win)} .sp-card .line b.neg{color:var(--loss)}
.sp-card .go{font-size:13px;font-weight:800;color:var(--ink2)}
.sp-card .soon{color:var(--muted);font-size:13px}
@media (max-width:520px){
  .slip-sel{font-size:28px}
  .slip-foot{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:12px}
  .strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis{grid-template-columns:1fr}
  .d{padding:4px}
  .d .du{font-size:13px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<nav class="tabs" aria-label="Sections"><div class="tabs-in">
  <button class="tab" data-v="today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/></svg>Today</button>
  <button class="tab" data-v="calendar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Calendar</button>
  <button class="tab" data-v="records"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5h16M6.5 16l4-5 3 3 4.5-6.5"/></svg>Records</button>
  <button class="tab" data-v="sports"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.4 2.6 14.6 0 17M12 3.5c-2.6 2.4-2.6 14.6 0 17"/></svg>Sports</button>
</div></nav>

<div class="wrap">
  <div class="top">
    <div class="logo"><div class="logo-mark">★</div><h1>Best Plays</h1></div>
    <div class="season-chip"><b class="num" id="seasonUnits"></b><span id="seasonLabel">Season</span></div>
  </div>
  <main>
    <section class="view" id="v-today"></section>
    <section class="view" id="v-calendar" hidden></section>
    <section class="view" id="v-records" hidden></section>
    <section class="view" id="v-sports" hidden></section>
  </main>
</div>

<script>
const H = /*HUB*/null;
const $ = s => document.querySelector(s);
const S = H.settings;
const FINAL = ["win","loss","push","void"];
const TOP = ["VIP","3U"];
const today = H.today;
const sgn = (x,d=1) => x == null || isNaN(x) ? "–" : (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(+x).toFixed(d);
const pct = x => x == null ? "–" : Math.round(x*100) + "%";
const price = p => p == null ? "" : (p > 0 ? "+" : "") + Math.round(p);
const ymd = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fromYmd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const sportVar = code => `var(--${H.folders[code] || "nba"})`;
const profit = pr => pr == null ? 100/110 : (pr < 0 ? 100/-pr : pr/100);
const tip = s => { if (!s) return ""; const d = new Date(s); return isNaN(d) ? "" : d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}); };
const lockText = () => S.lock_hour_et > 12 ? (S.lock_hour_et-12) + " PM" : S.lock_hour_et + " AM";
const store = { get(k, d){ try { return localStorage.getItem(k) ?? d; } catch(e){ return d; } }, set(k, v){ try { localStorage.setItem(k, v); } catch(e){} } };
const rankSort = (a,b) => (TOP.includes(b.tier) - TOP.includes(a.tier)) || (b.ev||0) - (a.ev||0);
const cls = x => x > 0 ? "pos" : x < 0 ? "neg" : "";

let view = store.get("hubView", "today");
const hv = location.hash.replace("#","");
if (["today","calendar","records","sports"].includes(hv)) view = hv;
let selDay = today, month = fromYmd(today), sportFilter = store.get("hubSport", "all"), live = [];

function rec(es){
  const g = es.filter(e => FINAL.includes(e.status) && e.status !== "void");
  const w = g.filter(e=>e.status==="win").length, l = g.filter(e=>e.status==="loss").length, p = g.filter(e=>e.status==="push").length;
  const u = g.reduce((a,e)=>a+(e.result_units||0),0), st = g.reduce((a,e)=>a+e.stake,0);
  return {n:g.length, w, l, p, u, roi: st ? 100*u/st : null, text: `${w}-${l}${p?"-"+p:""}`};
}

// ---------- slips
function unitsBadge(e){
  const u = e.stake || Math.max(e.units||0, S.min_stake);
  return `<span class="units ${u>=3?'u3':''}">${u}U</span>`;
}
function resultBadge(e, preview){
  const st = e.status || "pending";
  if (FINAL.includes(st)) return `<span class="res ${st}">${st}${e.result_units!=null && st!=="void" ? " " + sgn(e.result_units,2) : ""}</span>`;
  return `<span class="res pending">${preview ? "Leading" : (tip(e.start) || "Pending")}</span>`;
}
function bigSlip(e, preview){
  const myP = e.model_prob, bookP = e.market_prob;
  return `<article class="slip potd">
    <div class="slip-top"><span class="eyebrow">★ Play of the Day${preview ? " · not locked yet" : ""}</span>${resultBadge(e, preview)}</div>
    <div class="slip-body">
      <div class="sport"><i style="background:${sportVar(e.sport)}"></i>${H.names[e.sport]||e.sport} · ${e.event}${e.market==="prop"?" · prop":""}${e.start && !FINAL.includes(e.status) ? " · " + tip(e.start) : ""}</div>
      <div class="slip-sel" style="margin-top:6px">${e.selection}<span class="px">${price(e.price)}</span></div>
      ${e.backfilled ? `<div style="margin-top:6px"><span class="tag">Backfilled</span></div>` : ""}
    </div>
    <div class="perf"></div>
    <div class="slip-foot">
      <div class="kv"><b>${e.stake || Math.max(e.units||0,S.min_stake)}U</b><span>Stake</span></div>
      <div class="kv"><b>${e.edge_display || "–"}</b><span>Edge</span></div>
      <div class="kv"><b>${sgn(100*(e.ev||0),0)}%</b><span>Exp. value</span></div>
      <div class="kv"><b>${pct(myP)}</b><span>Model · book ${pct(bookP)}</span>
        <div class="bar" title="Model ${pct(myP)} vs book ${pct(bookP)}"><i style="width:${Math.round((myP||0)*100)}%"></i><em style="left:${Math.round((bookP||0)*100)}%"></em></div></div>
    </div>
  </article>`;
}
function miniSlip(e, preview){
  return `<div class="mini">
    <div class="sel">${e.selection} <span class="px">${price(e.price)}</span></div>
    <div class="side">${unitsBadge(e)}${resultBadge(e, preview)}</div>
    <div class="meta"><span class="sport"><i style="background:${sportVar(e.sport)}"></i>${e.sport}</span><span>${e.event}</span><span>Edge ${e.edge_display||"–"} · EV ${sgn(100*(e.ev||0),0)}%</span>${e.backfilled?'<span class="tag">Backfilled</span>':""}</div>
  </div>`;
}

// same rules as the cloud run, for a preview before the lock
function candidates(day){
  const taken = new Set(), out = [], now = Date.now() + 5*60*1000;
  const c = live.filter(p => p.date===day && p.status==="pending" && S.allowed_tiers.includes(p.tier) && (p.ev||0) > S.min_ev && p.start && new Date(p.start).getTime() > now).sort(rankSort);
  for (const p of c){
    if (out.length >= S.picks_per_day) break;
    const g = p.sport + "|" + p.event + "|" + (p.market === "prop" ? p.player : "");
    if (taken.has(g)) continue;
    taken.add(g); out.push({...p, stake: Math.max(p.units||0, S.min_stake)});
  }
  return out;
}

// ---------- TODAY
function renderToday(){
  const potdAll = H.ledger.filter(e => e.potd).sort((a,b) => a.date < b.date ? -1 : 1);
  const r = rec(potdAll);
  const dec = potdAll.filter(e => e.status==="win" || e.status==="loss");
  let streak = "–";
  if (dec.length){ const last = dec[dec.length-1].status; let n = 0; for (let i = dec.length-1; i >= 0 && dec[i].status === last; i--) n++; streak = (last==="win"?"W":"L") + n; }
  const formEs = potdAll.filter(e => FINAL.includes(e.status) && e.status!=="void").slice(-10);
  const form = formEs.map(e => `<i class="${e.status}" title="${e.date}: ${e.selection}">${e.status==="win"?"W":e.status==="loss"?"L":"P"}</i>`).join("");

  const todays = H.ledger.filter(e => e.date === today).sort((a,b) => (b.potd?1:0)-(a.potd?1:0) || a.slot-b.slot);
  let hero, rest;
  if (todays.length){
    hero = bigSlip(todays.find(e=>e.potd) || todays[0], false);
    rest = todays.filter(e => !e.potd).map(e => miniSlip(e, false)).join("");
  } else {
    const c = candidates(today);
    hero = c.length ? bigSlip(c[0], true) : `<div class="empty">${live.length ? "No 1U+ plays posted for today yet." : "Loading today's plays…"} Today's picks lock at ${lockText()} ET.</div>`;
    rest = c.slice(1).map(e => miniSlip(e, true)).join("");
  }
  const dt = fromYmd(today).toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
  const sports = [...new Set(live.filter(p=>p.date===today && S.allowed_tiers.includes(p.tier) && p.status==="pending").map(p=>p.sport))];
  const filt = sportFilter !== "all" && !sports.includes(sportFilter) ? "all" : sportFilter;
  const rows = live.filter(p => p.date===today && p.status==="pending" && S.allowed_tiers.includes(p.tier) && (filt==="all" || p.sport===filt)).sort(rankSort).slice(0, 30);

  $("#v-today").innerHTML = `
    <div class="sec-h"><h2>${dt}</h2><span>${todays.length ? "Locked in" : "Locks at " + lockText() + " ET"}</span></div>
    ${hero}
    <div class="strip">
      <div class="kv"><b class="num">${r.text}</b><span>★ Record</span></div>
      <div class="kv"><b class="num ${cls(r.u)}">${sgn(r.u)}u</b><span>Units</span></div>
      <div class="kv"><b class="num">${r.roi==null?"–":sgn(r.roi)+"%"}</b><span>ROI</span></div>
      <div class="kv"><b class="num">${streak}</b><span>Streak</span></div>
    </div>
    ${form ? `<div class="form">${form}<small>last ${formEs.length}</small></div>` : ""}

    <div class="sec">
      <div class="sec-h"><h2>Today's card</h2><span>${S.picks_per_day} best plays · 3U first, then highest EV</span></div>
      ${rest || `<div class="empty">${todays.length ? "Just the Play of the Day today." : "Nothing else qualifies yet."}</div>`}
    </div>

    <div class="sec">
      <div class="sec-h"><h2>Edge board</h2><span>Every 1U+ play today, all sports</span></div>
      <div class="chips" id="chips">${[["all","All"], ...Object.keys(H.names).filter(s=>sports.includes(s)).map(s=>[s,H.names[s]])]
        .map(([k,l]) => `<button class="chip ${filt===k?'on':''}" data-s="${k}">${l}</button>`).join("")}</div>
      ${rows.length ? `<div class="board">${rows.map((p,i) => `<a class="brow" href="${H.folders[p.sport]}/">
          <span class="rank">${i+1}</span>
          <span class="w"><b>${p.selection} <span style="color:var(--muted);font-weight:600">${price(p.price)}</span></b><span>${p.sport} · ${p.event}${p.start?" · "+tip(p.start):""}</span></span>
          <span class="r"><span class="ev"><b>${sgn(100*(p.ev||0),0)}%</b><span>EV</span></span>${unitsBadge({stake: Math.max(p.units||0,1)})}</span>
        </a>`).join("")}</div>` : `<div class="empty" style="margin-top:10px">${live.length ? "No 1U+ plays posted for today." : "Loading today's plays…"}</div>`}
    </div>`;
  document.querySelectorAll("#chips .chip").forEach(c => c.onclick = () => { sportFilter = c.dataset.s; store.set("hubSport", sportFilter); renderToday(); });
}

// ---------- CALENDAR
function renderCalendar(){
  const first = new Date(month.getFullYear(), month.getMonth(), 1);
  const nDays = new Date(month.getFullYear(), month.getMonth()+1, 0).getDate();
  const mk = ymd(first).slice(0,7);
  const mr = rec(H.ledger.filter(e => e.date.startsWith(mk)));
  const mp = rec(H.ledger.filter(e => e.date.startsWith(mk) && e.potd));
  let cells = ["S","M","T","W","T","F","S"].map(d=>`<div class="dw">${d}</div>`).join("");
  for (let i = 0; i < first.getDay(); i++) cells += `<div class="d blank"></div>`;
  for (let d = 1; d <= nDays; d++){
    const key = ymd(new Date(month.getFullYear(), month.getMonth(), d));
    const es = H.ledger.filter(e => e.date === key), r = rec(es), pd = es.find(e=>e.potd);
    const pend = es.filter(e => !FINAL.includes(e.status));
    const c = ["d", r.n ? (r.u > 0 ? "up" : r.u < 0 ? "down" : "") : "", key===today?"today":"", key===selDay?"sel":""].join(" ");
    cells += `<button class="${c}" data-d="${key}" aria-label="${fromYmd(key).toDateString()}${r.n?", "+r.text+", "+sgn(r.u)+" units":""}">
      <span class="dn">${d}</span>${pd ? `<span class="st ${FINAL.includes(pd.status)?pd.status:''}" aria-hidden="true">★</span>` : ""}
      ${r.n ? `<span class="du num">${sgn(r.u)}</span>` : pend.length ? `<span class="pend">${pend.map(e=>`<i style="background:${sportVar(e.sport)}"></i>`).join("")}</span>` : ""}
    </button>`;
  }
  const es = H.ledger.filter(e => e.date === selDay).sort((a,b) => (b.potd?1:0)-(a.potd?1:0) || a.slot-b.slot);
  const dr = rec(es);
  $("#v-calendar").innerHTML = `
    <div class="cal-head"><button class="navbtn" id="prev" aria-label="Previous month">‹</button>
      <h2>${month.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</h2>
      <button class="navbtn" id="next" aria-label="Next month">›</button></div>
    <div class="mtotal">${mr.n ? `<span>Best plays <b class="${cls(mr.u)}">${mr.text} · ${sgn(mr.u)}u</b></span><span>★ Play of the Day <b class="${cls(mp.u)}">${mp.text} · ${sgn(mp.u)}u</b></span>` : `<span>No graded plays this month.</span>`}</div>
    <div class="g7">${cells}</div>
    <div class="sec">
      <div class="sec-h"><h2>${fromYmd(selDay).toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"})}</h2>
        <span>${dr.n ? `${dr.text} · <b class="${cls(dr.u)}">${sgn(dr.u)}u</b>` : es.length ? "Pending" : ""}</span></div>
      ${es.length ? es.map(e => e.potd ? bigSlip(e, false) + `<div style="height:8px"></div>` : miniSlip(e, false)).join("")
        : `<div class="empty">No best plays ${selDay < today ? "that day" : "yet"}.</div>`}
      ${es.some(e=>e.backfilled) ? `<p class="note">Backfilled: picked after the fact with the same rules from plays the models had logged.</p>` : ""}
    </div>`;
  document.querySelectorAll(".d[data-d]").forEach(b => b.onclick = () => { selDay = b.dataset.d; renderCalendar(); });
  $("#prev").onclick = () => { month = new Date(month.getFullYear(), month.getMonth()-1, 1); renderCalendar(); };
  $("#next").onclick = () => { month = new Date(month.getFullYear(), month.getMonth()+1, 1); renderCalendar(); };
}

// ---------- RECORDS
function cumulative(es){
  const days = [...new Set(es.map(e=>e.date))].sort();
  let run = 0;
  return days.map(d => { run += es.filter(e=>e.date===d).reduce((a,e)=>a+(e.result_units||0),0); return {d, v: run}; });
}
const CH = {W: 640, H: 230, L: 40, R: 12, T: 12, B: 26};
function chartData(){
  const graded = H.ledger.filter(e => FINAL.includes(e.status));
  const all = cumulative(graded), pd = cumulative(graded.filter(e=>e.potd));
  return {all, pd, days: all.map(p=>p.d)};
}
function chartSVG(){
  // draw at the real on-screen width so labels stay readable on phones
  CH.W = Math.max(300, Math.min(640, Math.round(Math.min(window.innerWidth, 860) - 58)));
  CH.H = CH.W < 480 ? 210 : 230;
  const {all, pd, days} = chartData();
  if (all.length < 2) return `<div class="empty">The chart fills in once a few days are graded.</div>`;
  const {W, H: Hh, L, R, T, B} = CH;
  const xi = d => L + (W-L-R) * days.indexOf(d) / (days.length-1);
  const vals = [...all, ...pd].map(p=>p.v), lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  const step = (hi - lo) > 40 ? 20 : (hi - lo) > 16 ? 10 : 5;
  const y0 = Math.floor(lo/step)*step, y1 = Math.ceil(hi/step)*step;
  const y = v => T + (Hh-T-B) * (1 - (v - y0)/((y1 - y0) || 1));
  let grid = "";
  for (let v = y0; v <= y1; v += step) grid += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="${v===0?1.5:1}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v>0?"+":""}${v}</text>`;
  const firsts = days.filter((d,i) => i===0 || d.slice(5,7) !== days[i-1].slice(5,7));
  const xl = firsts.map(d => `<text x="${xi(d)}" y="${Hh-6}" font-size="11" fill="var(--muted)">${fromYmd(d).toLocaleDateString(undefined,{month:"short"})}</text>`).join("");
  const path = pts => pts.map((p,i) => (i?"L":"M") + xi(p.d).toFixed(1) + " " + y(p.v).toFixed(1)).join(" ");
  const dot = (pts, color) => { const p = pts[pts.length-1]; return `<circle cx="${xi(p.d)}" cy="${y(p.v)}" r="4.5" fill="${color}" stroke="var(--surface)" stroke-width="2"/>`; };
  return `<div class="legend"><span><i style="background:var(--s-all)"></i>All best plays ${sgn(all[all.length-1].v)}u</span><span><i style="background:var(--s-potd)"></i>★ Play of the Day ${pd.length?sgn(pd[pd.length-1].v)+"u":"–"}</span></div>
    <svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Running units over the season: all best plays ${sgn(all[all.length-1].v)} units">${grid}${xl}
      <path d="${path(all)}" fill="none" stroke="var(--s-all)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${pd.length > 1 ? `<path d="${path(pd)}" fill="none" stroke="var(--s-potd)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` : ""}
      ${dot(all, "var(--s-all)")}${pd.length ? dot(pd, "var(--s-potd)") : ""}
      <line id="xh" y1="${T}" y2="${Hh-B}" stroke="var(--line-hi)" stroke-width="1" visibility="hidden"/>
      <rect id="hit" x="${L}" y="0" width="${W-L-R}" height="${Hh-B}" fill="transparent"/>
    </svg><div class="tip" id="tip"></div>`;
}
function wireChart(){
  const svg = document.querySelector("#v-records svg"); if (!svg) return;
  const {all, pd, days} = chartData(), {W, L, R} = CH;
  const hit = svg.querySelector("#hit"), xh = svg.querySelector("#xh"), tipEl = document.querySelector("#tip");
  if (!hit || !xh || !tipEl) return;
  const pdAt = d => { let v = null; for (const p of pd) { if (p.d <= d) v = p.v; } return v; };
  const move = ev => {
    const box = svg.getBoundingClientRect(), x = (ev.clientX - box.left) * W / box.width;
    const i = Math.max(0, Math.min(days.length-1, Math.round((x - L) / (W-L-R) * (days.length-1))));
    const px = L + (W-L-R) * i / (days.length-1), sx = px * box.width / W;
    xh.setAttribute("x1", px); xh.setAttribute("x2", px); xh.setAttribute("visibility", "visible");
    const v2 = pdAt(days[i]);
    tipEl.innerHTML = `${fromYmd(days[i]).toLocaleDateString(undefined,{month:"short",day:"numeric"})} · All <b>${sgn(all[i].v)}u</b>${v2!=null?` · ★ <b>${sgn(v2)}u</b>`:""}`;
    tipEl.style.display = "block";
    const tw = tipEl.offsetWidth, cw = svg.parentElement.clientWidth;
    tipEl.style.left = Math.max(8, Math.min(cw - tw - 8, sx + 12 - (sx > cw/2 ? tw + 24 : 0))) + "px";
    tipEl.style.top = "36px";
  };
  hit.addEventListener("pointermove", move); hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", () => { xh.setAttribute("visibility","hidden"); tipEl.style.display = "none"; });
}
function renderRecords(){
  const r = rec(H.ledger), p = rec(H.ledger.filter(e=>e.potd));
  const flat = H.ledger.filter(e=>e.potd && FINAL.includes(e.status)).reduce((a,e)=>a+(e.status==="win"?profit(e.price):e.status==="loss"?-1:0),0);
  const months = [...new Set(H.ledger.map(e=>e.date.slice(0,7)))].sort().reverse();
  const cell = x => x.n ? `<td>${x.text}</td><td class="${cls(x.u)}">${sgn(x.u)}</td><td>${x.roi==null?"–":sgn(x.roi)+"%"}</td>` : `<td>–</td><td>–</td><td>–</td>`;
  const mrow = (label, es, total) => `<tr${total?' class="total"':''}><td>${label}</td>${cell(rec(es))}${cell(rec(es.filter(e=>e.potd)))}</tr>`;
  const sports = Object.keys(H.names).filter(s => H.ledger.some(e=>e.sport===s));
  const since = H.ledger.length ? fromYmd(H.ledger[0].date).toLocaleDateString(undefined,{month:"short",day:"numeric"}) : "";
  $("#v-records").innerHTML = `
    <div class="sec-h"><h2>Season record</h2><span>${since ? "Since " + since : ""}</span></div>
    <div class="kpis">
      <div class="kpi gold"><h3>★ Play of the Day</h3><div class="big num ${cls(p.u)}">${sgn(p.u)}u</div>
        <div class="row"><span><b>${p.text}</b> record</span><span><b>${p.w+p.l?Math.round(100*p.w/(p.w+p.l)):"–"}%</b> wins</span><span><b>${p.roi==null?"–":sgn(p.roi)+"%"}</b> ROI</span><span><b>${sgn(flat)}u</b> at flat 1u</span></div></div>
      <div class="kpi"><h3>All best plays</h3><div class="big num ${cls(r.u)}">${sgn(r.u)}u</div>
        <div class="row"><span><b>${r.text}</b> record</span><span><b>${r.w+r.l?Math.round(100*r.w/(r.w+r.l)):"–"}%</b> wins</span><span><b>${r.roi==null?"–":sgn(r.roi)+"%"}</b> ROI</span></div></div>
    </div>
    <div class="sec"><div class="sec-h"><h2>Running units</h2><span>Tap or hover for any day</span></div><div class="chart">${chartSVG()}</div></div>
    <div class="sec"><div class="sec-h"><h2>By month</h2></div>
      <div class="twrap"><table class="t">
        <tr><th></th><th colspan="3" class="grp">All best plays</th><th colspan="3" class="grp">★ Play of the Day</th></tr>
        <tr><th>Month</th><th>W-L</th><th>Units</th><th>ROI</th><th>W-L</th><th>Units</th><th>ROI</th></tr>
        ${months.map(m => mrow(fromYmd(m+"-01").toLocaleDateString(undefined,{month:"long"}), H.ledger.filter(e=>e.date.startsWith(m)))).join("")}
        ${mrow("Season", H.ledger, true)}
      </table></div></div>
    <div class="sec"><div class="sec-h"><h2>By sport</h2></div>
      <div class="twrap"><table class="t">
        <tr><th>Sport</th><th>W-L</th><th>Units</th><th>ROI</th><th>★ W-L</th><th>★ Units</th></tr>
        ${sports.map(s => { const a = rec(H.ledger.filter(e=>e.sport===s)), b = rec(H.ledger.filter(e=>e.sport===s && e.potd));
          return `<tr><td><span class="sport"><i style="background:${sportVar(s)}"></i>${H.names[s]}</span></td><td>${a.text}</td><td class="${cls(a.u)}">${sgn(a.u)}</td><td>${a.roi==null?"–":sgn(a.roi)+"%"}</td><td>${b.n?b.text:"–"}</td><td class="${cls(b.u)}">${b.n?sgn(b.u):"–"}</td></tr>`; }).join("")}
      </table></div></div>
    <p class="note">Units are at each play's own size (a 3U play risks 3 units). ROI = units won ÷ units risked. Plays before the live log began (Oct 19) are backfilled with the same rules from each model's record.</p>`;
  wireChart();
}

    <div class="sports">${H.sports.map(s => `<a class="sp-card" href="${s.folder}/" style="--c:${sportVar(s.sport)}">

      <span class="go">Open the ${s.name} app ›</span></a>`).join("")}</div>`;

// ---------- shell
function setView(v){
  view = v; store.set("hubView", v);
  document.querySelectorAll(".tab").forEach(t => { t.classList.toggle("on", t.dataset.v === v); t.setAttribute("aria-current", t.dataset.v === v ? "page" : "false"); });

}
document.querySelectorAll(".tab").forEach(t => t.onclick = () => setView(t.dataset.v));
const season = rec(H.ledger);
$("#seasonUnits").textContent = sgn(season.u) + "u";
$("#seasonUnits").className = "num " + cls(season.u);

Promise.all(Object.entries(H.folders).map(([code, folder]) =>

)).then(lists => { live = lists.flat(); renderToday(); });

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Best Plays</title>
<meta name="theme-color" content="#0d0f15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Best Plays">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: one screen per tab (Today / My Picks / Calendar / Records / Data / Sports), one hero per
   screen. Today leads with the Play of the Day as a bet slip; the tab bar sits at the bottom on
   phones, top on desktop. Gold = the models' Best Plays, blue = your own picks (My Picks app). */
:root{
  color-scheme:dark;
  --bg:#0d0f15; --surface:#151821; --surface2:#1c2030; --sunk:#10131b; --line:#272c3d; --line-hi:#3b4258;
  --ink:#eef0f6; --ink2:#b4bbcc; --muted:#808a9f; --faint:#586178;
  --gold:#e3b04b; --gold-ink:#f2c66a; --gold-bg:rgba(227,176,75,.13); --gold-line:rgba(227,176,75,.5); --on-gold:#1a1305;
  --blue:#6f97ff; --blue-ink:#9db8ff; --blue-bg:rgba(111,151,255,.13); --blue-line:rgba(111,151,255,.5); --on-blue:#0b1430;
  --win:#3ddc84; --win-bg:rgba(61,220,132,.14); --loss:#ff6b6b; --loss-bg:rgba(255,107,107,.14); --push-bg:#272c3d;
  --s-all:#5b8def; --s-potd:#c98500; --grid:#232838;
  --nfl:#5b8def; --cfb:#ff6b7d; --nba:#ff8a3d; --ncaab:#b39dff; --nhl:#3dd6c6;
  --shadow:none; --logo-bg:#f3f1ec;
  --font-display:"Big Shoulders Display","Oswald","Arial Narrow",system-ui,sans-serif;
  --font-body:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;
  --tabbar-h:64px;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#f3f1ec; --surface:#ffffff; --surface2:#f8f6f1; --sunk:#ece9e2; --line:#e0dcd2; --line-hi:#c9c3b5;
  --ink:#16181f; --ink2:#3d4252; --muted:#6a7080; --faint:#9a9fac;
  --gold:#a8750a; --gold-ink:#8a5f00; --gold-bg:rgba(201,141,18,.12); --gold-line:rgba(168,117,10,.45); --on-gold:#fffaf0;
  --blue:#2f5fe0; --blue-ink:#1f47b8; --blue-bg:rgba(47,95,224,.09); --blue-line:rgba(47,95,224,.4); --on-blue:#ffffff;
  --win:#14864a; --win-bg:rgba(20,134,74,.11); --loss:#c8323a; --loss-bg:rgba(200,50,58,.1); --push-bg:#e6e2d9;
  --s-all:#2f62d8; --s-potd:#b07a00; --grid:#ebe7de;
  --nfl:#2f62d8; --cfb:#d6304a; --nba:#d9600f; --ncaab:#6d4ee0; --nhl:#0f8f84;
  --shadow:0 1px 2px rgba(22,24,31,.04),0 6px 20px rgba(22,24,31,.05); --logo-bg:#f3f1ec;
}}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f3f1ec; --surface:#ffffff; --surface2:#f8f6f1; --sunk:#ece9e2; --line:#e0dcd2; --line-hi:#c9c3b5;
  --ink:#16181f; --ink2:#3d4252; --muted:#6a7080; --faint:#9a9fac;
  --gold:#a8750a; --gold-ink:#8a5f00; --gold-bg:rgba(201,141,18,.12); --gold-line:rgba(168,117,10,.45); --on-gold:#fffaf0;
  --blue:#2f5fe0; --blue-ink:#1f47b8; --blue-bg:rgba(47,95,224,.09); --blue-line:rgba(47,95,224,.4); --on-blue:#ffffff;
  --win:#14864a; --win-bg:rgba(20,134,74,.11); --loss:#c8323a; --loss-bg:rgba(200,50,58,.1); --push-bg:#e6e2d9;
  --s-all:#2f62d8; --s-potd:#b07a00; --grid:#ebe7de;
  --nfl:#2f62d8; --cfb:#d6304a; --nba:#d9600f; --ncaab:#6d4ee0; --nhl:#0f8f84;
  --shadow:0 1px 2px rgba(22,24,31,.04),0 6px 20px rgba(22,24,31,.05); --logo-bg:#f3f1ec;
}
*{box-sizing:border-box}
html,body{margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);-webkit-font-smoothing:antialiased;overflow-x:hidden;
  padding-bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px))}
button{font:inherit;color:inherit}
a{color:inherit}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--win)} .neg{color:var(--loss)}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;padding-top:env(safe-area-inset-top, 0px)}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{width:34px;height:34px;border-radius:10px;background:var(--gold);color:var(--on-gold);display:grid;place-items:center;font:900 19px var(--font-display)}
.logo h1{margin:0;font:900 26px/1 var(--font-display);letter-spacing:.03em;text-transform:uppercase}
.season-chip{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.season-chip b{font:800 22px var(--font-display)}
.season-chip span{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb, var(--surface) 92%, transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom, 0px);padding-left:env(safe-area-inset-left, 0px);padding-right:env(safe-area-inset-right, 0px)}
.tabs-in{max-width:860px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);height:var(--tabbar-h)}
.tab{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:700;letter-spacing:.01em;min-width:0;white-space:nowrap;position:relative}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--gold-ink)}
.tab.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;border-radius:0 0 2px 2px;background:var(--gold)}
@media (min-width:760px){
  body{padding-bottom:0}
  .tabs{position:sticky;top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top, 0px)}
  .tabs-in{height:54px;grid-template-columns:repeat(6,auto);justify-content:start;gap:2px;padding-left:max(16px, env(safe-area-inset-left, 0px))}
  .tab{flex-direction:row;gap:8px;font-size:14px;padding:0 14px}
  .tab.on::before{top:auto;bottom:0;left:10px;right:10px;border-radius:2px 2px 0 0}
  .tab svg{width:18px;height:18px}
  .top{padding-top:0;margin-top:6px}
}
.view[hidden]{display:none!important}
.sec{margin-top:30px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sec-h h2{margin:0;font:800 22px/1 var(--font-display);text-transform:uppercase;letter-spacing:.03em;text-wrap:balance}
.sec-h > span{color:var(--muted);font-size:13px}
.sec-h .more{font-size:13px;font-weight:800;color:var(--blue-ink);text-decoration:none;min-height:44px;display:inline-flex;align-items:center;margin:-12px 0}
.sec-h .more.gold{color:var(--gold-ink)}
.date-h{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}
.note{color:var(--muted);font-size:13px;max-width:70ch;margin:10px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}

/* "How this works" toggles: the explanations live here, not on the screen */
details.how{margin-top:30px;border-top:1px solid var(--line)}
details.how summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;min-height:48px;font-size:13.5px;font-weight:800;color:var(--ink2)}
details.how summary::-webkit-details-marker{display:none}
details.how summary::before{content:"?";width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-hi);display:grid;place-items:center;font-size:12px;color:var(--muted)}
details.how summary::after{content:"+";margin-left:auto;color:var(--muted);font-size:18px}
details.how[open] summary::after{content:"–"}
details.how ul{margin:0 0 8px;padding-left:18px;color:var(--muted);font-size:13.5px;display:grid;gap:6px;max-width:70ch}
details.how b{color:var(--ink2)}

/* team marks: ESPN logo when there is one, otherwise the team code on the sport color */
.tm{flex:0 0 auto;width:var(--sz,36px);height:var(--sz,36px);border-radius:50%;background:var(--logo-bg);display:grid;place-items:center;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.tm img{position:absolute;inset:12%;width:76%;height:76%;object-fit:contain}
.tm b{font:900 calc(var(--sz,36px) * .34)/1 var(--font-display);letter-spacing:.02em;color:#16181f}
.tm.code{background:var(--c, var(--line-hi))}
.tm.code b{color:#fff}
.tm.dot{background:color-mix(in srgb, var(--c) 16%, var(--surface));box-shadow:none}
.tm.dot i{width:28%;height:28%;border-radius:50%;background:var(--c)}
.tm.long b{font-size:calc(var(--sz,36px) * .25)}
.tms{display:flex}
.tms .tm + .tm{margin-left:calc(var(--sz,36px) * -.28)}

/* bet slip (the hero) */
.slip{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.slip.potd{border-color:var(--gold-line);background:linear-gradient(180deg,var(--gold-bg),transparent 70%),var(--surface)}
.slip-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 18px 0}
.slip-body{padding:14px 18px 18px;display:flex;gap:14px;align-items:center}
.slip-body .w{min-width:0;flex:1}
.slip-sel{font:900 34px/1 var(--font-display);text-transform:uppercase;letter-spacing:.01em;overflow-wrap:anywhere;margin-top:4px}
.slip-sel .px{font:700 18px var(--font-body);color:var(--muted);text-transform:none;margin-left:6px;white-space:nowrap}
.perf{position:relative;height:0;border-top:2px dashed var(--line);margin:0 16px}
.perf::before,.perf::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.perf::before{left:-27px}.perf::after{right:-27px}
.slip.potd .perf::before,.slip.potd .perf::after{border-color:var(--gold-line)}
.slip-foot{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:14px 18px 16px}
.kv{min-width:0}
.kv b{display:block;font:800 21px/1.1 var(--font-display);letter-spacing:.02em}
.kv span{display:block;font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.bar{height:6px;border-radius:4px;background:var(--sunk);margin-top:8px;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--ink2)}
.bar em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--gold)}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--gold-ink)}
.sport{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);min-width:0}
.sport i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 8px}
.units{font:800 15px var(--font-display);letter-spacing:.04em;padding:4px 9px;border-radius:8px;background:var(--sunk);color:var(--ink);white-space:nowrap}
.units.u3{background:var(--gold);color:var(--on-gold)}
.res{font:800 14px var(--font-display);letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:8px;white-space:nowrap}
.res.win{background:var(--win-bg);color:var(--win)} .res.loss{background:var(--loss-bg);color:var(--loss)}
.res.push,.res.void{background:var(--push-bg);color:var(--muted)} .res.pending{background:var(--sunk);color:var(--muted)}
.res.live{background:var(--gold-bg);color:var(--gold-ink)}
.tag{font-size:10.5px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 6px;letter-spacing:.03em}

/* record strip under the hero */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:12px}
.strip > div{background:var(--surface);padding:11px 13px}
.form{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap;align-items:center}
.form i{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font:800 12px var(--font-display);font-style:normal}
.form i.win{background:var(--win-bg);color:var(--win)} .form i.loss{background:var(--loss-bg);color:var(--loss)} .form i.push{background:var(--push-bg);color:var(--muted)}
.form small{color:var(--muted);font-size:12px;margin-left:6px}

/* rows (compact slips) */
.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);min-height:64px;color:var(--ink);text-decoration:none}
.row:first-child{border-top:0}
a.row:hover{background:var(--surface2)}
.row .w{min-width:0;flex:1}
.row .sel{font:800 19px/1.1 var(--font-display);text-transform:uppercase;overflow-wrap:anywhere}
.row .sel .px{font:600 13.5px var(--font-body);color:var(--muted);text-transform:none;white-space:nowrap}
.row .meta{font-size:12.5px;line-height:1.4;color:var(--muted);margin-top:3px}
.row .meta .sport{vertical-align:1px}
.row .meta .tag{margin-left:4px}
.row .side{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:0 0 auto}
.row .side.h{flex-direction:row;align-items:center;gap:8px}
.rank{font:800 18px var(--font-display);color:var(--faint);width:18px;text-align:center;flex:0 0 18px}
.ev{text-align:right}
.ev b{display:block;font:800 18px/1.1 var(--font-display)}
.ev span{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.07em}
.empty{color:var(--muted);text-align:center;padding:28px 16px;background:var(--surface);border:1px dashed var(--line-hi);border-radius:18px;font-size:14px}
.empty b{display:block;color:var(--ink);font:800 19px var(--font-display);text-transform:uppercase;margin-bottom:4px;letter-spacing:.02em}
.empty a,.empty button.lnk{color:var(--blue-ink);font-weight:800;text-decoration:none;background:none;border:0;cursor:pointer;display:inline-flex;align-items:center;min-height:44px;font-size:14px}
.skel{height:64px;border-radius:14px;background:linear-gradient(90deg,var(--surface) 0%,var(--surface2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sk 1.4s ease-in-out infinite;margin-bottom:8px;border:1px solid var(--line)}
@keyframes sk{to{background-position:-200% 0}}

/* your picks (blue) */
.you{border-color:var(--blue-line);background:linear-gradient(180deg,var(--blue-bg),transparent 120px),var(--surface)}
.you .row{border-top-color:color-mix(in srgb, var(--line) 80%, transparent)}
.you-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);min-height:48px;flex-wrap:wrap}
.you-foot a{color:var(--blue-ink);font-weight:800;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.bchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.bchips span{font-size:12.5px;font-weight:700;color:var(--ink2);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:3px 8px;white-space:nowrap}
.ybadge{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-ink)}
.banner{background:var(--blue-bg);border:1px solid var(--blue-line);border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:13.5px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:12px;border:0;background:var(--blue);color:var(--on-blue);font-weight:800;font-size:14px;text-decoration:none;cursor:pointer}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:var(--on-gold)}

/* chips + segmented switch */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px;scroll-padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:40px;background:var(--surface);border:1px solid var(--line);color:var(--ink2);font-size:13px;font-weight:800;padding:0 15px;border-radius:999px;cursor:pointer;position:relative}
.chip::after{content:"";position:absolute;inset:-3px 0}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.scope{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:14px;padding:3px;margin-bottom:18px;gap:3px}
.scope button{flex:1;min-height:42px;background:none;border:0;cursor:pointer;padding:0 8px;border-radius:11px;font-size:13px;font-weight:800;color:var(--muted);min-width:0}
.scope button.on{background:var(--surface2);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18),inset 0 0 0 1px var(--line-hi)}
.scope button.on.me{color:var(--blue-ink)}
#pfSport,#pfOpts{margin-bottom:10px}
.proofk{grid-template-columns:1fr 1fr}
.proofk .kpi .big{font-size:30px}
.knote{font-size:12px;color:var(--muted);margin-top:6px}
.t td small{color:var(--muted);font-size:11px;font-weight:600}
table.t.pf th,table.t.pf td{padding:9px 5px;font-size:12.5px}
table.t.pf th{font-size:10px;letter-spacing:.04em;white-space:normal}
table.t.pf td:first-child,table.t.pf th:first-child{padding-left:12px}
table.t.pf td:last-child,table.t.pf th:last-child{padding-right:12px}
.pv{display:inline-block;margin-top:4px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap}
.pv.up{background:var(--win-bg);color:var(--win)}
.pv.down{background:var(--loss-bg);color:var(--loss)}
.pv.flat{background:var(--surface2);color:var(--ink2)}
.pv.wait{background:none;color:var(--faint);padding-left:0}

/* + buttons (open My Picks with the play filled in) */
.add{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:0;background:none;cursor:pointer;display:grid;place-items:center;padding:0;text-decoration:none}
.add span{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--blue-line);background:var(--blue-bg);color:var(--blue-ink);font:800 19px/1 var(--font-body);display:grid;place-items:center}
.add.done span{border-color:var(--win);background:var(--win-bg);color:var(--win);font-size:15px}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.cal-head h2{margin:0;font:900 28px/1 var(--font-display);text-transform:uppercase;text-align:center}
.navbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:20px;flex:0 0 44px}
.mtotal{display:flex;gap:8px 16px;color:var(--ink2);font-size:13px;margin-bottom:12px;flex-wrap:wrap}
.mtotal b{font:800 17px var(--font-display)}
.g7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dw{font-size:10.5px;color:var(--faint);font-weight:800;text-align:center;letter-spacing:.08em;padding-bottom:2px}
.d{aspect-ratio:1/1.08;min-width:0;min-height:44px;border-radius:11px;border:1.5px solid transparent;background:var(--surface);cursor:pointer;
  display:flex;flex-direction:column;justify-content:space-between;padding:5px 6px;text-align:left;position:relative}
.d.blank{background:transparent;cursor:default}
.d .dn{font-size:12px;font-weight:700;color:var(--muted)}
.d .du{font:800 15px/1 var(--font-display);align-self:flex-end}
.d.up{background:var(--win-bg)} .d.up .du{color:var(--win)}
.d.down{background:var(--loss-bg)} .d.down .du{color:var(--loss)}
.d.today{border-color:var(--gold)}
.d.sel{border-color:var(--ink)}
.d .st{position:absolute;top:4px;right:5px;font-size:11px;line-height:1;color:var(--gold)}
.d .st.win{color:var(--win)} .d .st.loss{color:var(--loss)}
.d .pend{display:flex;gap:2px;align-self:flex-end}
.d .pend i{width:5px;height:5px;border-radius:50%}

/* records */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0;box-shadow:var(--shadow)}

.kpi.me{border-color:var(--blue-line);background:linear-gradient(180deg,var(--blue-bg),transparent),var(--surface)}
.kpi.hero{grid-column:1/-1}
.kpi.hero .big{font-size:56px}
.kpi h3{margin:0 0 8px;font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

.kpi .big{font:900 40px/1 var(--font-display)}

.kpi .krow b{color:var(--ink);font-weight:800}
a.kpi{text-decoration:none;color:var(--ink);display:block}
a.kpi .go{font-size:13px;font-weight:800;color:var(--blue-ink);margin-top:10px;display:block}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 12px 6px;position:relative;box-shadow:var(--shadow)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--ink2);margin:0 0 6px 4px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:3px}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 8px;border-radius:8px;white-space:nowrap;display:none;z-index:2}
.tip b{font-weight:800}
.twrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
table.t th,table.t td{padding:10px 12px;text-align:right;white-space:nowrap;border-top:1px solid var(--line)}
table.t th{font-size:10.5px;color:var(--muted);font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-top:0}
table.t td:first-child,table.t th:first-child{text-align:left}
table.t tr.total td{font-weight:800;background:var(--surface2)}
table.t .grp{text-align:center;color:var(--ink2)}

/* sports */
.sports{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.sp-card{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 16px 16px 20px;text-decoration:none;color:var(--ink);position:relative;overflow:hidden;min-width:0;box-shadow:var(--shadow)}
.sp-card::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--c)}
.sp-card:hover{border-color:var(--line-hi)}
.sp-card h3{margin:0;font:900 26px/1 var(--font-display);text-transform:uppercase}
.sp-card .line{display:flex;gap:16px;color:var(--ink2);font-size:13px;flex-wrap:wrap}
.sp-card .line b{font:800 18px var(--font-display);color:var(--ink)}
.sp-card .line b.pos{color:var(--win)} .sp-card .line b.neg{color:var(--loss)}
.sp-card .go{font-size:13px;font-weight:800;color:var(--ink2)}
.sp-card .soon{color:var(--muted);font-size:13px}

.gcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow)}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px 6px}
.gmatch{padding:2px 14px 12px;display:flex;flex-direction:column;gap:6px}
.gteam{display:flex;align-items:center;gap:10px;font:800 21px/1.15 var(--font-display);text-transform:uppercase;min-width:0}
.gteam .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gteam small{font:600 12.5px var(--font-body);color:var(--muted);text-transform:none;margin-left:6px}
.gteam b{font:900 24px var(--font-display)}
.gteam.lost{color:var(--muted)}

.glines > div{background:var(--surface2);padding:9px 12px;min-width:0}
.glines .lab{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.glines .now{font:800 18px/1.2 var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.mv{font-weight:800;color:var(--ink2)}

.inj2 h4{margin:0 0 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.inj2 p{margin:0 0 2px;display:flex;justify-content:space-between;gap:6px}
.inj2 p span:last-child{color:var(--muted);white-space:nowrap}
.dtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 12px}
.dtools input{flex:1 1 160px;min-width:0;min-height:44px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px;color:var(--ink);font:inherit}
.addrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:10px 14px;border-top:1px solid var(--line)}
.addrow a{display:flex;align-items:center;justify-content:center;min-height:44px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:0 6px;font-size:12.5px;font-weight:800;color:var(--ink2);text-decoration:none;text-align:center;line-height:1.15;min-width:0;overflow:hidden}
.addrow a.done{border-color:var(--win);color:var(--win)}
.addrow a:hover{border-color:var(--blue-line);color:var(--blue-ink)}

.toast[hidden]{display:none}

function cumulative(es){
  const days = [...new Set(es.map(e=>e.date))].sort();
  let run = 0;
  return days.map(d => { run += es.filter(e=>e.date===d).reduce((a,e)=>a+(e.result_units||0),0); return {d, v: run}; });
}
const CH = {W: 640, H: 230, L: 40, R: 12, T: 12, B: 26};
function chartData(){
  const src = scope === "me" ? real().map(mStake) : scopeList();
  const graded = src.filter(e => FINAL.includes(e.status));
  const all = cumulative(graded), pd = scope === "best" ? cumulative(graded.filter(e=>e.potd)) : [];
  return {all, pd, days: all.map(p=>p.d)};
}
function chartSVG(){
  // draw at the real on-screen width so labels stay readable on phones
  CH.W = Math.max(300, Math.min(640, Math.round(Math.min(window.innerWidth, 860) - 58)));
  CH.H = CH.W < 480 ? 210 : 230;
  const {all, pd, days} = chartData();
  if (all.length < 2) return `<div class="empty" style="border:0">The chart fills in once a few days are graded.</div>`;
  const {W, H: Hh, L, R, T, B} = CH;
  const xi = d => L + (W-L-R) * days.indexOf(d) / (days.length-1);
  const vals = [...all, ...pd].map(p=>p.v), lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  const step = (hi - lo) > 40 ? 20 : (hi - lo) > 16 ? 10 : (hi - lo) > 6 ? 5 : 2;
  const y0 = Math.floor(lo/step)*step, y1 = Math.ceil(hi/step)*step;
  const y = v => T + (Hh-T-B) * (1 - (v - y0)/((y1 - y0) || 1));
  let grid = "";
  for (let v = y0; v <= y1; v += step) grid += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="${v===0?1.5:1}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v>0?"+":""}${v}</text>`;
  const firsts = days.filter((d,i) => i===0 || d.slice(5,7) !== days[i-1].slice(5,7));
  const xl = firsts.map(d => `<text x="${xi(d)}" y="${Hh-6}" font-size="11" fill="var(--muted)">${fromYmd(d).toLocaleDateString(undefined,{month:"short"})}</text>`).join("");
  const path = pts => pts.map((p,i) => (i?"L":"M") + xi(p.d).toFixed(1) + " " + y(p.v).toFixed(1)).join(" ");
  const c1 = scope === "me" ? "var(--blue)" : "var(--s-all)";
  const dot = (pts, color) => { const p = pts[pts.length-1]; return `<circle cx="${xi(p.d)}" cy="${y(p.v)}" r="4.5" fill="${color}" stroke="var(--surface)" stroke-width="2"/>`; };
  const label = scope === "me" ? "Your real picks" : scope === "best" ? "All best plays" : "Every 1U+ play";
  return `<div class="legend"><span><i style="background:${c1}"></i>${label} ${sgn(all[all.length-1].v)}u</span>${pd.length?`<span><i style="background:var(--s-potd)"></i>★ Play of the Day ${sgn(pd[pd.length-1].v)}u</span>`:""}</div>
    <svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Running units: ${label} ${sgn(all[all.length-1].v)} units">${grid}${xl}
      <path d="${path(all)}" fill="none" stroke="${c1}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
      ${pd.length > 1 ? `<path d="${path(pd)}" fill="none" stroke="var(--s-potd)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>` : ""}
      ${dot(all, c1)}${pd.length ? dot(pd, "var(--s-potd)") : ""}
      <line id="xh" y1="${T}" y2="${Hh-B}" stroke="var(--line-hi)" stroke-width="1" visibility="hidden"/>
      <rect id="hit" x="${L}" y="0" width="${W-L-R}" height="${Hh-B}" fill="transparent"/>
    </svg><div class="tip" id="tip"></div>`;
}
function wireChart(){
  const svg = document.querySelector("#v-records svg"); if (!svg) return;
  const {all, pd, days} = chartData(), {W, L, R} = CH;
  const hit = svg.querySelector("#hit"), xh = svg.querySelector("#xh"), tipEl = document.querySelector("#tip");
  if (!hit || !xh || !tipEl) return;
  const pdAt = d => { let v = null; for (const p of pd) { if (p.d <= d) v = p.v; } return v; };
  const move = ev => {
    const box = svg.getBoundingClientRect(), x = (ev.clientX - box.left) * W / box.width;
    const i = Math.max(0, Math.min(days.length-1, Math.round((x - L) / (W-L-R) * (days.length-1))));
    const px = L + (W-L-R) * i / (days.length-1), sx = px * box.width / W;
    xh.setAttribute("x1", px); xh.setAttribute("x2", px); xh.setAttribute("visibility", "visible");
    const v2 = pdAt(days[i]);
    tipEl.innerHTML = `${fromYmd(days[i]).toLocaleDateString(undefined,{month:"short",day:"numeric"})} · <b>${sgn(all[i].v)}u</b>${v2!=null?` · ★ <b>${sgn(v2)}u</b>`:""}`;
    tipEl.style.display = "block";
    const tw = tipEl.offsetWidth, cw = svg.parentElement.clientWidth;
    tipEl.style.left = Math.max(8, Math.min(cw - tw - 8, sx + 12 - (sx > cw/2 ? tw + 24 : 0))) + "px";
    tipEl.style.top = "36px";
  };
  hit.addEventListener("pointermove", move); hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", () => { xh.setAttribute("visibility","hidden"); tipEl.style.display = "none"; });
}

let proofSport = store.get("proofSport", "all"), proofKind = store.get("proofKind", "all"), proofSpan = store.get("proofSpan", "season");

function proofRec(es){
  const g = es.filter(e => FINAL.includes(e.status) && e.status !== "void");
  const w = g.filter(e=>e.status==="win").length, l = g.filter(e=>e.status==="loss").length, p = g.filter(e=>e.status==="push").length;

  return {n:g.length, w, l, p, u, roi: g.length ? 100*u/g.length : null, text:`${w}-${l}${p?"-"+p:""}`, cn:c.length, cpct: c.length ? 100*cb/c.length : null};
}
function proofVerdict(r){
  if (r.n < 100) return `<span class="pv wait">Too few yet</span>`;
  if (r.roi >= 4) return `<span class="pv up">Making money</span>`;

}

function fromFeed(p){ if (!p || !p.id) return null;
  const [a, h] = teamsInEvent(p.sport, p.event), parts = String(p.event||"").split(/\s+(?:@|vs\.?|at)\s+/i);
  return {feed_id: p.id, sport: p.sport, date: p.date, start: p.start, event: p.event, market: p.market === "moneyline" ? "ml" : p.market,
          selection: p.selection, line: p.line ?? null, price: p.price ?? -110, model_tier: p.tier || null,
          away_short: parts.length === 2 ? parts[0] : "", home_short: parts.length === 2 ? parts[1] : "",
          side: p.market === "total" || p.market === "prop" || parts.length !== 2 ? null
            : String(p.selection).startsWith(parts[1]) ? "home" : String(p.selection).startsWith(parts[0]) ? "away" : null}; }
function fromGame(g, market, side){
  const L = g.lines || {}, A = g.away.abbr || g.away.short, Hm = g.home.abbr || g.home.short;
  let line = null, pr = -110, sel = "";
  if (market === "spread"){ if (L.spread == null) return null; line = side === "home" ? L.spread : -L.spread; sel = `${side === "home" ? g.home.short : g.away.short} ${line > 0 ? "+" : ""}${line}`; }
  if (market === "total"){ if (L.total == null) return null; line = L.total; sel = `${side === "over" ? "Over" : "Under"} ${line}`; }
  if (market === "ml"){ pr = side === "home" ? L.home_ml : L.away_ml; if (pr == null) return null; sel = `${side === "home" ? g.home.short : g.away.short} ML`; }
  return {sport: g.sport, game_id: g.id, date: g.date, start: g.start, home: g.home.name, away: g.away.name, home_short: g.home.short, away_short: g.away.short,
          market, side, line, price: pr, selection: sel, vegas_line: L.spread ?? null};
}
function gameAddRow(g){
  const b = (mk, sd, label) => { const p = fromGame(g, mk, sd); if (!p) return ""; const done = alreadyMine(p);
    return `<a class="${done?"done":""}" href="${addLink(p)}">${done ? "✓" : "+"} ${label}</a>`; };
  const L = g.lines || {}, A = g.away.abbr || g.away.short, Hm = g.home.abbr || g.home.short;
  return `<div class="addrow">${b("spread","away",`${A} ${L.spread!=null?(-L.spread>0?"+":"")+(-L.spread):""}`)}${b("total","over",`O ${L.total??""}`)}${b("ml","away",`${A} ML`)}${b("spread","home",`${Hm} ${L.spread!=null?(L.spread>0?"+":"")+L.spread:""}`)}${b("total","under",`U ${L.total??""}`)}${b("ml","home",`${Hm} ML`)}</div>`;
}
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2400); }

// ---------- MY PICKS tab (read-only view of the My Picks app's picks)
let oldLocal = []; try { oldLocal = JSON.parse(store.get("hubMyPicks", "[]")) || []; } catch(e) { oldLocal = []; }
function renderMine(){
  const oldBanner = oldLocal.length ? `<div class="banner"><span><b>${oldLocal.length} pick${oldLocal.length>1?"s":""}</b> from the old Mine tab ${oldLocal.length>1?"are":"is"} saved only on this phone.</span><a class="btn" href="picks/#import">Move to My Picks</a></div>` : "";
  if (!MINE){
    $("#v-mine").innerHTML = oldBanner + (mineLoading ? `<div class="skel" style="height:150px"></div><div class="skel"></div><div class="skel"></div>` :
      `<div class="kpi me hero"><h3>My Picks</h3><div class="big">Your bets, tracked</div>
        <div class="krow"><span>Log your own picks in the My Picks app. They show here, on Today and on Records, with their own record.</span></div>
        <div style="margin-top:14px"><a class="btn" href="picks/">Open My Picks</a></div></div>`);
    return;
  }
  const R = real(), r = rec(R.map(mStake));
  const pend = R.filter(m => !FINAL.includes(m.status)).sort((a,b) => (a.date + (a.start||"")) < (b.date + (b.start||"")) ? -1 : 1);
  const done = R.filter(m => FINAL.includes(m.status)).sort((a,b) => a.date < b.date ? 1 : -1);
  const B = blinds(), bToday = B.filter(m => m.date >= today && !FINAL.includes(m.status));
  const bDone = B.filter(m => FINAL.includes(m.status)), br = rec(bDone.map(mStake));
  const days = [...new Set(bToday.map(m => m.date))].sort();
  const dayName = d => d === today ? "Today" : fromYmd(d).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
  $("#v-mine").innerHTML = `${oldBanner}
    <div class="kpi me hero"><h3>Your real picks</h3><div class="big num ${cls(r.u)}">${r.n ? sgn(r.u) + "u" : "0-0"}</div>
      <div class="krow"><span><b>${r.text}</b> record</span><span><b>${winPct(r)}</b> wins</span><span><b>${roiTxt(r)}</b> ROI</span><span><b>${pend.length}</b> pending</span></div>
      <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap"><a class="btn" href="picks/">+ Log a pick</a><a class="btn ghost" href="#records" data-go="records" data-sc="me">Full record</a></div></div>
    <div class="sec"><div class="sec-h"><h2>Pending</h2><span>${pend.length}</span></div>
      ${pend.length ? `<div class="list you">${pend.map(pickRow).join("")}</div>` : `<div class="empty"><b>No pending picks</b>Tap + on any play or game line to add it.<br><a href="picks/">Log a pick ›</a></div>`}</div>
    ${days.length ? `<div class="sec"><div class="sec-h"><h2>Blind picks</h2><a class="more" href="picks/">Pick more ›</a></div>
      <div class="list">${days.map(d => { const es = bToday.filter(m => m.date === d);
        return `<div class="row" style="align-items:flex-start"><div class="w"><div class="sel" style="font-size:16px">${dayName(d)}</div>
          <div class="ybadge" style="margin-top:2px">${blindLine(es)}</div>
          <div class="bchips">${es.map(m => `<span>${esc(m.selection)}</span>`).join("")}</div></div></div>`; }).join("")}</div></div>` : ""}
    <div class="sec"><div class="sec-h"><h2>Graded</h2><span>${done.length ? `${r.text} · <b class="${cls(r.u)}">${sgn(r.u)}u</b>` : ""}</span></div>
      ${done.length ? `<div class="list">${done.slice(0, 60).map(pickRow).join("")}</div>` : `<div class="empty">Results show here after games finish.</div>`}
      ${bDone.length ? `<p class="note">Blind picks so far: ${br.text} · <b class="${cls(br.u)}">${sgn(br.u)}u</b>. See them against the model in My Picks.</p>` : ""}</div>
    ${how(["This tab shows the picks you save in the <b>My Picks</b> app (the one real place your picks live, in your private my-picks repo). To add, change or grade a pick, use My Picks.",
      "<b>Real picks</b> are the bets you log at your own stake. <b>Blind picks</b> are your 1-unit sides on every game before seeing the model.",
      `${mineSource === "live" ? "This phone is connected to My Picks, so this is live." : "On a phone connected to My Picks this is live; elsewhere it updates with the hub every 30 minutes."} Your notes stay private.`])}`;
  wireGo();
}
function renderMineViews(){ renderToday(); renderMine(); if (scope === "me") renderRecords(); else if (view === "records") renderRecords(); }
function wireGo(){
  document.querySelectorAll("[data-go]").forEach(a => a.onclick = ev => { ev.preventDefault(); if (a.dataset.sc) { scope = a.dataset.sc; store.set("hubScope", scope); renderRecords(); } setView(a.dataset.go); });
}

      <span class="go">Open ${s.name} ›</span></a>`).join("")}</div>
    <div class="sec"><div class="sec-h"><h2>Your tools</h2></div>

        <a class="sp-card" href="picks/" style="--c:var(--blue)"><h3>My Picks</h3><div class="line"><span>Log your bets, blind picks vs. the model, your record</span></div><span class="go">Open My Picks ›</span></a>
        <a class="sp-card" href="research/" style="--c:var(--gold)"><h3>Research</h3><div class="line"><span>Prop hit rates, trends and matchup data</span></div><span class="go">Open Research ›</span></a>

        <a class="sp-card" href="parlays/" style="--c:var(--ncaab)"><h3>Parlays</h3><div class="line"><span>Alt-line prop parlays built from the models</span></div><span class="go">Open Parlays ›</span></a>
      </div></div>`;
}

// ---------- shell
function setView(v){
  view = v; store.set("hubView", v);
  document.querySelectorAll(".tab").forEach(t => { t.classList.toggle("on", t.dataset.v === v); t.setAttribute("aria-current", t.dataset.v === v ? "page" : "false"); });
  document.querySelectorAll(".view").forEach(s => s.hidden = s.id !== "v-" + v);
  if (location.hash !== "#" + v) history.replaceState(null, "", "#" + v);
  window.scrollTo(0, 0);
}
document.querySelectorAll(".tab").forEach(t => t.onclick = () => setView(t.dataset.v));
window.addEventListener("hashchange", () => { const v = location.hash.replace("#",""); if (v !== view && document.getElementById("v-" + v)) setView(v); });
const season = rec(H.ledger);
$("#seasonUnits").textContent = sgn(season.u) + "u";
$("#seasonUnits").className = "num " + cls(season.u);
$("#seasonLabel").textContent = `Season · ${season.text}`;
renderToday(); renderMine(); renderCalendar(); renderRecords(); renderData(); renderSports(); setView(view);
let rw = window.innerWidth;
window.addEventListener("resize", () => { if (Math.abs(window.innerWidth - rw) > 40) { rw = window.innerWidth; renderRecords(); } });
loadMineLive();

Promise.all(Object.entries(H.folders).map(([code, folder]) =>
  fetch(folder + "/plays.json", {cache: "no-store"}).then(r => r.ok ? r.json() : {plays: []}).then(d => d.plays || []).catch(() => [])
)).then(lists => { live = lists.flat(); liveLoaded = true; renderToday(); if (scope === "all") renderCalendar(); if (scope === "all" || scope === "proof") renderRecords(); });

Promise.all(Object.entries(H.folders).map(([code, folder]) =>
  fetch(folder + "/games.json", {cache: "no-store"}).then(r => r.ok ? r.json() : null).catch(() => null)
    .then(d => ({code, games: d && Array.isArray(d.games) ? d.games.map(g => ({...g, sport: code})) : null}))
)).then(res => {
  missingSports = res.filter(r => r.games === null).map(r => r.code);
  gamesAll = res.flatMap(r => r.games || []); gamesLoaded = true;
  renderData();
});

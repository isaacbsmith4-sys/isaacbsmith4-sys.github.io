<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Isaac's Models</title>
<meta name="theme-color" content="#0c1018">
<style>
:root{color-scheme:dark;--bg:#0c1018;--panel:#141a26;--line:#252e42;--text:#e9edf5;--muted:#8b95aa;--accent:#ff7a1a}
@media (prefers-color-scheme: light){:root{color-scheme:light;--bg:#eef1f6;--panel:#fff;--line:#dde2eb;--text:#141a26;--muted:#5a6478;--accent:#e8620c}}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,sans-serif}
main{max-width:560px;margin:0 auto;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:26px;margin:0 0 4px}p{color:var(--muted);margin:0 0 24px}
a.app{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:10px;color:var(--text);text-decoration:none;font-weight:600}
a.app span{color:var(--muted);font-weight:400;font-size:14px}a.app:hover{border-color:var(--accent)}
</style>
</head>
<body>
<main>
<h1>Isaac's Models</h1>
<p>The all-sports hub with the day's best plays is coming here. For now, open a sport:</p>
<a class="app" href="nba/">NBA Model <span>games + player props</span></a>
<a class="app" href="nfl/">NFL Model <span>games + player props</span></a>
<a class="app" href="nhl/">NHL Model <span>moneylines + totals</span></a>
<a class="app" href="ncaab/">College Basketball <span>spreads + totals</span></a>
</main>
</body>
</html>

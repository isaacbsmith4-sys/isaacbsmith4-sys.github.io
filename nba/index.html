<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1018">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NBA Model">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>NBA Model</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: bottom tabs (Tonight / Games / Props / Results). Tonight leads with the night's unit plays
   as bet slips; Games and Props keep a date strip and expandable cards; Results holds the record. */
:root{
  color-scheme:dark;
  --bg:#0d0f15; --panel:#151821; --panel2:#1c2030; --detail:#12151d; --line:#272c3d; --line-hi:#3b4258;
  --text:#eef0f6; --muted:#808a9f; --faint:#586178; --track:#272c3d; --away-bar:#6b7590;
  --accent:#ff7a1a; --accent2:#e8432e; --on-accent:#ffffff;
  --u2:#f5b301; --u2-bg:rgba(245,179,1,.15); --u2-ring:rgba(245,179,1,.45);
  --u1:#2fd06e; --u1-bg:rgba(34,197,94,.13); --u1-ring:rgba(34,197,94,.42);
  --lean:#3b82f6; --lean-tx:#86b5ff; --lean-bg:rgba(59,130,246,.14); --lean-ring:rgba(59,130,246,.42);
  --light:#7c8db5; --light-tx:#aab7d4; --light-bg:rgba(124,141,181,.12); --light-ring:rgba(124,141,181,.32);
  --win:#2fd06e; --win-bg:rgba(34,197,94,.15); --loss:#f05252; --loss-bg:rgba(239,68,68,.15); --push-bg:#252e42;
  --flag:#ffb46b; --flag-bg:rgba(255,122,26,.13);
  --s-out:#ff8a8a; --s-out-bg:rgba(239,68,68,.15); --s-dbt:#ffb36b; --s-dbt-bg:rgba(249,115,22,.15);
  --s-q:#f2cf55; --s-q-bg:rgba(234,179,8,.13); --s-prob:#6ee69a; --s-prob-bg:rgba(34,197,94,.12);
  --font-body:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-num:"Big Shoulders Display","Oswald","Arial Narrow",system-ui,sans-serif;
  --tabbar-h:64px;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#f3f1ec; --panel:#ffffff; --panel2:#f8f6f1; --detail:#faf9f6; --line:#e0dcd2; --line-hi:#c9c3b5;
  --text:#16181f; --muted:#6a7080; --faint:#9a9fac; --track:#e6e2d9; --away-bar:#a2a6b0;
  --accent:#e8620c; --accent2:#cf3420; --on-accent:#ffffff;
  --u2:#a87400; --u2-bg:rgba(245,179,1,.16); --u2-ring:rgba(200,140,0,.5);
  --u1:#13893f; --u1-bg:rgba(34,197,94,.12); --u1-ring:rgba(19,137,63,.4);
  --lean:#2563eb; --lean-tx:#1d4fc4; --lean-bg:rgba(59,130,246,.1); --lean-ring:rgba(37,99,235,.35);
  --light:#6b7a9c; --light-tx:#4f5d7d; --light-bg:rgba(107,122,156,.1); --light-ring:rgba(107,122,156,.3);
  --win:#13893f; --win-bg:rgba(34,197,94,.13); --loss:#c62828; --loss-bg:rgba(220,38,38,.1); --push-bg:#e6eaf1;
  --flag:#b45309; --flag-bg:rgba(245,158,11,.14);
  --s-out:#b91c1c; --s-out-bg:rgba(220,38,38,.1); --s-dbt:#c2410c; --s-dbt-bg:rgba(249,115,22,.12);
  --s-q:#946200; --s-q-bg:rgba(234,179,8,.15); --s-prob:#13893f; --s-prob-bg:rgba(34,197,94,.12);
}}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f3f1ec; --panel:#ffffff; --panel2:#f8f6f1; --detail:#faf9f6; --line:#e0dcd2; --line-hi:#c9c3b5;
  --text:#16181f; --muted:#6a7080; --faint:#9a9fac; --track:#e6e2d9; --away-bar:#a2a6b0;
  --accent:#e8620c; --accent2:#cf3420; --on-accent:#ffffff;
  --u2:#a87400; --u2-bg:rgba(245,179,1,.16); --u2-ring:rgba(200,140,0,.5);
  --u1:#13893f; --u1-bg:rgba(34,197,94,.12); --u1-ring:rgba(19,137,63,.4);
  --lean:#2563eb; --lean-tx:#1d4fc4; --lean-bg:rgba(59,130,246,.1); --lean-ring:rgba(37,99,235,.35);
  --light:#6b7a9c; --light-tx:#4f5d7d; --light-bg:rgba(107,122,156,.1); --light-ring:rgba(107,122,156,.3);
  --win:#13893f; --win-bg:rgba(34,197,94,.13); --loss:#c62828; --loss-bg:rgba(220,38,38,.1); --push-bg:#e6eaf1;
  --flag:#b45309; --flag-bg:rgba(245,158,11,.14);
  --s-out:#b91c1c; --s-out-bg:rgba(220,38,38,.1); --s-dbt:#c2410c; --s-dbt-bg:rgba(249,115,22,.12);
  --s-q:#946200; --s-q-bg:rgba(234,179,8,.15); --s-prob:#13893f; --s-prob-bg:rgba(34,197,94,.12);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--font-body);-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom, 0px);padding-left:env(safe-area-inset-left, 0px);padding-right:env(safe-area-inset-right, 0px)}
.tabs-in{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabbar-h)}
.tab{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font:700 11.5px var(--font-body)}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}
@media (min-width:760px){
  body{padding-bottom:0}
  .tabs{position:sticky;top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line)}
  .tabs-in{height:52px;grid-template-columns:repeat(4,auto);justify-content:start;gap:4px;padding-left:max(16px, env(safe-area-inset-left, 0px))}
  .tab{flex-direction:row;gap:8px;font-size:14px;padding:0 14px;border-bottom:2px solid transparent}
  .tab.on{border-bottom-color:var(--accent)}
  .tab svg{width:18px;height:18px}
}
.pane[hidden]{display:none!important}
.slips{display:grid;gap:10px}
.slipc{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;text-align:left;color:var(--text);font:inherit;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;min-height:44px}
.slipc.u2{border-color:var(--u2-ring);background:linear-gradient(180deg,var(--u2-bg),transparent 70%),var(--panel)}
.slipc.u1{border-color:var(--u1-ring);background:linear-gradient(180deg,var(--u1-bg),transparent 70%),var(--panel)}
.slipc .ev{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.slipc .ev img{width:20px;height:20px;object-fit:contain}
.slipc .pk{font:900 28px/1.05 var(--font-num);text-transform:uppercase;letter-spacing:.01em;overflow-wrap:anywhere;min-width:0}
.slipc .pk small{font:700 15px var(--font-body);color:var(--muted);text-transform:none;margin-left:6px}
.slipc .nums{grid-column:1/-1;display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;margin-top:2px}
.slipc .nums b{font:800 17px var(--font-num);color:var(--text);margin-right:4px}
.heroh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:4px 0 12px}
.heroh h2{margin:0;font:900 30px/1 var(--font-num);text-transform:uppercase;letter-spacing:.02em}
.heroh span{color:var(--muted);font-size:13px}
.whyl{margin:0;padding-left:18px;display:grid;gap:4px;font-size:13.5px;color:var(--text)}
.warnline{color:var(--flag);font-weight:700;font-size:13px;margin-bottom:4px}
.whyshort{grid-column:1/-1;font-size:12.5px;color:var(--muted);margin-top:2px}
.favs{display:grid;gap:6px}
.fav{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:44px;cursor:pointer;color:var(--text);font:inherit;text-align:left}
.fav b{display:block;font-weight:800}
.fav small{display:block;color:var(--muted);font-size:12px}
.fav em{font:800 18px var(--font-num);font-style:normal;color:var(--muted)}
details.how{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0 14px;margin-bottom:12px}
details.how summary{cursor:pointer;padding:12px 0;font-weight:800;font-size:13px;color:var(--muted);list-style:none;min-height:44px;display:flex;align-items:center}
details.how summary::-webkit-details-marker{display:none}
details.how summary::after{content:"+";margin-left:auto;font-size:18px}
details.how[open] summary::after{content:"–"}
details.how .legend{padding-bottom:12px;margin:0}
.season{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.season b{font:900 22px var(--font-num)}
.season span{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
button:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font:800 16px var(--font-num);color:var(--on-accent);letter-spacing:.5px}
.brand h1{font:800 24px/1 var(--font-num);margin:0;letter-spacing:.3px;text-transform:uppercase}
.brand small{display:block;color:var(--muted);font-size:12.5px;font-weight:500;margin-top:3px}
.record{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 12px;min-width:92px}
.stat b{display:block;font:700 20px/1.1 var(--font-num);font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.dates{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:thin;scroll-snap-type:x proximity}
.date{flex:0 0 auto;scroll-snap-align:start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px;cursor:pointer;text-align:center;min-width:86px;transition:border-color .15s;color:var(--text);font:inherit}
.date:hover{border-color:var(--line-hi)}
.date .dow{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;font-weight:600}
.date .day{font:700 19px/1.15 var(--font-num);margin:1px 0}
.date .meta{font-size:11.5px;color:var(--muted)}
.date .meta .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--u1);margin-right:4px;vertical-align:1px}
.date.past .day{color:var(--muted)}
.date.today{border-color:var(--accent)}
.date.active{background:var(--panel2);border-color:var(--text)}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px;gap:10px;flex-wrap:wrap}
.toolbar h2{font:700 20px/1.2 var(--font-num);margin:0;text-transform:uppercase;letter-spacing:.3px;text-wrap:balance}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{background:none;border:0;color:var(--muted);font:700 13px var(--font-body);padding:10px 14px;border-radius:7px;cursor:pointer;min-height:40px}
.seg button.on{background:var(--panel2);color:var(--text)}
.legend{display:flex;gap:12px;color:var(--muted);font-size:12.5px;flex-wrap:wrap;margin-bottom:12px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;transition:border-color .15s}
.card:hover{border-color:var(--line-hi)}
.card.open{border-color:var(--line-hi)}
.row{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr) minmax(0,1fr) 82px 104px;align-items:center;gap:10px;padding:14px 16px;cursor:pointer}
.teams{display:flex;flex-direction:column;gap:6px;min-width:0}
.team{display:flex;align-items:center;gap:9px;min-width:0}
.team img{width:26px;height:26px;object-fit:contain;flex:0 0 26px}
.team .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team .rec{color:var(--faint);font-size:12.5px;margin-left:2px;font-variant-numeric:tabular-nums}
.team .sc{margin-left:auto;font:700 18px var(--font-num);font-variant-numeric:tabular-nums}
.team.lost .nm,.team.lost .sc{color:var(--muted)}
.cell{min-width:0}
.cell .lbl{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.7px;font-weight:600}
.cell .val{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.cell .sub{font-size:12.5px;color:var(--muted);white-space:nowrap}
.edge .val{font:800 22px/1.1 var(--font-num)}
.badge{justify-self:end;font:700 14px var(--font-num);letter-spacing:.4px;text-transform:uppercase;padding:6px 10px;border-radius:8px;white-space:nowrap;text-align:center;min-width:86px}
.t-2U{background:var(--u2-bg);color:var(--u2);box-shadow:inset 0 0 0 1px var(--u2-ring)}
.t-1U{background:var(--u1-bg);color:var(--u1);box-shadow:inset 0 0 0 1px var(--u1-ring)}
.t-Lean{background:var(--lean-bg);color:var(--lean-tx);box-shadow:inset 0 0 0 1px var(--lean-ring)}
.t-Light{background:var(--light-bg);color:var(--light-tx);box-shadow:inset 0 0 0 1px var(--light-ring)}
.t-No{background:transparent;color:var(--faint);box-shadow:inset 0 0 0 1px var(--line)}
.res{display:inline-block;font:700 12px var(--font-num);letter-spacing:.5px;padding:2px 7px;border-radius:6px;margin-left:6px}
.res.win{background:var(--win-bg);color:var(--win)} .res.loss{background:var(--loss-bg);color:var(--loss)} .res.push{background:var(--push-bg);color:var(--muted)}
.flag{display:inline-block;font-size:11px;font-weight:700;color:var(--flag);background:var(--flag-bg);border-radius:5px;padding:1px 6px;margin-top:4px}
.detail{display:none;border-top:1px solid var(--line);padding:16px;background:var(--detail)}
.card.open .detail{display:block}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.box{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.box h4{margin:0 0 8px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.pickline{font:800 24px/1.15 var(--font-num);letter-spacing:.2px}
.kv{display:flex;justify-content:space-between;gap:8px;padding:3px 0;font-variant-numeric:tabular-nums}
.kv span:first-child{color:var(--muted)}
.prob{height:8px;border-radius:5px;background:var(--track);overflow:hidden;display:flex;margin:8px 0 4px}
.prob div{height:100%}
.cmpwrap{overflow-x:auto}
.cmp{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.cmp th{font-size:11px;color:var(--muted);font-weight:600;text-align:right;padding:4px 6px}
.cmp th:first-child,.cmp td:first-child{text-align:left;color:var(--muted)}
.cmp td{text-align:right;padding:5px 6px;border-top:1px solid var(--line)}
.cmp td.better{color:var(--text);font-weight:700}
.inj{margin:0;padding:0;list-style:none}
.inj li{display:flex;justify-content:space-between;gap:8px;padding:3px 0;font-size:13.5px}
.inj .st{font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;white-space:nowrap}
.st.Out,.st.Suspension{background:var(--s-out-bg);color:var(--s-out)}
.st.Doubtful{background:var(--s-dbt-bg);color:var(--s-dbt)}
.st.Questionable,.st.Day-To-Day{background:var(--s-q-bg);color:var(--s-q)}
.st.Probable{background:var(--s-prob-bg);color:var(--s-prob)}
.note{color:var(--muted);font-size:13px;margin-top:10px;max-width:75ch}
.empty{color:var(--muted);text-align:center;padding:50px 0}
.sumwrap{overflow-x:auto}
.summary{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin-top:6px}
.summary th,.summary td{padding:7px 8px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
.summary th{color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;border-top:0}
.summary td:first-child,.summary th:first-child{text-align:left}
details.sum{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-top:22px}
details.sum summary{cursor:pointer;font-weight:700}
.views{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--muted);font:700 13px var(--font-body);padding:9px 14px;border-radius:999px;cursor:pointer;min-height:40px}
.chip.on{color:var(--bg);border-color:var(--text);background:var(--text)}
.prow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1.2fr) minmax(0,.9fr) 82px 104px;align-items:center;gap:10px;padding:13px 16px;cursor:pointer}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who img{width:28px;height:28px;object-fit:contain;flex:0 0 28px}
.who .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .mu{font-size:12.5px;color:var(--muted);white-space:nowrap}
.side{font:700 17px/1.15 var(--font-num);letter-spacing:.2px;white-space:nowrap}
.warn{display:inline-block;font-size:11px;font-weight:700;color:var(--s-q);background:var(--s-q-bg);border-radius:5px;padding:1px 6px;margin-top:4px}
.bars{display:flex;align-items:flex-end;gap:5px;height:110px;position:relative;padding-top:6px;border-bottom:1px solid var(--line)}
.bars .b{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.bars .b i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--away-bar)}
.bars .b i.hit{background:var(--u1)}
.bars .b span{font:700 12px var(--font-num);margin-bottom:2px;font-variant-numeric:tabular-nums}
.bars .ln{position:absolute;left:0;right:0;border-top:2px dashed var(--accent)}
.bars .ln em{position:absolute;right:0;top:-18px;font:700 11px var(--font-num);color:var(--accent);font-style:normal;background:var(--panel2);padding:0 3px}
.barlbl{display:flex;gap:5px;margin-top:4px}
.barlbl span{flex:1;min-width:0;text-align:center;font-size:10px;color:var(--faint);white-space:nowrap;overflow:hidden}
@media (max-width:760px){
  .prow{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"w b" "s e" "p e"}
  .prow .who{grid-area:w}.prow .badge{grid-area:b;align-self:start}
  .prow .c-side{grid-area:s}.prow .c-proj{grid-area:p}.prow .edge{grid-area:e;text-align:right;align-self:end}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media (max-width:760px){
  .row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"t b" "v m" "e e"}
  .row .teams{grid-area:t}.row .badge{grid-area:b;align-self:start}
  .row .c-vegas{grid-area:v}.row .c-model{grid-area:m;text-align:right}.row .edge{grid-area:e}
  .grid{grid-template-columns:1fr}
  .box[style*="span 2"]{grid-column:auto!important}
  .stat{min-width:0;flex:1}
}

const PLAY_MARKETS = S.props ? S.props.play_markets : [];
const MARKETS = [["all","All"],["reb","Rebounds"],["ast","Assists"],["fg3m","3-Pointers"],["pts","Points"],["pra","Pts+Reb+Ast"],["pr","Pts+Reb"],["pa","Pts+Ast"],["ra","Reb+Ast"]];
const pct = x => x == null ? "–" : Math.round(x*100) + "%";

$("#updated").textContent = "Updated " + D.updated;
const GAME_LEGEND =
  `<span><i style="background:var(--u2)"></i>2U · ${T.two_unit}+ pts</span>` +
  `<span><i style="background:var(--u1)"></i>1U · ${T.one_unit}+</span>` +
  `<span><i style="background:var(--lean)"></i>Lean · ${T.lean}+</span>` +
  `<span><i style="background:var(--light)"></i>Light lean · ${T.light_lean}+</span>` +
  (S.early_season_bump ? `<span>Early season: +${S.early_season_bump} pts until ${S.early_season_games} games</span>` : "");
const PROP_LEGEND = PT ? `<span><i style="background:var(--u2)"></i>2U · ${Math.round(PT.two_unit*100)}%+ edge</span>` +
  `<span><i style="background:var(--u1)"></i>1U · ${Math.round(PT.one_unit*100)}%+</span>` +
  `<span><i style="background:var(--lean)"></i>Lean · ${Math.round(PT.lean*100)}%+</span>` +
  `<span><i style="background:var(--light)"></i>Light lean · ${Math.round(PT.light_lean*100)}%+</span>` +
  `<span>Edge = model's chance minus the book's no-vig chance. Plays only in ${PLAY_MARKETS.map(m => (MARKETS.find(x=>x[0]===m)||[m,m])[1].toLowerCase()).join(", ")}.</span>` : "";

// header record: unit plays
(function(){
  const plays = D.summary.filter(r => r.tier === "2U" || r.tier === "1U");
  const w = plays.reduce((a,r)=>a+r.w,0), l = plays.reduce((a,r)=>a+r.l,0);
  const u = plays.reduce((a,r)=>a+(r.units||0),0);
  const all = D.summary, n = all.reduce((a,r)=>a+r.w+r.l,0);
  const beat = all.filter(r=>r.beat!=null);
  const bw = beat.reduce((a,r)=>a+r.beat*(r.w+r.l),0)/Math.max(1,beat.reduce((a,r)=>a+r.w+r.l,0));
  const pp = (D.prop_summary||[]).filter(r => r.tier === "2U" || r.tier === "1U");
  const pw = pp.reduce((a,r)=>a+r.w,0), pl = pp.reduce((a,r)=>a+r.l,0), pu = pp.reduce((a,r)=>a+(r.units||0),0);
  $("#season").innerHTML = `<b style="color:${u+pu>=0?'var(--win)':'var(--loss)'}">${sgn(u+pu)}u</b><span>${w+pw}-${l+pl} unit plays</span>`;
  $("#record").innerHTML =
    `<div class="stat"><b>${w}-${l}</b><span>Game plays</span></div>` +
    `<div class="stat"><b>${pw}-${pl} <small style="font-size:13px;color:${pu>=0?'var(--win)':'var(--loss)'}">${sgn(pu)}u</small></b><span>Prop plays</span></div>` +
    `<div class="stat"><b style="color:${u>=0?'var(--win)':'var(--loss)'}">${sgn(u)}u</b><span>Units</span></div>` +
    `<div class="stat"><b>${n?Math.round(bw*100)+"%":"–"}</b><span>Beat close</span></div>`;
})();

const byDate = {};
D.games.forEach(g => (byDate[g.date] = byDate[g.date] || []).push(g));
(D.props||[]).forEach(p => { byDate[p.date] = byDate[p.date] || []; });
const dates = Object.keys(byDate).sort();
let current = dates.find(d => d >= todayStr) || dates[dates.length-1];

function dayLabel(d){ const [y,m,dd] = d.split("-").map(Number); return new Date(y, m-1, dd); }
function renderDates(){
  $("#dates").innerHTML = dates.map(d => {
    const dt = dayLabel(d), gs = byDate[d], plays = gs.filter(isPlay).length;
    const graded = gs.filter(g => g.result && isPlay(g));
    const w = graded.filter(g=>g.result.result==="win").length, l = graded.filter(g=>g.result.result==="loss").length;
    const meta = graded.length ? `${w}-${l} plays` : `${gs.length} games` + (plays ? ` · <span class="dot"></span>${plays}` : "");
    const cls = ["date", d < todayStr ? "past" : "", d === todayStr ? "today" : "", d === current ? "active" : ""].join(" ");
    return `<button class="${cls}" data-d="${d}"><div class="dow">${d===todayStr?"Today":dt.toLocaleDateString(undefined,{weekday:"short"})}</div>` +
      `<div class="day">${dt.toLocaleDateString(undefined,{month:"short",day:"numeric"})}</div><div class="meta">${meta}</div></button>`;
  }).join("");
  document.querySelectorAll(".date").forEach(b => b.onclick = () => { current = b.dataset.d; openId = null; render(); });
  const a = document.querySelector(".date.active"); if (a) a.scrollIntoView({inline:"center", block:"nearest"});
}

function tip(g){
  if (g.result) return "Final";
  if (!g.start) return g.status || "";
  return new Date(g.start).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
}

function teamRow(t, g, side){
  const r = g.result; let sc = "", lost = false;
  if (r) { sc = side==="home" ? r.home_pts : r.away_pts; const other = side==="home" ? r.away_pts : r.home_pts; lost = sc < other; }
  return `<div class="team ${lost?'lost':''}"><img src="${D.logos[t.logo]||""}" alt="" onerror="this.style.visibility='hidden'">` +
    `<span class="nm">${t.short}</span><span class="rec">${t.record||""}</span>${r?`<span class="sc">${sc}</span>`:""}</div>`;
}

function card(g){
  const v = g.vegas, pickShort = g.pick ? g.pick.split(" ").slice(-1)[0] : "";
  const res = g.result ? `<span class="res ${g.result.result}">${g.result.result.toUpperCase()}</span>` : "";
  const badge = g.tier === "No line" ? `<span class="badge t-No">No line yet</span>` : `<span class="badge ${tierCls(g.tier)}">${g.tier}</span>`;
  return `<div class="card ${openId===g.id?'open':''}" data-id="${g.id}">
    <div class="row" tabindex="0" role="button" aria-expanded="${openId===g.id}">
      <div class="teams">${teamRow(g.away,g,"away")}${teamRow(g.home,g,"home")}</div>
      <div class="cell c-vegas"><div class="lbl">Vegas</div><div class="val">${v?v.line:"–"}</div><div class="sub">${tip(g)}</div></div>
      <div class="cell c-model"><div class="lbl">Model</div><div class="val">${g.model.line}</div><div class="sub">${Math.round(Math.max(g.model.p_home,1-g.model.p_home)*100)}% win</div></div>
      <div class="cell edge"><div class="lbl">Edge</div><div class="val">${g.edge!=null?fmt(g.edge):"–"}</div><div class="sub">${g.pick?pickShort+" "+sgn(g.pick_line):""}${res}</div>${g.early?'<span class="flag">Early season</span>':""}</div>
      ${badge}
    </div>
    <div class="detail">${openId===g.id?detail(g):""}</div>
  </div>`;
}

function detail(g){
  const lineOf = x => x == null ? "–" : (x >= 0 ? g.home.short + " " + sgn(-x) : g.away.short + " " + sgn(x));
  const v = g.vegas, m = g.model, a = g.away, h = g.home;
  const ph = m.p_home, pa = 1 - ph;
  const stake = {"2U":"2 units","1U":"1 unit","Lean":"Lean (no stake)","Light lean":"Light lean (no stake)","No play":"No play"}[g.tier] || "No line yet";
  let pick = `<div class="box"><h4>The pick</h4>`;
  if (g.pick) {
    pick += `<div class="pickline">${g.pick} ${sgn(g.pick_line)}</div>
      <div class="kv"><span>Edge vs. line</span><span><b>${fmt(g.edge)} pts</b></span></div>
      <div class="kv"><span>Play</span><span>${stake}</span></div>`;
    if (g.logged) pick += `<div class="kv"><span>Logged at</span><span>${sgn(g.logged.pick===g.home.name?g.logged.line:-g.logged.line)} (${fmt(g.logged.edge)} edge)</span></div>`;
    if (g.result) pick += `<div class="kv"><span>Result</span><span><span class="res ${g.result.result}">${g.result.result.toUpperCase()}</span> ${sgn(g.result.units,2)}u</span></div>
      <div class="kv"><span>Closing line</span><span>${g.result.close!=null?sgn(g.pick===h.name?g.result.close:-g.result.close):"–"}</span></div>
      <div class="kv"><span>Line value (CLV)</span><span>${g.result.clv!=null?sgn(g.result.clv)+" pts":"–"}</span></div>`;
  } else pick += `<div class="note">No betting line posted yet. Check back closer to tip.</div>`;
  pick += `</div>`;

  let lines = `<div class="box"><h4>Lines</h4>`;
  if (v) {
    const openTxt = v.open != null ? (v.open <= 0 ? h.short+" "+sgn(v.open) : a.short+" "+sgn(-v.open)) : "–";
    lines += `<div class="kv"><span>Open</span><span>${openTxt}</span></div>
      <div class="kv"><span>Now${v.book?" ("+v.book+")":""}</span><span><b>${v.line}</b></span></div>
      <div class="kv"><span>Model line</span><span>${m.line}</span></div>
      ${m.market_share>0.05?`<div class="kv"><span>&nbsp;&nbsp;stats only · market view</span><span>${lineOf(m.model_only)} · ${lineOf(m.market_prior)}</span></div>`:""}
      <div class="kv"><span>${a.short} ML · fair</span><span>${v.away_ml!=null?sgn(v.away_ml,0):"–"} · ${m.fair_away}</span></div>
      <div class="kv"><span>${h.short} ML · fair</span><span>${v.home_ml!=null?sgn(v.home_ml,0):"–"} · ${m.fair_home}</span></div>
      ${v.total?`<div class="kv"><span>Total</span><span>${fmt(v.total)}</span></div>`:""}`;
  } else lines += `<div class="kv"><span>Model line</span><span>${m.line}</span></div>`;
  lines += `</div>`;

  const prob = `<div class="box"><h4>Win probability</h4>
    <div class="kv"><span>${a.short}</span><span><b>${Math.round(pa*100)}%</b></span></div>
    <div class="prob"><div style="width:${pa*100}%;background:var(--away-bar)"></div><div style="width:${ph*100}%;background:var(--accent)"></div></div>
    <div class="kv"><span>${h.short}</span><span><b>${Math.round(ph*100)}%</b></span></div>
    <div class="kv"><span>Projected margin</span><span>${(m.margin>=0?h.short:a.short)} by ${fmt(Math.abs(m.margin))}</span></div></div>`;

  const better = (x, y, hi=true) => x==null||y==null ? ["",""] : (hi ? (x>y?["better",""]:x<y?["","better"]:["",""]) : (x<y?["better",""]:x>y?["","better"]:["",""]));
  const rowC = (label, x, y, f, hi=true) => { const [c1,c2] = better(x,y,hi); return `<tr><td>${label}</td><td class="${c1}">${f(x)}</td><td class="${c2}">${f(y)}</td></tr>`; };
  let cmp = "";
  if (a.rating !== undefined) {
    cmp = `<div class="box" style="grid-column:span 2"><h4>Matchup</h4><div class="cmpwrap"><table class="cmp">
      <tr><th></th><th>${a.short}</th><th>${h.short}</th></tr>
      ${rowC("Team rating (pts vs avg)", a.rating, h.rating, x=>sgn(x))}
      ${rowC("Last 10 avg margin", a.form, h.form, x=>sgn(x))}
      ${rowC("Roster strength tonight", a.strength, h.strength, x=>fmt(x))}
      ${rowC("Value missing (injuries)", a.missing, h.missing, x=>fmt(x), false)}
      ${rowC("Days rest", a.rest, h.rest, x=>x==null?"–":(x>=4?"4+":x))}
      <tr><td>Back-to-back</td><td>${a.b2b?"Yes":"No"}</td><td>${h.b2b?"Yes":"No"}</td></tr>
      ${(a.adj||h.adj)?`<tr><td>Your adjustment</td><td>${a.adj?sgn(a.adj):"–"}</td><td>${h.adj?sgn(h.adj):"–"}</td></tr>`:""}
    </table></div></div>`;
  }
  const injList = t => !t.injuries || !t.injuries.length ? `<div class="note" style="margin:0">None reported</div>` :
    `<ul class="inj">${t.injuries.slice(0,8).map(i=>`<li><span>${i.name}${i.value>=8?" ★":""}</span><span class="st ${i.status.replace(/ /g,"-")}">${i.status}</span></li>`).join("")}</ul>`;
  let inj = "";
  if (a.rating !== undefined) inj = `<div class="box"><h4>Injuries</h4><div style="font-weight:600;margin-bottom:2px">${a.short}</div>${injList(a)}<div style="font-weight:600;margin:8px 0 2px">${h.short}</div>${injList(h)}</div>`;
  else if (g.notes_out && (g.notes_out.home || g.notes_out.away)) inj = `<div class="box"><h4>Missing when logged</h4>${g.notes_out.away?`<div class="kv"><span>${a.short}</span><span>${g.notes_out.away}</span></div>`:""}${g.notes_out.home?`<div class="kv"><span>${h.short}</span><span>${g.notes_out.home}</span></div>`:""}</div>`;

  const notes = [];
  if (m.market_share > 0.05) notes.push(`Early-season blend: the model line is ${Math.round(m.market_share*100)}% the market's view of these teams (from every other posted line) and ${Math.round((1-m.market_share)*100)}% the stats model. The market's share fades as teams play games.`);
  if (g.early) notes.push(`Early season: a team has played fewer than ${S.early_season_games} games, so the ratings still lean on last season. Tier thresholds are raised by ${S.early_season_bump} pts.`);
  [a,h].forEach(t => { if (t.adj) notes.push(`Your adjustment: ${t.short} ${sgn(t.adj)} pts${t.adj_note?" (" + t.adj_note + ")":""}.`); });
  if (m.adj) notes.push(`Adjustments move the model line ${sgn(m.adj)} pts toward ${m.adj>0?h.short:a.short}.`);
  const whyG = g.why && g.why.length ? `<div class="box" style="grid-column:1/-1;margin-bottom:12px"><h4>Why</h4><ul class="whyl">${g.why.map(w => `<li>${w}</li>`).join("")}</ul></div>` : "";
  return whyG + `<div class="grid">${pick}${lines}${prob}${cmp}${inj}</div>` + notes.map(n=>`<div class="note">${n}</div>`).join("") +
    `<div class="note">★ = rotation player (value 8+). Roster strength = summed value of the top 8 healthy players.</div>`;
}

function propCard(p){
  const id = "p-" + p.event_id + "-" + p.player_id + "-" + p.market;
  const side = (p.pick === "over" ? "Over " : "Under ") + p.line;
  const myP = p.pick === "over" ? p.p_over : 1 - p.p_over, bookP = p.pick === "over" ? p.mkt_over : 1 - p.mkt_over;
  const badge = p.tier ? `<span class="badge ${tierCls(p.tier)}">${p.tier}</span>` : `<span class="badge t-No">${p.playable ? "No play" : "Info only"}</span>`;
  const at = (p.home ? "vs " : "@ ") + p.opp_abbr;
  return `<div class="card ${openId===id?'open':''}" data-id="${id}">
    <div class="prow" tabindex="0" role="button" aria-expanded="${openId===id}">
      <div class="who"><img src="${D.logos[p.logo]||""}" alt="" onerror="this.style.visibility='hidden'"><div style="min-width:0"><div class="nm">${p.player}</div><div class="mu">${at} · ${p.market_name}</div></div></div>
      <div class="cell c-side"><div class="lbl">${p.market_name}</div><div class="side">${side} <span style="font-size:13px;color:var(--muted)">${sgn(p.price,0)}</span></div>${p.note?`<span class="warn">${p.note.split(" - ")[0]}</span>`:""}${p.flags && p.flags.length?`<span class="warn">⚠ ${p.flags[0].split(":")[0]}</span>`:""}</div>
      <div class="cell c-proj"><div class="lbl">Projection</div><div class="val">${fmt(p.proj)}</div><div class="sub">${pct(myP)} vs book ${pct(bookP)}</div></div>
      <div class="cell edge"><div class="lbl">Edge</div><div class="val">${Math.round(p.edge*100)}%</div>${p.line_share>0.05?'<span class="flag">Early season</span>':""}</div>
      ${badge}
    </div>
    <div class="detail">${openId===id?propDetail(p):""}</div>
  </div>`;
}

function propDetail(p){
  const h = (p.history||[]).slice(-10);
  const top = Math.max(p.line, ...h.map(x=>x.val), 1) * 1.15;
  const bars = h.length ? `<div class="bars">${h.map(x=>`<div class="b"><span>${x.val}</span><i class="${x.val>p.line?'hit':''}" style="height:${Math.max(2, x.val/top*92)}%"></i></div>`).join("")}<div class="ln" style="bottom:${p.line/top*92}%"><em>${p.line}</em></div></div>
    <div class="barlbl">${h.map(x=>`<span>${x.date.slice(5).replace("-","/")}</span>`).join("")}</div>` : `<div class="note">No recent games.</div>`;
  const hits = h.filter(x=>x.val>p.line).length;
  const oppTxt = p.opp_factor >= 1 ? `allows ${Math.round((p.opp_factor-1)*100)}% more than average` : `allows ${Math.round((1-p.opp_factor)*100)}% less than average`;
  const notes = [];
  if (p.line_share > 0.05) notes.push(`Early season: the projection is ${Math.round(p.line_share*100)}% the book's expectation (${fmt(p.proj_market)}) and ${Math.round((1-p.line_share)*100)}% the stats model (${fmt(p.proj_model)}). The book's share fades as he plays games.`);
  if (p.note) notes.push(p.note + ".");
  if (!p.playable) notes.push("Points and combo props are shown for reference only; they didn't hold up in backtests.");
  const whyBox = (p.why && p.why.length) || (p.flags && p.flags.length) ? `<div class="box" style="grid-column:1/-1"><h4>Why</h4>
    ${(p.flags||[]).map(f => `<div class="warnline">⚠ ${f}</div>`).join("")}
    <ul class="whyl">${(p.why||[]).map(w => `<li>${w}</li>`).join("")}</ul></div>` : "";
  return whyBox + `<div class="grid">
    <div class="box" style="grid-column:span 2"><h4>Last ${h.length} games · ${p.market_name} (${hits} of ${h.length} over ${p.line})</h4>${bars}</div>
    <div class="box"><h4>The pick</h4>
      <div class="pickline">${p.pick === "over" ? "Over" : "Under"} ${p.line}</div>
      <div class="kv"><span>Price (${p.book})</span><span>${sgn(p.price,0)}</span></div>
      <div class="kv"><span>Model chance</span><span><b>${pct(p.pick==="over"?p.p_over:1-p.p_over)}</b></span></div>
      <div class="kv"><span>Book chance (no vig)</span><span>${pct(p.pick==="over"?p.mkt_over:1-p.mkt_over)}</span></div>
      <div class="kv"><span>Edge</span><span><b>${Math.round(p.edge*100)}%</b></span></div>
      <div class="kv"><span>Play</span><span>${p.tier||"No play"}</span></div></div>
    <div class="box"><h4>Projection</h4>
      <div class="kv"><span>Projected ${p.market_name.toLowerCase()}</span><span><b>${fmt(p.proj)}</b></span></div>
      <div class="kv"><span>Stats model alone</span><span>${fmt(p.proj_model)}</span></div>
      <div class="kv"><span>Book expects</span><span>${fmt(p.proj_market)}</span></div>
      <div class="kv"><span>Projected minutes</span><span>${fmt(p.proj_min)}</span></div>
      <div class="kv"><span>Open line</span><span>${p.open_line!=null?p.open_line:"–"}</span></div></div>
    <div class="box"><h4>Matchup</h4>
      <div class="kv"><span>${p.opp.split(" ").slice(-1)[0]} defense</span><span>${oppTxt}</span></div>
      <div class="kv"><span>Teammates' minutes out</span><span>${Math.round(p.out_share*240)} min</span></div>
      <div class="kv"><span>Status</span><span>${p.status||"Active"}</span></div></div>
  </div>` + notes.map(n=>`<div class="note">${n}</div>`).join("");
}

function renderProps(){
  $("#markets").hidden = false;
  $("#markets").innerHTML = MARKETS.map(([k,l]) => `<button class="chip ${market===k?'on':''}" data-m="${k}">${l}</button>`).join("");
  document.querySelectorAll("#markets .chip").forEach(c => c.onclick = () => { market = c.dataset.m; openId = null; try { localStorage.setItem("nbaMarket", market); } catch(e) {} render(); });
  const ps = (D.props||[]).filter(p => p.date === current && (market === "all" || p.market === market) && (filter === "all" || UNIT_TIERS.includes(p.tier)))
    .sort((a,b) => TIER_RANK(a.tier||"No play") - TIER_RANK(b.tier||"No play") || (b.playable - a.playable) || b.edge - a.edge);
  const shown = ps.slice(0, 150);
  $("#games").innerHTML = shown.length ? shown.map(propCard).join("") + (ps.length > shown.length ? `<div class="note">Showing the top ${shown.length} of ${ps.length}. Pick a stat above to see more.</div>` : "")
    : `<div class="empty">${(D.props||[]).some(p=>p.date===current) ? "No props match this filter." : "No prop lines posted for this date yet. Books usually post them the day before."}</div>`;
  document.querySelectorAll(".card .prow").forEach(r => {
    const toggle = () => { const id = r.parentElement.dataset.id; openId = openId === id ? null : id; render(); };
    r.onclick = toggle;
    r.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } };
  });
}

function renderTonight(){
  const gs = (byDate[current] || []).filter(isPlay).sort((a,b) => TIER_RANK(a.tier) - TIER_RANK(b.tier) || (b.edge||0) - (a.edge||0));
  const ps = (D.props||[]).filter(p => p.date === current && UNIT_TIERS.includes(p.tier)).sort((a,b) => TIER_RANK(a.tier) - TIER_RANK(b.tier) || b.edge - a.edge);
  const leans = (byDate[current] || []).filter(g => g.tier === "Lean" || g.tier === "Light lean").length
    + (D.props||[]).filter(p => p.date === current && (p.tier === "Lean" || p.tier === "Light lean")).length;
  const dt = dayLabel(current).toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"});
  const tcls = t => t === "2U" || t === "3U" ? "u2" : t === "1U" ? "u1" : "";
  const gSlip = g => `<button class="slipc ${tcls(g.tier)}" data-open="games" data-oid="${g.id}">
      <div style="min-width:0"><div class="ev"><img src="${D.logos[g.away.logo]||""}" alt=""><img src="${D.logos[g.home.logo]||""}" alt="">${g.away.short} @ ${g.home.short} · ${tip(g)}</div>
      <div class="pk">${g.pick.split(" ").slice(-1)[0]} ${sgn(g.pick_line)}<small>spread</small></div></div>
      <span class="badge ${tierCls(g.tier)}">${g.tier}</span>
      <div class="nums"><span><b>${fmt(g.edge)}</b>pt edge</span><span><b>${g.vegas ? g.vegas.line : "–"}</b>Vegas</span><span><b>${g.model.line}</b>model</span>${g.result?`<span class="res ${g.result.result}">${g.result.result.toUpperCase()}</span>`:""}</div>
      ${g.why && g.why.length ? `<div class="whyshort">${g.why[0]}</div>` : ""}</button>`;
  const pSlip = p => `<button class="slipc ${tcls(p.tier)}" data-open="props" data-oid="p-${p.event_id}-${p.player_id}-${p.market}">
      <div style="min-width:0"><div class="ev"><img src="${D.logos[p.logo]||""}" alt="">${p.player} ${p.home ? "vs" : "@"} ${p.opp_abbr}</div>
      <div class="pk">${p.pick === "over" ? "Over" : "Under"} ${p.line} ${p.market_name}<small>${sgn(p.price,0)}</small></div></div>
      <span class="badge ${tierCls(p.tier)}">${p.tier}</span>
      <div class="nums"><span><b>${Math.round(p.edge*100)}%</b>edge</span><span><b>${fmt(p.proj)}</b>projected</span><span><b>${pct(p.pick==="over"?p.p_over:1-p.p_over)}</b>model chance</span>${p.p_honest!=null?`<span><b>${pct(p.p_honest)}</b>realistic</span>`:""}</div>
      ${p.flags && p.flags.length ? `<div class="whyshort warnline">⚠ ${p.flags[0]}</div>` : p.why && p.why.length ? `<div class="whyshort">${p.why[0]}</div>` : ""}</button>`;
  $("#p-tonight").innerHTML = `<div class="heroh"><h2>${current === todayStr ? "Tonight's plays" : dt}</h2><span>${gs.length + ps.length} unit plays${current === todayStr ? " · " + dt : ""}</span></div>
    ${gs.length + ps.length ? `<div class="slips">${gs.map(gSlip).join("")}${ps.map(pSlip).join("")}</div>`
      : `<div class="empty">No 1U+ plays ${current === todayStr ? "tonight" : "this day"}.${leans ? ` The model has ${leans} leans; they're on the Games and Props tabs.` : ""}</div>`}
    ${favoritesHTML()}
    <p class="note">Tap a play for the full breakdown. Early in the season the model leans on the market, so plays are rare until teams have a few games in.</p>`;
  document.querySelectorAll("[data-open]").forEach(b => b.onclick = () => { openId = b.dataset.oid; setTab(b.dataset.open); });
}
function favoritesHTML(){
  // the model's best leans tonight: not official plays, a starting point for your own handicapping
  const gl = (byDate[current] || []).filter(g => (g.tier === "Lean" || g.tier === "Light lean") && g.pick && !g.result)
    .map(g => ({kind: "games", id: g.id, txt: `${g.pick.split(" ").slice(-1)[0]} ${sgn(g.pick_line)}`, sub: `${g.away.short} @ ${g.home.short}`, edge: `${fmt(g.edge)} pts`, score: g.edge / 8, flag: ""}));
  const pl = (D.props||[]).filter(p => p.date === current && p.playable && !p.tier && p.edge >= 0.04)
    .map(p => ({kind: "props", id: `p-${p.event_id}-${p.player_id}-${p.market}`, txt: `${p.player} ${p.pick} ${p.line} ${p.market_name.toLowerCase()}`, sub: `${sgn(p.price,0)} · realistic ${pct(p.p_honest)}`, edge: `${Math.round(p.edge*100)}%`, score: p.edge / 0.09, flag: p.flags && p.flags.length ? "⚠ " : ""}));
  const fav = [...gl, ...pl].sort((a,b) => b.score - a.score).slice(0, 6);
  if (!fav.length) return "";
  return `<div class="heroh" style="margin-top:22px"><h2 style="font-size:22px">Model's favorites</h2><span>Leans, not official plays</span></div>
    <div class="favs">${fav.map(f => `<button class="fav" data-open="${f.kind}" data-oid="${f.id}"><span><b>${f.flag}${f.txt}</b><small>${f.sub}</small></span><em>${f.edge}</em></button>`).join("")}</div>`;
}
function setTab(t){
  view = t; try { localStorage.setItem("nbaTab", t); } catch(e) {}
  document.querySelectorAll(".tab").forEach(b => { b.classList.toggle("on", b.dataset.tab === t); b.setAttribute("aria-current", b.dataset.tab === t ? "page" : "false"); });
  render(); window.scrollTo(0, 0);
}
function render(){
  renderDates();
  $("#dates").hidden = view === "results";
  $("#p-tonight").hidden = view !== "tonight"; $("#p-list").hidden = !(view === "games" || view === "props"); $("#p-results").hidden = view !== "results";
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.tab === view));
  if (view === "tonight") return renderTonight();
  if (view === "results") return;
  document.querySelectorAll("#filter button").forEach(b => b.classList.toggle("on", b.dataset.f === filter));
  $("#legend").innerHTML = view === "props" ? PROP_LEGEND : GAME_LEGEND;
  $("#dayTitle").textContent = dayLabel(current).toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
  if (view === "props") return renderProps();
  $("#markets").hidden = true;
  const gs = (byDate[current] || []).slice().sort((x,y) => {
    const tx = TIER_RANK(x.tier), ty = TIER_RANK(y.tier);
    return tx - ty || (y.edge||0) - (x.edge||0);
  }).filter(g => filter === "all" || isPlay(g));
  const dt = dayLabel(current);
  $("#dayTitle").textContent = dt.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
  $("#games").innerHTML = gs.length ? gs.map(card).join("") : `<div class="empty">${filter==="plays"?"No plays on this date.":"No games."}</div>`;
  document.querySelectorAll(".card .row").forEach(r => {
    const toggle = () => { const id = r.parentElement.dataset.id; openId = openId === id ? null : id; render(); };
    r.onclick = toggle;
    r.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } };
  });
  document.querySelectorAll("#filter button").forEach(b => b.classList.toggle("on", b.dataset.f === filter));
}
function TIER_RANK(t){ return ["2U","1U","Lean","Light lean","No play","No line"].indexOf(t); }
document.querySelectorAll(".tab").forEach(b => b.onclick = () => { openId = null; setTab(b.dataset.tab); });
document.querySelectorAll("#filter button").forEach(b => b.onclick = () => {
  filter = b.dataset.f; try { localStorage.setItem("nbaFilter", filter); } catch(e) {} render();
});

function propSummaryHTML(){
  const rows = D.prop_summary || [];
  if (!rows.length) return `<div class="note">No graded prop plays yet.</div>`;
  return `<div class="sumwrap"><table class="summary"><tr><th>Prop tier</th><th>Record</th><th>Win %</th><th>Units (staked)</th><th>Flat units</th></tr>` +
    rows.map(r => `<tr><td><span class="badge ${tierCls(r.tier)}" style="min-width:0;padding:3px 8px">${r.tier}</span></td><td>${r.w}-${r.l}${r.p?"-"+r.p:""}</td>` +
      `<td>${r.w+r.l?Math.round(100*r.w/(r.w+r.l))+"%":"–"}</td><td>${r.units!=null?sgn(r.units):"–"}</td><td>${sgn(r.flat)}</td></tr>`).join("") + `</table></div>`;
}
(function(){
  if (!D.summary.length) { $("#summary").innerHTML = `<div class="note">No graded game picks yet. Results appear here after games finish and the model runs.</div>` + `<h4 style="margin:14px 0 4px">Player props</h4>` + propSummaryHTML(); return; }
  $("#summary").innerHTML = `<div class="sumwrap"><table class="summary"><tr><th>Tier</th><th>Record</th><th>Win %</th><th>Units (staked)</th><th>Flat units</th><th>Beat close</th><th>Avg CLV</th></tr>` +
    D.summary.map(r => `<tr><td><span class="badge ${tierCls(r.tier)}" style="min-width:0;padding:3px 8px">${r.tier}</span></td><td>${r.w}-${r.l}${r.p?"-"+r.p:""}</td>` +
      `<td>${r.w+r.l?Math.round(100*r.w/(r.w+r.l))+"%":"–"}</td><td>${r.units!=null?sgn(r.units):"–"}</td><td>${sgn(r.flat)}</td>` +
      `<td>${r.beat!=null?Math.round(r.beat*100)+"%":"–"}</td><td>${r.clv!=null?sgn(r.clv,2):"–"}</td></tr>`).join("") + `</table></div>` +
    `<h4 style="margin:14px 0 4px">Player props</h4>` + propSummaryHTML();
})();
render();
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});</script>
</html>

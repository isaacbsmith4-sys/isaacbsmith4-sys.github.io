  passing_yards: { label: "Passing yards", short: "pass yds", kind: "q" },
  pass_tds: { label: "Passing TDs", short: "pass TD", kind: "td" },
  anytime: { label: "Anytime TD", short: "TD", kind: "td" },
};
const PS = { player: null, game: null, market: null, line: null, over: -115, under: -115 };

async function loadProps() {
  if (PROPS) return PROPS;
  try { PROPS = await (await fetch("props.json", { cache: "no-cache" })).json(); }
  catch (e) { PROPS = { games: {}, meta: {}, error: true }; }
  return PROPS;
}

function playerRow(p, gid) {
  const pj = p.proj, bits = [];
  if (pj.passing_yards != null) bits.push(`<span><b>${pj.passing_yards.toFixed(0)}</b> pass yds</span>`);
  if (pj.receptions != null) bits.push(`<span><b>${pj.receptions.toFixed(1)}</b> rec</span>`);
  if (pj.receiving_yards != null) bits.push(`<span><b>${pj.receiving_yards.toFixed(0)}</b> rec yds</span>`);
  if (pj.rushing_yards != null) bits.push(`<span><b>${pj.rushing_yards.toFixed(0)}</b> rush yds</span>`);
  if (p.td.pass != null) bits.push(`<span><b>${p.td.pass.toFixed(1)}</b> pass TD</span>`);
  const st = p.status ? ` <span class="pill ${p.status === "Questionable" ? "Q" : p.status}">${p.status}</span>` : "";
  const dk = Object.entries(p.lines || {}).map(([mk, l]) => l.tier
    ? `<span class="tag ${PTIER[l.tier].cls}">${PTIER[l.tier].label} · ${l.side} ${l.line} ${PMKT[mk].short}</span>`
    : `<span>DK ${PMKT[mk].short} ${l.line}: ${l.side[0]} ${pct(l.prob)}</span>`).join("");
  if (dk) bits.push(`<span style="flex-basis:100%;display:flex;flex-wrap:wrap;gap:4px 12px">${dk}</span>`);
  return `<div class="prow" onclick="openProp('${gid}','${p.id}')">
    <span class="nm">${p.name} <small>${p.pos} · ${p.team}</small>${st}</span>
    <b class="mono" title="Anytime TD">${p.td.anytime != null && p.pos !== "QB" ? pct(p.td.anytime) + " TD" : p.td.anytime != null ? pct(p.td.anytime) + " rush TD" : ""}</b>
    <span class="pj">${bits.join("")}</span></div>`;
}

function propsGame(gid, open) {
  const ps = PROPS.games[gid] || [], m = PROPS.meta[gid] || {};
  if (!ps.length) return "";
  const teams = [m.away, m.home];
  return `<div class="pgame"><h3 onclick="this.parentElement.classList.toggle('open'); this.nextElementSibling.style.display = this.parentElement.classList.contains('open') ? '' : 'none'">
      ${m.away} @ ${m.home} <small>Week ${m.week} · ${ps.length} players ▾</small></h3>
    <div style="${open ? "" : "display:none"}">${teams.map(t => `<div class="day" style="margin:10px 0 0">${t}</div>` +
      ps.filter(p => p.team === t).map(p => playerRow(p, gid)).join("")).join("")}</div></div>`;
}

const propsFooter = () => `<p class="note">Projections are averages; a player goes under his average more often than over because of occasional big games,
  and the over/under chances account for that. Tap a player to enter a DraftKings line. Backtest (${PROPS.backtest.receiving_yards?.seasons}):
  receiving yards miss ${PROPS.backtest.receiving_yards?.mae} on average vs ${PROPS.backtest.receiving_yards?.recent_avg_mae} using the player's recent average;
  anytime TD odds were well calibrated. Players listed Out are left off.</p>`;

// Props by week: graded results for past games, picks for games still to come
let PROPS_WEEK = null;
function propWeeks() {
  const ws = new Set(Object.keys(PROPS.record_weeks || {}).map(Number));
  Object.values(PROPS.meta || {}).forEach(m => ws.add(m.week));
  return [...ws].sort((a, b) => a - b);
}

async function renderProps() {
  await loadProps();
  const weeks = propWeeks();
  if (!weeks.length) { $("#props").innerHTML = `<div class="empty">No player props yet.</div>`; return; }
  // default: the earliest week that still has games to play, else the latest week
  const upcomingWeeks = Object.values(PROPS.meta || {}).map(m => m.week);
  if (PROPS_WEEK == null || !weeks.includes(PROPS_WEEK))
    PROPS_WEEK = upcomingWeeks.length ? Math.min(...upcomingWeeks) : weeks[weeks.length - 1];
  const nowWeek = upcomingWeeks.length ? Math.min(...upcomingWeeks) : null;
  const pills = `<div class="week-nav" id="propweeks" style="margin-top:8px">${weeks.map(w =>
    `<button class="${w === PROPS_WEEK ? "on" : ""}" onclick="PROPS_WEEK=${w}; renderProps()">Week ${w}${w === nowWeek ? '<span class="dot"></span>' : ""}</button>`).join("")}</div>`;
  const ids = Object.keys(PROPS.games).filter(id => PROPS.meta[id]?.week === PROPS_WEEK);
  $("#props").innerHTML = pills + propLeansPanel(PROPS_WEEK) +
    (ids.length ? `<div class="day">All players · week ${PROPS_WEEK}</div>` + ids.map(id => propsGame(id, false)).join("") : "") + propsFooter();
  const on = $("#propweeks .on");
  if (on) $("#propweeks").scrollLeft = Math.max(0, on.offsetLeft - ($("#propweeks").clientWidth - on.offsetWidth) / 2);
}

// "Opened 20.5 → now 44.5", with a news warning when the line moved a lot
function moveNote(l) {
  if (l.open == null || l.open === l.line) return "";
  const big = Math.abs(l.line - l.open) / Math.max(0.5, l.open) > 0.35;
  return ` · opened ${l.open}${big ? ` <span class="tag lock">big line move · check news</span>` : ""}`;
}

// Tiered prop picks vs DraftKings lines, plus the season record by tier
const recTxt = (r) => r ? `${r.wins}–${r.losses}${r.pushes ? "–" + r.pushes : ""}` : "0–0";
const recPct = (r) => r && r.wins + r.losses ? ` (${(r.wins / (r.wins + r.losses) * 100).toFixed(1)}%)` : "";
function propLeansPanel(week) {
  const picks = [];
  for (const [gid, ps] of Object.entries(PROPS.games)) {
    if (week != null && PROPS.meta[gid]?.week !== week) continue;
    for (const p of ps) for (const [mk, l] of Object.entries(p.lines || {}))
      if (l.tier) picks.push({ gid, p, mk, l });
  }
  const R = PROPS.record || {};
  // this week's record and graded picks
  const WR = (PROPS.record_weeks || {})[week];
  const wkUnits = WR ? (WR.play3?.units_net || 0) + (WR.play1?.units_net || 0) : 0;
  const wkLines = WR ? PTIER_ORDER.map(t => `<div class="line"><span>${PTIER[t].label}s</span><b class="mono">${recTxt(WR[t])}${recPct(WR[t])}${
    WR[t]?.units_risked ? ` · <span class="${WR[t].units_net >= 0 ? "good" : "bad"}">${fmtU(WR[t].units_net)}</span>` : ""}</b></div>`).join("") : "";
  const done = (PROPS.graded || []).filter(g => g.week === week);
  const doneGroups = PTIER_ORDER.map(t => {
    const xs = done.filter(g => g.tier === t);
    if (!xs.length) return "";
    const w = xs.filter(g => g.result === "win").length, l = xs.filter(g => g.result === "loss").length;
    return `<div class="tier-group ${t}"><div class="day">${PTIER[t].label}s · graded ${w}–${l}</div>` + xs.map(g =>
      `<div class="line"><span>${g.name} <small>${g.team} · ${PMKT[g.market].label} · actual <b>${g.actual}</b></small></span>
        <span class="pick-col"><b class="mono ${g.result === "win" ? "good" : g.result === "loss" ? "bad" : ""}">${g.side} ${g.line}</b>
        <small class="mono">${g.result}${g.units ? " · " + fmtU(g.units_net) : ""}</small></span></div>`).join("") + `</div>`;
  }).join("");
  const recLines = PTIER_ORDER.map(t => `<div class="line"><span>${PTIER[t].label}s</span><b class="mono">${recTxt(R[t])}${recPct(R[t])}${
    R[t]?.units_risked ? ` · <span class="${R[t].units_net >= 0 ? "good" : "bad"}">${fmtU(R[t].units_net)}</span>` : ""}</b></div>`).join("");
  const groups = PTIER_ORDER.map(t => {
    const xs = picks.filter(x => x.l.tier === t).sort((a, b) => b.l.prob - a.l.prob);
    if (!xs.length) return "";
    return `<div class="tier-group ${t}"><div class="day">${PTIER[t].label}s · ${xs.length}</div>` + xs.map(x =>
      `<div class="line" style="cursor:pointer" onclick="openProp('${x.gid}','${x.p.id}','${x.mk}')">
        <span>${x.p.name} <small>${x.p.team} · ${PMKT[x.mk].label} · proj ${x.l.proj}${moveNote(x.l)}</small>
          ${x.p.alerts?.length ? `<small class="alert-line" style="display:block">⚠ ${x.p.alerts.join(" · ")}</small>` : ""}</span>
        <span class="pick-col"><b class="mono ${t.startsWith("play") ? "good" : ""}">${x.l.side} ${x.l.line}</b><small class="mono">${pct(x.l.prob)}</small></span></div>`).join("") + `</div>`;
  }).join("");
  const tiers = PROPS.tiers.map(t => `<b>${PTIER[t.tier].label}</b>: ${t.rule}`).join("; ");
  return `<div class="review"><h2>Week ${week} props</h2>
    ${WR ? `<div class="day" style="margin:4px 0 2px">Week ${week} record · unit plays <span class="${wkUnits >= 0 ? "good" : "bad"}">${fmtU(wkUnits)}</span></div>${wkLines}`
         : `<p class="note">Nothing graded yet this week.</p>`}
    ${groups ? `<div class="day" style="margin:14px 0 2px">Still to play</div>${groups}` : ""}
    ${doneGroups ? `<div class="day" style="margin:14px 0 2px">Graded</div>${doneGroups}` : ""}
    ${!groups && !doneGroups ? `<p class="note">No picks for this week yet. DraftKings lines usually post during the week and fill in on game day.</p>` : ""}
    <div class="day" style="margin:16px 0 2px">${PROPS.season} season (graded at −110)</div>${recLines}
    <p class="note">Tiers: ${tiers}. Passing yards get no tier (they lost in the backtest). Unit plays need the filters because, in this season's results,
      bigger chances alone didn't win more often, but lines under 45 that moved away from our side did (in both halves of the season).
      Weeks before tracking began are graded against DraftKings' last pre-game line from ESPN, with each week projected only from earlier games.
      ${PROPS.lines_source}: the record assumes −110, but DraftKings props are often −115 to −125, which would cut the profit a lot (the 1u tier would be near break-even at −120).
      Rules were set on this season's results, so expect the future to be somewhat worse.</p></div>`;
}

function gvProps(g) {
  if (!PROPS) { loadProps().then(() => GV.tab === "props" && renderGame()); return `<div class="empty">Loading…</div>`; }
  if (!PROPS.games[g.id]) return `<div class="empty">${g.final ? "Props are shown for upcoming games." : "No player projections for this game yet."}</div>`;
  return propsGame(g.id, true) + propsFooter();
}

function propMarkets(p) {
  const ms = Object.keys(p.proj).filter(k => p.proj[k] != null);
  if (p.td.pass != null) ms.push("pass_tds");
  if (p.td.anytime != null && p.pos !== "QB") ms.push("anytime");
  return ms;
}

function openProp(gid, pid, mk) {
  const p = PROPS.games[gid].find(x => x.id === pid);
  PS.player = p; PS.game = gid;
  PS.market = mk || Object.keys(p.lines || {})[0] || propMarkets(p)[0];
  PS.line = defaultLine(p, PS.market); PS.over = -110; PS.under = -110; PS.mode = "model";
  renderProp();
  $("#sheet-bg").classList.add("on"); $("#sheet").classList.add("on");
  document.body.style.overflow = "hidden";
}

// Outcome-to-projection quantiles for this market and projection size
function propDist(mk, proj) {
  const d = PROPS.dists[mk];
  return d.q[d.edges.filter(e => proj > e).length];
}

function defaultLine(p, mk) {
  if (p.lines?.[mk]) return p.lines[mk].line;  // DraftKings' current line
  if (mk === "anytime") return 0.5;
  if (mk === "pass_tds") return 1.5;
  const v = p.proj[mk];  // books set lines near the median, below the average
  const med = propDist(mk, v)[50] * v;
  return Math.max(0.5, Math.floor(med) + 0.5);
}

// Calibrated: DraftKings' implied projection moved 15% toward ours (when a DK line exists)
function propCenter(p, mk) {
  const raw = mk === "pass_tds" ? p.td.pass : p.proj[mk], l = p.lines?.[mk];
  return PS.mode === "cal" && l?.cal_proj != null ? l.cal_proj : raw;
}
function propProbs(p, mk, line) {
  if (mk === "anytime") return Calc.poissonOver((p.td.rec || 0) + (p.td.rush || 0), line);
  if (mk === "pass_tds") return Calc.poissonOver(propCenter(p, mk), line);
  const c = propCenter(p, mk);
  return Calc.propProbs(propDist(mk, c), c, line);
}

function renderProp() {
  const p = PS.player, mk = PS.market, info = PMKT[mk], c = p.ctx;
  const pr = propProbs(p, mk, PS.line);
  const side = (lab, win, lose, odds) => {
    let ev = null; try { ev = Calc.expectedValue(win, pr.push, odds); } catch (e) {}
    return `<div class="verdict ${ev > 0.005 ? "pos" : ev < -0.005 ? "neg" : ""}">
      <div class="row" style="margin:0"><b style="font-size:16px">${lab} ${PS.line}</b><b class="mono ${evCls(ev)}" style="font-size:16px">${fmtEv(ev)} EV</b></div>
      <div class="row"><span>Chance</span><b class="mono">${fmtPct(win)}${pr.push > 0.001 ? " (push " + fmtPct(pr.push) + ")" : ""}</b></div>
      <div class="row"><span>Fair odds</span><b class="mono">${fairOdds(win, lose)}</b></div></div>`;
  };
  const projTxt = info.kind === "td"
    ? (mk === "anytime" ? `${pct(p.td.anytime)} to score (expected ${((p.td.rec || 0) + (p.td.rush || 0)).toFixed(2)} TDs)` : `${p.td.pass.toFixed(2)} passing TDs expected`)
    : `${p.proj[mk].toFixed(1)} average · ${(propDist(mk, p.proj[mk])[50] * p.proj[mk]).toFixed(1)} median`;
  const opp = PROPS.meta[PS.game].home === p.team ? PROPS.meta[PS.game].away : PROPS.meta[PS.game].home;
  const rel = (x) => x == null ? "—" : `${x > 0 ? "+" : ""}${(x * 100).toFixed(0)}%`;
  const manRate = PROPS.coverage.man_rate?.[opp];
  const mz = c.tprr_man != null ? `<div class="line"><span>Vs man / vs zone (2023–${PROPS.coverage.season})</span>
      <b class="mono">${c.yprr_man} / ${c.yprr_zone} yds per route · ${(c.tprr_man * 100).toFixed(0)}% / ${(c.tprr_zone * 100).toFixed(0)}% targets per route</b></div>
    <div class="line"><span>${opp} man coverage rate (${PROPS.coverage.season})</span><b class="mono">${manRate != null ? pct(manRate) : "—"} · league ${pct(PROPS.coverage.league_man)}</b></div>` : "";
  $("#sheet").innerHTML = `
    <div class="grab"></div>
    <h3>${p.name} <small style="color:var(--muted);font-size:13px;font-weight:500">&nbsp;${p.pos} · ${p.team} vs ${opp}</small><button onclick="closeAlt()">×</button></h3>
    <div class="seg" style="flex-wrap:wrap">${propMarkets(p).map(k => `<button class="${k === mk ? "on" : ""}"
      onclick="PS.market='${k}'; PS.line=defaultLine(PS.player,'${k}'); renderProp()">${PMKT[k].label}</button>`).join("")}</div>
    ${p.lines?.[mk] ? `<div class="seg" style="margin-top:8px">
      <button class="${PS.mode === "model" ? "on" : ""}" onclick="PS.mode='model'; renderProp()">Stats model</button>
      <button class="${PS.mode === "cal" ? "on" : ""}" onclick="PS.mode='cal'; renderProp()">Lean on DraftKings</button></div>
      ${p.lines[mk].tier ? `<p style="margin:8px 0 0"><span class="tag ${PTIER[p.lines[mk].tier].cls}">${PTIER[p.lines[mk].tier].label} · ${p.lines[mk].side} ${p.lines[mk].line}</span></p>` : ""}
      <p class="note" style="margin:6px 0 0">DraftKings line <b>${p.lines[mk].line}</b>${p.lines[mk].open != null && p.lines[mk].open !== p.lines[mk].line ? ` (opened ${p.lines[mk].open})` : ""}
      · updated ${new Date(p.lines[mk].updated).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })}. Odds aren't in the feed: enter DraftKings' prices.</p>` : ""}
    <p class="note" style="margin:6px 0 0">Model projection: <b>${projTxt}</b>${p.cfac ? ` (includes ${Math.round((p.cfac - 1) * 100)}% more carries from injured teammates)` : ""}${p.tfac ? ` (includes ${Math.round((p.tfac - 1) * 100)}% more targets from injured teammates)` : ""}${p.opp_def_out && (p.opp_def_out[0] + p.opp_def_out[1]) ? ` · ${p.opp_def_out[0] + p.opp_def_out[1]} opposing defensive starter(s) out, factored in` : ""}</p>
    ${p.alerts?.length ? `<div class="heads"><h2>⚠ Heads up</h2>${p.alerts.map(a => `<div class="item">${a}</div>`).join("")}</div>` : ""}
    <div class="calc" style="grid-template-columns:1fr 1fr 1fr">
      <label>Line<input type="number" step="0.5" inputmode="decimal" value="${PS.line}" onchange="PS.line=parseFloat(this.value)||0.5; renderProp()"></label>
      <label>Over odds<input type="number" step="5" value="${PS.over}" onchange="const v=parseInt(this.value); PS.over=(v>=100||v<=-100)?v:-115; renderProp()"></label>
      <label>Under odds<input type="number" step="5" value="${PS.under}" onchange="const v=parseInt(this.value); PS.under=(v>=100||v<=-100)?v:-115; renderProp()"></label>
    </div>
    ${side(mk === "anytime" ? "Yes, over" : "Over", pr.over, pr.under, PS.over)}
    ${side(mk === "anytime" ? "No, under" : "Under", pr.under, pr.over, PS.under)}
    <div class="review"><h2>Matchup</h2>
      ${c.targets ? `<div class="line"><span>Targets per game · target share</span><b class="mono">${c.targets} · ${(c.tgt_share * 100).toFixed(0)}%</b></div>
      <div class="line"><span>Yards per target · avg depth</span><b class="mono">${c.ypt} · ${c.adot}</b></div>` : ""}
      ${c.carries ? `<div class="line"><span>Carries per game · share · yds/carry</span><b class="mono">${c.carries} · ${(c.car_share * 100).toFixed(0)}% · ${c.ypc}</b></div>` : ""}
      <div class="line"><span>${opp} vs ${p.pos}s this season (yds per ${p.pos === "QB" ? "attempt" : "target"}, vs league)</span>
        <b class="mono">${rel(p.pos === "QB" ? c.def_ypa_rel : c.def_ypt_rel)}</b></div>
      ${p.pos !== "QB" && p.pos !== "WR" ? `<div class="line"><span>${opp} run defense (yds per carry vs league)</span><b class="mono">${rel(c.def_ypc_rel)}</b></div>` : ""}
      <div class="line"><span>${p.team} implied points</span><b class="mono">${c.team_pts}</b></div>
      ${mz}
    </div>
    <p class="note">${mz ? "Man/zone is shown for context only: in the backtest it didn't improve projections, and a receiver's edge vs man barely carries from one season to the next. " : ""}
      Chances come from how real players finished relative to their projections (2024–26), so they include duds and big games.
      ${p.lines?.[mk] ? (PS.mode === "cal" ? "'Lean on DraftKings' moves DraftKings' line only 15% toward the model; it's here for comparison." : "Stats-model chances, which beat DraftKings' lines in this season's backtest. Very big gaps can still mean the model is missing news (injury returns, role changes).") : ""}</p>`;
}

// ---------------------------------------------------------------- alt lines
const KEY_MARGINS = new Set([3, 7, 10, 6, 4, 14, 1]);
const ALT = { game: null, side: null, mode: "cal", line: null, odds: -110 };

const marginPmf = (mu) => Calc.pmfAt(DATA.margin_pmf, mu);

// One distribution drives spread, moneyline and alt lines. "cal" = market line
// moved k toward the model (what the backtest supports); "model" = model only.
function expectedMargin(g, mode) {
  const mkt = g.market?.spread ?? g.vegas_spread;
  return mode === "model" ? g.model_spread : Calc.blend(mkt, g.model_spread, DATA.margin_pmf.calibration_k);
}
// Calibrated total = the market-aware totals model (Vegas total + what the stats add)
function expectedTotal(g, mode) {
  return mode === "model" || g.ou_total == null ? g.model_total : g.ou_total;
}

// line is from the bet side's view: -3.5 means the side gives 3.5
const coverProbs = (g, side, line, mode) =>
  Calc.spreadProbs(marginPmf(expectedMargin(g, mode)), DATA.margin_pmf.min_margin, side === g.home, line);

const payout = (odds) => Calc.profitPerUnit(odds);
function fairOdds(win, lose) {
  const f = Calc.fairOdds(win, lose);
  return f == null ? "—" : f > 0 ? `+${f}` : `${f}`;
}
const sideVegasLine = (g, side) => g.vegas_spread == null ? 0 : (side === g.home ? -g.vegas_spread : g.vegas_spread);
const fmtLn = (l) => l === 0 ? "PK" : `${l > 0 ? "+" : "−"}${Math.abs(l).toFixed(1)}`;

function openAlt(id) {
  const g = Object.values(DATA.weeks).flat().find(x => x.id === id);
  ALT.game = g;
  ALT.side = g.ats_pick || g.pick;
  ALT.mode = g.vegas_spread == null ? "model" : "cal";
  ALT.line = sideVegasLine(g, ALT.side);
  ALT.odds = -110;
  renderAlt();
  $("#sheet-bg").classList.add("on"); $("#sheet").classList.add("on");
  document.body.style.overflow = "hidden";
}
function closeAlt() {
  $("#sheet-bg").classList.remove("on"); $("#sheet").classList.remove("on");
  document.body.style.overflow = "";
}

function renderAlt() {
  const g = ALT.game, side = ALT.side, base = sideVegasLine(g, side);
  const c = coverProbs(g, side, ALT.line, ALT.mode);
  const ev = c.win * payout(ALT.odds) - c.lose;           // per 1 unit risked
  const cls = ev > 0.005 ? "pos" : ev < -0.005 ? "neg" : "";
  const lines = [];
  for (let l = base - 7; l <= base + 7 + 1e-9; l += 0.5) lines.push(Math.round(l * 2) / 2);
  const rows = lines.map(l => {
    const p = coverProbs(g, side, l, ALT.mode);
    const key = Number.isInteger(l) && KEY_MARGINS.has(Math.abs(l));
    return `<tr class="${key ? "key" : ""} ${l === ALT.line ? "sel" : ""} ${l === base ? "vegas" : ""}" onclick="ALT.line=${l}; renderAlt()">
      <td class="mono"><b>${side} ${fmtLn(l)}</b></td>
      <td class="mono">${(p.win * 100).toFixed(1)}%</td>
      <td class="mono">${p.push > 0.0005 ? (p.push * 100).toFixed(1) + "%" : "—"}</td>
      <td class="mono">${fairOdds(p.win, p.lose)}</td></tr>`;
  }).join("");
  const mu = expectedMargin(g, ALT.mode);
  $("#sheet").innerHTML = `
    <div class="grab"></div>
    <h3>${g.away} @ ${g.home} <button onclick="closeAlt()">×</button></h3>
    <div class="seg">${[g.away, g.home].map(t =>
      `<button class="${t === side ? "on" : ""}" onclick="ALT.side='${t}'; ALT.line=sideVegasLine(ALT.game,'${t}'); renderAlt()">${t}</button>`).join("")}</div>
    <div class="seg">
      <button class="${ALT.mode === "cal" ? "on" : ""}" ${g.vegas_spread == null ? "disabled" : ""} onclick="ALT.mode='cal'; renderAlt()">Calibrated</button>
      <button class="${ALT.mode === "model" ? "on" : ""}" onclick="ALT.mode='model'; renderAlt()">Model only</button>
    </div>
    <div class="calc">
      <label>Your line (${side})<input type="number" step="0.5" inputmode="decimal" value="${ALT.line}"
        onchange="ALT.line=Math.round(parseFloat(this.value)*2)/2||0; renderAlt()"></label>
      <label>DraftKings odds<input type="number" step="5" inputmode="numeric" value="${ALT.odds}"
        onchange="const v=parseInt(this.value); ALT.odds=(v>=100||v<=-100)?v:-110; renderAlt()"></label>
    </div>
    <div class="verdict ${cls}">
      <div class="big mono ${ev > 0 ? "good" : ev < 0 ? "bad" : ""}">${ev >= 0 ? "+" : "−"}${Math.abs(ev * 100).toFixed(1)}% EV</div>
      <div class="row"><span>Win / push / lose</span><b class="mono">${(c.win * 100).toFixed(1)} / ${(c.push * 100).toFixed(1)} / ${(c.lose * 100).toFixed(1)}%</b></div>
      <div class="row"><span>Fair odds at this line</span><b class="mono">${fairOdds(c.win, c.lose)}</b></div>
      <div class="row"><span>Profit per $100 bet, long run</span><b class="mono">${ev >= 0 ? "+" : "−"}$${Math.abs(ev * 100).toFixed(2)}</b></div>
    </div>
    <table class="alt-table">
      <tr><th>Line</th><th>Cover</th><th>Push</th><th>Fair odds</th></tr>
      ${rows}
    </table>
    <p class="note">Expected margin: ${g.home} ${fmtLn(-mu)} (${ALT.mode === "cal"
      ? `Vegas line moved ${Math.round(DATA.margin_pmf.calibration_k * 100)}% toward the model — what the backtest supports`
      : "model's line only — the backtest says this overstates value"}).
      Probabilities use real NFL final margins, so key numbers like 3 and 7 count. If DraftKings' price is better than the fair odds, the bet has value.</p>`;
}

document.querySelectorAll("nav.tabs button").forEach(btn => btn.addEventListener("click", () => {
  if (btn.dataset.view === "props") renderProps();
}));
document.querySelectorAll("nav.tabs button").forEach(btn => btn.onclick = () => {
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("on", b === btn));
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === "v-" + btn.dataset.view));
  $("#weeknav").style.display = btn.dataset.view === "picks" ? "" : "none";
  window.scrollTo({ top: 0 });
});

async function load() {
  try {
    const res = await fetch("predictions.json", { cache: "no-cache" });
    DATA = await res.json();
  } catch (e) {
    $("#games").innerHTML = `<div class="empty">Couldn't load predictions. Check your connection.</div>`;
    return;
  }
  const wks = Object.keys(DATA.weeks).map(Number);
  curWeek = wks.includes(DATA.week) ? DATA.week : Math.max(...wks);
  const r = DATA.season_record;
  const nPlays = r.plays_wins + r.plays_losses + r.plays_pushes;
  $("#record").innerHTML = `Plays <b>${r.plays_wins}–${r.plays_losses}${r.plays_pushes ? "–" + r.plays_pushes : ""}</b> · <b class="${nPlays < 30 ? "small-n" : r.units_net >= 0 ? "good" : "bad"}">${fmtU(r.units_net)}</b><span class="n-badge">n=${nPlays}</span>`;
  const when = new Date(DATA.generated_at);
  $("#updated").textContent = "Updated " + when.toLocaleString("en-US", { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  renderWeekNav(); renderGames(); renderRecords(); renderRanks(); renderAbout();
  const deep = location.hash.match(/^#game=(.+)$/);
  if (deep) openGame(deep[1]);
}
load();

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>

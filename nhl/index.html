<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NHL Model">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>NHL Model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* One screen per tab (Plays / Games / Results / How it works). Plays leads with tonight's unit
   plays as bet slips. Tab bar at the bottom on phones, on top on desktop. Tokens follow the
   Best Plays hub so every app looks like one family; this app's accent is the NHL teal. */
:root{
  color-scheme:dark;
  --bg:#0d0f15; --surface:#151821; --surface2:#1c2030; --sunk:#10131b; --line:#272c3d; --line-hi:#3b4258;
  --ink:#eef0f6; --ink2:#b4bbcc; --muted:#808a9f; --faint:#586178;
  --gold:#e3b04b; --gold-ink:#f2c66a; --gold-bg:rgba(227,176,75,.13); --gold-line:rgba(227,176,75,.5); --on-gold:#1a1305;
  --win:#3ddc84; --win-bg:rgba(61,220,132,.14); --loss:#ff6b6b; --loss-bg:rgba(255,107,107,.14); --push-bg:#272c3d;
  --acc:#3dd6c6; --acc-bg:rgba(61,214,198,.12); --acc-line:rgba(61,214,198,.45); --on-acc:#04211e;
  --lean:#8fb4ff; --lean-bg:rgba(143,180,255,.12);
  --font-display:"Big Shoulders Display","Oswald","Arial Narrow",system-ui,sans-serif;
  --font-body:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;
  --tabbar-h:64px;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#f3f1ec; --surface:#ffffff; --surface2:#f8f6f1; --sunk:#ece9e2; --line:#e0dcd2; --line-hi:#c9c3b5;
  --ink:#16181f; --ink2:#3d4252; --muted:#6a7080; --faint:#9a9fac;
  --gold:#a8750a; --gold-ink:#8a5f00; --gold-bg:rgba(201,141,18,.12); --gold-line:rgba(168,117,10,.45); --on-gold:#fffaf0;
  --win:#14864a; --win-bg:rgba(20,134,74,.11); --loss:#c8323a; --loss-bg:rgba(200,50,58,.1); --push-bg:#e6e2d9;
  --acc:#0f8f84; --acc-bg:rgba(15,143,132,.1); --acc-line:rgba(15,143,132,.4); --on-acc:#ffffff;
  --lean:#2f62d8; --lean-bg:rgba(47,98,216,.09);
}}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f3f1ec; --surface:#ffffff; --surface2:#f8f6f1; --sunk:#ece9e2; --line:#e0dcd2; --line-hi:#c9c3b5;
  --ink:#16181f; --ink2:#3d4252; --muted:#6a7080; --faint:#9a9fac;
  --gold:#a8750a; --gold-ink:#8a5f00; --gold-bg:rgba(201,141,18,.12); --gold-line:rgba(168,117,10,.45); --on-gold:#fffaf0;
  --win:#14864a; --win-bg:rgba(20,134,74,.11); --loss:#c8323a; --loss-bg:rgba(200,50,58,.1); --push-bg:#e6e2d9;
  --acc:#0f8f84; --acc-bg:rgba(15,143,132,.1); --acc-line:rgba(15,143,132,.4); --on-acc:#ffffff;
  --lean:#2f62d8; --lean-bg:rgba(47,98,216,.09);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);-webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px));overflow-x:hidden}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-block:18px 32px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;padding-top:env(safe-area-inset-top, 0px)}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo-mark{width:36px;height:36px;border-radius:10px;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;font:900 15px var(--font-display);letter-spacing:.04em;flex:0 0 36px}
.logo h1{margin:0;font:900 26px/1 var(--font-display);letter-spacing:.03em;text-transform:uppercase}
.logo small{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px}
.season-chip{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;flex:0 0 auto}
.season-chip b{font:800 22px var(--font-display)}
.season-chip span{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.07em;text-transform:uppercase}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom, 0px);padding-left:env(safe-area-inset-left, 0px);padding-right:env(safe-area-inset-right, 0px)}
.tabs-in{max-width:860px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabbar-h)}
.tab{background:none;border:0;cursor:pointer;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.02em;min-width:0}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--acc)}
@media (min-width:760px){
  body{padding-bottom:0}
  .tabs{position:sticky;top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top, 0px)}
  .tabs-in{height:52px;grid-template-columns:repeat(5,auto);justify-content:start;gap:4px;padding-left:max(16px, env(safe-area-inset-left, 0px))}
  .tab{flex-direction:row;gap:8px;font-size:14px;padding:0 14px;border-bottom:2px solid transparent}
  .tab.on{border-bottom-color:var(--acc)}
  .tab svg{width:18px;height:18px}
  .top{padding-top:0}
}
.view[hidden]{display:none!important}
.sec{margin-top:26px}
.sec:first-child{margin-top:4px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sec-h h2{margin:0;font:800 22px/1 var(--font-display);text-transform:uppercase;letter-spacing:.03em;text-wrap:balance}
.sec-h span{color:var(--muted);font-size:13px}
.note{color:var(--muted);font-size:13px;max-width:70ch;margin:10px 0 0}
.empty{color:var(--muted);text-align:center;padding:26px 16px;background:var(--surface);border:1px dashed var(--line-hi);border-radius:14px}
.empty b{display:block;color:var(--ink);font:800 20px var(--font-display);text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px}
.linkbtn{background:none;border:0;color:var(--acc);font-weight:800;cursor:pointer;padding:10px 0;min-height:44px}

/* logos and team marks */
.lg{width:26px;height:26px;object-fit:contain;flex:0 0 26px}
.lg.sm{width:18px;height:18px;flex-basis:18px}
.mu{display:flex;align-items:center;gap:6px;min-width:0;font-size:13px;color:var(--ink2);font-weight:700}
.mu span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* bet slip (hero) */
.slips{display:grid;gap:12px}
@media (min-width:760px){ .slips{grid-template-columns:repeat(2,minmax(0,1fr))} }
.slip{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.slip::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--c, var(--acc))}
.slip.top{border-color:var(--gold-line);background:linear-gradient(180deg,var(--gold-bg),transparent 55%),var(--surface)}
.slip-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 0 18px}
.slip-body{padding:8px 16px 12px 18px}
.slip-sel{font:900 32px/1.02 var(--font-display);text-transform:uppercase;letter-spacing:.01em;overflow-wrap:anywhere}
.slip-sel .px{font:700 18px var(--font-body);color:var(--muted);text-transform:none;margin-left:6px;white-space:nowrap}
.slip-sub{font-size:12.5px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 10px}
.perf{position:relative;height:0;border-top:2px dashed var(--line);margin:0 14px}
.perf::before,.perf::after{content:"";position:absolute;top:-10px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.perf::before{left:-24px}.perf::after{right:-24px}
.slip.top .perf::before,.slip.top .perf::after{border-color:var(--gold-line)}
.slip-foot{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:12px 16px 14px 18px}
.kv{min-width:0}
.kv b{display:block;font:800 20px/1.1 var(--font-display);letter-spacing:.02em;white-space:nowrap}
.kv span{display:block;font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.bar{height:6px;border-radius:4px;background:var(--sunk);margin:2px 18px 14px;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--acc)}
.bar em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink2)}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--acc)}
.units{font:800 15px var(--font-display);letter-spacing:.04em;padding:4px 10px;border-radius:7px;background:var(--sunk);color:var(--ink);white-space:nowrap}
.units.u2{background:var(--gold);color:var(--on-gold)}
.units.u1{background:var(--acc-bg);color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc-line)}
.units.lean{background:var(--lean-bg);color:var(--lean)}
.units.light{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line-hi)}
.res{font:800 14px var(--font-display);letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:7px;white-space:nowrap}
.res.win{background:var(--win-bg);color:var(--win)} .res.loss{background:var(--loss-bg);color:var(--loss)}
.res.push{background:var(--push-bg);color:var(--muted)} .res.pending{background:var(--sunk);color:var(--muted)}
.tag{font-size:10.5px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 6px;letter-spacing:.03em;white-space:nowrap}
.gk{white-space:nowrap}
.gk i{font-style:normal;font-weight:800}
.gk i.Confirmed{color:var(--win)} .gk i.Expected{color:var(--gold-ink)} .gk i.Projected{color:var(--loss)}

/* record strip + form */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.strip > div{background:var(--surface);padding:10px 12px;min-width:0}
.form{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap;align-items:center}
.form i{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font:800 12px var(--font-display);font-style:normal}
.form i.win{background:var(--win-bg);color:var(--win)} .form i.loss{background:var(--loss-bg);color:var(--loss)} .form i.push{background:var(--push-bg);color:var(--muted)}
.form small{color:var(--muted);font-size:12px;margin-left:6px}

/* compact slips */
.mini{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-bottom:8px;min-height:44px}
.mini .sel{font:800 19px/1.1 var(--font-display);text-transform:uppercase;overflow-wrap:anywhere;min-width:0}
.mini .sel .px{font:600 14px var(--font-body);color:var(--muted);text-transform:none}
.mini .meta{grid-column:1/2;font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center;min-width:0}
.mini .side{display:flex;flex-direction:column;align-items:flex-end;gap:5px;grid-row:1/3;grid-column:2}
.mini .side small{font-size:12px;color:var(--muted);font-weight:700}
details.fold{margin-top:14px}
details.fold > summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:0 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;font-weight:800;color:var(--ink2)}
details.fold > summary::-webkit-details-marker{display:none}
details.fold > summary::after{content:"+";color:var(--muted);font-size:18px}
details.fold[open] > summary{margin-bottom:10px}
details.fold[open] > summary::after{content:"–"}

/* games */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);color:var(--ink2);padding:6px 12px;border-radius:12px;cursor:pointer;min-height:48px;min-width:64px;text-align:center;line-height:1.15}
.chip b{display:block;font:800 16px var(--font-display);letter-spacing:.02em}
.chip span{display:block;font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.chip .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-left:4px;vertical-align:2px}
.chip.today{border-color:var(--acc-line)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.on span{color:var(--bg);opacity:.75}
.scope{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;margin:10px 0 14px}
.scope button{flex:1;background:none;border:0;cursor:pointer;padding:8px 10px;min-height:40px;border-radius:9px;font-size:13.5px;font-weight:800;color:var(--muted)}
.scope button.on{background:var(--ink);color:var(--bg)}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.gcard.play{border-color:var(--gold-line)}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px 6px;font-size:12.5px;color:var(--muted);font-weight:700}
.ghead .bt{display:flex;gap:6px;align-items:center}
.gmatch{padding:0 14px 10px;display:flex;flex-direction:column;gap:6px}
.gteam{display:grid;grid-template-columns:4px 26px minmax(0,1fr) auto;align-items:center;gap:10px;min-width:0}
.gteam .cb{width:4px;height:26px;border-radius:2px;background:var(--c)}
.gteam .nm{min-width:0}
.gteam .nm b{display:block;font:800 21px/1.05 var(--font-display);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gteam .nm span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gteam .sc{font:900 26px var(--font-display);min-width:20px;text-align:right}
.gteam.lost .nm b,.gteam.lost .sc{color:var(--muted)}
.glines{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line)}
.glines > div{background:var(--surface2);padding:9px 12px;min-width:0}
.glines .lab{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.glines .now{font:800 18px/1.2 var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.glines .was{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.glines .hit{color:var(--gold-ink)}
details.gmore{border-top:1px solid var(--line)}
details.gmore summary{cursor:pointer;padding:0 14px;min-height:44px;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:800;color:var(--ink2);list-style:none}
details.gmore summary::-webkit-details-marker{display:none}
details.gmore summary::after{content:"+";color:var(--muted);font-size:18px}
details.gmore[open] summary::after{content:"–"}
.gbody{padding:0 14px 14px;display:grid;gap:14px}
.gbody h4{margin:0 0 6px;font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.picks2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pk{background:var(--sunk);border-radius:12px;padding:10px 12px;min-width:0}
.pk .t{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:4px}
.pk .t small{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pk .s{font:800 19px/1.1 var(--font-display);text-transform:uppercase}
.pk .s .px{font:600 13px var(--font-body);color:var(--muted);text-transform:none}
.pk .d{font-size:12px;color:var(--muted);margin-top:4px}
.pk .d b{color:var(--ink2)}
.cmp{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.cmp th,.cmp td{padding:7px 4px;border-top:1px solid var(--line);text-align:right}
.cmp th{font-size:10.5px;color:var(--muted);font-weight:800;letter-spacing:.07em;text-transform:uppercase;border-top:0}
.cmp td:first-child,.cmp th:first-child{text-align:left;color:var(--muted)}
.cmp td.b{color:var(--ink);font-weight:800}
.cmp small.op{display:block;font-size:11.5px;color:var(--muted)}
.gnotes{display:flex;flex-wrap:wrap;gap:6px}
.gnotes span{font-size:12px;color:var(--ink2);background:var(--sunk);border-radius:8px;padding:4px 8px}

/* results */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.kpi.hero{border-color:var(--gold-line);background:linear-gradient(180deg,var(--gold-bg),transparent),var(--surface)}
.kpi h3{margin:0 0 8px;font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.kpi.hero h3{color:var(--gold-ink)}
.kpi .big{font:900 36px/1 var(--font-display)}
.kpi .row{display:flex;gap:12px;margin-top:8px;color:var(--ink2);font-size:13px;flex-wrap:wrap}
.kpi .row b{color:var(--ink);font-weight:800}
.twrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
table.t th,table.t td{padding:9px 10px;text-align:right;white-space:nowrap;border-top:1px solid var(--line)}
table.t th{font-size:10.5px;color:var(--muted);font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-top:0}
table.t td:first-child,table.t th:first-child{text-align:left}
table.t tr.grp td{background:var(--surface2);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left}
.pos{color:var(--win)} .neg{color:var(--loss)}
.dayh{font:800 15px var(--font-display);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:14px 0 6px;display:flex;justify-content:space-between}

/* how it works */
.how{display:grid;gap:12px}
.how section{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.how h3{margin:0 0 6px;font:800 19px var(--font-display);text-transform:uppercase;letter-spacing:.03em}
.how p{margin:0 0 8px;color:var(--ink2);font-size:14px;max-width:68ch}
.how p:last-child{margin-bottom:0}
.how ul{margin:0;padding-left:18px;color:var(--ink2);font-size:14px}
.how li{margin-bottom:4px}

@media (max-width:520px){
  .glines .now{font-size:16px}
  .slip-sel{font-size:28px}
  .slip-foot{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:12px}
  .strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi.hero{grid-column:1/-1}
  .kpi .big{font-size:30px}
  .picks2{grid-template-columns:1fr}
  .logo h1{font-size:23px}
  .hs{display:none}
  table.t th,table.t td{padding:9px 8px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

const S = D.settings;

const unitChip = t => UNIT.includes(t) ? `<span class="units ${t==="1U"?"u1":"u2"}">${t}</span>` : t === "Lean" ? `<span class="units lean">Lean</span>` : t === "Light lean" ? `<span class="units light">Light lean</span>` : "";
const resChip = r => r ? `<span class="res ${r}">${r}</span>` : "";

// every bet (moneyline and total) on every game, with its result once graded
function betsOf(g){
  const out = [], r = g.result || {};
  if (g.ml && g.ml.pick) out.push({g, kind:"ml", tier:g.ml.tier, sel:`${g.ml.short} ML`, price:g.ml.price, prob:g.ml.prob, mkt:g.ml.mkt, edge:g.ml.edge,
    result:r.ml || null, units:r.ml_units, team:g.ml.pick === g.home.name ? g.home : g.away});
  if (g.tot && g.tot.pick) out.push({g, kind:"tot", tier:g.tot.tier, sel:`${g.tot.pick === "over" ? "Over" : "Under"} ${g.tot.line}`, price:g.tot.price,

const ALL = D.games.flatMap(betsOf);

const byDate = {};

const dates = Object.keys(byDate).sort();
const nextDay = dates.find(d => d >= todayStr) || dates[dates.length-1];
const matchup = (g, abbr) => `${logo(g.away,"sm")}<span>${abbr ? g.away.abbr + " @ " + g.home.abbr : g.away.short + " @ " + g.home.short}</span>${logo(g.home,"sm")}`;
const when = g => g.result ? "Final" : g.state === "in" ? "Live" : (tipTime(g.start) || g.status || "");
const goalieTxt = g => [g.away, g.home].map(t => { const q = t.goalie || {}; return q.name ? `<span class="gk">${q.name.split(" ").slice(-1)[0]}${q.status ? ` <i class="${q.status}">${q.status === "Confirmed" ? "✓" : q.status === "Expected" ? "exp." : "proj."}</i>` : ""}</span>` : ""; }).filter(Boolean).join(" vs ");

$("#updated").textContent = "Updated " + D.updated;

const graded = ALL.filter(b => isUnit(b) && (b.result === "win" || b.result === "loss" || b.result === "push"));
const unitsWon = graded.reduce((a,b) => a + (b.units || 0) * STAKE[b.tier], 0);

$("#seasonUnits").className = "num " + (unitsWon >= 0 ? "pos" : "neg");

function slip(b){
  const g = b.g, top = b.tier !== "1U";
  const fair = b.prob ? (b.prob >= .5 ? -100*b.prob/(1-b.prob) : 100*(1-b.prob)/b.prob) : null;
  const c = b.team ? color(b.team) : "var(--acc)";
  return `<article class="slip ${top ? "top" : ""}" style="--c:${c}">
    <div class="slip-top"><div class="mu">${matchup(g, true)}<span style="color:var(--muted);font-weight:600">· ${when(g)}</span></div>${g.result ? resChip(b.result) : unitChip(b.tier)}</div>
    <div class="slip-body"><div class="slip-sel">${b.sel}<span class="px">${am(b.price)}</span></div>
      <div class="slip-sub">${goalieTxt(g) ? `<span>Goalies: ${goalieTxt(g)}</span>` : ""}${g.backtest ? `<span class="tag">Backtest</span>` : ""}</div></div>

  if (recent.length) {
    const w = graded.filter(b => b.result === "win").length, l = graded.filter(b => b.result === "loss").length;
    h += `<div class="sec"><div class="sec-h"><h2>Recent results</h2><span>${w}-${l} on unit plays · <span class="${unitsWon>=0?"pos":"neg"}">${sgn(unitsWon)}u</span></span></div>
      <div class="form">${recent.map(b => `<i class="${b.result}" title="${b.sel}">${b.result[0].toUpperCase()}</i>`).join("")}<small>newest first</small></div>
      <button class="linkbtn" data-go="results">All results →</button></div>`;
  }
  $("#v-plays").innerHTML = h;
}

// ---------- GAMES
let gDay = store.get("nhlDay", ""); if (!dates.includes(gDay) || gDay < todayStr && nextDay >= todayStr) gDay = nextDay;
let gScope = store.get("nhlScope", "all");
function gameCard(g){
  const v = g.vegas || {}, m = g.model, r = g.result, bets = betsOf(g);
  const best = gameTier(g), play = UNIT.includes(best);
  const team = (t, side) => { const sc = r ? (side === "home" ? r.home_goals : r.away_goals) : null, other = r ? (side === "home" ? r.away_goals : r.home_goals) : null;
    const q = t.goalie || {};
    return `<div class="gteam ${r && sc < other ? "lost" : ""}" style="--c:${color(t)}"><i class="cb"></i>${logo(t)}<div class="nm"><b>${t.short}</b><span>${[t.record, q.name ? "G: " + q.name + (q.status && !r ? " (" + q.status.toLowerCase() + ")" : "") : ""].filter(Boolean).join(" · ")}</span></div>${r ? `<span class="sc">${sc}</span>` : ""}</div>`; };
  const mlPick = g.ml && g.ml.pick, totPick = g.tot && g.tot.pick, mlUnit = mlPick && UNIT.includes(g.ml.tier);
  const mlNow = v.home_ml != null ? (v.home_ml <= v.away_ml ? `${g.home.abbr} ${am(v.home_ml)}` : `${g.away.abbr} ${am(v.away_ml)}`) : "–";
  const mlWas = v.open_home_ml != null ? `open ${v.open_home_ml <= v.open_away_ml ? g.home.abbr + " " + am(v.open_home_ml) : g.away.abbr + " " + am(v.open_away_ml)}` : "fav. price";
  const totNow = v.total != null ? `O/U ${v.total}` : "–";
  const totWas = v.total != null ? `O ${am(v.over_price)} · U ${am(v.under_price)}` : "";
  const fav = m.p_home >= .5 ? g.home : g.away, favP = Math.max(m.p_home, 1 - m.p_home);
  const model = `<div><div class="lab">Model</div><div class="now ${play ? "hit" : ""}">${fav.abbr} ${pct(favP)}</div><div class="was">total ${fmt(m.total,2)}</div></div>`;
  let body = "";
  const pk = b => `<div class="pk"><div class="t"><small>${b.kind === "ml" ? "Moneyline" : "Total"}</small>${r ? resChip(b.result) : unitChip(b.tier) || `<span class="tag">No play</span>`}</div>
    <div class="s">${b.sel} <span class="px">${am(b.price)}</span></div>
    <div class="d">Model <b>${pct(b.prob)}</b> · market <b>${pct(b.mkt)}</b> · edge <b>${sgn(b.edge*100,1)}%</b></div>
    ${r && b.units != null ? `<div class="d">${sgn(b.units,2)}u per unit${b.kind === "ml" && r.ml_clv != null ? ` · line moved ${sgn(r.ml_clv*100,1)}%` : b.kind === "tot" && r.total_clv != null ? ` · line moved ${sgn(r.total_clv*100,1)}%` : ""}</div>` : ""}</div>`;
  body += bets.length ? `<div><h4>The picks</h4><div class="picks2">${bets.map(pk).join("")}</div></div>` : "";
  const ln = [];
  if (v.home_ml != null) ln.push(["Moneyline", `${g.away.abbr} ${am(v.away_ml)} / ${g.home.abbr} ${am(v.home_ml)}`, v.open_home_ml != null ? `${am(v.open_away_ml)} / ${am(v.open_home_ml)}` : "–"]);
  if (r && r.close_home_ml != null) ln.push(["Closing ML", `${am(r.close_away_ml)} / ${am(r.close_home_ml)}`, ""]);
  if (v.puck_line != null) ln.push(["Puck line", `${g.home.abbr} ${sgn(v.puck_line)} (${am(v.home_pl_price)})`, ""]);
  if (v.total != null) ln.push(["Total", `${v.total} (O ${am(v.over_price)} / U ${am(v.under_price)})`, v.open_total != null ? v.open_total : "–"]);
  ln.push(["Model fair ML", `${g.away.abbr} ${m.fair_away} / ${g.home.abbr} ${m.fair_home}`, ""]);
  body += `<div><h4>Lines${v.book ? " · " + v.book : ""}</h4><table class="cmp">${ln.map(x => `<tr><td>${x[0]}</td><td>${x[1]}${x[2] && x[2] !== "–" ? `<small class="op">open ${x[2]}</small>` : ""}</td></tr>`).join("")}</table></div>`;
  const a = g.away, h = g.home;
  if (a.rating !== undefined) {
    const row = (lab, x, y, f, hi=true) => { const bx = x != null && y != null && (hi ? x > y : x < y), by = x != null && y != null && (hi ? y > x : y < x);
      return `<tr><td>${lab}</td><td class="${bx?"b":""}">${f(x)}</td><td class="${by?"b":""}">${f(y)}</td></tr>`; };
    const ga = a.goalie || {}, gh = h.goalie || {};
    body += `<div><h4>Matchup</h4><table class="cmp"><tr><th></th><th>${a.abbr}</th><th>${h.abbr}</th></tr>
      ${row("Win chance", 1 - m.p_home, m.p_home, x => pct(x))}
      ${row("Goalie saved vs avg / gm", ga.q, gh.q, x => sgn(x,2))}
      ${row("Team rating (goals)", a.rating, h.rating, x => sgn(x,2))}
      ${row("Goals for / gm", a.gf, h.gf, x => fmt(x,2))}
      ${row("Goals against / gm", a.ga, h.ga, x => fmt(x,2), false)}
      ${row("Shots for / gm", a.sf, h.sf, x => fmt(x,1))}
      ${row("Shots against / gm", a.sa, h.sa, x => fmt(x,1), false)}
      ${row("Last 10 margin", a.form, h.form, x => sgn(x,2))}
      <tr><td>Rest</td><td>${a.b2b ? "Back-to-back" : (a.rest >= 3 ? "3+ days" : a.rest + " days")}</td><td>${h.b2b ? "Back-to-back" : (h.rest >= 3 ? "3+ days" : h.rest + " days")}</td></tr>
      ${(a.adj || h.adj) ? `<tr><td>Your adjustment</td><td>${a.adj ? sgn(a.adj) : "–"}</td><td>${h.adj ? sgn(h.adj) : "–"}</td></tr>` : ""}
    </table></div>`;
  }
  const notes = [];
  if (g.backtest) notes.push("Backtest: played before live tracking began; priced at the opening line");
  else if (g.early) notes.push("Early season: ratings still lean on last season");
  if (m.market_share > .05) notes.push(`${Math.round(m.market_share*100)}% market view (early-season blend)`);
  [a, h].forEach(t => { if (t.goalie && t.goalie.status === "Projected" && !r && a.rating !== undefined) notes.push(`${t.short}: starter not announced, usual starter assumed`); });
  [a, h].forEach(t => { if (t.adj) notes.push(`Your adjustment: ${t.short} ${sgn(t.adj)} goals${t.adj_note ? " (" + t.adj_note + ")" : ""}`); });
  if (g.logged && !r) notes.push(`Logged ${g.logged.at.slice(5)} at ${g.logged.ml_pick.split(" ").slice(-1)[0]} ${am(g.logged.ml_price)}`);
  if (notes.length) body += `<div class="gnotes">${notes.map(n => `<span>${n}</span>`).join("")}</div>`;
  return `<article class="gcard ${play ? "play" : ""}">
    <div class="ghead"><span>${when(g)}</span><span class="bt">${g.backtest ? `<span class="tag">Backtest</span>` : ""}${unitChip(best)}</span></div>
    <div class="gmatch">${team(g.away,"away")}${team(g.home,"home")}</div>
    <div class="glines"><div><div class="lab">Moneyline</div><div class="now ${mlUnit ? "hit" : ""}">${mlPick ? `${g.ml.pick === g.home.name ? g.home.abbr : g.away.abbr} ${am(g.ml.price)}` : mlNow}</div><div class="was">${mlPick ? `edge ${sgn(g.ml.edge*100,1)}%` : mlWas}</div></div>
      <div><div class="lab">Total</div><div class="now ${totPick && UNIT.includes(g.tot.tier) ? "hit" : ""}">${totNow}</div><div class="was">${totPick ? `${g.tot.pick} · ${sgn(g.tot.edge*100,1)}%` : totWas}</div></div>
      ${model}</div>
    <details class="gmore"><summary>Breakdown</summary><div class="gbody">${body}</div></details>
  </article>`;
}
function renderGames(){
  const chips = dates.map(d => { const gs = byDate[d], n = gs.flatMap(betsOf).filter(isUnit).length;
    const dt = fromYmd(d);
    return `<button class="chip ${d === gDay ? "on" : ""} ${d === todayStr ? "today" : ""}" data-d="${d}"><span>${d === todayStr ? "Today" : dt.toLocaleDateString(undefined,{weekday:"short"})}</span><b>${dt.toLocaleDateString(undefined,{month:"short",day:"numeric"})}${n ? `<i class="dot" aria-label="${n} plays"></i>` : ""}</b></button>`; }).join("");
  let gs = (byDate[gDay] || []).slice().sort((x,y) => RANK(gameTier(x)) - RANK(gameTier(y)) || (x.start || "").localeCompare(y.start || ""));
  const all = gs.length;
  if (gScope === "plays") gs = gs.filter(g => UNIT.includes(gameTier(g)));
  $("#v-games").innerHTML = `<div class="chips" id="dchips">${chips}</div>
    <div class="scope"><button data-s="all" class="${gScope==="all"?"on":""}">All games · ${all}</button><button data-s="plays" class="${gScope==="plays"?"on":""}">Unit plays</button></div>
    ${gs.length ? gs.map(gameCard).join("") : `<div class="empty"><b>${gScope === "plays" ? "No unit plays" : "No games"}</b>${gScope === "plays" ? "Nothing on this date clears the 1U bar." : "No NHL games on this date."}</div>`}`;
  document.querySelectorAll("#dchips .chip").forEach(b => b.onclick = () => { gDay = b.dataset.d; store.set("nhlDay", gDay); renderGames(); });
  document.querySelectorAll("#v-games .scope button").forEach(b => b.onclick = () => { gScope = b.dataset.s; store.set("nhlScope", gScope); renderGames(); });
  const on = document.querySelector("#dchips .chip.on"); if (on) on.scrollIntoView({inline:"center", block:"nearest"});
}

// ---------- RESULTS
function renderResults(){
  const rec = kind => { const r = D.summary.filter(x => x.kind === kind && UNIT.includes(x.tier));
    return {w: r.reduce((a,x)=>a+x.w,0), l: r.reduce((a,x)=>a+x.l,0), p: r.reduce((a,x)=>a+x.p,0), u: r.reduce((a,x)=>a+(x.units||0),0)}; };
  const m = rec("Moneyline"), t = rec("Total");
  const beat = D.summary.filter(r => r.beat != null), n = beat.reduce((a,r)=>a+r.w+r.l,0);
  const bw = beat.reduce((a,r)=>a+r.beat*(r.w+r.l),0)/Math.max(1,n);
  const bt = D.games.filter(g => g.backtest && g.result).length, live = D.games.filter(g => !g.backtest && g.result).length;
  const cls = x => x >= 0 ? "pos" : "neg";
  let h = `<div class="sec"><div class="sec-h"><h2>This season</h2><span>${live} live · ${bt} backtest games</span></div>
    <div class="kpis">
      <div class="kpi hero"><h3>Moneyline unit plays</h3><div class="big">${m.w}-${m.l}</div><div class="row"><span><b class="${cls(m.u)}">${sgn(m.u)}u</b> staked</span><span>${m.w+m.l ? Math.round(100*m.w/(m.w+m.l)) : 0}% wins</span></div></div>
      <div class="kpi"><h3>Total unit plays</h3><div class="big">${t.w}-${t.l}${t.p ? "-" + t.p : ""}</div><div class="row"><span><b class="${cls(t.u)}">${sgn(t.u)}u</b> staked</span></div></div>
      <div class="kpi"><h3>Beat the close</h3><div class="big">${n ? Math.round(bw*100) + "%" : "–"}</div><div class="row"><span>of all picks, when the line moved</span></div></div>
    </div></div>`;
  if (D.summary.length) {
    h += `<div class="sec"><div class="sec-h"><h2>By tier</h2><span>1 unit per bet; staked = 2U counts 2</span></div><div class="twrap"><table class="t">
      <tr><th>Tier</th><th>Record</th><th class="hs">Win %</th><th>Staked</th><th class="hs">Flat</th><th>Beat close</th></tr>` +
      ["Moneyline","Total"].map(k => `<tr class="grp"><td colspan="6">${k === "Total" ? "Totals" : "Moneylines"}</td></tr>` + D.summary.filter(r => r.kind === k).map(r =>
        `<tr><td>${unitChip(r.tier) || `<span class="tag">No play</span>`}</td><td>${r.w}-${r.l}${r.p ? "-" + r.p : ""}</td><td class="hs">${r.w+r.l ? Math.round(100*r.w/(r.w+r.l)) + "%" : "–"}</td>
        <td class="${r.units == null ? "" : cls(r.units)}">${r.units != null ? sgn(r.units) + "u" : "–"}</td><td class="hs ${cls(r.flat)}">${sgn(r.flat)}</td><td>${r.beat != null ? Math.round(r.beat*100) + "%" : "–"}</td></tr>`).join("")).join("") +
      `</table></div></div>`;
  }
  const done = ALL.filter(b => (isUnit(b) || LEANS.includes(b.tier)) && b.result).sort((a,b) => (b.g.date + (b.g.start||"")).localeCompare(a.g.date + (a.g.start||"")));
  if (done.length) {
    let last = "", list = "";
    done.filter(isUnit).slice(0, 40).forEach(b => { if (b.g.date !== last) { const day = done.filter(x => isUnit(x) && x.g.date === b.g.date);
      const u = day.reduce((a,x) => a + (x.units||0)*STAKE[x.tier], 0);
      list += `<div class="dayh"><span>${dayName(b.g.date)}</span><span class="${cls(u)}">${sgn(u)}u</span></div>`; last = b.g.date; } list += mini(b); });
    h += `<div class="sec"><div class="sec-h"><h2>Unit plays</h2><span>Newest first</span></div>${list || `<div class="empty"><b>None yet</b>Graded unit plays show up here.</div>`}</div>`;
  } else h += `<div class="sec"><div class="empty"><b>No graded picks yet</b>Results appear after games finish and the model runs.</div></div>`;
  const B = D.backtest;
  if (B) {
    const tbl = (b, beatMap) => `<div class="twrap"><table class="t"><tr><th>Tier</th><th>Bets</th><th class="hs">Win %</th><th>ROI</th><th>Staked</th>${beatMap ? "<th>Line moved</th>" : ""}</tr>` +
      b.tiers.map(r => `<tr><td>${unitChip(r.tier)}</td><td>${r.bets}</td><td class="hs">${r.w+r.l ? Math.round(100*r.w/(r.w+r.l)) + "%" : "–"}</td><td class="${cls(r.roi)}">${sgn(r.roi*100)}%</td><td class="${r.units == null ? "" : cls(r.units)}">${r.units != null ? sgn(r.units) + "u" : "–"}</td>${beatMap ? `<td>${beatMap[r.tier] != null ? Math.round(beatMap[r.tier]*100) + "%" : "–"}</td>` : ""}</tr>`).join("") + `</table></div>`;
    h += `<details class="fold"><summary>Past seasons backtest (${B.seasons})</summary>
      <div class="sec-h"><h2 style="font-size:18px">Moneyline vs. opening lines</h2><span>${B.ml_open.games.toLocaleString()} games since Oct 2023</span></div>${tbl(B.ml_open, B.ml_open_beat_close)}
      <div class="sec-h" style="margin-top:16px"><h2 style="font-size:18px">Moneyline vs. closing lines</h2><span>${B.ml_close.games.toLocaleString()} games</span></div>${tbl(B.ml_close)}
      <div class="sec-h" style="margin-top:16px"><h2 style="font-size:18px">Totals vs. closing lines</h2><span>${B.tot_close.games.toLocaleString()} games</span></div>${tbl(B.tot_close)}
      <p class="note">Each season was predicted by a model trained only on earlier seasons. Against closing lines there's no moneyline edge; against opening lines 1U and 2U made a small profit. Totals showed no edge. Updated ${B.generated}.</p></details>`;
  }
  $("#v-results").innerHTML = h;
}

// ---------- HOW IT WORKS
function renderHow(){
  const T = S.ml_tiers, TT = S.total_tiers, p = x => Math.round(x*100) + "%";
  $("#v-how").innerHTML = `<div class="how">
    <section><h3>What the model does</h3><p>For every game it estimates each team's chance to win and the expected total goals, from team strength (an Elo rating), goal and shot differential, last-10 form, rest and back-to-backs, and the starting goalie's recent save record.</p>
      <p>It then compares its chance with the market's chance (the betting price with the bookmaker's cut removed). <b>Edge</b> is the difference.</p></section>
    <section><h3>Tiers</h3><table class="cmp"><tr><th>Tier</th><th>Moneyline edge</th><th>Total edge</th></tr>
      <tr><td>${unitChip("2U")}</td><td>${p(T.two_unit)}+</td><td>${p(TT.two_unit)}+</td></tr>
      <tr><td>${unitChip("1U")}</td><td>${p(T.one_unit)}+</td><td>${p(TT.one_unit)}+</td></tr>
      <tr><td>${unitChip("Lean")}</td><td>${p(T.lean)}+</td><td>${p(TT.lean)}+</td></tr>
      <tr><td>${unitChip("Light lean")}</td><td>${p(T.light_lean)}+</td><td>${p(TT.light_lean)}+</td></tr></table>
      <p class="note">Only 1U and 2U are staked plays (they get the gold dot and the Plays screen). Leans are tracked with no stake. Totals tiers are set high on purpose: past seasons showed no totals edge.</p></section>
    <section><h3>Reading a slip</h3><ul>
      <li><b>Model / Market</b>: chance the bet wins, by the model and by the market (no vig).</li>
      <li><b>Fair price</b>: the odds the model thinks are fair. Better odds than this = value.</li>
      <li><b>The bar</b>: teal fill is the model's chance; the line marks the market's.</li>
      <li><b>Goalies</b>: ✓ confirmed, exp. = expected, proj. = not announced yet (the model assumes the usual starter, so the pick can change).</li></ul></section>
    <section><h3>How it's done so far</h3><p>Against closing lines the model doesn't show an edge, same as the NBA model. Against opening lines (2023-24 on) 1U and 2U plays made a small profit and the line moved toward the model's side about 3 times in 4. Picks are logged the first time a line is seen, usually the day before, so bet early.</p>
      <p><b>Beat the close</b> = the line moved toward the pick after it was logged. It's a faster, less noisy sign of a real edge than win-loss.</p></section>
    <section><h3>Backtest tag</h3><p>Games from earlier this season, before live tracking began on Oct 19, were picked afterwards by a model trained only on past seasons and priced at the opening line. They count in the record and are tagged "Backtest".</p></section>
    <section><h3>Updates</h3><p>The model runs in the cloud at 2 AM, 9 AM, 3 PM and 6:30 PM ET. Starting goalies are usually confirmed by the afternoon run. Last update: ${D.updated}.</p></section>
  </div>`;
}

// ---------- tabs
let view = store.get("nhlTab", "plays");
if (!["plays","games","results","how"].includes(view)) view = "plays";
function show(v){
  view = v; store.set("nhlTab", v);
  document.querySelectorAll("button.tab").forEach(b => { b.classList.toggle("on", b.dataset.v === v); b.setAttribute("aria-current", b.dataset.v === v ? "page" : "false"); });
  document.querySelectorAll(".view").forEach(s => s.hidden = s.id !== "v-" + v);
  ({plays: renderPlays, games: renderGames, results: renderResults, how: renderHow})[v]();
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { show(b.dataset.go); window.scrollTo(0, 0); });
}
document.querySelectorAll("button.tab").forEach(b => b.onclick = () => { show(b.dataset.v); window.scrollTo(0, 0); });
show(view);
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});</script>
</html>

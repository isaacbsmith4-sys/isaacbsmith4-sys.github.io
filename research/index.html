    ${block(aT, A, hT, H, aL, hL)}${block(hT, H, aT, A, hL, aL)}
    <p class="note">${statWin === "season" ? "Small number = league rank (1st = best; for pace, plays, pass rates 1st = most). " : "Ranks show on the Season view. "}${(S.notes || []).map(esc).join(" ")}</p>`;
}

// model vs market: cover / win / total probabilities from the model, fair prices and EV at the posted price
function normCdf(x){ const t = 1 / (1 + 0.2316419 * Math.abs(x)); const d = 0.3989423 * Math.exp(-x*x/2); const p = d*t*(0.3193815 + t*(-0.3565638 + t*(1.781478 + t*(-1.821256 + t*1.330274)))); return x > 0 ? 1 - p : p; }
const profitOf = o => o == null ? null : o < 0 ? 100 / -o : o / 100;
function fairPrice(pw, pl){ if (!(pw > 0) || !(pl > 0)) return null; const b = pl / pw; return b >= 1 ? "+" + Math.round(b*100) : "-" + Math.round(100/b); }
function evAt(pw, pp, o){ const b = profitOf(o); return b == null ? null : pw * b - (1 - pw - pp); }
function pmfRow(tab, mu){ const mus = tab.mus, step = mus[1] - mus[0]; mu = Math.max(mus[0], Math.min(mus[mus.length-1], mu)); const i = Math.min(Math.floor((mu - mus[0]) / step), mus.length - 2); const f = (mu - mus[i]) / step; return tab.p[i].map((x, k) => (1 - f) * x + f * tab.p[i+1][k]); }
function modelProbs(G, u, side, line, total){
  const g = G.games.find(x => x.id === u.id);
  if (!g) return null;
  const home = side === "home";
  if (sport === "NBA"){
    const ms = g.model && g.model.spread; if (ms == null) return null;
    const muTeam = home ? -ms : ms, sd = G.spread_sd || 12.5;
    const cover = 1 - normCdf((-line - muTeam) / sd);
    const pw = g.model.home_win_prob != null ? (home ? g.model.home_win_prob : 1 - g.model.home_win_prob) : null;
    return {cover, push: 0, win: pw, tie: 0, over: null, src: "normal curve around the model's line (sd 12.5 pts, the NBA model's own setting)"};
  }
  const mp = G.margin_pmf, tp = G.total_pmf;
  if (!mp || g.model_spread == null) return null;
  const vegas = g.vegas_spread ?? g.model_spread;
  const mu = vegas + mp.calibration_k * (g.model_spread - vegas);
  const row = pmfRow(mp, mu);
  let win = 0, push = 0, mw = 0, mt = 0;
  row.forEach((x, k) => { const m = (mp.min_margin + k) * (home ? 1 : -1); const r = m + line; if (Math.abs(r) < 1e-9) push += x; else if (r > 0) win += x; if (m > 0) mw += x; else if (m === 0) mt += x; });
  let over = null, opush = 0;
  if (tp && g.model_total != null && total != null){
    const tl = g.total_line ?? total, tmu = tl + tp.calibration_k * (g.model_total - tl);
    const tr = pmfRow(tp, tmu); over = 0;
    tr.forEach((x, k) => { const t = tp.min_total + k; if (Math.abs(t - total) < 1e-9) opush += x; else if (t > total) over += x; });
  }
  return {cover: win, push, win: mw, tie: mt, over, opush, src: "the NFL model's own outcome table (market line moved part of the way toward the model, as the NFL app does)"};
}
function modelEdgeHTML(G, T, u){
  const D = gameDetail, g = G.games.find(x => x.id === u.id);

  const side = D.side, home = side === "home";
  const line = D.bet === "side" ? D.spread : (u.spread == null ? 0 : home ? u.spread : -u.spread);
  const total = D.total ?? u.total;
  const P = modelProbs(G, u, side, line, total);

  const tm = shortTeam(home ? u.home : u.away), op = shortTeam(home ? u.away : u.home);

      <div>Model this season: every game ATS</div><div>${sr.ats_wins ?? "–"}-${sr.ats_losses ?? "–"}</div>
      <div>Backtest ${esc(bt.seasons || "")}: spread error vs Vegas</div><div>${fix(bt.spread_mae)} vs ${fix(bt.vegas_spread_mae)} pts</div>
      <div>Backtest: picks winners vs Vegas</div><div>${bt.model_acc != null ? Math.round(100*bt.model_acc) : "–"}% vs ${bt.vegas_acc != null ? Math.round(100*bt.vegas_acc) : "–"}%</div></div>`;
  } else {
    const r = (G.record || []);
    rec = `<p class="note">${r.length ? "Tracked record: " + r.map(x => esc(Object.values(x).join(" "))).join("; ") : "The NBA model's tracked record this season starts once picks are graded."} In backtests it has not beaten closing lines.</p>`;

function nbaMovesAndInjuries(games){
  const mv = [];

      const toward = L.spread < L.spread_open ? g.home.abbr : g.away.abbr;
      mv.push([Math.abs(L.spread - L.spread_open), `${esc(g.away.abbr)} @ ${esc(g.home.abbr)}: spread ${esc(g.home.abbr)} ${fmtLine(L.spread_open)} → ${fmtLine(L.spread)} <small style="color:var(--muted)">(toward ${esc(toward)})</small>`]);
    }
    if (L.total != null && L.total_open != null && Math.abs(L.total - L.total_open) >= 1)
      mv.push([Math.abs(L.total - L.total_open) / 2, `${esc(g.away.abbr)} @ ${esc(g.home.abbr)}: total ${fmtLine(L.total_open)} → ${fmtLine(L.total)}`]);
  }

    const a = side("away"), h = side("home"); return a || h ? `<p style="margin:0 0 8px;font-size:13px"><b>${esc(g.away.abbr)}</b>: ${a || "none"}<br><b>${esc(g.home.abbr)}</b>: ${h || "none"}${t.away && t.home ? `<br><small style="color:var(--muted)">Roster value missing: ${esc(g.away.abbr)} ${fix(t.away.missing)} · ${esc(g.home.abbr)} ${fix(t.home.missing)}</small>` : ""}</p>` : ""; }).join("");
  return `${mv.length ? `<details class="box" style="margin:0 0 10px"><summary>Line moves since open <span style="color:var(--muted);font-weight:600">${mv.length}</span></summary><div>${mv.map(x => `<p style="margin:0 0 6px;font-size:13.5px">${x[1]}</p>`).join("")}<p class="note">Open = ESPN's opening line. Moves don't tell you who bet; there's no ticket or money-percentage data in the free feeds.</p></div></details>` : ""}

}
function nflInjuries(G, games){

function wireGameCards(){
  $$(".gres").forEach(b => b.onclick = () => { gameState.openWhy = null; gameDetail = {id: b.dataset.r, bet: "side", side: "away", spread: null, total: null, ou: "over", range: "L20"}; renderGames(); window.scrollTo(0,0); });
  if (gameState.openWhy){ const d = document.querySelector(`[data-why="${CSS.escape(gameState.openWhy)}"]`); if (d) d.scrollIntoView({block: "start"}); gameState.openWhy = null; }
}

function trendLines(T, team, sits){
  if (!T) return "";
  const sitBy = Object.fromEntries(T.situations.map(s => [s.key, s]));
  return (sits||[]).filter(k => !["home","away"].includes(k)).map(k => { const r = winRec(T, team, k), s = sitBy[k]; return r && r.n ? `${s.label}, last ${r.n}: ${recText(r.ats)} ATS, ${recText(r.su)} SU` : null; }).filter(Boolean).join("; ");
}

function renderNbaGames(el, G, T){

  G.games.forEach(g => (byDate[g.date] = byDate[g.date] || []).push(g));
  const dates = Object.keys(byDate).sort();
  if (gameState.openWhy){ const og = G.games.find(x => x.id === gameState.openWhy); if (og) gameState.date = og.date; }
  if (!dates.includes(gameState.date)) gameState.date = dates[0];
  const tiers = G.tiers || {light_lean:3, lean:4, one_unit:6, two_unit:8};
  const ab = n => (T && T.abbr && T.abbr[n]) || n;
  const card = g => {
    const L = g.lines || {}, d = g.detail || {}, dm = d.model || {}, tm = g.teams || {};
    const hs = L.spread;
    const spreadTxt = hs == null ? "–" : hs <= 0 ? `${g.home.abbr} ${hs===0?"PK":fmtLine(hs)}` : `${g.away.abbr} ${fmtLine(-hs)}`;
    const openTxt = L.spread_open == null ? "" : L.spread_open <= 0 ? `opened ${g.home.abbr} ${fmtLine(L.spread_open)}` : `opened ${g.away.abbr} ${fmtLine(-L.spread_open)}`;
    const ms = g.model && g.model.spread;
    const modelTxt = ms == null ? "–" : ms <= 0 ? `${g.home.short} ${fmtLine(ms)}` : `${g.away.short} ${fmtLine(-ms)}`;
    const up = T ? (T.upcoming||[]).find(u => u.id === g.id) : null;
    const teamRows = side => { const t = tm[side] || {}; const tt = g[side]; return `<tr><td>${esc(tt.abbr || tt.short)}${t.adj ? `<br><small style="color:var(--gold-ink)">your adj ${sgn(t.adj)}</small>` : ""}</td><td>${sgn(t.rating)}</td><td>${fix(t.strength,1)}</td><td>${fix(t.missing,1)}</td><td>${t.rest ?? "–"}${t.b2b?" B2B":""}</td></tr>`; };
    const edge = d.edge, need = tiers.light_lean;
    const verdict = d.tier || "No line";
    const why = edge == null ? "There's no line for this game yet." :
      edge < need ? `The model's line is only ${fix(edge,1)} pts from the market; it needs ${need}+ for even a light lean.` :
      `The model's line is ${fix(edge,1)} pts from the market on ${esc(d.pick||"")}: ${esc(verdict)}.`;
    const inj = side => (g[side].injuries||[]).slice(0,6).map(i => `${esc(i.name)} <span style="color:var(--muted)">${esc(i.status)}</span>`).join(", ") || "none listed";
    return `<div class="gcard">
      <div class="ghead"><span>${tipTime(g.start)}</span><span>${esc(g.away.record||"")} · ${esc(g.home.record||"")}</span></div>
      <div class="gmatch"><div class="row">${logo(g.away.name, 28)}<span>${esc(g.away.short)}</span><small style="color:var(--muted);font:700 13px var(--font-body)">@</small>${logo(g.home.name, 28)}<span>${esc(g.home.short)}</span></div></div>
      <div class="glines">

        <div><div class="lab">Total</div><div class="now">${fmtLine(L.total)}</div><div class="was">${L.total_open!=null?"opened "+fmtLine(L.total_open):""}</div></div>
        <div><div class="lab">Moneyline</div><div class="now">${price(L.away_ml)} / ${price(L.home_ml)}</div><div class="was">${esc(L.book||"")}</div></div>
      </div>
      <button class="gres" data-r="${esc(g.id)}">Research spread, moneyline &amp; total <span>›</span></button>
      <details class="box" data-why="${esc(g.id)}" ${gameState.openWhy===g.id?"open":""} style="margin:0;border:0;border-top:1px solid var(--line);border-radius:0"><summary>Why didn't the model like this? <span style="color:var(--muted);font-weight:600">model ${esc(modelTxt)}</span></summary><div>
        <p style="margin:0 0 10px;font-size:13.5px">${why}</p>

          <div>Model line (what it posts)</div><div>${esc(dm.line || modelTxt)}</div>

function nbaGameQuestion(g, T){
  const L = g.lines || {}, d = g.detail || {}, dm = d.model || {}, tm = g.teams || {};
  const up = T ? (T.upcoming||[]).find(u => u.id === g.id) : null;
  const sp = L.spread == null ? "no line yet" : L.spread <= 0 ? `${g.home.name} ${fmtLine(L.spread)}` : `${g.away.name} ${fmtLine(-L.spread)}`;
  const t = s => { const x = tm[s] || {}; return `${g[s].name}: rating ${sgn(x.rating)} pts vs avg, roster strength ${fix(x.strength)}, missing value ${fix(x.missing)}, rest ${x.rest ?? "?"} days${x.b2b ? " (back-to-back)" : ""}, injuries: ${(g[s].injuries||[]).map(i => i.name + " " + i.status).join(", ") || "none listed"}`; };
  return `I'm handicapping an NBA game and want a second opinion (I make my own decisions).
${g.away.name} @ ${g.home.name}, ${tipTime(g.start)}. Spread ${sp}${L.spread_open != null ? ` (home opened ${fmtLine(L.spread_open)})` : ""}, total ${fmtLine(L.total)}, moneyline ${price(L.away_ml)}/${price(L.home_ml)}.
The NBA model's line: ${dm.line || "?"} (model alone ${fix(dm.model_only)} home margin, market prior ${fix(dm.market_prior)}, ${Math.round(100*(dm.market_share||0))}% weight on the market early season). Edge ${fix(d.edge)} pts, verdict: ${d.tier || "no line"} (needs 3+ pts for a light lean).
${t("away")}.
${t("home")}.
${up ? `Situational records (each team's most recent games in each spot): ${g.away.short}: ${trendLines(T, up.away, up.sits.away) || "none"}. ${g.home.short}: ${trendLines(T, up.home, up.sits.home) || "none"}.` : ""}
What's the case for each side and for the total, what might the model be missing (roster changes, matchups, motivation), and what should I check before deciding?`;
}

The NFL model: ${sp(g.model_spread)} (home win ${Math.round(100*(g.home_prob||0))}%), edge ${fix(g.ats_edge)} pts toward ${g.ats_lean || "?"}, verdict ${g.tier || "no play"} (needs ${G.ats_min_edge}+). Model total ${fix(g.model_total)} vs ${fmtLine(g.total_line)}.

// ---------------------------------------------------------------- game research (spread + moneyline, totals)
// Props-style hit rates for a game: how often each team would have covered tonight's spread
// (or any spread you set), its straight-up / moneyline record, and how often its games went
// over tonight's total. History only, no picks.
let gameDetail = null;  // {id, bet: "side" | "total", side: "away" | "home", spread, total, ou, range}

const coverRes = (l, sp) => { const v = l.pf - l.pa + sp; return v > 0 ? "W" : v < 0 ? "L" : "P"; };
const totRes = (l, tot) => { const v = l.pf + l.pa; return v > tot ? "O" : v < tot ? "U" : "P"; };
const mlProfit = l => l.ml == null ? null : l.pf > l.pa ? (l.ml > 0 ? l.ml/100 : 100/-l.ml) : l.pf < l.pa ? -1 : 0;
const impl = ml => ml == null ? null : ml > 0 ? 100/(ml+100) : -ml/(-ml+100);
function sideStats(logs, sp){
  let w = 0, l = 0, p = 0, aw = 0, al = 0, ap = 0, sw = 0, sl = 0, st = 0, mn = 0, mu = 0, marg = 0;
  for (const g of logs){
    const r = coverRes(g, sp); if (r === "W") w++; else if (r === "L") l++; else p++;
    if (g.ats === "W") aw++; else if (g.ats === "L") al++; else if (g.ats === "P") ap++;
    if (g.pf > g.pa) sw++; else if (g.pf < g.pa) sl++; else st++;
    const u = mlProfit(g); if (u != null){ mn++; mu += u; }
    marg += g.pf - g.pa;
  }
  return {n: logs.length, w, l, p, pct: w + l ? Math.round(100*w/(w+l)) : null, ats: [aw, al, ap], su: [sw, sl, st], mlN: mn, mlU: mu, marg: logs.length ? marg/logs.length : null};
}
function totStats(logs, tot, ou){
  let h = 0, m = 0, p = 0, o = 0, u = 0, pu = 0, sum = 0, pf = 0, pa = 0;
  for (const g of logs){
    const r = totRes(g, tot); if (r === "P") p++; else if ((r === "O") === (ou === "over")) h++; else m++;
    if (g.ou === "O") o++; else if (g.ou === "U") u++; else if (g.ou === "P") pu++;
    sum += g.pf + g.pa; pf += g.pf; pa += g.pa;
  }
  const n = logs.length;
  return {n, h, m, p, pct: h + m ? Math.round(100*h/(h+m)) : null, ou: [o, u, pu], avg: n ? sum/n : null, pf: n ? pf/n : null, pa: n ? pa/n : null};
}
const unitsTxt = (u, n) => n ? `${u >= 0 ? "+" : "−"}${Math.abs(u).toFixed(1)}u` : "–";
function teamWindows(T, logs){
  const cur = T.season, lab = s => T.season_labels[s] || s;
  const thisS = logs.filter(l => l.s === cur), lastS = logs.filter(l => l.s === cur - 1);
  const w = [["L5", logs.slice(-5)], ["L10", logs.slice(-10)], ["L20", logs.slice(-20)]];
  if (thisS.length) w.push([lab(cur), thisS]);
  w.push([lab(cur - 1), lastS]);
  return w;
}
function gameBars(logs, valFn, lineV, resFn, subFn, fromZero = true){
  if (!logs.length) return `<div class="empty">No games in this range.</div>`;
  const W = Math.max(300, Math.min(820, (window.innerWidth || 375) - 52)), Hh = 210, L = 4, R = 4, T0 = 16, B = 40;
  const vals = logs.map(valFn);
  const hi = Math.max(lineV, 0, ...vals), lo = Math.min(lineV, 0, ...vals);
  const vmin = Math.min(lineV, ...vals);
  const span = ((fromZero ? hi - lo : hi - vmin) || 1), top = hi + span * 0.08;
  const bot = !fromZero ? vmin - span * 0.35 : lo < 0 ? lo - span * 0.08 : 0;
  const y = v => T0 + (Hh - T0 - B) * (top - v) / (top - bot);
  const bw = (W - L - R) / logs.length;
  let bars = "";
  logs.forEach((g, i) => {
    const gap = Math.min(6, bw * 0.22), v = vals[i], x = L + i * bw + gap / 2, w = Math.max(2, bw - gap), r = resFn(g);
    const col = r === "hit" ? "var(--bar-hit)" : r === "miss" ? "var(--bar-miss)" : "var(--muted)";
    const y1 = fromZero ? y(Math.max(v, 0)) : y(v), y2 = fromZero ? y(Math.min(v, 0)) : Hh - B;
    const h = Math.max(2, y2 - y1);
    const date = sport === "NBA" ? shortDate(g.d) : shortDate(g.d);
    bars += `<g><title>${esc(g.d)} ${g.h ? "vs" : "@"} ${esc(g.o)}: ${g.pf}-${g.pa}${g.line != null ? `, line ${g.line > 0 ? "+" : ""}${fmtLine(g.line)}` : ""}${g.tot != null ? `, total ${fmtLine(g.tot)}` : ""}</title>

const marginOf = g => g.pf - g.pa;

function gameLookup(G, T, id){
  const u = T && (T.upcoming || []).find(x => x.id === id);
  const g = G.games.find(x => x.id === id);
  if (u) return u;
  if (!g) return null;
  if (sport === "NBA"){
    const L = g.lines || {};
    return {id, date: g.date, start: g.start, home: g.home.name, away: g.away.name, spread: L.spread, open: L.spread_open,
            total: L.total, total_open: L.total_open, home_ml: L.home_ml, away_ml: L.away_ml, sits: {home: [], away: []}};
  }
  return {id, date: g.date, time: g.time, week: g.week, home: g.home, away: g.away, spread: g.vegas_spread == null ? null : -g.vegas_spread,
          total: g.total_line, home_ml: (g.market||{}).home_ml, away_ml: (g.market||{}).away_ml, sits: {home: [], away: []}};
}

function gameResearchQuestion(G, T, u){
  const ab = t => shortTeam(t);
  const lines = [];
  for (const side of ["away", "home"]){
    const tm = u[side], lg = T.logs[tm] || [];
    const sp = u.spread == null ? null : side === "home" ? u.spread : -u.spread;
    const parts = teamWindows(T, lg).map(([lab, x]) => { const s = sideStats(x, sp ?? 0), t = totStats(x, u.total ?? 0, "over"); return `${lab}: covers ${s.w}-${s.l}${s.p?"-"+s.p:""} at ${sp==null?"?":(sp>0?"+":"")+fmtLine(sp)}, SU ${s.su[0]}-${s.su[1]}, ML ${unitsTxt(s.mlU, s.mlN)}${u.total!=null?`, over ${fmtLine(u.total)} ${t.h}/${t.h+t.m}`:""}`; }).join("; ");
    lines.push(`${tm} (${side}): ${parts}.`);
  }
  const h2h = (T.logs[u.home] || []).filter(l => l.o === u.away).slice(-6).map(l => `${l.d} ${ab(u.home)} ${l.pf}-${l.pa}${l.line!=null?` (line ${l.line>0?"+":""}${fmtLine(l.line)}, total ${fmtLine(l.tot)})`:""}`).join("; ");
  const g = G.games.find(x => x.id === u.id) || {};
  let model = "";
  if (sport === "NBA" && g.detail){ const d = g.detail, dm = d.model || {}; model = `The NBA model's line: ${dm.line || "?"}, edge ${fix(d.edge)} pts, verdict ${d.tier || "no line"}.`; }
  if (sport === "NFL" && g.model_spread != null){ model = `The NFL model: home margin ${fix(g.model_spread)}, edge ${fix(g.ats_edge)} pts toward ${g.ats_lean || "?"}, verdict ${g.tier || "no play"}; model total ${fix(g.model_total)}.`; }
  const when = sport === "NBA" ? tipTime(u.start) : nflTime(u.date, u.time);
  return `I'm handicapping an ${sport} game (spread, moneyline and total) and want a second opinion (I make my own decisions).
${u.away} @ ${u.home}, ${when}. Spread: ${u.home} ${u.spread==null?"?":(u.spread>0?"+":"")+fmtLine(u.spread)}${u.open!=null&&u.open!==u.spread?` (opened ${fmtLine(u.open)})`:""}. Moneyline ${price(u.away_ml)} / ${price(u.home_ml)}. Total ${fmtLine(u.total)}${u.total_open!=null&&u.total_open!==u.total?` (opened ${fmtLine(u.total_open)})`:""}.
${lines.join("\n")}
Head to head (last 3 seasons, ${u.home}'s score first): ${h2h || "none"}.
${model}
What's the case for each side, the moneyline and the total, what matters most here (injuries, rest, matchups, line movement), and what should I check before deciding?`;
}

// ---------------------------------------------------------------- teams
let teamState = {team: null};
async function renderTeams(){
  const el = $("#v-teams");
  let T;
  try { T = await load("trends"); } catch(e){ el.innerHTML = `<div class="empty">Couldn't load ${sport} team data (${esc(e.message)}).</div>`; return; }
  const ab = t => T.abbr && T.abbr[t] ? T.abbr[t] : t;
  const teams = Object.keys(T.logs).sort((a,b) => ab(a).localeCompare(ab(b)));
  if (!teams.includes(teamState.team)) teamState.team = store.get("resTeam_" + sport, teams[0]);
  if (!teams.includes(teamState.team)) teamState.team = teams[0];
  const team = teamState.team;
  const logs = T.logs[team] || [];
  const curLogs = logs.filter(l => l.s === T.season), lastLogs = logs.filter(l => l.s === T.season - 1);
  const show = (curLogs.length ? curLogs : lastLogs).slice().reverse();
  const bySeason = T.team_by_season[team] || {};
  const sits = T.situations.filter(s => s.key !== "all");
  const seasonRec = bySeason[T.season] && (bySeason[T.season].su[0] + bySeason[T.season].su[1]) ? bySeason[T.season] : bySeason[T.season - 1];
  el.innerHTML = `<div class="hero" style="--hc1:${tint(teamColor(team), .4)}">
      <div class="teamhero">${logo(team, 64)}<div style="min-width:0"><h2>${esc(sport === "NBA" ? team.split(" ").slice(-1)[0] : ((NFL_META[team] || {}).nick || team))}</h2>
        <div class="meta">${seasonRec ? `<span>${recText(seasonRec.su)} straight up</span><span>${recText(seasonRec.ats)} ATS</span><span>${recText(seasonRec.ou)} O/U</span>` : ""}</div></div></div></div>
    <select id="tteam" class="btn" style="width:100%;text-align:left;margin-top:12px" aria-label="Team">${teams.map(t => `<option value="${esc(t)}" ${t===team?"selected":""}>${esc(sport==="NBA"?t:ab(t))}</option>`).join("")}</select>
    <div class="sec"><div class="sec-h"><h3>By season</h3></div><div class="twrap"><table class="t"><tr><th>Season</th><th>ATS</th><th>SU</th><th>ML</th><th>O/U</th></tr>
      ${Object.keys(bySeason).sort().reverse().map(s => { const r = bySeason[s]; return `<tr><td>${esc(T.season_labels[s]||s)}</td><td><span class="pill ${recPct(r.ats)>52.4?"g":recPct(r.ats)<47.6?"r":""}">${recText(r.ats)}</span></td><td>${recText(r.su)}</td><td class="${r.ml&&r.ml[1]>0?"pos":r.ml&&r.ml[1]<0?"neg":""}">${r.ml?unitsTxt(r.ml[1], r.ml[0]):"–"}</td><td>${recText(r.ou)}</td></tr>`; }).join("")}</table></div></div>
    <div class="sec"><div class="sec-h"><h3>${curLogs.length ? "This season" : "Last season"}, game by game</h3><span>newest first</span></div>
      <div class="form" style="margin-bottom:8px">${show.slice(0,20).map(l => `<i class="${l.ats||""}" title="${esc(l.d)}">${l.ats||"·"}</i>`).join("")}<small style="color:var(--muted);margin-left:6px">ATS, last ${Math.min(20, show.length)}</small></div>
      <div class="twrap"><table class="t"><tr><th>Game</th><th>Score</th><th>Line · ATS</th><th>Total · O/U</th></tr>
      ${show.map(l => `<tr><td>${l.h?"vs":"@"} ${logo(l.o, 16)} ${esc(ab(l.o))}<br><small style="color:var(--muted)">${shortDate(l.d)}${l.ml != null ? ` · ML ${price(l.ml)}` : ""}</small></td><td class="${l.pf>l.pa?"pos":l.pf<l.pa?"neg":""}">${l.pf}-${l.pa}</td><td>${l.line==null?"–":(l.line>0?"+":"")+fmtLine(l.line)} <span class="pill ${l.ats==="W"?"g":l.ats==="L"?"r":""}">${l.ats||"–"}</span></td><td>${fmtLine(l.tot)} <span class="pill ${l.ou==="O"?"g":l.ou==="U"?"r":""}">${l.ou||"–"}</span></td></tr>`).join("") || `<tr><td colspan="4" class="l">No games yet.</td></tr>`}</table></div></div>
    <div class="sec"><div class="sec-h"><h3>Every situation</h3><span>${esc(ab(team))}'s last ${win} games in each spot</span></div>
      ${winChips("teamwin")}
      <div class="twrap"><table class="t"><tr><th>Spot</th><th>ATS</th><th>SU</th><th>ML</th><th>O/U</th></tr>
      ${sits.map(s => { const r = winRec(T, team, s.key); if (!r || !r.n) return ""; return `<tr><td>${esc(s.label)}${r.n < win ? `<br><small style="color:var(--muted)">only ${r.n} game${r.n===1?"":"s"}</small>` : ""}</td><td><span class="pill ${atsCls(r.ats)}">${recText(r.ats)}</span></td><td>${recText(r.su)}</td><td class="${mlCls(r.ml[1])}">${unitsTxt(r.ml[1], r.ml[0])}</td><td>${recText(r.ou)}</td></tr>`; }).join("")}</table></div></div>
    <p class="note">${(T.notes||[]).map(esc).join(" ")}</p>`;
  $("#tteam").onchange = e => { teamState.team = e.target.value; store.set("resTeam_" + sport, e.target.value); renderTeams(); };
  wireWin("teamwin", renderTeams);
}

// ---------------------------------------------------------------- shell
async function renderData(){
  const el = $("#v-data");
  const kinds = [["props", "Player props"], ["trends", "Trends and team logs"], ["finder", "Trend Finder history"], ["games", "Games and model numbers"], ["teamstats", "Team stats"]];
  const ago = s => { if (!s) return "–"; const m = Math.round((Date.now() - new Date(s.replace("Z", ":00Z").replace("::", ":")).getTime()) / 60000); return isNaN(m) ? s : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m/60)} h ago` : `${Math.round(m/1440)} days ago`; };
  const rows = await Promise.all(kinds.map(async ([k, l]) => { try { const d = await load(k); const last = k === "trends" ? Object.values(d.logs || {}).flat().map(x => x.d).sort().pop() : null; return `<div>${l}</div><div>${ago(d.generated_at)}${last ? ` · last game ${esc(last)}` : ""}</div>`; } catch(e){ return `<div>${l}</div><div class="neg">didn't load</div>`; } }));
  el.innerHTML = `<button class="back" id="dback">‹ Back</button>
    <div class="sec-h"><h2>${sport} data</h2><span>how fresh it is, where it comes from</span></div>
    <div class="card"><div class="kv">${rows.join("")}</div></div>
    <p class="note">The app refreshes 6 times a day, a little after the ${sport} model runs. Times are when this app last rebuilt each file.</p>
    <div class="sec"><div class="sec-h"><h3>Sources</h3></div><div class="card"><div class="kv">
      ${sport === "NBA" ? `<div>Box scores, results</div><div>ESPN, via the NBA model</div><div>Spreads, totals, moneylines</div><div>ESPN odds feed (DraftKings now; closing + opening lines)</div><div>Player prop lines</div><div>DraftKings via ESPN (history: ESPN BET/DraftKings 2024-26, gaps)</div>`
        : `<div>Results, closing lines, weather, coaches, refs</div><div>nflverse schedules</div><div>Play-by-play stats</div><div>nflverse play-by-play</div><div>Player stats, snaps, coverage</div><div>nflverse</div><div>Player prop lines</div><div>DraftKings via ESPN (lines only, no prices)</div><div>Injuries</div><div>NFL injury reports (nflverse) + ESPN</div>`}
      <div>Model numbers</div><div>The ${sport} model's own files</div></div></div></div>
    <div class="sec"><div class="sec-h"><h3>Not in this app (no free data)</h3></div><p class="note" style="margin-top:0">Prices at every sportsbook / best price, timestamped line history and steam moves, ticket and money percentages, routes and alignment (slot vs outside), pressure rates by player, weather forecasts for upcoming games, and practice reports for the NBA.</p></div>`;
  $("#dback").onclick = () => show(store.get("resPrevView", "props"));
}
$("#dataBtn").onclick = () => { if (view !== "data") store.set("resPrevView", view); show("data"); };
const RENDER = {props: renderProps, trends: renderTrends, games: renderGames, teams: renderTeams, data: renderData};
function show(v){
  view = v; store.set("resView", v);
  $$(".tab").forEach(t => t.classList.toggle("on", t.dataset.v === v));
  $$(".view").forEach(s => s.hidden = s.id !== "v-" + v);
  const el = $("#v-" + v);
  if (!el.innerHTML || el.querySelector(".skel")) el.innerHTML = skeleton();
  RENDER[v]();
}
function setSport(s){
  sport = s; store.set("resSport", s); detail = null; gameDetail = null;
  $$("#sportSeg button").forEach(b => b.classList.toggle("on", b.dataset.s === s));
  $$(".view").forEach(v => v.innerHTML = "");
  show(view);
}
$$(".tab").forEach(t => t.onclick = () => { if (t.dataset.v === view && view === "props") detail = null; if (t.dataset.v === view && view === "games") gameDetail = null; show(t.dataset.v); window.scrollTo(0,0); });
$$("#sportSeg button").forEach(b => b.onclick = () => setSport(b.dataset.s));
$$(".view").forEach(v => tidyObs.observe(v, {childList: true, subtree: true}));
// Deep links from other apps (e.g. Parlays): #props/<sport>/<player id>/<market>
function openFromHash(){
  const m = location.hash.match(/^#props\/(nba|nfl)\/([^/]+)\/([a-z0-9_]+)/i);
  if (!m) return false;
  const sp = m[1].toUpperCase();
  if (sp !== sport) setSport(sp);
  view = "props";
  detail = {pid: decodeURIComponent(m[2]), market: m[3].toLowerCase(), line: null, side: "over", range: "L20"};
  show("props");
  window.scrollTo(0, 0);
  return true;
}
setSport(sport);
openFromHash();
window.addEventListener("hashchange", openFromHash);
</script>

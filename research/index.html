<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Research</title>
<meta name="theme-color" content="#0d0f15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Research">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Handicapping research app: data, trends and the models' numbers. No picks.
   Same look as the Best Plays hub (hub/template.html). */
:root{
  color-scheme:dark;
  --bg:#0d0f15; --surface:#151821; --surface2:#1c2030; --sunk:#10131b; --line:#272c3d; --line-hi:#3b4258;
  --ink:#eef0f6; --ink2:#b4bbcc; --muted:#808a9f; --faint:#586178;
  --gold:#e3b04b; --gold-ink:#f2c66a; --gold-bg:rgba(227,176,75,.13); --gold-line:rgba(227,176,75,.5); --on-gold:#1a1305;
  --win:#3ddc84; --win-bg:rgba(61,220,132,.14); --loss:#ff6b6b; --loss-bg:rgba(255,107,107,.14); --push-bg:#272c3d;
  --bar-hit:#2fbf71; --bar-miss:#e25555; --grid:#232838;
  --nfl:#5b8def; --nba:#ff8a3d;
  --font-display:"Big Shoulders Display","Oswald","Arial Narrow",system-ui,sans-serif;
  --font-body:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;
  --tabbar-h:64px;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#f3f1ec; --surface:#ffffff; --surface2:#f8f6f1; --sunk:#ece9e2; --line:#e0dcd2; --line-hi:#c9c3b5;
  --ink:#16181f; --ink2:#3d4252; --muted:#6a7080; --faint:#9a9fac;
  --gold:#a8750a; --gold-ink:#8a5f00; --gold-bg:rgba(201,141,18,.12); --gold-line:rgba(168,117,10,.45); --on-gold:#fffaf0;
  --win:#14864a; --win-bg:rgba(20,134,74,.11); --loss:#c8323a; --loss-bg:rgba(200,50,58,.1); --push-bg:#e6e2d9;
  --bar-hit:#1f9d5a; --bar-miss:#d0434a; --grid:#ebe7de;
  --nfl:#2f62d8; --nba:#d9600f;
}}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f3f1ec; --surface:#ffffff; --surface2:#f8f6f1; --sunk:#ece9e2; --line:#e0dcd2; --line-hi:#c9c3b5;
  --ink:#16181f; --ink2:#3d4252; --muted:#6a7080; --faint:#9a9fac;
  --gold:#a8750a; --gold-ink:#8a5f00; --gold-bg:rgba(201,141,18,.12); --gold-line:rgba(168,117,10,.45); --on-gold:#fffaf0;
  --win:#14864a; --win-bg:rgba(20,134,74,.11); --loss:#c8323a; --loss-bg:rgba(200,50,58,.1); --push-bg:#e6e2d9;
  --bar-hit:#1f9d5a; --bar-miss:#d0434a; --grid:#ebe7de;
  --nfl:#2f62d8; --nba:#d9600f;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);-webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px))}
button,input,select{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-block:18px 32px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.num{font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;padding-top:env(safe-area-inset-top, 0px)}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo-mark{width:34px;height:34px;border-radius:9px;background:var(--gold);color:var(--on-gold);display:grid;place-items:center;font:900 19px var(--font-display);flex:0 0 34px}
.logo h1{margin:0;font:900 26px/1 var(--font-display);letter-spacing:.03em;text-transform:uppercase}
.topr{display:flex;gap:8px;align-items:center}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:3px}
.seg button{background:none;border:0;cursor:pointer;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.seg button.on{background:var(--ink);color:var(--bg)}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom, 0px);padding-left:env(safe-area-inset-left, 0px);padding-right:env(safe-area-inset-right, 0px)}
.tabs-in{max-width:860px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabbar-h)}
.tab{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11.5px;font-weight:700;letter-spacing:.03em}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--gold-ink)}
@media (min-width:760px){
  body{padding-bottom:0}
  .tabs{position:sticky;top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top, 0px)}
  .tabs-in{height:52px;grid-template-columns:repeat(4,auto);justify-content:start;gap:4px;padding-left:max(16px, env(safe-area-inset-left, 0px))}
  .tab{flex-direction:row;gap:8px;font-size:14px;padding:0 14px;border-bottom:2px solid transparent}
  .tab.on{border-bottom-color:var(--gold)}
  .tab svg{width:18px;height:18px}
  .top{padding-top:0}
}
.view[hidden]{display:none!important}
.sec{margin-top:24px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sec-h h2{margin:0;font:800 22px/1 var(--font-display);text-transform:uppercase;letter-spacing:.03em}
.sec-h h3{margin:0;font:800 18px/1 var(--font-display);text-transform:uppercase;letter-spacing:.03em}
.sec-h span{color:var(--muted);font-size:13px}
.note{color:var(--muted);font-size:12.5px;max-width:70ch;margin:8px 0 0}
.empty{color:var(--muted);text-align:center;padding:26px 14px;background:var(--surface);border:1px dashed var(--line-hi);border-radius:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrapc{flex-wrap:wrap;overflow:visible}
.chip{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);color:var(--ink2);font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tools input,.tools select{flex:1 1 160px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.tag{font-size:10.5px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 6px;letter-spacing:.03em;white-space:nowrap}
.pos{color:var(--win)} .neg{color:var(--loss)}
.btn{background:var(--surface2);border:1px solid var(--line-hi);border-radius:10px;padding:8px 12px;font-weight:800;font-size:13px;cursor:pointer;color:var(--ink)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.back{background:none;border:0;color:var(--ink2);font-weight:800;cursor:pointer;padding:4px 0;margin-bottom:8px;font-size:14px}

/* prop list */
.plist{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.prow:first-child{border-top:0}
.prow:hover{background:var(--surface2)}
.prow .nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.prow .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.prow .ln{font:800 18px var(--font-display);text-align:right;white-space:nowrap}
.hrs{display:flex;gap:4px;grid-column:1/3}
.hr{flex:1 1 0;min-width:0;border-radius:7px;padding:3px 4px;text-align:center;background:var(--sunk)}
.hr b{display:block;font:800 15px/1.1 var(--font-display)}
.hr span{display:block;font-size:9.5px;color:var(--muted);font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.hr.g{background:var(--win-bg)} .hr.g b{color:var(--win)}
.hr.r{background:var(--loss-bg)} .hr.r b{color:var(--loss)}

/* player detail */
.phead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.phead h2{margin:0;font:900 30px/1 var(--font-display);text-transform:uppercase}
.phead .meta{color:var(--muted);font-size:13px;margin-top:4px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line-hi);background:var(--surface2);cursor:pointer;font-size:18px;font-weight:800}
.stepper b{font:900 26px var(--font-display);min-width:58px;text-align:center}
.lineinfo{font-size:12.5px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.kpi b{display:block;font:900 24px/1.05 var(--font-display)}
.kpi small{display:block;font-size:11.5px;color:var(--muted)}
.kpi span{display:block;font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.07em;text-transform:uppercase}
.kpi b em{font-style:normal}
.kpi.g b{color:var(--win)} .kpi.r b{color:var(--loss)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 8px 4px;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13.5px}
table.t th,table.t td{padding:8px 10px;text-align:right;white-space:nowrap;border-top:1px solid var(--line)}
table.t th{font-size:10.5px;color:var(--muted);font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-top:0}
table.t td:first-child,table.t th:first-child{text-align:left;white-space:normal;min-width:64px}
table.t.wide td:first-child{min-width:100px}
table.t td.l{text-align:left}
table.t tr.sub td{color:var(--muted);font-size:12px}
.twrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.pill{display:inline-block;min-width:30px;text-align:center;font:800 14px var(--font-display);padding:2px 7px;border-radius:6px;background:var(--sunk)}
.pill.g{background:var(--win-bg);color:var(--win)} .pill.r{background:var(--loss-bg);color:var(--loss)}
details.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:12px}
details.box > summary{cursor:pointer;padding:12px 14px;font-weight:800;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.box > summary::-webkit-details-marker{display:none}
details.box > summary::after{content:"+";color:var(--muted)}
details.box[open] > summary::after{content:"–"}
details.box > div{padding:0 14px 14px}
details.box.gold{border-color:var(--gold-line);background:linear-gradient(180deg,var(--gold-bg),transparent 120px),var(--surface)}
.kv{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:5px 12px;font-size:13.5px}
.kv div:nth-child(odd){color:var(--muted)}
.kv div:nth-child(even){text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.parts{display:grid;gap:6px;margin-top:6px}
.part{display:grid;grid-template-columns:minmax(0,1fr) 120px 48px;gap:8px;align-items:center;font-size:13px}
.part .pb{height:10px;background:var(--sunk);border-radius:5px;position:relative}
.part .pb i{position:absolute;top:0;bottom:0;border-radius:5px}
.part .pb em{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line-hi)}
.part b{text-align:right;font-variant-numeric:tabular-nums}

/* games */
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px 4px;font-size:12.5px;color:var(--muted)}
.gmatch{padding:0 14px 10px}
.gteam{display:flex;justify-content:space-between;gap:10px;font:800 21px/1.2 var(--font-display);text-transform:uppercase}
.gteam small{font:600 12.5px var(--font-body);color:var(--muted);text-transform:none;margin-left:6px}
.glines{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line)}
.glines > div{background:var(--surface2);padding:9px 12px;min-width:0}
.glines .lab{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.glines .now{font:800 17px/1.2 var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.glines .was{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 10px}
.fl{display:flex;flex-direction:column;gap:3px;min-width:0}
.fl span{font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.fl select,.fl input{width:100%;min-width:0;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:7px 8px;font-size:13.5px}
.gres{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--gold-bg);border:0;border-top:1px solid var(--line);color:var(--gold-ink);font-weight:800;font-size:13.5px;padding:11px 14px;cursor:pointer;text-align:left}
.gres span{font-size:18px}
.gbody{padding:12px 14px;border-top:1px solid var(--line);display:grid;gap:12px}
.sit{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 10px;align-items:center;font-size:13px;padding:6px 0;border-top:1px solid var(--line)}
.sit:first-child{border-top:0}
.sit .lab{min-width:0}
.sit small{color:var(--muted);font-size:11.5px;display:block}
.form{display:flex;gap:3px;flex-wrap:wrap}
.form i{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font:800 11px var(--font-display);font-style:normal;background:var(--push-bg);color:var(--muted)}
.form i.W,.form i.O{background:var(--win-bg);color:var(--win)} .form i.L,.form i.U{background:var(--loss-bg);color:var(--loss)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar-h) + 20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;font-size:13.5px;z-index:50;display:none;max-width:90vw}
@media (max-width:520px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .phead h2{font-size:26px}
  .part{grid-template-columns:minmax(0,1fr) 80px 44px}
  .glines .now{font-size:15px}
  table.t th,table.t td{padding:8px 6px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ---------- 2026-10 redesign: bigger tap targets, calmer cards, logos/headshots, heroes ---------- */
body{font-size:15px}
.wrap{padding-block:14px 40px}
.top{margin-bottom:10px}
.logo h1{font-size:24px}
@media (max-width:420px){ .logo h1{font-size:21px} .logo-mark{width:30px;height:30px;flex-basis:30px;font-size:17px} }
.iconbtn{width:44px;height:44px;border-radius:12px}
.seg{border-radius:13px}
.seg button{min-height:44px;padding:0 12px;border-radius:10px;font-size:13.5px}
table.t.tight th,table.t.tight td{padding-left:4px;padding-right:4px}
.chips{gap:8px;padding-bottom:2px;margin-bottom:2px}
.chip{min-height:44px;display:inline-flex;align-items:center;gap:6px;padding:0 16px;font-size:13.5px}
.chip img{width:20px;height:20px}
.btn{min-height:44px;padding:0 16px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.back{min-height:44px;display:inline-flex;align-items:center;gap:4px;font-size:15px}
.stepper button{width:44px;height:44px;border-radius:12px;font-size:22px}
.stepper b{font-size:30px;min-width:70px}
.tools input,.tools select,select.btn{min-height:44px;font-size:15px}
.fl select,.fl input{min-height:44px;font-size:15px}
.sec{margin-top:28px}
.sec-h{margin-bottom:12px}
.sec-h h2{font-size:24px}
.sec-h h3{font-size:19px}
.sec-h span{font-size:12.5px}
.card,.kpi,.twrap,.plist,.gcard,details.box,.chart{border-radius:18px}
.card{padding:14px 16px}
.kpis{gap:8px}
.kpi{padding:10px 12px}
.kpi b{font-size:28px}
.note{font-size:12.5px;line-height:1.5}
table.t th,table.t td{padding:10px 10px}
.empty{padding:34px 18px;border-radius:18px;font-size:14px}
.empty b{display:block;color:var(--ink);font:800 18px var(--font-display);text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px}
details.box > summary{min-height:48px;align-items:center;padding:12px 16px}

/* logos, headshots */
.tlogo{display:inline-block;object-fit:contain;vertical-align:middle;flex:0 0 auto}
.av{position:relative;width:46px;height:46px;border-radius:50%;background:var(--sunk);overflow:hidden;flex:0 0 46px;display:grid;place-items:center;border:1px solid var(--line)}
.av b{font:800 15px var(--font-display);color:var(--muted);letter-spacing:.03em}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.av .tl{position:absolute;right:-2px;bottom:-2px;width:18px;height:18px;border-radius:50%;background:var(--surface);padding:1px}
.av.big{width:84px;height:84px;flex-basis:84px}
.av.big b{font-size:26px}
.av.big .tl{width:28px;height:28px}

/* hero cards */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--hc1,transparent) 0%,transparent 55%),var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(225deg,var(--hc2,transparent) 0%,transparent 45%);pointer-events:none}
.hero > *{position:relative;z-index:1}
.hero h2{margin:0;font:900 30px/1 var(--font-display);text-transform:uppercase;letter-spacing:.01em}
.hero .meta{color:var(--ink2);font-size:13px;margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.hero .pillx{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--loss-bg);color:var(--loss)}
.hero .pillx.ok{background:var(--sunk);color:var(--ink2)}
.prow-hero{display:flex;gap:14px;align-items:center}
.bigline{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:14px}
.bigline .l b{display:block;font:900 44px/0.95 var(--font-display)}
.bigline .l span{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.ring{--p:0;width:80px;height:80px;flex:0 0 80px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--rc,var(--muted)) calc(var(--p)*1%),var(--sunk) 0)}
.ring > div{width:64px;height:64px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;line-height:1}
.ring b{font:900 20px var(--font-display)}
.ring small{display:block;font-size:8px;margin-top:2px;color:var(--muted);font-weight:800;letter-spacing:.06em}
.ring.g{--rc:var(--win)} .ring.r{--rc:var(--loss)}
.matchup{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.matchup .tm{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.matchup .tm b{font:900 22px/1 var(--font-display);text-transform:uppercase}
.matchup .tm small{color:var(--muted);font-size:12px}
.matchup .at{font:800 14px var(--font-display);color:var(--muted)}
.hlines{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.hlines > div{background:var(--sunk);border-radius:12px;padding:8px 10px;text-align:center;min-width:0}
.hlines span{display:block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hlines b{display:block;font:800 17px/1.2 var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* prop list rows with headshots */
.prow{grid-template-columns:46px minmax(0,1fr) auto;gap:4px 12px;padding:12px 14px}
.prow .av{grid-row:1/3}
.prow .nm{font-size:15.5px}
.prow .hrs{grid-column:1/4;margin-top:4px}
.hr{padding:5px 4px;border-radius:9px}
.hr b{font-size:16px}

/* today board */
.board2{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;scroll-snap-type:x mandatory}
.board2::-webkit-scrollbar{display:none}
.tcard{flex:0 0 156px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:44px}
.tcard .who{display:flex;gap:8px;align-items:center;min-width:0}
.tcard .who .av{width:34px;height:34px;flex-basis:34px}
.tcard .who span{font-weight:800;font-size:13px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tcard .what{font-size:12px;color:var(--ink2)}
.tcard .big{font:900 26px/1 var(--font-display)}
.tcard.hot .big{color:var(--win)} .tcard.cold .big{color:var(--loss)}

/* game cards */
.gteam{align-items:center}
.gteam .tlogo{width:26px;height:26px}
.gcard{border-radius:18px}
.gres{min-height:48px;font-size:14px}
.gmatch .row{display:flex;align-items:center;gap:10px;font:800 20px/1.25 var(--font-display);text-transform:uppercase}

/* team hero */
.teamhero{display:flex;gap:14px;align-items:center}
.teamhero .tlogo{width:64px;height:64px}

/* how this works */
details.how{margin-top:22px;border:1px dashed var(--line-hi);border-radius:16px;background:transparent}
details.how > summary{list-style:none;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:8px;padding:10px 14px;font-weight:800;font-size:13.5px;color:var(--ink2)}
details.how > summary::-webkit-details-marker{display:none}
details.how > summary::before{content:"?";width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--muted);font-size:12px}
details.how > div{padding:0 14px 12px}
details.how .note{margin:8px 0 0}
.warn{color:var(--gold-ink);font-size:13px;font-weight:700;margin:10px 0 0}

/* loading skeleton */
.skel{display:grid;gap:12px}
.skel i{display:block;height:84px;border-radius:18px;background:linear-gradient(90deg,var(--surface) 0%,var(--surface2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sk 1.2s ease-in-out infinite}
.skel i:first-child{height:120px}
@keyframes sk{0%{background-position:100% 0}100%{background-position:-100% 0}}
@media (prefers-reduced-motion: reduce){.skel i{animation:none}}

/* fit everything at 375 */
html,body{overflow-x:hidden}
.twrap{-webkit-overflow-scrolling:touch}
@media (max-width:420px){
  table.t{font-size:13px}
  table.t th,table.t td{padding:9px 6px}
  table.t th{font-size:9.5px;letter-spacing:.05em}
  .kpi b{font-size:24px}
  .hero h2{font-size:26px}
  .bigline .l b{font-size:38px}
  .fgrid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<nav class="tabs" aria-label="Sections"><div class="tabs-in">
  <button class="tab" data-v="props"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Props</button>
  <button class="tab" data-v="trends"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5h16M6.5 16l4-5 3 3 4.5-6.5"/></svg>Trends</button>
  <button class="tab" data-v="games"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Games</button>
  <button class="tab" data-v="teams"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/></svg>Teams</button>
</div></nav>

<div class="wrap">
  <div class="top">
    <div class="logo"><div class="logo-mark">R</div><h1>Research</h1></div>
    <div class="topr">
      <div class="seg" id="sportSeg"><button data-s="NBA">NBA</button><button data-s="NFL">NFL</button></div>
      <button class="iconbtn" id="dataBtn" aria-label="Data sources and freshness"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.6v.4"/></svg></button>
      <button class="iconbtn" id="themeBtn" aria-label="Switch light or dark"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg></button>
    </div>
  </div>
  <main>
    <section class="view" id="v-props"></section>
    <section class="view" id="v-trends" hidden></section>
    <section class="view" id="v-games" hidden></section>
    <section class="view" id="v-teams" hidden></section>
    <section class="view" id="v-data" hidden></section>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
// ---------------------------------------------------------------- basics
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const store = { get(k, d){ try { return localStorage.getItem(k) ?? d; } catch(e){ return d; } }, set(k, v){ try { localStorage.setItem(k, v); } catch(e){} } };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sgn = (x,d=1) => x == null || isNaN(x) ? "–" : (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(+x).toFixed(d);
const pctf = (a,b) => b ? Math.round(100*a/b) : null;
const price = p => p == null ? "" : (p > 0 ? "+" : "") + Math.round(p);
const fix = (x,d=1) => x == null || isNaN(x) ? "–" : (+x).toFixed(d);
const fmtLine = x => x == null ? "–" : (Number.isInteger(+x) ? String(+x) : (+x).toFixed(1));
const tipTime = s => { if (!s) return ""; const d = new Date(s); return isNaN(d) ? "" : d.toLocaleString(undefined,{weekday:"short",hour:"numeric",minute:"2-digit"}); };
const shortDate = s => { if (!s) return ""; const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString(undefined,{month:"short",day:"numeric"}); };
const nflTime = (d,t) => { if (!d) return ""; const [y,m,dd] = d.split("-").map(Number); const day = new Date(y,m-1,dd).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}); if (!t) return day; const [h,mi] = t.split(":").map(Number); return `${day} ${h%12||12}:${String(mi).padStart(2,"0")} ${h>=12?"PM":"AM"} ET`; };
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = "none", 2200); }
async function copyText(text){
  try { await navigator.clipboard.writeText(text); toast("Copied. Paste it into Claude."); return; } catch(e){}
  const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly",""); ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
  try { document.execCommand("copy"); toast("Copied. Paste it into Claude."); } catch(e){ prompt("Copy this:", text); }
  ta.remove();
}
const ord = n => n + (n % 100 >= 11 && n % 100 <= 13 ? "th" : ["th","st","nd","rd"][n % 10] || "th");
const recText = r => r ? `${r[0]}-${r[1]}${r[2] ? "-" + r[2] : ""}` : "–";
const recPct = r => r && r[0] + r[1] ? Math.round(1000*r[0]/(r[0]+r[1]))/10 : null;

// ---------------------------------------------------------------- logos, colors, headshots, tidy notes
const NBA_COLORS = {ATL:"#E03A3E",BOS:"#007A33",BKN:"#777D84",CHA:"#00788C",CHI:"#CE1141",CLE:"#860038",DAL:"#00538C",DEN:"#FEC524",DET:"#C8102E",GS:"#1D428A",
  HOU:"#CE1141",IND:"#FDBB30",LAC:"#C8102E",LAL:"#552583",MEM:"#5D76A9",MIA:"#98002E",MIL:"#00471B",MIN:"#236192",NO:"#B4975A",NY:"#F58426",OKC:"#007AC1",
  ORL:"#0077C0",PHI:"#006BB6",PHX:"#E56020",POR:"#E03A3E",SAC:"#5A2D81",SA:"#C4CED4",TOR:"#CE1141",UTAH:"#753BBD",WSH:"#E31837"};
const NBA_AB = {};          // full name -> abbreviation (filled from any loaded NBA file)
const NFL_META = {};        // abbreviation -> {name, nick, color, logo}
function absorbMeta(d){
  if (!d) return;
  if (d.abbr) Object.assign(NBA_AB, d.abbr);
  if (d.team_meta) Object.assign(NFL_META, d.team_meta);
}
function abOf(team){ if (!team) return ""; if (sport === "NBA") return NBA_AB[team] || team; return team; }
function logoUrl(team){
  if (!team) return "";
  if (sport === "NBA"){ const a = abOf(team); return a ? `https://a.espncdn.com/i/teamlogos/nba/500/${a.toLowerCase()}.png` : ""; }
  const m = NFL_META[team]; if (m && m.logo) return m.logo;
  const a = ({LA: "lar", WAS: "wsh"})[team] || team.toLowerCase();
  return `https://a.espncdn.com/i/teamlogos/nfl/500/${a}.png`;
}
function teamColor(team){ if (sport === "NBA") return NBA_COLORS[abOf(team)] || "var(--line-hi)"; const m = NFL_META[team]; return (m && m.color) || "var(--line-hi)"; }
const logo = (team, size = 24) => team ? `<img class="tlogo" src="${logoUrl(team)}" width="${size}" height="${size}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : "";
function headshotUrl(pid, espn){
  if (sport === "NBA") return `https://a.espncdn.com/i/headshots/nba/players/full/${pid}.png`;
  return espn ? `https://a.espncdn.com/i/headshots/nfl/players/full/${espn}.png` : "";
}
function avatar(name, pid, espn, team, big){
  const ini = String(name || "").split(" ").filter(Boolean).map(x => x[0]).slice(0, 2).join("");
  const u = headshotUrl(pid, espn);
  return `<span class="av${big ? " big" : ""}"><b>${esc(ini)}</b>${u ? `<img src="${u}" alt="" loading="lazy" onerror="this.remove()">` : ""}${team ? `<img class="tl" src="${logoUrl(team)}" alt="" loading="lazy" onerror="this.remove()">` : ""}</span>`;
}
const tint = (c, a = 0.28) => c && c.startsWith("#") ? c + Math.round(a * 255).toString(16).padStart(2, "0") : "transparent";
function skeleton(){ return `<div class="skel" aria-label="Loading"><i></i><i></i><i></i><i></i></div>`; }
function emptyBox(title, text){ return `<div class="empty"><b>${esc(title)}</b>${text}</div>`; }

// Longer explanations go into one "How this works" box at the bottom of each screen.
let tidying = false;
function tidyNotes(view){
  if (tidying || !view) return;
  const notes = [...view.querySelectorAll("p.note")].filter(p => !p.closest("details.how") && !p.closest("details.box") && !p.classList.contains("keep") && p.textContent.trim().length > 70);
  if (!notes.length) return;
  tidying = true;
  let how = view.querySelector(":scope > details.how");
  if (!how){ how = document.createElement("details"); how.className = "how"; how.innerHTML = `<summary>How this works</summary><div></div>`; view.appendChild(how); }
  const box = how.querySelector("div");
  for (const n of notes) box.appendChild(n);
  if (how !== view.lastElementChild) view.appendChild(how);
  tidying = false;
}
const tidyObs = new MutationObserver(muts => { const views = new Set(muts.map(m => m.target.closest ? m.target.closest(".view") : null).filter(Boolean)); clearTimeout(tidyObs.t); tidyObs.t = setTimeout(() => views.forEach(tidyNotes), 0); });

// theme: auto -> light -> dark
const THEMES = ["auto","light","dark"];
let theme = store.get("resTheme","auto");
const applyTheme = () => { if (theme === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", theme); };
applyTheme();
$("#themeBtn").onclick = () => { theme = THEMES[(THEMES.indexOf(theme)+1)%3]; store.set("resTheme", theme); applyTheme(); toast(theme === "auto" ? "Theme: follows your phone" : "Theme: " + theme); };

// state
let sport = store.get("resSport", "NBA");
let view = store.get("resView", "props");
const hv = location.hash.replace("#","");
if (["props","trends","games","teams"].includes(hv)) view = hv;
const cache = {};
async function load(kind){
  const key = `${sport.toLowerCase()}_${kind}`;
  if (cache[key]) return cache[key];
  const r = await fetch(`data/${key}.json?v=${Math.floor(Date.now()/600000)}`, {cache: "no-cache"});
  if (!r.ok) throw new Error(`${key}.json: ${r.status}`);
  cache[key] = await r.json();
  absorbMeta(cache[key]);
  return cache[key];
}

// ---------------------------------------------------------------- props: values and hit rates
const NFL_STAT = {receiving_yards:"recyd", receptions:"rec", rushing_yards:"rushyd", passing_yards:"passyd", pass_tds:"passtd", rush_rec_yards:null};
function statVal(P, log, mk){
  if (P.sport === "NBA") return (P.parts[mk] || [mk]).reduce((a,s) => a + (log[s]||0), 0);
  if (mk === "rush_rec_yards") return (log.rushyd||0) + (log.recyd||0);
  return log[NFL_STAT[mk]] ?? 0;
}
function hit(P, logs, mk, line, side){
  let h = 0, n = 0, push = 0, sum = 0;
  for (const l of logs){
    const v = statVal(P, l, mk); sum += v; n++;
    if (v === line) push++;
    else if (side === "over" ? v > line : v < line) h++;
  }
  return {h, n, push, avg: n ? sum/n : null, pct: n - push ? Math.round(100*h/(n-push)) : null};
}
function hrClass(pct){ return pct == null ? "" : pct > 50 ? "g" : pct < 50 ? "r" : ""; }
function seasonLabel(P, s){ return P.sport === "NBA" ? `${s-1}-${String(s).slice(2)}` : String(s); }
function windows(P, logs){
  const cur = P.season;
  const thisS = logs.filter(l => l.s === cur), lastS = logs.filter(l => l.s === cur - 1);
  const w = [["L5", logs.slice(-5)], ["L10", logs.slice(-10)], ["L20", logs.slice(-20)]];
  w.push([thisS.length ? seasonLabel(P, cur) : seasonLabel(P, cur) + " (none yet)", thisS]);
  w.push([seasonLabel(P, cur-1), lastS]);
  return w;
}

let propState = {game: "all", market: "all", q: "", side: "over", sort: "time"};
let detail = null;  // {pid, market, line, side, range}

function marketsFor(P, pl){
  if (P.sport === "NBA") return Object.keys(P.markets);
  const pos = pl.pos || "";
  if (pos === "QB") return ["passing_yards","pass_tds","rushing_yards"];
  if (pos === "RB") return ["rushing_yards","receiving_yards","receptions","rush_rec_yards"];
  return ["receiving_yards","receptions","rushing_yards"];
}

async function renderProps(){
  const el = $("#v-props");
  let P;
  try { P = await load("props"); } catch(e){ el.innerHTML = `<div class="empty">Couldn't load ${sport} props (${esc(e.message)}).</div>`; return; }
  P.sport = sport;
  if (detail) return renderPlayer(P);
  const props = P.props || [];
  if (!props.length){ el.innerHTML = emptyBox("No lines yet", `No ${sport} player prop lines are posted right now. DraftKings usually posts them a day or two before games.`); return; }
  const gameKey = p => sport === "NBA" ? p.event_id : p.game_id;
  const games = [];
  const seen = new Set();
  for (const p of props){ const k = gameKey(p); if (!seen.has(k)){ seen.add(k); games.push(p); } }
  const gLabel = p => { const ab = sport === "NBA" ? (P.abbr[p.team]||p.team) : p.team, ob = sport === "NBA" ? (P.abbr[p.opp]||p.opp) : p.opp; return p.home ? `${ob} @ ${ab}` : `${ab} @ ${ob}`; };
  const mks = [...new Set(props.map(p => p.market))];
  const S = propState;
  if (S.game !== "all" && !seen.has(S.game)) S.game = "all";
  if (S.market !== "all" && !mks.includes(S.market)) S.market = "all";
  let rows = props.filter(p => (S.game === "all" || gameKey(p) === S.game) && (S.market === "all" || p.market === S.market)
    && (!S.q || p.player.toLowerCase().includes(S.q.toLowerCase()) || (p.team||"").toLowerCase().includes(S.q.toLowerCase())));
  rows = rows.slice().sort((a,b) => (a.start||a.date||"").localeCompare(b.start||b.date||"") || (gameKey(a)+"").localeCompare(gameKey(b)+""));
  const withHR = rows.map(p => { const pl = P.players[p.pid] || {logs: []}; const l10 = hit(P, pl.logs.slice(-10), p.market, p.line, S.side); return {p, pl, l10}; });
  if (S.sort === "hit") withHR.sort((a,b) => (b.l10.pct ?? -1) - (a.l10.pct ?? -1));
  else if (S.sort === "name") withHR.sort((a,b) => a.p.player.localeCompare(b.p.player));
  else if (S.sort === "move") withHR.sort((a,b) => Math.abs(b.p.line - (b.p.open_line ?? b.p.line)) / Math.max(1, b.p.line) - Math.abs(a.p.line - (a.p.open_line ?? a.p.line)) / Math.max(1, a.p.line));
  const shown = withHR.slice(0, 250);
  el.innerHTML = `
    <div class="hero" style="--hc1:${sport === "NBA" ? "rgba(255,138,61,.18)" : "rgba(91,141,239,.2)"}">
      <h2>${sport} player props</h2>
      <div class="meta"><span>${props.length} DraftKings lines</span><span>${games.length} game${games.length === 1 ? "" : "s"}</span>${sport === "NFL" ? "<span>lines only, assume -110</span>" : ""}</div>
    </div>
    ${S.game === "all" && S.market === "all" && !S.q ? todayBoard(P, props) : ""}
    <div class="tools" style="margin-top:16px"><input id="pq" type="search" placeholder="Search player or team" value="${esc(S.q)}">
      <select id="psort" aria-label="Sort"><option value="time">Sort: game time</option><option value="hit">Sort: L10 hit rate</option><option value="name">Sort: name</option><option value="move">Sort: line moved most</option></select></div>
    <div class="chips" id="pgames"><button class="chip ${S.game==="all"?"on":""}" data-g="all">All games</button>${games.map(g => `<button class="chip ${S.game===gameKey(g)?"on":""}" data-g="${esc(gameKey(g))}">${esc(gLabel(g))}</button>`).join("")}</div>
    <div class="chips" id="pmk" style="margin-top:6px"><button class="chip ${S.market==="all"?"on":""}" data-m="all">All stats</button>${mks.map(m => `<button class="chip ${S.market===m?"on":""}" data-m="${m}">${esc(P.markets[m]||m)}</button>`).join("")}</div>
    <div class="tools" style="margin-top:8px;margin-bottom:6px"><div class="seg" id="pside"><button data-x="over" class="${S.side==="over"?"on":""}">Over hit %</button><button data-x="under" class="${S.side==="under"?"on":""}">Under hit %</button></div></div>
    <div class="plist">${shown.map(({p, pl, l10}) => {
      const ws = windows(P, pl.logs || []);
      const sw = ws[3][1].length ? [ws[3][0], ws[3][1]] : ws[4];
      const w = [ws[0], ws[1], ws[2], sw].map(([lab, lg]) => { const r = hit(P, lg, p.market, p.line, S.side); return `<div class="hr ${hrClass(r.pct)}"><b>${r.pct==null?"–":r.pct+"%"}</b><span>${esc(lab)}${r.n?` ${r.h}/${r.n-r.push}`:""}</span></div>`; }).join("");
      const opp = sport === "NBA" ? (P.abbr[p.opp]||p.opp) : p.opp;
      return `<button class="prow" data-pid="${esc(p.pid)}" data-m="${p.market}">
        ${avatar(p.player, p.pid, pl.espn, p.team)}<span class="nm">${esc(p.player)}</span><span class="ln">${p.open_line != null && p.open_line !== p.line ? `<span style="font:600 12px var(--font-body);color:var(--muted)">${fmtLine(p.open_line)}→</span>` : ""}${fmtLine(p.line)} <span style="font:600 12px var(--font-body);color:var(--muted)">${esc(P.markets[p.market]||p.market)}</span></span>
        <span class="sub">${esc(sport==="NBA"?(P.abbr[p.team]||p.team):p.team)} ${p.home?"vs":"@"} ${esc(opp)} · ${sport==="NBA" ? tipTime(p.start) : "Week " + (p.week||"")}${p.over!=null?` · o${price(p.over)} / u${price(p.under)}`:""}</span>
        <div class="hrs">${w}</div></button>`; }).join("")}</div>
    ${withHR.length > shown.length ? `<p class="note">Showing the first ${shown.length} of ${withHR.length}. Pick a game or stat to narrow it down.</p>` : ""}
    <p class="note">Hit rate = share of games the ${S.side} would have cashed at tonight's line (pushes left out). Green = above 50%. ${P.season ? "Season = " + seasonLabel(P, P.season) + "." : ""} This is history, not a prediction.</p>`;
  $("#psort").value = S.sort;
  $("#psort").onchange = e => { S.sort = e.target.value; renderProps(); };
  $("#pq").oninput = e => { S.q = e.target.value; clearTimeout(renderProps.t); renderProps.t = setTimeout(() => { renderProps().then(() => { const i = $("#pq"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }); }, 250); };
  $$("#pgames .chip").forEach(c => c.onclick = () => { S.game = c.dataset.g; renderProps(); });
  $$("#pmk .chip").forEach(c => c.onclick = () => { S.market = c.dataset.m; renderProps(); });

}

// Streaks at tonight's lines: the props whose over (or under) hit most often in the last 10. History, not picks.
function todayBoard(P, props){
  const rows = [];
  for (const p of props){
    const pl = P.players[p.pid]; if (!pl) continue;
    const lg = (pl.logs || []).slice(-10); if (lg.length < 8) continue;
    const r = hit(P, lg, p.market, p.line, "over"); if (r.pct == null) continue;
    rows.push({p, pl, r});
  }
  const hot = rows.filter(x => x.r.pct >= 70).sort((a, b) => b.r.pct - a.r.pct || b.r.n - a.r.n).slice(0, 10);
  const cold = rows.filter(x => x.r.pct <= 30).sort((a, b) => a.r.pct - b.r.pct || b.r.n - a.r.n).slice(0, 10);
  if (!hot.length && !cold.length) return "";
  const card = (x, kind) => { const k = x.r.n - x.r.push; const h = kind === "hot" ? x.r.h : k - x.r.h;
    return `<button class="tcard ${kind}" data-pid="${esc(x.p.pid)}" data-m="${x.p.market}" data-side="${kind === "hot" ? "over" : "under"}">
      <span class="who">${avatar(x.p.player, x.p.pid, x.pl.espn, x.p.team)}<span>${esc(x.p.player)}</span></span>
      <span class="big">${h}/${k}</span><span class="what">${kind === "hot" ? "Over" : "Under"} ${fmtLine(x.p.line)} ${esc((P.markets[x.p.market] || x.p.market).toLowerCase())} · last 10</span></button>`; };
  return `<div class="sec" style="margin-top:20px"><div class="sec-h"><h3>Streaks at tonight's lines</h3><span>history, not picks</span></div>
    ${hot.length ? `<div class="board2">${hot.map(x => card(x, "hot")).join("")}</div>` : ""}
    ${cold.length ? `<div class="board2" style="margin-top:8px">${cold.map(x => card(x, "cold")).join("")}</div>` : ""}
    <p class="note">Streaks = props where the over (green) or under (red) hit in 7+ of the player's last 10 games at tonight's line. Lines are usually set with these streaks in mind, so a streak alone is not an edge; tap one to see why it happened (minutes, teammates, opponents).</p></div>`;
}

function barChart(P, logs, mk, line, side){
  if (!logs.length) return `<div class="empty">No games in this range.</div>`;
  const W = Math.max(300, Math.min(820, (window.innerWidth || 375) - 52)), Hh = 200, L = 4, R = 4, T = 16, B = 40;
  const vals = logs.map(l => statVal(P, l, mk));
  const hi = Math.max(line * 1.25, ...vals, 1);
  const bw = (W - L - R) / logs.length;
  const y = v => T + (Hh - T - B) * (1 - v / hi);
  let bars = "";
  logs.forEach((l, i) => {
    const gap = Math.min(6, bw * 0.22), x = L + i * bw + gap / 2, w = Math.max(2, bw - gap), v = vals[i];
    const res = v === line ? "push" : (side === "over" ? v > line : v < line) ? "hit" : "miss";
    const col = res === "hit" ? "var(--bar-hit)" : res === "miss" ? "var(--bar-miss)" : "var(--muted)";
    const y0 = y(Math.max(v, hi*0.012));
    const label = P.sport === "NBA" ? shortDate(l.d) : `W${l.wk}`;
    const sub = P.sport === "NBA" ? `${l.min}m` : (l.snap != null ? Math.round(l.snap*100) + "%" : "");
    bars += `<g><title>${esc(P.sport==="NBA"?l.d:`${l.s} week ${l.wk}`)} ${l.h?"vs":"@"} ${esc(l.o)}: ${v}${P.sport==="NBA"?` (${l.min} min)`:l.snap!=null?` (${Math.round(l.snap*100)}% snaps)`:""}</title>
      <rect x="${x}" y="${y0}" width="${w}" height="${Hh - B - y0}" rx="3" fill="${col}"/>
      ${bw >= 13 ? `<text x="${x + w/2}" y="${y0 - 4}" text-anchor="middle" font-size="${bw >= 22 ? 11 : 9.5}" font-weight="700" fill="var(--ink)">${v}</text>` : ""}
      ${bw >= 17 ? `<text x="${x + w/2}" y="${Hh - B + 13}" text-anchor="middle" font-size="${bw >= 26 ? 9.5 : 8}" fill="var(--muted)">${esc(String(l.o).slice(0, 4))}</text>` : ""}
      ${bw >= 30 ? `<text x="${x + w/2}" y="${Hh - B + 24}" text-anchor="middle" font-size="9" fill="var(--faint)">${esc(label)}</text>
      <text x="${x + w/2}" y="${Hh - B + 35}" text-anchor="middle" font-size="9" fill="var(--faint)">${esc(sub)}</text>` : ""}</g>`;
  });
  const ly = y(line);
  return `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Last ${logs.length} games vs a line of ${line}">
    <line x1="${L}" x2="${W-R}" y1="${Hh-B}" y2="${Hh-B}" stroke="var(--grid)"/>
    ${bars}
    <line x1="${L}" x2="${W-R}" y1="${ly}" y2="${ly}" stroke="var(--gold)" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="${W-R}" y="${ly-4}" text-anchor="end" font-size="11" font-weight="800" fill="var(--gold-ink)">${fmtLine(line)}</text></svg>`;
}

function splitRow(P, label, logs, mk, line, side, note){
  const r = hit(P, logs, mk, line, side);
  return `<tr><td>${label}${note?`<br><small style="color:var(--muted)">${note}</small>`:""}</td><td>${r.n}</td><td>${r.n?fix(r.avg):"–"}</td><td><span class="pill ${hrClass(r.pct)}">${r.pct==null?"–":r.pct+"%"}</span>${r.n?`<br><small style="color:var(--muted)">${r.h}/${r.n-r.push}</small>`:""}</td></tr>`;
}

function renderPlayer(P){
  const el = $("#v-props");
  const pl = P.players[detail.pid];
  const myProps = P.props.filter(p => p.pid === detail.pid);
  if (!pl){ detail = null; return renderProps(); }
  const mk = detail.market;
  const prop = myProps.find(p => p.market === mk);
  const allLogs = pl.logs || [];
  if (detail.line == null){
    if (prop) detail.line = prop.line;
    else { const l10 = allLogs.slice(-10).map(l => statVal(P, l, mk)).sort((a,b)=>a-b); detail.line = l10.length ? Math.floor(l10[Math.floor(l10.length/2)]) + 0.5 : 0.5; }
  }
  const line = detail.line, side = detail.side;
  const step = P.sport === "NFL" && /yards/.test(mk) ? 5 : (mk === "pts" || mk === "pra" || mk === "pr" || mk === "pa") ? 1 : 0.5;
  const ctx = prop || myProps[0];
  const opp = ctx ? ctx.opp : null;
  const oppAb = P.sport === "NBA" ? (P.abbr[opp] || opp) : opp;
  const teamAb = P.sport === "NBA" ? (P.abbr[pl.team] || pl.team) : pl.team;
  const mList = marketsFor(P, pl);
  const lined = new Set(myProps.map(p => p.market));
  const ranges = {"L5": allLogs.slice(-5), "L10": allLogs.slice(-10), "L20": allLogs.slice(-20), "Season": allLogs.filter(l => l.s === P.season), "Last season": allLogs.filter(l => l.s === P.season - 1), "All": allLogs};
  const range = detail.range;
  const shown = range === "All" ? allLogs.slice(-60) : ranges[range];
  const w = windows(P, allLogs);
  const vsOpp = allLogs.filter(l => l.o === oppAb);
  const H = allLogs.filter(l => l.h), A = allLogs.filter(l => !l.h);
  const recent = allLogs.filter(l => l.s >= P.season - 1);

  // usage / minutes
  let usage = "";
  if (P.sport === "NBA"){
    const m5 = allLogs.slice(-5), mS = recent;
    const avg = (a, f) => a.length ? a.reduce((s,l)=>s+f(l),0)/a.length : null;
    const l10min = avg(allLogs.slice(-10), l => l.min);
    const thr = l10min ? Math.round(l10min) : 30;
    usage = `<div class="kv">

      <div>3PA last 10 / season</div><div>${fix(avg(allLogs.slice(-10), l=>l.fg3a))} / ${fix(avg(mS, l=>l.fg3a))}</div></div>`;
    detail.minThr = thr;
  } else {
    const avg = (a, f) => { const v = a.map(f).filter(x => x != null); return v.length ? v.reduce((s,x)=>s+x,0)/v.length : null; };
    const cur = allLogs.filter(l => l.s === P.season);
    usage = `<div class="kv">
      <div>Snap share, last 3</div><div>${fix(100*(avg(allLogs.slice(-3), l=>l.snap)||0),0)}%</div>
      <div>Snap share, ${P.season}</div><div>${fix(100*(avg(cur, l=>l.snap)||0),0)}%</div>
      ${pl.pos !== "QB" ? `<div>Target share, last 3</div><div>${fix(100*(avg(allLogs.slice(-3), l=>l.ts)||0),1)}%</div>
      <div>Target share, ${P.season}</div><div>${fix(100*(avg(cur, l=>l.ts)||0),1)}%</div>
      <div>Targets / game, last 3 · ${P.season}</div><div>${fix(avg(allLogs.slice(-3), l=>l.tgt))} · ${fix(avg(cur, l=>l.tgt))}</div>
      <div>Carries / game, last 3 · ${P.season}</div><div>${fix(avg(allLogs.slice(-3), l=>l.car))} · ${fix(avg(cur, l=>l.car))}</div>` :
      `<div>Pass attempts / game, last 3 · ${P.season}</div><div>${fix(avg(allLogs.slice(-3), l=>l.att))} · ${fix(avg(cur, l=>l.att))}</div>
      <div>Carries / game, last 3 · ${P.season}</div><div>${fix(avg(allLogs.slice(-3), l=>l.car))} · ${fix(avg(cur, l=>l.car))}</div>`}</div>`;
  }

  // splits
  const sr = (lab, lg, note) => splitRow(P, lab, lg, mk, line, side, note);
  let splits = sr("All games (last 3 seasons)", allLogs) + sr("Home", H) + sr("Away", A) + sr(`vs ${esc(oppAb||"opponent")}`, vsOpp);
  (pl.keys || []).forEach((k, i) => {
    const withK = allLogs.filter(l => l.w && l.w[i] === "1"), without = allLogs.filter(l => l.w && l.w[i] === "0");
    splits += sr(`With ${esc(k.name)}`, withK) + sr(`Without ${esc(k.name)}`, without);
  });
  if (P.sport === "NBA"){
    splits += sr("Back-to-back", allLogs.filter(l => l.r === 1)) + sr("1 day of rest", allLogs.filter(l => l.r === 2)) + sr("2+ days of rest", allLogs.filter(l => l.r >= 3));
    const t = detail.minThr;
    splits += sr(`Played ${t}+ minutes`, allLogs.filter(l => l.min >= t), "his last-10 average") + sr(`Under ${t} minutes`, allLogs.filter(l => l.min < t));
    splits += sr("Started", allLogs.filter(l => l.st)) + sr("Came off the bench", allLogs.filter(l => !l.st));
  } else {
    splits += sr("Short week (5 days or less)", allLogs.filter(l => l.r != null && l.r <= 5)) + sr("Normal week (6-8 days)", allLogs.filter(l => l.r >= 6 && l.r <= 8)) + sr("Off a bye / extra rest (9+)", allLogs.filter(l => l.r >= 9));
    const snaps = allLogs.map(l => l.snap).filter(x => x != null);
    const s3 = allLogs.slice(-5).map(l => l.snap).filter(x => x != null);
    const thr = s3.length ? Math.round(100*s3.reduce((a,b)=>a+b,0)/s3.length) : 70;
    if (snaps.length) splits += sr(`Snap share ${thr}%+`, allLogs.filter(l => l.snap != null && l.snap*100 >= thr), "his last-5 average") + sr(`Snap share under ${thr}%`, allLogs.filter(l => l.snap != null && l.snap*100 < thr));
    if (pl.pos !== "QB"){
      const ts = allLogs.slice(-5).map(l => l.ts).filter(x => x != null);
      const tthr = ts.length ? Math.round(1000*ts.reduce((a,b)=>a+b,0)/ts.length)/10 : 15;
      splits += sr(`Target share ${tthr}%+`, allLogs.filter(l => l.ts != null && l.ts*100 >= tthr), "his last-5 average") + sr(`Target share under ${tthr}%`, allLogs.filter(l => l.ts != null && l.ts*100 < tthr));
    }
  }

  // game environment: tonight's spread / total / implied team total, and his games in similar spots
  const env = (ctx && ctx.env) || {};
  let envHtml = "";
  if (env.line != null || env.total != null){
    const itt = l => l.tl == null || l.tt == null ? null : l.tt / 2 - l.tl / 2;
    if (env.line != null){
      splits += sr(env.line < 0 ? "Team favored (like tonight)" : "Team an underdog (like tonight)", allLogs.filter(l => l.tl != null && (env.line < 0 ? l.tl < 0 : l.tl > 0)))
        + sr(env.line < 0 ? "Team an underdog" : "Team favored", allLogs.filter(l => l.tl != null && (env.line < 0 ? l.tl > 0 : l.tl < 0)));
    }
    if (env.itt != null){
      splits += sr(`Team expected to score ${fmtLine(env.itt)}+`, allLogs.filter(l => itt(l) != null && itt(l) >= env.itt), "tonight's implied team total")
        + sr(`Team expected under ${fmtLine(env.itt)}`, allLogs.filter(l => itt(l) != null && itt(l) < env.itt));
    }
    envHtml = `<div class="kv"><div>Team spread tonight</div><div>${env.line == null ? "–" : (env.line > 0 ? "+" : "") + fmtLine(env.line)}</div>
      <div>Game total</div><div>${fmtLine(env.total)}</div><div>Implied team total</div><div>${env.itt == null ? "–" : fix(env.itt)}</div>
      ${env.qb ? `<div>Expected starting QB</div><div>${esc(env.qb)}</div>` : ""}</div>`;
  }
  if (P.sport === "NFL" && env.qb){
    const withQb = allLogs.filter(l => l.qb === env.qb), other = allLogs.filter(l => l.qb && l.qb !== env.qb);
    if (withQb.length && other.length) splits += sr(`With ${esc(env.qb)} at QB`, withQb) + sr("With a different QB", other);
  }

  // line ladder: hit rates at nearby lines (the "results at multiple lines" view)
  const lstep = step < 1 ? 1 : step;
  const ladder = [-3, -2, -1, 0, 1, 2, 3].map(k => +(line + k * lstep).toFixed(1)).filter(x => x > 0);
  const lw = [["L5", allLogs.slice(-5)], ["L10", allLogs.slice(-10)], ["L20", allLogs.slice(-20)], [allLogs.some(l => l.s === P.season) ? seasonLabel(P, P.season) : seasonLabel(P, P.season - 1), allLogs.some(l => l.s === P.season) ? allLogs.filter(l => l.s === P.season) : allLogs.filter(l => l.s === P.season - 1)]];
  const ladderHtml = `<div class="twrap"><table class="t"><tr><th>${side === "over" ? "Over" : "Under"}</th>${lw.map(([l]) => `<th>${esc(l)}</th>`).join("")}</tr>
    ${ladder.map(x => `<tr${x === line ? ' style="background:var(--gold-bg)"' : ""}><td><b>${fmtLine(x)}</b>${prop && x === prop.line ? ' <span class="tag">posted</span>' : ""}</td>${lw.map(([, lg]) => { const r = hit(P, lg, mk, x, side); return `<td><span class="pill ${hrClass(r.pct)}">${r.pct == null ? "–" : r.pct + "%"}</span></td>`; }).join("")}</tr>`).join("")}</table></div>`;

  // efficiency
  const effWin = [["L5", allLogs.slice(-5)], ["L10", allLogs.slice(-10)], ["Last 2 seasons", recent]];
  const sumF = (a, f) => a.reduce((x, l) => x + (f(l) || 0), 0);
  const ratio = (a, f, g, mult = 1, d = 1) => { const b = sumF(a, g); return b ? fix(mult * sumF(a, f) / b, d) : "–"; };
  let effRows;
  if (P.sport === "NBA"){

      ["Shots (FGA) per 36", a => ratio(a, l => l.fga, l => l.min, 36)], ["3-pointers made / tried", a => a.length ? `${fix(sumF(a, l => l.fg3m)/a.length)} / ${fix(sumF(a, l => l.fg3a)/a.length)}` : "–"],

  } else if (pl.pos === "QB"){

      ["TD passes per game", a => a.length ? fix(sumF(a, l => l.passtd)/a.length, 2) : "–"], ["Yards per carry", a => ratio(a, l => l.rushyd, l => l.car)]];
  } else {
    effRows = [["Catch rate", a => ratio(a, l => l.rec, l => l.tgt, 100, 0) + "%"], ["Yards per target", a => ratio(a, l => l.recyd, l => l.tgt)], ["Yards per catch", a => ratio(a, l => l.recyd, l => l.rec)],
      ["Targets per game", a => a.length ? fix(sumF(a, l => l.tgt)/a.length) : "–"], ["Yards per carry", a => ratio(a, l => l.rushyd, l => l.car)], ["Carries per game", a => a.length ? fix(sumF(a, l => l.car)/a.length) : "–"],
      ["Touchdowns per game", a => a.length ? fix(sumF(a, l => l.td)/a.length, 2) : "–"]];
  }
  const effHtml = `<div class="twrap"><table class="t"><tr><th></th>${effWin.map(([l]) => `<th>${esc(l)}</th>`).join("")}</tr>${effRows.map(([l, f]) => `<tr><td>${esc(l)}</td>${effWin.map(([, a]) => `<td>${f(a)}</td>`).join("")}</tr>`).join("")}</table></div>`;

  // NFL: man vs zone coverage (context only in the NFL model's backtest)
  let covHtml = "";
  if (P.sport === "NFL" && P.coverage && P.coverage[detail.pid] && pl.pos !== "QB"){
    const c = P.coverage[detail.pid], mr = (P.man_rate || {})[opp];

    covHtml = `<div class="kv"><div>Vs man coverage (${c.s})</div><div>${ypr(c.ym, c.rm)} yds/route · ${tpr(c.tm, c.rm)} targeted · ${Math.round(c.rm)} routes</div>
      <div>Vs zone coverage (${c.s})</div><div>${ypr(c.yz, c.rz)} yds/route · ${tpr(c.tz, c.rz)} targeted · ${Math.round(c.rz)} routes</div>
      ${mr != null ? `<div>${esc(opp)} plays man (${P.coverage_season})</div><div>${Math.round(100 * mr)}% of dropbacks</div>` : ""}</div>
      <p class="note">nflverse coverage charting. The NFL model found it didn't improve projections, so treat it as context.</p>`;
  }

  // injury status
  const inj = ctx && ctx.inj;
  const injTxt = inj ? [inj.live || inj.status, inj.practice ? inj.practice.replace(" in Practice", "").replace("Participation", "practice") : null, inj.injury].filter(Boolean).join(" · ") : "";

  // his own past lines
  const withLines = allLogs.filter(l => l.L && l.L[mk] != null);
  let own = "";
  if (withLines.length){
    let o = 0, u = 0, p = 0;
    withLines.forEach(l => { const v = statVal(P, l, mk); if (v > l.L[mk]) o++; else if (v < l.L[mk]) u++; else p++; });
    own = `<div class="sec"><div class="sec-h"><h3>Vs. his own lines</h3><span>${withLines.length} past games with a posted ${esc(P.markets[mk])} line</span></div>
      <div class="card"><div class="kv"><div>Went over his line</div><div>${o} of ${o+u} (${pctf(o,o+u) ?? "–"}%)</div><div>Went under</div><div>${u}${p?` · ${p} push`:""}</div>
      <div>Last 5 lines</div><div>${withLines.slice(-5).map(l => `${fmtLine(l.L[mk])}→${statVal(P,l,mk)}`).join(", ")}</div></div></div></div>`;
  }

  // league hit rate near this line
  let lr = "";
  const rates = (P.line_rates || {})[mk];
  if (rates && rates.length){
    const win = P.sport === "NBA" ? (step >= 1 ? 1.5 : 0.5) : Math.max(1, line * 0.08);
    let n = 0, ov = 0, pu = 0;
    rates.forEach(([l, nn, o, pp]) => { if (Math.abs(l - line) <= win + 1e-9){ n += nn; ov += o; pu += pp; } });
    if (n) lr = `<div class="kv"><div>All players, lines ${fmtLine(line - win)} to ${fmtLine(line + win)}</div><div>${pctf(ov, n - pu)}% over · ${n} props</div></div>`;
  }

  // opponent / defense
  let oppHtml = "";
  if (P.sport === "NBA" && P.opp && P.opp[oppAb]){
    const parts = P.parts[mk] || [mk];
    oppHtml = `<div class="kv">${parts.map(s => { const o = P.opp[oppAb][s]; return `<div>${esc(oppAb)} allows ${esc(P.markets[s])} per game</div><div>${fix(o.pg)} (${sgn(o.rel)}% vs avg, ${ord(o.rank)} most of 30)</div>`; }).join("")}</div>`;
  } else if (P.sport === "NFL" && P.defense && P.defense.allowed[opp]){

// ---------------------------------------------------------------- "why didn't the model like this?" (props)
function nbaTierNeed(P, prop){
  const t = (P.settings || {}).tiers || {light_lean:.04, lean:.06, one_unit:.09, two_unit:.13};
  const playable = ((P.settings || {}).play_markets || []).includes(prop.market);
  return {t, playable};
}
function modelBox(P, prop, pl, r10){
  const m = prop.model || {};
  let body = "";
  if (P.sport === "NBA"){
    const {t, playable} = nbaTierNeed(P, prop);
    body = `<div class="kv">
      <div>Model projection</div><div>${fix(m.proj, 1)} ${esc(P.markets[prop.market])}</div>
      <div>&nbsp;· from player stats alone</div><div>${fix(m.proj_model,1)}</div>
      <div>&nbsp;· the book's implied average</div><div>${fix(m.proj_market,1)}</div>
      <div>&nbsp;· weight on the book's number (early season)</div><div>${m.line_share!=null?Math.round(100*m.line_share)+"%":"–"}</div>
      <div>Games played this season</div><div>${m.season_games ?? "–"}</div>
      <div>Projected minutes</div><div>${fix(m.proj_min,1)}</div>
      <div>Opponent factor for this stat</div><div>${m.opp_factor!=null?"×"+fix(m.opp_factor,2):"–"}</div>
      <div>Teammates' missing usage (out tonight)</div><div>${m.out_share!=null?Math.round(100*m.out_share)+"%":"–"}</div>
      <div>Chance he plays</div><div>${m.play_prob!=null?Math.round(100*m.play_prob)+"%":"–"}</div>
      <div>Model's chance of the over</div><div>${m.p_over!=null?Math.round(100*m.p_over)+"%":"–"}</div>
      <div>Book's chance of the over (no vig)</div><div>${m.mkt_over!=null?Math.round(100*m.mkt_over)+"%":"–"}</div>
      <div>Edge (model vs book)</div><div>${m.edge!=null?(100*m.edge).toFixed(1)+"% on the "+esc(m.pick||""):"–"}</div>
      <div>Model's verdict</div><div>${esc(m.tier || "No play")}</div></div>
      <p class="note">The NBA model needs a ${Math.round(100*t.light_lean)}% edge for a light lean, ${Math.round(100*t.lean)}% lean, ${Math.round(100*t.one_unit)}% 1U, ${Math.round(100*t.two_unit)}% 2U.
      ${playable ? "" : `It only makes plays on ${((P.settings||{}).play_markets||[]).map(x=>P.markets[x]).join(", ")} (its backtest lost on the others), so ${esc(P.markets[prop.market])} is shown for reference only.`}
      ${m.note ? " Note: " + esc(m.note) : ""}</p>`;
  } else {
    const c = prop.ctx || {};
    const pickSide = m.side;
    body = `<div class="kv">
      <div>Model projection (stats)</div><div>${fix(m.proj,1)}</div>
      <div>Line-implied average</div><div>${fix(m.implied,1)}</div>
      <div>Calibrated projection</div><div>${fix(m.cal_proj,1)}</div>
      <div>Model's chance over / under</div><div>${m.p_over!=null?Math.round(100*m.p_over):"–"}% / ${m.p_under!=null?Math.round(100*m.p_under):"–"}%</div>
      <div>Calibrated chance over / under</div><div>${m.cal_p_over!=null?Math.round(100*m.cal_p_over):"–"}% / ${m.cal_p_under!=null?Math.round(100*m.cal_p_under):"–"}%</div>
      <div>Model's side</div><div>${esc(pickSide||"–")} ${m.prob!=null?Math.round(100*m.prob)+"%":""}</div>
      <div>Model's verdict</div><div>${esc(m.tier ? ({play3:"3U",play1:"1U",lean:"Lean",light:"Light lean"}[m.tier]||m.tier) : "No play")}</div>
      ${c.tgt_share!=null && pl.pos!=="QB" ? `<div>Target share (model input)</div><div>${fix(100*c.tgt_share,1)}%</div><div>Targets expected</div><div>${fix(c.targets,1)}</div><div>Yards per target</div><div>${fix(c.ypt,1)}</div><div>aDOT</div><div>${fix(c.adot,1)}</div>`:""}
      ${c.car_share!=null ? `<div>Carry share · carries expected</div><div>${fix(100*c.car_share,0)}% · ${fix(c.carries,1)}</div><div>Yards per carry</div><div>${fix(c.ypc,1)}</div>`:""}
      ${c.def_ypt_rel!=null ? `<div>Defense vs avg: yds/target · yds/carry · yds/att</div><div>${sgn(100*c.def_ypt_rel,0)}% · ${sgn(100*c.def_ypc_rel,0)}% · ${sgn(100*(c.def_ypa_rel||0),0)}%</div>`:""}
      ${c.team_pts!=null ? `<div>Team's expected points</div><div>${fix(c.team_pts,1)}</div>`:""}
      </div>
      <p class="note">NFL prop tiers: ${(P.tiers||[]).map(t => `${esc({play3:"3U",play1:"1U",lean:"Lean",light:"Light lean"}[t.tier]||t.tier)}: ${esc(t.rule)}`).join("; ")}. Passing yards never get a tier.${(prop.alerts||[]).length ? " Alerts: " + prop.alerts.map(esc).join("; ") : ""}</p>`;
  }
  return `<details class="box gold"><summary>Why didn't the model like this? The model's numbers</summary><div>${body}
    <div style="margin-top:12px"><button class="btn gold" id="copyProp">Copy question for Claude</button></div></div></details>`;
}

function propQuestion(P, prop, pl){
  const mk = prop.market, name = P.markets[mk], logs = pl.logs || [];
  const oppAb = P.sport === "NBA" ? (P.abbr[prop.opp] || prop.opp) : prop.opp;
  const hr = (lab, lg) => { const o = hit(P, lg, mk, prop.line, "over"); return o.n ? `${lab} ${o.h}/${o.n - o.push} over (avg ${fix(o.avg)})` : `${lab} no games`; };
  const w = windows(P, logs).filter(([lab, lg]) => lg.length).map(([lab, lg]) => hr(lab, lg)).join("; ");
  const vs = hr(`vs ${oppAb}`, logs.filter(l => l.o === oppAb));
  const m = prop.model || {};
  let model;
  if (P.sport === "NBA") model = `The NBA model projects ${fix(m.proj)} (stats model ${fix(m.proj_model)}, book-implied ${fix(m.proj_market)}, ${Math.round(100*(m.line_share||0))}% weight on the book this early), ${Math.round(100*(m.p_over||0))}% over vs the book's ${Math.round(100*(m.mkt_over||0))}% no-vig, edge ${(100*(m.edge||0)).toFixed(1)}% on the ${m.pick||"?"}, verdict: ${m.tier||"no play"}. Projected minutes ${fix(m.proj_min)}, opponent factor ${fix(m.opp_factor,2)}.`;
  else model = `The NFL model projects ${fix(m.proj)} (line-implied ${fix(m.implied)}, calibrated ${fix(m.cal_proj)}), ${Math.round(100*(m.p_over||0))}% over / ${Math.round(100*(m.p_under||0))}% under, side ${m.side||"?"}, verdict: ${m.tier||"no play"}.`;
  const keys = (pl.keys || []).map((k, i) => { const wk = logs.filter(l => l.w && l.w[i] === "1"), wo = logs.filter(l => l.w && l.w[i] === "0"); const a = hit(P, wk, mk, prop.line, "over"), b = hit(P, wo, mk, prop.line, "over"); return `${k.name}: with ${a.n ? fix(a.avg) + " avg" : "–"}, without ${b.n ? fix(b.avg) + " avg (" + b.n + " games)" : "no games"}`; }).join("; ");
  const sim = prop.similar ? `Similar players vs ${oppAb}: ${prop.similar.vs_pct == null ? "no games" : sgn(prop.similar.vs_pct) + "% vs their usual over " + prop.similar.vs_n + " games"}.` : "";
  const when = P.sport === "NBA" ? tipTime(prop.start) : `week ${prop.week}`;
  return `I'm handicapping an ${P.sport} player prop and want a second opinion (I make my own decisions).
${pl.name} (${pl.team}) ${name} ${fmtLine(prop.line)}${prop.over != null ? ` (over ${price(prop.over)} / under ${price(prop.under)})` : ""}${prop.open_line != null && prop.open_line !== prop.line ? `, opened ${fmtLine(prop.open_line)}` : ""}, ${prop.home ? "vs" : "@"} ${prop.opp}, ${when}.
Hit rate vs ${fmtLine(prop.line)}: ${w}; ${vs}.
Key teammates: ${keys || "n/a"}.
${sim}
${model}
What's the best case for the over and for the under, what might the model be missing, and what news or matchup details should I check before deciding?`;
}

// ---------------------------------------------------------------- trends
let trendState = {mode: "spots", sit: "home_dog", scope: "win", sort: "pct"};
// Recent windows: a team's last N games in a spot ("last 10 road games"), not the spot within its last N games.
const WINDOWS = [3, 5, 10, 15, 20];
let win = +store.get("resWin", "10");
if (!WINDOWS.includes(win)) win = 10;
function winRec(T, team, key, n = win){
  const r = ((T.recent || {})[team] || {})[key];
  if (!r) return null;
  const a = r.a.slice(-n), o = r.o.slice(-n), s = r.s.slice(-n), m = r.m.slice(-n);
  const c = (str, ch) => [...str].filter(x => x === ch).length;
  const ml = m.filter(x => x != null);
  return {n: a.length, ats: [c(a,"W"), c(a,"L"), c(a,"P")], ou: [c(o,"O"), c(o,"U"), c(o,"P")], su: [c(s,"W"), c(s,"L"), c(s,"T")],
          ml: [ml.length, ml.reduce((x, y) => x + y, 0)], form: a};
}
function winChips(id){
  return `<div class="chips" id="${id}" style="margin-bottom:10px">${WINDOWS.map(n => `<button class="chip ${n===win?"on":""}" data-n="${n}">Last ${n}</button>`).join("")}</div>`;
}
function wireWin(id, rerender){ $$(`#${id} .chip`).forEach(c => c.onclick = () => { win = +c.dataset.n; store.set("resWin", String(win)); rerender(); }); }
const atsCls = r => { const p = recPct(r); return p == null ? "" : p > 52.4 ? "g" : p < 47.6 ? "r" : ""; };
const sampleNote = r => r && r.n < win ? `only ${r.n} game${r.n === 1 ? "" : "s"}` : `last ${win}`;
const mlCls = u => u > 0 ? "pos" : u < 0 ? "neg" : "";

function leagueSeasons(T, key, both){
  const by = (T.league_by_season || {})[key] || {};
  const rows = [T.season, T.season - 1].filter(s => by[s] && (by[s].ats[0] + by[s].ats[1] + by[s].ou[0] + by[s].ou[1]) > 0);
  const all = T.league[key];
  const sm = x => `<br><small style="color:var(--muted)">${x}</small>`;
  const row = (lab, r, small) => `<tr${small ? ' class="sub"' : ""}><td>${esc(lab)}</td><td>${both ? "–" : recText(r.ats) + sm((recPct(r.ats) ?? "–") + "%")}</td><td>${recText(r.ou) + sm((recPct(r.ou) ?? "–") + "% over")}</td><td class="${mlCls(r.ml && r.ml[1])}">${both || !r.ml || !r.ml[0] ? "–" : sgn(100*r.ml[1]/r.ml[0]) + "%"}</td></tr>`;
  return `<div class="twrap"><table class="t"><tr><th>League</th><th>ATS</th><th>O/U</th><th>ML ROI</th></tr>
    ${rows.map(s => row(T.season_labels[s] || s, by[s])).join("")}
    ${row(`${T.season_labels[T.first_season]} to now`, all, true)}</table></div>`;
}

function wireTmode(){ $$("#tmode button").forEach(b => b.onclick = () => { trendState.mode = b.dataset.x; renderTrends(); }); }
async function renderTrends(){
  const el = $("#v-trends");
  let T;
  try { T = await load("trends"); } catch(e){ el.innerHTML = `<div class="empty">Couldn't load ${sport} trends (${esc(e.message)}).</div>`; return; }
  const S = trendState;
  const ab = t => T.abbr && T.abbr[t] ? T.abbr[t] : t;
  const sitBy = Object.fromEntries(T.situations.map(s => [s.key, s]));
  if (!sitBy[S.sit]) S.sit = "home";
  const head = `<div class="sec-h"><h2>${sport} trends</h2><span>ATS, moneyline and over/under</span></div>
    <div class="seg" id="tmode" style="margin-bottom:10px"><button data-x="spots" class="${S.mode==="spots"?"on":""}">${sport==="NBA"?"Tonight":"This week"}</button><button data-x="table" class="${S.mode==="table"?"on":""}">Situations</button><button data-x="finder" class="${S.mode==="finder"?"on":""}">Trend Finder</button></div>`;
  if (S.mode === "finder"){ el.innerHTML = head; wireTmode(); return renderFinder(el, head).then(wireTmode); }
  let body = "";
  if (S.mode === "spots"){
    body += winChips("twin");
    const ups = T.upcoming || [];
    if (!ups.length) body += `<div class="empty">No upcoming ${sport} games found.</div>`;
    const byDate = {};
    ups.forEach(u => (byDate[u.date] = byDate[u.date] || []).push(u));
    const dates = Object.keys(byDate).sort();
    S.date = dates.includes(S.date) ? S.date : dates[0];
    if (dates.length > 1) body += `<div class="chips" id="tdates" style="margin-bottom:10px">${dates.map(d => `<button class="chip ${d===S.date?"on":""}" data-d="${d}">${shortDate(d)}</button>`).join("")}</div>`;
    body += (byDate[S.date] || []).map(u => {
      const sitRow = (team, key) => {
        const s = sitBy[key]; if (!s) return "";
        const r = winRec(T, team, key), all = (T.teams[team] || {})[key];
        const lgS = ((T.league_by_season || {})[key] || {})[T.season], lgL = ((T.league_by_season || {})[key] || {})[T.season - 1];

  if ($("#tsort")){ $("#tsort").value = S.sort; $("#tsort").onchange = e => { S.sort = e.target.value; renderTrends(); }; }
}

// ---------------------------------------------------------------- trend finder
// Build your own trend: combine conditions and get the exact record of every game that matched
// (not separate percentages multiplied together), season by season, with the full game log.
let finder = null;     // filter state per sport
let finderShow = 50;
function finderDefaults(FD){
  const seasons = Object.keys(FD.season_labels).map(Number);
  return {team: "any", opp: "any", from: Math.min(...seasons), to: Math.max(...seasons), last: "all",
          venue: "any", role: "any", spMin: "", spMax: "", totMin: "", totMax: "", div: "any", conf: "any",
          rest: "any", orest: "any", restEdge: "any", prev: "any", prevBy: sport === "NBA" ? 15 : 14,
          su: "any", ats: "any", ou: "any", orec: "any", trec: "any", road: "any", part: "any", move: "any",
          kick: "any", roof: "any", surf: "any", temp: "any", wind: "any", coach: "any", ref: "any", qb: "any", pot: "any"};
}
const FINDER_PRESETS = {
  NFL: [["Division game, total 45+", {div: "yes", totMin: "45"}], ["Home dog vs team on a short week", {venue: "home", role: "dog", orest: "short"}],
        ["Road favorite off a bye", {venue: "away", role: "fav", rest: "bye"}], ["Outdoors, wind 15+ mph", {roof: "outdoors", wind: "15"}],
        ["After 2+ straight losses, underdog", {su: "l2", role: "dog"}], ["Thursday games", {kick: "thu"}], ["Favored by 7+", {spMax: "-7"}]],
  NBA: [["Back-to-back road dog", {venue: "away", role: "dog", rest: "b2b"}], ["Home dog vs team on a back-to-back", {venue: "home", role: "dog", orest: "b2b"}],
        ["After 2+ straight ATS losses", {ats: "l2"}], ["Line moved 1+ toward team", {move: "toward"}], ["Division game, total 230+", {div: "yes", totMin: "230"}],
        ["Favored by 10+", {spMax: "-10"}], ["After a 15+ point loss", {prev: "lostby"}]],
};
function wilson(w, n){
  if (!n) return null;
  const z = 1.96, p = w / n, d = 1 + z*z/n, c = p + z*z/(2*n), m = z * Math.sqrt(p*(1-p)/n + z*z/(4*n*n));
  return [Math.round(100*(c - m)/d), Math.round(100*(c + m)/d)];
}
function finderMatch(FD, F){
  const C = Object.fromEntries(FD.cols.map((c, i) => [c, i]));
  const L = FD.lists || {}, teams = FD.teams;
  const tIdx = F.team === "any" ? null : teams.indexOf(F.team), oIdx = F.opp === "any" ? null : teams.indexOf(F.opp);
  const num = v => v === "" || v == null ? null : +v;
  const spMin = num(F.spMin), spMax = num(F.spMax), totMin = num(F.totMin), totMax = num(F.totMax);
  const confOf = FD.conf || {}, divOf = FD.division || {};
  const isNBA = sport === "NBA";
  const restOk = (r, v) => {
    if (v === "any") return true; if (r == null) return false;
    if (isNBA) return v === "b2b" ? r === 1 : v === "one" ? r === 2 : v === "two" ? r >= 3 : true;
    return v === "short" ? r <= 5 : v === "normal" ? r >= 6 && r <= 8 : v === "extra" ? r >= 9 : v === "bye" ? r >= 13 : true;
  };
  const out = [];
  for (const row of FD.rows){
    const g = k => row[C[k]];
    const s = g("s");
    if (s < F.from || s > F.to) continue;
    if (tIdx != null && g("t") !== tIdx) continue;
    if (oIdx != null && g("o") !== oIdx) continue;
    const line = g("line"), tot = g("tot");
    if (F.venue !== "any" && (F.venue === "home") !== !!g("h")) continue;
    if (F.role === "fav" && !(line < 0)) continue;
    if (F.role === "dog" && !(line > 0)) continue;
    if (spMin != null && !(line != null && line >= spMin)) continue;
    if (spMax != null && !(line != null && line <= spMax)) continue;
    if (totMin != null && !(tot != null && tot >= totMin)) continue;
    if (totMax != null && !(tot != null && tot <= totMax)) continue;
    if (F.div !== "any" && (F.div === "yes") !== !!g("div")) continue;
    if (F.conf !== "any"){ const same = confOf[teams[g("t")]] && confOf[teams[g("t")]] === confOf[teams[g("o")]]; if ((F.conf === "yes") !== !!same) continue; }
    if (!restOk(g("r"), F.rest) || !restOk(g("or"), F.orest)) continue;
    if (F.restEdge !== "any"){ const r = g("r"), o = g("or"); if (r == null || o == null) continue; const a = isNBA ? Math.min(r, 4) : r, b = isNBA ? Math.min(o, 4) : o; if (F.restEdge === "more" ? !(a > b) : !(a < b)) continue; }
    const pm = g("pm");
    if (F.prev !== "any"){ if (pm == null) continue; const by = +F.prevBy || 0;
      if (F.prev === "won" && !(pm > 0)) continue; if (F.prev === "lost" && !(pm < 0)) continue;
      if (F.prev === "wonby" && !(pm >= by)) continue; if (F.prev === "lostby" && !(pm <= -by)) continue; }
    const st = (k, v) => { if (v === "any") return true; const x = g(k), n = +v.slice(1); return v[0] === "w" ? x >= n : x <= -n; };
    if (!st("su_st", F.su) || !st("ats_st", F.ats) || !st("ou_st", F.ou)) continue;
    if (F.orec !== "any"){ const p = g("op"); if (p == null) continue; if (F.orec === "win" ? !(p >= 0.5) : !(p < 0.5)) continue; }
    if (F.trec !== "any"){ const p = g("tp"); if (p == null) continue; if (F.trec === "win" ? !(p >= 0.5) : !(p < 0.5)) continue; }
    if (F.road !== "any" && !(g("rr") >= +F.road)) continue;
    if (F.part !== "any"){
      const gn = isNBA ? g("gn") : g("wk");
      const [a, b] = isNBA ? {early: [1, 20], mid: [21, 60], late: [61, 99]}[F.part] : {early: [1, 6], mid: [7, 12], late: [13, 99]}[F.part];
      if (gn < a || gn > b) continue;
    }
    if (isNBA && F.move !== "any"){ const o = g("open"); if (o == null || line == null) continue; const mv = line - o; if (F.move === "toward" ? !(mv <= -1) : !(mv >= 1)) continue; }
    if (!isNBA){
      if (F.kick !== "any"){ const wd = L.wd[g("wd")], gt = g("gt") || "", h = +gt.slice(0, 2);
        const ok = {thu: wd === "Thursday", mon: wd === "Monday", sat: wd === "Saturday", early: wd === "Sunday" && h < 16, late: wd === "Sunday" && h >= 16 && h < 19, snf: wd === "Sunday" && h >= 19, prime: h >= 19 || wd === "Thursday" || wd === "Monday"}[F.kick];
        if (!ok) continue; }
      if (F.roof !== "any"){ const r = L.roof[g("roof")]; if (F.roof === "outdoors" ? !(r === "outdoors" || r === "open") : !(r === "dome" || r === "closed")) continue; }
      if (F.surf !== "any"){ const sf = (L.surf[g("surf")] || "").trim(); if (!sf) continue; if ((F.surf === "grass") !== (sf === "grass")) continue; }
      if (F.temp !== "any"){ const t = g("temp"); if (t == null) continue; const [a, b] = {cold: [-50, 32], cool: [33, 50], mild: [51, 75], hot: [76, 150]}[F.temp]; if (t < a || t > b) continue; }
      if (F.wind !== "any"){ const w = g("wind"); if (w == null || w < +F.wind) continue; }
      if (F.coach !== "any" && L.coach[g("coach")] !== F.coach) continue;
      if (F.ref !== "any" && L.ref[g("ref")] !== F.ref) continue;
      if (F.qb !== "any" && L.qb[g("qb")] !== F.qb) continue;
      if (F.pot !== "any" && g("pot") !== 1) continue;
    }
    out.push(row);
  }
  return {C, rows: out.sort((a, b) => a[C.d] < b[C.d] ? -1 : 1)};
}

let statWin = "season";
const NFL_METRICS = [
  // key, label, kind (avg | rate | per), offense higher is better?, format
  ["pf", "Points per game", "per", true, 1], ["h1", "1st-half points", "h1", true, 1],
  ["epa", "EPA per play", "w", true, 3], ["sr", "Success rate", "w", true, "%"],
  ["pass_epa", "EPA per dropback", "w", true, 3], ["rush_epa", "EPA per run", "w", true, 3],
  ["expl", "Explosive-play rate", "w", true, "%"], ["third", "3rd-down conversion", "third", true, "%"],
  ["rz", "Red-zone TD rate", "rz", true, "%"], ["sack", "Sack rate", "sack", false, "%"],
  ["to", "Turnovers per game", "per", false, 1], ["plays", "Plays per game", "per", null, 1],
  ["early_pass", "Early-down pass rate", "w", null, "%"], ["proe", "Pass rate over expected", "w", null, "%"],
];
const NBA_METRICS = [
  ["pf", "Points per game", true, 1], ["pace", "Pace (possessions)", null, 1], ["ortg", "Points per 100 poss.", true, 1],
  ["efg", "Effective FG%", true, "%"], ["tovp", "Turnover rate", false, "%"], ["orebp", "Off. rebound rate", true, "%"],
  ["ftr", "Free-throw rate", true, "%"], ["par3", "3-point attempt rate", null, "%"], ["fg3p", "3-point %", true, "%"],
];
function nflAgg(games, side){   // side "o" = the team's offense, "d" = what its defense allowed
  const sum = k => games.reduce((a, g) => a + (g[`${side}_${k}`] || 0), 0);
  const plays = sum("plays"), n = games.length;
  const w = k => { let a = 0, b = 0; for (const g of games){ const v = g[`${side}_${k}`], p = g[`${side}_plays`] || 0; if (v != null){ a += v * p; b += p; } } return b ? a / b : null; };
  return {n, pf: n ? games.reduce((a, g) => a + (side === "o" ? g.pf : g.pa), 0) / n : null,
    h1: n ? games.reduce((a, g) => a + ((side === "o" ? g.h1_pf : g.h1_pa) || 0), 0) / n : null,
    epa: w("epa"), sr: w("sr"), pass_epa: w("pass_epa"), rush_epa: w("rush_epa"), expl: w("expl"), early_pass: w("early_pass"), proe: w("proe"),
    third: sum("third_att") ? sum("third_conv") / sum("third_att") : null, rz: sum("rz_trips") ? sum("rz_td") / sum("rz_trips") : null,
    sack: sum("dropbacks") ? sum("sacks") / sum("dropbacks") : null, to: n ? sum("to") / n : null, plays: n ? plays / n : null};
}
function nbaAgg(games, side){
  const n = games.length, k = s => side === "o" ? s : (s === "pf" ? "pa" : "d_" + s);
  const m = s => { const v = games.map(g => g[k(s)]).filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  const raw = s => { const v = games.map(g => g[s]).filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  return {n, pf: m("pf"), pace: raw("pace"), ortg: raw(side === "o" ? "ortg" : "drtg"), efg: m("efg"), tovp: m("tovp"), orebp: m("orebp"), ftr: m("ftr"), par3: m("par3"), fg3p: m("fg3p")};
}
function statWindow(games, cur, win, home){
  const thisS = games.filter(g => g.s === cur), base = thisS.length >= 3 ? thisS : games.filter(g => g.s === cur - 1);
  if (win === "season") return {g: base, lab: thisS.length >= 3 ? "this season" : "last season"};
  if (win === "venue") return {g: base.filter(g => !!g.h === home), lab: (home ? "home" : "road") + (thisS.length >= 3 ? " games this season" : " games last season")};
  return {g: games.slice(-(+win)), lab: `last ${win} games`};
}
async function matchupStatsHTML(u, T){

  const nba = sport === "NBA";

  const metrics = nba ? NBA_METRICS.map(([k, l, b, f]) => [k, l, null, b, f]) : NFL_METRICS;
  // league ranks over the same season window
  const ranks = {};

    const all = Object.entries(S.teams).map(([t, gs]) => [t, statWindow(gs, S.season, "season", true).g]);
    for (const [k, , , better] of metrics){

      ${metrics.map(([k, l, , , f]) => `<tr><td>${esc(l)}</td><td>${fmt(o[k], f)}${rk(offT, "o", k)}</td><td>${fmt(d[k], f)}${rk(defT, "d", k)}</td></tr>`).join("")}</table></div></div>`;

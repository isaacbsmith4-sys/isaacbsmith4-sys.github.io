<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0b07">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="School">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: one screen per tab (Due / Classes / Study / GPA), bottom tab bar, a floating + for adding work.
   Due is a single list sorted by urgency (overdue, today, tomorrow, this week, later). Ink-black ground with
   a legal-pad gold accent and a serif display face; each class keeps its own color dot everywhere. */
:root{
  color-scheme:dark;
  --bg:#0c0b07; --surface:#16140d; --surface2:#1e1b12; --sunk:#110f0a; --line:#2e2a1c; --line-hi:#454030;
  --ink:#f7f2e2; --ink2:#d6cdb2; --muted:#a19779; --faint:#6d654d;
  --accent:#f2c14e; --accent-bg:rgba(242,193,78,.13); --on-accent:#1d1502;
  --good:#5fe0a0; --warn:#f5b85a; --bad:#ff6b7d;
  --display:"Fraunces",Georgia,serif;
  --body:"Manrope","Avenir Next","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --tabh:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);min-height:100vh;overflow-x:hidden;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(var(--tabh) + 80px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(100% 50% at 90% -10%,rgba(242,193,78,.11),transparent 60%)}
.wrap{position:relative;max-width:620px;margin:0 auto}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:18px 0 14px;flex-wrap:wrap}
header h1{font:800 30px var(--display);margin:0;letter-spacing:-.01em}
header p{margin:2px 0 0;color:var(--muted);font-size:13px}
.screen{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0}
.card h2{font:600 19px var(--display);margin:0}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.sub,.note{color:var(--muted);font-size:12.5px}
.eyebrow{font:600 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
.group{display:grid;gap:6px}
.gh{display:flex;justify-content:space-between;align-items:baseline;margin:8px 2px 0}
.gh .eyebrow.bad{color:var(--bad)}
.a{display:flex;align-items:center;gap:12px;padding:12px 13px;border-radius:14px;background:var(--surface);border:1px solid var(--line);cursor:pointer}
.a .box{flex:none;width:24px;height:24px;border-radius:8px;border:1.8px solid var(--faint);display:grid;place-items:center;cursor:pointer}
.a.done{opacity:.55}
.a.done .box{background:var(--accent);border-color:var(--accent)}
.a.done .box::after{content:"";width:6px;height:11px;border:solid var(--on-accent);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.a.done .t{text-decoration:line-through}
.a .m{flex:1;min-width:0}
.a .t{font-weight:600;overflow-wrap:anywhere}
.a .meta{font-size:12px;color:var(--muted);display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.a.test{border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.pri{font:700 9.5px var(--mono);letter-spacing:.08em;border-radius:6px;padding:1px 5px;border:1px solid}
.pri.h{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 55%,transparent)}
.pri.m{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.kind{font:600 9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.when{font:600 12px var(--mono);color:var(--ink2);text-align:right;white-space:nowrap}
.when.late{color:var(--bad)}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom,0px));z-index:25;width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:var(--on-accent);font:700 30px var(--body);box-shadow:0 10px 30px -8px var(--accent);cursor:pointer}
.load{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end;height:84px}
.load div{display:grid;justify-items:center;gap:4px;align-self:end}
.load b{display:block;width:70%;border-radius:5px 5px 2px 2px;background:var(--accent);min-height:3px}
.load span{font:600 10px var(--mono);color:var(--muted)}
.cls{display:grid;gap:8px;cursor:pointer}
.cls .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cls .nm{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;min-width:0}
.grade{font:800 26px var(--display);font-variant-numeric:tabular-nums}
.grade small{font:600 13px var(--mono);color:var(--muted);margin-left:6px}
.btn{appearance:none;border:1px solid var(--line-hi);background:var(--surface2);color:var(--ink);font:700 14px var(--body);padding:11px 15px;border-radius:13px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block}
.btn.go{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.wide{width:100%;padding:14px;text-align:center}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:11px}
.btn:disabled{opacity:.45}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tab:focus-visible,.a:focus-visible,.fab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.between{justify-content:space-between}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:11px;padding:10px 11px;min-width:0}
input[type=number],input[type=date],input[type=time]{font-family:var(--mono)}
textarea{width:100%;min-height:90px;resize:vertical}
label.f{display:grid;gap:5px;font-size:12px;color:var(--muted);flex:1 1 120px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface2);color:var(--ink2);border-radius:999px;padding:8px 12px;font:600 13px var(--body);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.on{border-color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 16%,transparent);color:var(--ink)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv span:last-child{font:600 13px var(--mono);text-align:right}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:2px}
.stat .v{font:800 30px var(--display);font-variant-numeric:tabular-nums;line-height:1.05}
.stat .s{font-size:12px;color:var(--muted)}
.fc{min-height:210px;border-radius:20px;background:var(--surface2);border:1px solid var(--line-hi);display:grid;place-items:center;text-align:center;padding:24px;cursor:pointer;font:600 21px var(--display);line-height:1.35;white-space:pre-wrap;overflow-wrap:anywhere}
.fc.back{background:color-mix(in srgb,var(--accent) 9%,var(--surface2));border-color:color-mix(in srgb,var(--accent) 40%,transparent);font:500 18px var(--body)}
.grade3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grade3 button{padding:14px 4px;border-radius:13px;border:1px solid var(--line-hi);background:var(--surface2);color:var(--ink);font:700 14px var(--body);cursor:pointer;display:grid;gap:2px}
.grade3 button span{font:500 11px var(--mono);color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:16px;border:1px dashed var(--line-hi);border-radius:14px;text-align:center}
.x{border:0;background:none;color:var(--faint);font-size:18px;cursor:pointer;padding:2px 6px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:rgba(12,11,7,.93);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
nav.tabs .in{display:flex;width:100%;max-width:620px}
.tab{flex:1;border:0;background:none;color:var(--faint);font:600 11px var(--body);display:grid;justify-items:center;gap:3px;padding:6px 0;cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-selected=true]{color:var(--accent)}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(4,3,1,.72);backdrop-filter:blur(5px);display:grid;align-items:end;justify-items:center}
.sheet .in{width:min(620px,100%);max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;display:grid;gap:14px;align-content:start;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .22s ease-out}
.sheet h3{margin:0;font:600 22px var(--display)}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--surface2);border:1px solid var(--line-hi);border-radius:13px;padding:10px 14px;font-size:14px;display:flex;gap:12px;align-items:center;box-shadow:0 12px 40px rgba(0,0,0,.5);max-width:calc(100vw - 32px)}
.toast button{border:0;background:none;color:var(--accent);font:700 13px var(--body);cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header><div><h1 id="title">School</h1><p id="sub"></p></div><div id="sync"></div></header>
  <main id="main" class="screen"></main>
</div>
<button class="fab" id="fab" data-act="addItem" aria-label="Add assignment or test">+</button>
<nav class="tabs"><div class="in" id="tabs" role="tablist"></div></nav>
<div id="overlay"></div>
<script src="../kit/kit.js?v=10"></script>
<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rid = () => Math.random().toString(36).slice(2, 10);
const pad = n => String(n).padStart(2, "0");
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const todayKey = () => ymd(new Date());
const parseKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return ymd(d); };
const daysTo = k => Math.round((parseKey(k) - parseKey(todayKey())) / 864e5);
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const fmtTime = t => { if (!t) return ""; const [h, m] = t.split(":").map(Number); return (h % 12 || 12) + (m ? ":" + pad(m) : "") + (h < 12 ? "am" : "pm"); };
const hm = min => { min = Math.max(0, Math.round(min)); const h = Math.floor(min / 60), m = min % 60; return h ? `${h}h${m ? " " + pad(m) + "m" : ""}` : `${m}m`; };
const TYPES = ["Homework", "Quiz", "Test", "Project", "Essay", "Lab", "Reading", "Exam"];
const BIG = new Set(["Test", "Exam", "Project", "Essay"]);
const COLORS = ["#f2c14e", "#6aa8ff", "#ff7eb6", "#5fe0a0", "#d29bff", "#ff8a5c", "#46d1c4", "#c8d26a"];
const LETTERS = [[93, "A", 4], [90, "A-", 3.7], [87, "B+", 3.3], [83, "B", 3], [80, "B-", 2.7], [77, "C+", 2.3], [73, "C", 2], [70, "C-", 1.7], [67, "D+", 1.3], [63, "D", 1], [60, "D-", .7], [0, "F", 0]];
const letterOf = p => p == null ? null : LETTERS.find(([min]) => p >= min);
const BOOST = {reg: 0, hon: .5, ap: 1}; // common weighted-GPA bumps; schools differ

/* ---------- state + shared LIFE HQ data ---------- */
const KEY = "schoolapp:v1";
let S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
if (!S || !S.settings) S = {settings: {classes: []}, items: {}, plan: {}, cards: {decks: []}};
const localSave = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
// items and study plans are filed by due date, so the kit also pulls the next few months
const ITEMS = Life.col("school/items", {months: 6, ahead: 6}), PLAN = Life.col("school/plan", {months: 2, ahead: 3}), SET = Life.doc("school/settings"), CARDS = Life.doc("school/cards");
const FOCUS = Life.col("focus/sessions", {months: 2}); // read-only: study time from Focus
const save = () => { localSave(); SET.set(S.settings); CARDS.set(S.cards); ITEMS.replace(S.items); PLAN.replace(S.plan); };
function adopt() {
  const st = SET.get(); if (st) S.settings = {classes: [], ...st};
  const cd = CARDS.get(); if (cd) S.cards = {decks: [], ...cd};
  S.items = ITEMS.all(); S.plan = PLAN.all(); localSave();
}
ITEMS.seed(S.items); PLAN.seed(S.plan); SET.seed(S.settings); CARDS.seed(S.cards); adopt();
const classes = () => S.settings.classes.filter(c => !c.archived);
const cls = id => S.settings.classes.find(c => c.id === id) || {name: "No class", color: "#a19779", cats: []};
const items = () => Object.entries(S.items).map(([id, x]) => ({...x, id}));

/* ---------- grades ----------
   With category weights (Tests 50%, Quizzes 25%…) each category's points average is weighted, and weights
   are rescaled over the categories that have grades so far. Without weights it's plain total points. */
function gradeOf(c, extra) {
  const graded = items().filter(x => x.cls === c.id && x.score != null && x.outOf > 0).concat(extra ? [extra] : []);
  if (!graded.length) return null;
  const cats = (c.cats || []).filter(k => k.w > 0);
  if (cats.length) {
    let w = 0, t = 0;
    for (const k of cats) { const g = graded.filter(x => (x.cat || "") === k.name); if (!g.length) continue; const p = g.reduce((a, x) => a + x.score, 0) / g.reduce((a, x) => a + x.outOf, 0); t += p * k.w; w += k.w; }
    const loose = graded.filter(x => !cats.some(k => k.name === x.cat));
    if (!w && loose.length) return loose.reduce((a, x) => a + x.score, 0) / loose.reduce((a, x) => a + x.outOf, 0) * 100;
    return w ? t / w * 100 : null;
  }
  return graded.reduce((a, x) => a + x.score, 0) / graded.reduce((a, x) => a + x.outOf, 0) * 100;
}
function gpa() {
  let u = 0, wt = 0, cr = 0;
  for (const c of classes()) { const g = gradeOf(c); if (g == null) continue; const L = letterOf(g), k = +c.credits || 1; u += L[2] * k; wt += (L[2] + (L[2] > 0 ? BOOST[c.level || "reg"] : 0)) * k; cr += k; }
  return cr ? {u: u / cr, w: wt / cr, n: cr} : null;
}
const toneOf = p => p == null ? "var(--muted)" : p >= 90 ? "var(--good)" : p >= 80 ? "var(--accent)" : p >= 70 ? "var(--warn)" : "var(--bad)";

/* ---------- ui bits ---------- */
let toastT;
function toast(msg, undo) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const o = document.createElement("div"); o.className = "toast"; o.setAttribute("role", "status");
  o.innerHTML = `<span>${esc(msg)}</span>${undo ? "<button>Undo</button>" : ""}`; document.body.appendChild(o);
  if (undo) o.querySelector("button").onclick = () => { undo(); save(); o.remove(); render(); };
  clearTimeout(toastT); toastT = setTimeout(() => o.remove(), 4500);
}
const sheet = html => { $("#overlay").innerHTML = `<div class="sheet" data-act="closeSheet"><div class="in" role="dialog">${html}</div></div>`; };
const closeSheet = () => { $("#overlay").innerHTML = ""; };
const ICONS = {
  due: '<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  classes: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/>',
  study: '<rect x="3" y="5" width="14" height="10" rx="2"/><path d="M7 19h12a2 2 0 0 0 2-2V9"/>',
  gpa: '<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M7 10.5v4.5c0 1 2.2 3 5 3s5-2 5-3v-4.5"/>',
};
const TABS = [["due", "Due"], ["classes", "Classes"], ["study", "Study"], ["gpa", "GPA"]];
let tab = TABS.some(t => t[0] === location.hash.slice(1)) ? location.hash.slice(1) : "due";
function go(t) { tab = t; history.replaceState(null, "", "#" + t); render(); window.scrollTo(0, 0); }

/* ================= DUE ================= */
let showDone = false;
function whenText(x) { const d = daysTo(x.date); return d < 0 ? `${-d}d late` : d === 0 ? (x.time ? fmtTime(x.time) : "today") : d === 1 ? "tomorrow" : d < 7 ? DOW[parseKey(x.date).getDay()] : parseKey(x.date).toLocaleDateString([], {month: "short", day: "numeric"}); }
function row(x) {
  const c = cls(x.cls), late = !x.done && daysTo(x.date) < 0, plan = x.kind === "plan";
  return `<div class="a ${x.done ? "done" : ""} ${BIG.has(x.type) && !x.done ? "test" : ""}" style="--c:${c.color}" data-act="${plan ? "openPlan" : "openItem"}" data-id="${x.id}" role="button" tabindex="0">
    <span class="box" data-act="${plan ? "togglePlan" : "toggle"}" data-id="${x.id}" role="checkbox" aria-checked="${!!x.done}" aria-label="Done"></span>
    <div class="m"><div class="t">${plan ? "Study: " : ""}${esc(x.title)}</div><div class="meta"><span class="dot"></span>${esc(c.name)} · <span class="kind">${plan ? "study " + x.min + "m" : esc(x.type)}</span>${x.prio === "h" ? '<span class="pri h">HIGH</span>' : x.prio === "m" ? '<span class="pri m">MED</span>' : ""}${x.est && !plan ? `<span>~${hm(x.est)}</span>` : ""}${x.score != null ? `<span>${x.score}/${x.outOf}</span>` : ""}</div></div>
    <span class="when ${late ? "late" : ""}">${whenText(x)}</span></div>`;
}
function viewDue() {
  if (!classes().length) return `<section class="card"><h2>Start with your classes</h2><p class="note" style="margin:6px 0 12px">Add each class once (name, color, honors/AP). Then add assignments and tests with the + button.</p><button class="btn go" data-act="newClass">Add a class</button></section>`;
  const k = todayKey(), plans = Object.entries(S.plan).map(([id, p]) => ({...p, id, kind: "plan"}));
  const open = [...items().filter(x => !x.done), ...plans.filter(p => !p.done)].sort((a, b) => (a.date + (a.time || "99") + (a.prio === "h" ? 0 : a.prio === "m" ? 1 : 2)).localeCompare(b.date + (b.time || "99") + (b.prio === "h" ? 0 : b.prio === "m" ? 1 : 2)));
  const G = [["Overdue", x => daysTo(x.date) < 0, "bad"], ["Today", x => daysTo(x.date) === 0], ["Tomorrow", x => daysTo(x.date) === 1], ["This week", x => daysTo(x.date) > 1 && daysTo(x.date) <= 7], ["Later", x => daysTo(x.date) > 7]];
  // workload: estimated minutes due each of the next 7 days (plus planned study)
  const load = []; for (let i = 0; i < 7; i++) { const d = addDays(k, i), m = open.filter(x => x.date === d).reduce((t, x) => t + (x.kind === "plan" ? x.min : x.est || 30), 0); load.push({d, m}); }
  const mx = Math.max(60, ...load.map(x => x.m));
  const tests = items().filter(x => !x.done && BIG.has(x.type) && daysTo(x.date) >= 0 && daysTo(x.date) <= 14).sort((a, b) => a.date.localeCompare(b.date));
  const ws = addDays(k, -parseKey(k).getDay()), study = Object.values(FOCUS.all()).filter(s => s.cat === "School" && s.date >= ws).reduce((t, s) => t + s.min, 0);

/* ================= GPA ================= */
function viewGpa() {
  const g = gpa(), cs = classes().map(c => ({c, p: gradeOf(c)})).filter(x => x.p != null);
  const k = todayKey(), since = addDays(k, -27), recent = items().filter(x => x.date >= since && x.date <= k);
  // on time = finished by its due date (local day); unfinished work only counts against you once it's past due
  const doneDay = x => x.doneAt ? ymd(new Date(x.doneAt)) : null;
  const onTime = recent.filter(x => x.done && doneDay(x) && doneDay(x) <= x.date).length, late = recent.filter(x => (!x.done && x.date < k) || (x.done && doneDay(x) > x.date)).length;
  return `<section class="stats"><div class="stat"><span class="eyebrow">GPA (unweighted)</span><span class="v">${g ? g.u.toFixed(2) : "–"}</span><span class="s">4.0 scale</span></div>
      <div class="stat"><span class="eyebrow">GPA (weighted)</span><span class="v">${g ? g.w.toFixed(2) : "–"}</span><span class="s">+0.5 honors, +1 AP</span></div></section>
    <section class="card"><div class="ch"><h2>By class</h2><span class="sub">current grades</span></div>
      ${cs.length ? cs.sort((a, b) => b.p - a.p).map(({c, p}) => { const L = letterOf(p); return `<div class="kv"><span><span class="dot" style="--c:${c.color}"></span> ${esc(c.name)}${c.level !== "reg" ? ` <span class="kind">${c.level === "ap" ? "AP" : "H"}</span>` : ""}</span><span style="color:${toneOf(p)}">${L[1]} · ${p.toFixed(1)}%</span></div>`; }).join("") : '<p class="note" style="margin:0">Add scores to graded work (tap an assignment) and your GPA shows up here.</p>'}
      ${cs.length ? `<p class="note" style="margin:10px 0 0">An estimate from the grades you've entered. Your school's official GPA may weight classes differently.</p>` : ""}</section>
    <section class="card"><div class="ch"><h2>Last 4 weeks</h2></div>
      <div class="stats"><div class="stat"><span class="eyebrow">On time</span><span class="v">${onTime + late ? Math.round(onTime / (onTime + late) * 100) + "%" : "–"}</span><span class="s">${onTime} of ${onTime + late} assignments</span></div>
        <div class="stat"><span class="eyebrow">Studied</span><span class="v">${hm(Object.values(FOCUS.all()).filter(s => s.cat === "School" && s.date >= since).reduce((t, s) => t + s.min, 0))}</span><span class="s">School sessions in Focus</span></div></div></section>
    <section class="card"><div class="ch"><h2>Backup</h2></div><div class="row"><button class="btn" data-act="export">Save backup</button><label class="btn ghost" style="position:relative;overflow:hidden">Restore backup<input type="file" accept="application/json,.json" id="importFile" style="position:absolute;inset:0;opacity:0"></label></div></section>
    <p class="note" style="text-align:center">Open this from LIFE HQ so all your apps share the same data.</p>`;
}

    S.items[id] = {...(S.items[id] || {}), ...rest, done: f.score != null ? true : !!f.done, doneAt: f.score != null && !f.doneAt ? new Date().toISOString() : f.doneAt || null};

  },

  toggle(el, ev) { ev.stopPropagation(); const x = S.items[el.dataset.id]; x.done = !x.done; x.doneAt = x.done ? new Date().toISOString() : null; save(); render(); if (x.done) toast(`Done: ${x.title}${BIG.has(x.type) ? ". Add your score once it's graded." : ""}`, () => { x.done = false; x.doneAt = null; }); },
  togglePlan(el, ev) { ev.stopPropagation(); const p = S.plan[el.dataset.id]; p.done = !p.done; save(); render(); },
  openPlan(el, ev) { if (ev.target.closest(".box")) return; const p = S.plan[el.dataset.id]; sheet(`<div class="row between"><h3>Study: ${esc(p.title)}</h3><button class="btn sm" data-act="closeSheet">Close</button></div><p class="note" style="margin:0">${p.min} minutes · ${esc(cls(p.cls).name)}. Start a School session in Focus so it counts toward your study time.</p><a class="btn go wide" href="../focus/">Open Focus</a><button class="btn ghost" style="color:var(--bad)" data-act="delPlan" data-id="${el.dataset.id}">Remove this session</button>`); },
  delPlan(el) { delete S.plan[el.dataset.id]; save(); closeSheet(); render(); },
  planFor(el) { readItemForm(); planSheet(el.dataset.id); },
  makePlan(el) {
    const x = S.items[el.dataset.id], n = clamp(Math.round(+val("pN")) || 1, 1, 6), m = clamp(Math.round(+val("pM")) || 30, 10, 180), span = daysTo(x.date);
    // spread back from the day before the test: weighted toward the end, never today-of
    const offs = new Set(); for (let i = 0; i < n; i++) offs.add(Math.max(1, Math.round(Math.pow((i + 1) / n, 1.6) * span)));
    for (const o of offs) { const d = addDays(x.date, -o); if (daysTo(d) < 0) continue; S.plan[rid()] = {date: d, cls: x.cls, item: el.dataset.id, title: x.title, min: m, done: false}; }
    save(); closeSheet(); render(); toast(`Added ${offs.size} study session${offs.size === 1 ? "" : "s"} before ${x.title}`);
  },
  showDone() { showDone = !showDone; render(); },
  newClass() { classForm(null); },
  openClass(el) { classDetail(el.dataset.id); },
  editClass(el) { classForm(cls(el.dataset.id)); },
  cpick(el) { readClassForm(); cform[el.dataset.k] = el.dataset.v; drawClassForm(); },
  cday(el) { readClassForm(); const d = +el.dataset.d; cform.days = cform.days.includes(d) ? cform.days.filter(x => x !== d) : [...cform.days, d].sort(); drawClassForm(); },
  addCat() { readClassForm(); cform.cats.push({name: "", w: 0}); drawClassForm(); },
  delCat(el) { readClassForm(); cform.cats.splice(+el.dataset.i, 1); drawClassForm(); },
  saveClass() {
    readClassForm(); const c = cform; if (!c.name) { toast("Name the class."); return; }
    c.cats = c.cats.filter(k => k.name && k.w > 0);
    if (c.id) { const i = S.settings.classes.findIndex(x => x.id === c.id); S.settings.classes[i] = c; } else { c.id = rid(); S.settings.classes.push(c); }
    save(); closeSheet(); cform = null; render(); toast("Saved " + c.name);
  },
  archiveClass() { const c = S.settings.classes.find(x => x.id === cform.id); c.archived = true; save(); closeSheet(); cform = null; render(); toast("Archived " + c.name, () => { c.archived = false; }); },
  needFinal(el) {
    const c = cls(el.dataset.id), g = gradeOf(c), T = +val("wTarget"), w = (+val("wWeight")) / 100, out = $("#wOut");
    if (g == null) { out.textContent = "Add some graded scores first."; return; }
    if (!(w > 0 && w < 1)) { out.textContent = "Enter what the final is worth, between 1 and 99%."; return; }
    const need = (T - g * (1 - w)) / w;
    out.innerHTML = need <= 0 ? `You're at ${g.toFixed(1)}%. You'd keep ${T}% even with a 0, so just show up.` : need > 100 ? `You'd need <b>${need.toFixed(0)}%</b> on the final, which isn't possible. Aim for ${(g * (1 - w) + w * 100).toFixed(1)}% overall with a perfect final.` : `You need <b>${need.toFixed(0)}%</b> on the final to finish with ${T}%.`;
  },
  addNote() { const t = val("nText"); if (!t) return; const c = S.settings.classes.find(x => x.id === detail); (c.notes ||= []).unshift({id: rid(), t, d: todayKey()}); save(); classDetail(detail); },
  delNote(el) { const c = S.settings.classes.find(x => x.id === detail); c.notes = c.notes.filter(n => n.id !== el.dataset.id); save(); classDetail(detail); },
  addLink() { let u = val("lUrl"); if (!u) return; if (!/^https?:\/\//.test(u)) u = "https://" + u; const c = S.settings.classes.find(x => x.id === detail); (c.links ||= []).push({id: rid(), label: val("lLabel"), url: u}); save(); classDetail(detail); },
  delLink(el) { const c = S.settings.classes.find(x => x.id === detail); c.links = c.links.filter(l => l.id !== el.dataset.id); save(); classDetail(detail); },
  newDeck() {
    if (!classes().length) { toast("Add a class first."); return; }
    sheet(`<div class="row between"><h3>New deck</h3><button class="btn sm" data-act="closeSheet">Close</button></div>
      <label class="f">Name<input id="dName" placeholder="Unit 4 vocab"></label>
      <div class="chips" id="dCls">${classes().map((c, i) => `<button class="chip ${i ? "" : "on"}" data-act="dpick" data-v="${c.id}" style="--c:${c.color}"><span class="dot"></span>${esc(c.name)}</button>`).join("")}</div>
      <button class="btn go wide" data-act="saveDeck">Create deck</button>`);
  },
  dpick(el) { el.parentElement.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === el)); },
  saveDeck() { const n = val("dName"); if (!n) { toast("Name the deck."); return; } const d = {id: rid(), name: n, cls: document.querySelector("#dCls .chip.on").dataset.v, cards: []}; S.cards.decks.unshift(d); save(); cardsSheet(d.id); render(); },
  addCards(el) { cardsSheet(el.dataset.id); },
  saveCards(el) {
    const d = S.cards.decks.find(x => x.id === el.dataset.id), lines = $("#bulk").value.split("\n").map(l => l.trim()).filter(Boolean);
    let n = 0; for (const l of lines) { const m = l.match(/^(.+?)\s*(?:\s[-–—]\s|:|\t)\s*(.+)$/); if (!m) continue; d.cards.push({id: rid(), f: m[1].trim(), b: m[2].trim(), box: 0, due: null}); n++; }
    save(); cardsSheet(d.id); render(); toast(n ? `Added ${n} card${n === 1 ? "" : "s"}` : `Couldn't read those. Use "term - definition" on each line.`);
  },
  delCard(el) { const d = S.cards.decks.find(x => x.id === el.dataset.deck); d.cards = d.cards.filter(c => c.id !== el.dataset.id); save(); cardsSheet(d.id); render(); },
  delDeck(el) { const i = S.cards.decks.findIndex(x => x.id === el.dataset.id), d = S.cards.decks[i]; S.cards.decks.splice(i, 1); save(); closeSheet(); render(); toast("Deck deleted", () => { S.cards.decks.splice(i, 0, d); }); },
  study(el) { const d = S.cards.decks.find(x => x.id === el.dataset.id); review = {deck: d.id, queue: dueCards(d).map(c => c.id).sort(() => Math.random() - .5), flip: false, right: 0}; render(); },
  flip() { review.flip = !review.flip; render(); },
  rate(el) {
    const d = S.cards.decks.find(x => x.id === review.deck), cd = d.cards.find(x => x.id === review.queue[0]), v = +el.dataset.v;
    review.queue.shift();
    if (v === 0) { cd.box = 0; cd.due = todayKey(); review.queue.push(cd.id); } else { cd.box = Math.min((cd.box || 0) + v, 6); cd.due = addDays(todayKey(), BOX_DAYS[cd.box]); review.right++; }
    review.flip = false; save();
    if (!review.queue.length) { const r = review.right; review = null; render(); toast(`Deck done: ${r} right. Next review is scheduled.`); return; }
    render();
  },
  endReview() { review = null; render(); },
  closeSheet(el, ev) { if (ev.target === el || el.tagName === "BUTTON") { closeSheet(); form = null; cform = null; } },
  export() {
    const blob = new Blob([JSON.stringify(S)], {type: "application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "school-backup-" + todayKey() + ".json";
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  },
};
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]");
  if (!el || el.tagName === "INPUT" || el.tagName === "SELECT" || el.tagName === "TEXTAREA" || el.disabled) return;
  A[el.dataset.act]?.(el, ev);
});
document.addEventListener("keydown", ev => {
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches(".a[data-act],.cls[data-act],.fc")) { ev.preventDefault(); A[ev.target.dataset.act](ev.target, ev); }
  if (ev.key === "Escape") { closeSheet(); form = null; cform = null; }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.id === "importFile" && t.files[0]) t.files[0].text().then(txt => { const d = JSON.parse(txt); if (!d.settings || !d.items) throw 0; S = d; save(); render(); toast("Backup restored"); }).catch(() => toast("That file isn't a School backup."));
});
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (TABS.some(t => t[0] === h) && h !== tab) go(h); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && !$("#overlay").innerHTML && !review) render(); });

Life.mountStatus($("#sync"));
Life.onChange(() => { adopt(); if (!$("#overlay").innerHTML && !review) render(); });
render();
Life.start();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>

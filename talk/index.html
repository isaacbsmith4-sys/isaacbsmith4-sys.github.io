<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TALK">
<meta name="description" content="Talk it out. TALK turns what you say into notes, reminders and saved ideas.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>TALK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
/* TALK: Record screen is one big button with the live transcript under it. A note page shows the recording,
   transcript, summary and the action items found in it, each with a button that sends it to the right app.
   Coral is the accent; action kinds keep their own colors. */
:root{--accent:#ff7a59;--on-accent:#2a0d04}
.top .back{width:34px;height:34px;border-radius:11px;margin-right:-3px}

/* record */
.stage{display:flex;flex-direction:column;align-items:center;text-align:center;padding:18px 0 6px}
.mic{position:relative;width:148px;height:148px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;color:var(--on-accent);
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,#fff 26%,var(--accent)),var(--accent) 55%,color-mix(in srgb,#000 22%,var(--accent)));
  box-shadow:0 22px 50px -16px var(--accent),0 0 0 10px color-mix(in srgb,var(--accent) 10%,transparent);transition:transform .15s}
.mic:active{transform:scale(.96)}
.mic svg{width:54px;height:54px}
.mic .ring{position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--accent);opacity:0;transform:scale(var(--lv,1));transition:transform .08s linear,opacity .2s;pointer-events:none}
.mic.on{background:radial-gradient(circle at 35% 30%,#ff9a80,#f0462a 60%,#b8301b)}
.mic.on .ring{opacity:.55}
.mic.on::after{content:"";position:absolute;inset:-22px;border-radius:50%;border:2px solid var(--accent);animation:pulse 1.6s ease-out infinite;pointer-events:none}
@keyframes pulse{from{transform:scale(.86);opacity:.7}to{transform:scale(1.18);opacity:0}}
.timer{font:700 30px var(--mono);letter-spacing:.02em;margin:18px 0 2px;font-variant-numeric:tabular-nums}
.stage .hint{color:var(--muted);font-size:14px;max-width:360px}
.live{margin-top:16px;min-height:120px;max-height:42vh;overflow-y:auto;text-align:left;font-size:17px;line-height:1.5;white-space:pre-wrap}
.live .interim{color:var(--muted)}
.live .ph{color:var(--faint)}
.recbar{display:flex;gap:10px;justify-content:center;margin-top:14px}
.cap{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--ink2);text-align:left;margin-top:14px}
.cap svg{width:18px;height:18px;flex:none;margin-top:1px}
.cap.ok svg{color:var(--good)} .cap.warn svg{color:var(--warn)} .cap.bad svg{color:var(--bad)}
.recover{border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 10%,var(--surface))}

/* lists */
.list{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
.note{display:block;padding:13px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);cursor:pointer;text-align:left;width:100%;appearance:none;color:inherit;text-decoration:none}
.note:hover{border-color:var(--line-hi)}
.note .t{font-weight:700;font-size:15px;line-height:1.3;display:flex;gap:8px;align-items:flex-start}
.note .t span{flex:1;min-width:0;overflow-wrap:anywhere}
.note .t svg{width:16px;height:16px;color:var(--warn);flex:none;margin-top:2px}
.note .b{color:var(--muted);font-size:13px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.note .meta{display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center;margin-top:7px;font-size:11.5px;color:var(--faint)}
.note .meta .cat{display:inline-flex;align-items:center;gap:5px;color:var(--ink2);font-weight:600}
.pill{font:700 10px var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:7px;background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-line)}
mark{background:color-mix(in srgb,var(--accent) 35%,transparent);color:inherit;border-radius:3px;padding:0 1px}

/* note page */
.titlein{font:800 22px/1.25 var(--display)!important;letter-spacing:-.01em;background:transparent!important;border-color:transparent!important;padding:6px 2px!important}
.titlein:focus{border-color:var(--line)!important;background:var(--sunk)!important;padding:6px 10px!important}
.nmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12.5px;margin:2px 2px 12px}
.nmeta select{width:auto;padding:6px 30px 6px 10px;font-size:13px;border-radius:10px}
audio{width:100%;height:44px;margin-bottom:12px}
.summary{background:var(--accent-bg);border:1px solid var(--accent-line);border-radius:16px;padding:13px 15px;margin-bottom:12px}
.summary .eyebrow{color:var(--accent);margin-bottom:6px}
.summary ul{margin:8px 0 0;padding-left:18px}
.summary li{margin:3px 0}
.acts{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
.act-it{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:start;padding:11px 12px;border-radius:15px;border:1px solid var(--line);background:var(--surface)}
.act-it.sent{opacity:.75}
.act-it .sel{appearance:none;width:24px;height:24px;margin:7px 0 0;border-radius:7px;border:1.8px solid var(--faint);background:none;display:grid;place-items:center;cursor:pointer}
.act-it .sel.on{background:var(--accent);border-color:var(--accent)}
.act-it .sel.on::after{content:"";width:6px;height:11px;border:solid var(--on-accent);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.act-it .sel.done{border-color:var(--good);background:var(--good)}
.act-it .sel.done::after{content:"";width:6px;height:11px;border:solid #06140d;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.act-it input[type=text]{background:transparent;border-color:transparent;padding:6px 4px;font-weight:600;font-size:15px}
.act-it input[type=text]:focus{background:var(--sunk);border-color:var(--line)}
.act-it .row2{grid-column:2;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.act-it select,.act-it input[type=datetime-local]{width:auto;padding:5px 8px;font-size:12.5px;border-radius:9px}
.kind{font:700 10.5px var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:7px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.dest{font-size:12px;color:var(--muted)}
.dest b{color:var(--ink2)}
.sentlab{font-size:12.5px;color:var(--good);font-weight:600}
.sentlab a{color:var(--good)}
.xbtn{appearance:none;border:0;background:none;color:var(--faint);cursor:pointer;font-size:18px;line-height:1;padding:4px 6px;margin-left:auto}
.transcript{min-height:160px;font-size:16px;line-height:1.55}
.toolbar{display:flex;gap:8px;align-items:center;margin:4px 0 12px;flex-wrap:wrap}
.search{position:relative}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--faint);pointer-events:none}
.search input{padding-left:40px;font-size:17px;border-radius:14px;background:var(--surface)}
.group-h{font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:16px 2px 6px;display:flex;align-items:center;gap:7px}
.setrow{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}
.setrow:first-of-type{border-top:0}
.setrow .l{min-width:0}
.setrow .l b{display:block;font-size:14.5px}
.setrow .l span{font-size:12.5px;color:var(--muted)}
.setrow select{width:auto}
.fab.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><a class="iconbtn back" href="../base/" aria-label="Back to BASE"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></a><img src="icon-192.png" alt=""><div><h1>TALK</h1><p id="subtitle">Say it, sort it</p></div></div>
    <button class="iconbtn" id="settingsBtn" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1.1z"/></svg></button>
  </header>
  <main id="main" aria-live="polite"></main>
</div>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<button class="fab" id="fab" aria-label="Record a voice note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
<input type="file" id="importPick" accept="application/json,.json" class="sr" tabindex="-1">

<script src="../suite/nlp.js?v=2"></script>

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

</body>
</html>
